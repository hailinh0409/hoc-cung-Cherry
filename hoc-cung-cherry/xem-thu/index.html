<body><main><h1>Xem thử bài chat với Cherry</h1>
<div class="layout">
<section class="editor" aria-label="Soạn và kiểm tra bài">
<label for="source">LaTeX chủ đề hoặc khối baichat</label>
<textarea id="source" spellcheck="false"></textarea>
<label for="student">Tên học sinh</label><input id="student" type="text" value="An" maxlength="80" autocomplete="off">
<div class="controls"><button type="button" id="run">Chạy thử</button><button type="button" id="copy" disabled>Sao chép khối baichat</button><button type="button" id="restart" disabled>Làm lại từ đầu</button></div>
<p id="status" role="status"></p><div id="diagnostics" aria-label="Lỗi và cảnh báo"></div>
</section>

</section></div></main>
<script>// Câu hỏi có tham số (giống cú pháp game lớp học):
//   %@ a = ngaunhien(2, 9)        số nguyên ngẫu nhiên trong [2; 9]
//   %@ b = chon(2, 3, 5)          chọn ngẫu nhiên một giá trị
//   %@ c = a*b + 1                biểu thức từ các tham số trước
//   %@ dieukien: a != b           điều kiện phải thỏa (thử lại tối đa 300 lần)
// Trong đề viết {{a}}, {{2*a+b}}, {{+b}} (luôn có dấu), {{ps(p, q)}} (phân số tối giản).
// Không dùng tham số bên trong hình TikZ.

const FUNCS = new Set(['ngaunhien', 'chon', 'ps', 'abs', 'min', 'max', 'ucln', 'bcnn', 'sqrt', 'tron']);
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };

// ---- số hữu tỉ ----
class Frac {
  constructor(p, q) {
    if (!Number.isInteger(p) || !Number.isInteger(q) || q === 0) throw new Error('ps(p, q) cần p, q nguyên và q ≠ 0');
    const g = gcd(p, q) || 1, s = q < 0 ? -1 : 1;
    this.p = (s * p) / g; this.q = (s * q) / g;
  }
  get v() { return this.p / this.q; }
}
const isF = x => x instanceof Frac;
const toF = x => (isF(x) ? x : Number.isInteger(x) ? new Frac(x, 1) : null);
function arith(op, a, b) {
  if (isF(a) || isF(b)) {
    const A = toF(a), B = toF(b);
    if (A && B) {
      if (op === '+') return new Frac(A.p * B.q + B.p * A.q, A.q * B.q);
      if (op === '-') return new Frac(A.p * B.q - B.p * A.q, A.q * B.q);
      if (op === '*') return new Frac(A.p * B.p, A.q * B.q);
      if (op === '/') return new Frac(A.p * B.q, A.q * B.p);
    }
    a = isF(a) ? a.v : a; b = isF(b) ? b.v : b;
  }
  switch (op) {
    case '+': return a + b; case '-': return a - b; case '*': return a * b;
    case '/': if (b === 0) throw new Error('chia cho 0'); return a / b;
    case '%': return a % b; case '^': return a ** b;
  }
}
const num = x => (isF(x) ? x.v : x);

// ---- tách từ & phân tích biểu thức ----
function tokenize(s) {
  const t = []; let i = 0;
  while (i < s.length) {
    const c = s[i];
    if (/\s/.test(c)) { i++; continue; }
    const two = s.slice(i, i + 2);
    if (['==', '!=', '<=', '>=', '&&', '||'].includes(two)) { t.push(two); i += 2; continue; }
    if ('+-*/%^(),<>!'.includes(c)) { t.push(c); i++; continue; }
    const m = s.slice(i).match(/^(\d+(?:\.\d+)?|[A-Za-z_]\w*)/);
    if (!m) throw new Error(`ký tự lạ "${c}"`);
    t.push(m[1]); i += m[1].length;
  }
  return t;
}
function evaluate(src, env, rng = Math.random) {
  const t = tokenize(String(src)); let k = 0;
  const peek = () => t[k], eat = x => { if (t[k] !== x) throw new Error(`thiếu "${x}"`); k++; };
  const bin = (next, ops, f) => () => { let a = next(); while (ops.includes(peek())) { const o = t[k++]; a = f(o, a, next()); } return a; };
  const atom = () => {
    const x = t[k++];
    if (x === undefined) throw new Error('biểu thức dở dang');
    if (x === '(') { const v = or(); eat(')'); return v; }
    if (/^\d/.test(x)) return Number(x);
    if (peek() === '(') {
      if (!FUNCS.has(x)) throw new Error(`không có hàm ${x}`);
      k++; const args = [];
      if (peek() !== ')') { args.push(or()); while (peek() === ',') { k++; args.push(or()); } }
      eat(')');
      return call(x, args, rng);
    }
    if (!(x in env)) throw new Error(`chưa khai báo tham số ${x}`);
    return env[x];
  };
  const pow = () => { const a = atom(); if (peek() === '^') { k++; return arith('^', num(a), num(unary())); } return a; };
  const unary = () => {
    if (peek() === '-') { k++; const v = unary(); return isF(v) ? new Frac(-v.p, v.q) : -v; }
    if (peek() === '+') { k++; return unary(); }
    if (peek() === '!') { k++; return !unary(); }
    return pow();
  };
  const mul = bin(unary, ['*', '/', '%'], (o, a, b) => arith(o, a, b));
  const add = bin(mul, ['+', '-'], (o, a, b) => arith(o, a, b));
  const cmp = () => {
    const a = add();
    if (['==', '!=', '<', '>', '<=', '>='].includes(peek())) {
      const o = t[k++], x = num(a), y = num(add()), e = 1e-9;
      return o === '==' ? Math.abs(x - y) < e : o === '!=' ? Math.abs(x - y) >= e : o === '<' ? x < y : o === '>' ? x > y : o === '<=' ? x <= y + e : x >= y - e;
    }
    return a;
  };
  const and = bin(cmp, ['&&'], (o, a, b) => a && b);
  const or = bin(and, ['||'], (o, a, b) => a || b);
  const v = or();
  if (k < t.length) throw new Error(`thừa "${t[k]}"`);
  return v;
}
function call(f, a, rng) {
  const n = a.map(num);
  switch (f) {
    case 'ngaunhien': {
      const [lo, hi] = n;
      if (!Number.isInteger(lo) || !Number.isInteger(hi) || lo > hi) throw new Error('ngaunhien(a, b) cần a ≤ b nguyên');
      return lo + Math.floor(rng() * (hi - lo + 1));
    }
    case 'chon': if (!a.length) throw new Error('chon() cần ít nhất 1 giá trị'); return a[Math.floor(rng() * a.length)];
    case 'ps': return new Frac(n[0], n[1]);
    case 'abs': return isF(a[0]) ? new Frac(Math.abs(a[0].p), a[0].q) : Math.abs(n[0]);
    case 'min': return Math.min(...n); case 'max': return Math.max(...n);
    case 'ucln': return gcd(n[0], n[1]);
    case 'bcnn': return Math.abs(n[0] * n[1]) / (gcd(n[0], n[1]) || 1);
    case 'sqrt': return Math.sqrt(n[0]);
    case 'tron': { const d = n[1] ?? 0; return Math.round(n[0] * 10 ** d) / 10 ** d; }
  }
}

// ---- khai báo tham số ----
function parseSpec(lines) {
  const vars = [], conds = [];
  for (const raw of lines) {
    const l = raw.trim();
    if (!l) continue;
    let m = l.match(/^dieukien\s*:\s*(.+)$/i);
    if (m) { conds.push(m[1]); continue; }
    m = l.match(/^([A-Za-z_]\w*)\s*=\s*(.+)$/);
    if (!m) throw new Error(`dòng tham số không hiểu: "${l}"`);
    if (FUNCS.has(m[1])) throw new Error(`không đặt tên tham số trùng tên hàm: ${m[1]}`);
    vars.push({ name: m[1], expr: m[2] });
  }
  return { vars, conds };
}
function sampleEnv(spec, rng = Math.random) {
  for (let tries = 0; tries < 300; tries++) {
    const env = {};
    for (const v of spec.vars) env[v.name] = evaluate(v.expr, env, rng);
    if (spec.conds.every(c => evaluate(c, env, rng))) return env;
  }
  throw new Error('không tìm được bộ tham số thỏa điều kiện sau 300 lần thử');
}

// ---- in giá trị ----
function fmt(v, mode) {
  if (typeof v === 'boolean') return v ? 'đúng' : 'sai';
  if (isF(v)) {
    if (v.q === 1) return String(v.p);
    if (mode === 'ans') return `${v.p}/${v.q}`;
    return (v.p < 0 ? '-' : '') + `\\dfrac{${Math.abs(v.p)}}{${v.q}}`;
  }
  let s = Number.isInteger(v) ? String(v) : String(Math.round(v * 1e6) / 1e6);
  if (s.includes('.')) s = mode === 'ans' ? s.replace('.', ',') : s.replace('.', '{,}');
  return s;
}
function fill(str, env, mode = 'text') {
  if (typeof str !== 'string') return str;
  return str.replace(/\{\{(\+?)([^{}]+)\}\}/g, (_, plus, e) => {
    const v = evaluate(e, env);
    const s = fmt(v, mode);
    return plus && num(v) >= 0 ? '+' + s : s;
  });
}
function fillQ(q, env) {
  const f = s => fill(s, env);
  return {
    ...q, stem: f(q.stem), sol: f(q.sol),
    ...(q.hints && { hints: q.hints.map(f) }),
    ...(q.opts && { opts: q.opts.map(o => ({ ...o, t: f(o.t), ...(o.why && { why: f(o.why) }) })) }),
    ...(q.items && { items: q.items.map(o => ({ ...o, t: f(o.t), ...(o.why && { why: f(o.why) }) })) }),
    ...(q.traps && { traps: q.traps.map(x => ({ a: fill(x.a, env, 'ans'), why: f(x.why) })) }),
    ...(q.pairs && { pairs: q.pairs.map(p => p.map(f)) }),
    ...(q.ans && { ans: q.ans.map(a => fill(a, env, 'ans')) }),
    ...(q.steps && { steps: q.steps.map(x => ({ ...x, t: f(x.t) })) }),
    ...(q.nodes && { nodes: q.nodes.map(x => ({ ...x, t: f(x.t), c: f(x.c) })) }),
    ...(q.bad && { bad: q.bad.map(x => ({ ...x, t: f(x.t), ...(x.why && { why: f(x.why) }) })) }),
    ...(q.badc && { badc: q.badc.map(x => ({ ...x, t: f(x.t), ...(x.why && { why: f(x.why) }) })) }),
  };
}
// Sinh một bản cụ thể của câu hỏi (câu không có tham số giữ nguyên)
function instantiate(q, rng = Math.random) {
  if (!q.params) return q;
  const env = sampleEnv(parseSpec(q.params), rng);
  const { params, ...rest } = fillQ(q, env);
  return rest;
}

// Đọc ngân hàng câu hỏi LaTeX của game.
// Cú pháp:
//   \chude{Tên chủ đề}
//   \man{1}{Nhận biết}
//   \begin{ex}    đề \choice{..}{\True ..}{..}{..}        \loigiai{..} \end{ex}     trắc nghiệm
//   \begin{extf}  đề \choiceTF{\True ..}{..}{\True ..}{..} \loigiai{..} \end{extf}   đúng/sai từng ý
//   \begin{exfb}  đề \shortans{đáp số;đáp số khác}          \loigiai{..} \end{exfb}   điền đáp số
//   \begin{exmatch} đề \pair{trái}{phải} \pair{..}{..}       \loigiai{..} \end{exmatch} nối ý
//   \begin{extl}  đề \goiy{gợi ý 1} \goiy{gợi ý 2}          \end{extl}     tự luận (chỉ dùng trong đề ôn tập,
//                 học sinh làm vào vở; app chỉ hiện đề và gợi ý, mỗi gợi ý mở lần đầu trừ XP)
// Báo lỗi theo đáp án sai (hiện ngay khi học sinh chọn sai):
//   ex:   \sai{vì sao sai} đặt trong phương án sai, ví dụ \choice{$5$ \sai{Quên đổi dấu}}{\True $-5$}..
//   extf: \sai{giải thích} đặt trong ý, hiện khi học sinh đánh giá sai ý đó
//   exfb: \saithuong{đáp số sai hay gặp}{vì sao sai}, viết nhiều lần được
// Sắp xếp lời giải:
//   \begin{exsx} đề \buoc{bước 1} \buoc{bước 2} … \nhieu{khối sai}{vì sao sai} \loigiai{..} \end{exsx}
//   các bước liền nhau cùng nhãn \buoc[1]{..} được đổi chỗ cho nhau
// Sơ đồ phân tích đi lên:
//   \begin{exsd} đề \nut{số}[ô cha]{mệnh đề}{căn cứ} … (ô kết luận không có [ô cha])
//     \an{2,3} ẩn mệnh đề, \anly{3} ẩn căn cứ, \nhieu{mệnh đề sai}{vì sao}, \nhieuly{căn cứ sai}{vì sao} \end{exsd}


const QTYPES = 'ex|extf|exfb|exmatch|extl|exsx|exsd';
const ENV = new RegExp('\\\\begin\\{(' + QTYPES + ')\\}([\\s\\S]*?)\\\\end\\{\\1\\}', 'g');

function group(s, i) {
  while (i < s.length && /\s/.test(s[i])) i++;
  if (s[i] !== '{') return null;
  let d = 0, j = i;
  for (; j < s.length; j++) {
    if (s[j] === '\\') { j++; continue; }
    if (s[j] === '{') d++;
    else if (s[j] === '}') { d--; if (!d) break; }
  }
  if (d) return null;
  return [s.slice(i + 1, j), j + 1];
}

// Hình từng bước (dùng ở mọi chỗ có nội dung, thường trong lythuyet):
//   \begin{hinhbuoc}
//   \begin{tikzpicture} … \hien{2}{phần hiện từ bước 2} … \end{tikzpicture}
//   \loibuoc{lời bước 1} \loibuoc{lời bước 2} …
//   \end{hinhbuoc}
// Mỗi bước là một khung hình dịch riêng: mã khung = hbFrame(tikz, k). Phần chưa đến lượt vẫn vẽ nhưng trong suốt
// (xem PREAMBLE trong figcode.js) nên mọi khung cùng kích thước. Máy chủ và giao diện phải tính mã khung giống hệt nhau.
const HINHBUOC = /\\begin\{hinhbuoc\}([\s\S]*?)\\end\{hinhbuoc\}/g;
const HB_MAX = 8;
const TIKZ_ONE = /\\begin\{tikzpicture\}[\s\S]*?\\end\{tikzpicture\}/g;
const noComment = s => String(s || '').replace(/\r/g, '').replace(/(^|[^\\])%.*$/gm, '$1');
const hbFrame = (tikz, k) => '\\lttbuoc{' + k + '}\n' + tikz;
function parseHinhBuoc(body) {
  body = noComment(body);
  const pics = body.match(TIKZ_ONE) || [];
  const tikz = pics[0] || '';
  const rest = pics.reduce((s, p) => s.replace(p, ''), body);
  const caps = [], re = /\\loibuoc\b/g; let m;
  while ((m = re.exec(rest))) { const g = group(rest, re.lastIndex); if (!g) { caps.push(''); continue; } caps.push(g[0].trim()); re.lastIndex = g[1]; }
  const steps = [...tikz.matchAll(/\\hien\s*\{\s*(\d+)\s*\}/g)].map(x => Number(x[1]));
  return { tikz, pics: pics.length, caps, steps, frames: caps.map((_, i) => hbFrame(tikz, i + 1)) };
}
// Lỗi soạn của các khối hinhbuoc trong một đoạn mã
function hinhBuocErrors(raw) {
  const errors = [], src = noComment(raw);
  const opened = (src.match(/\\begin\{hinhbuoc\}/g) || []).length, all = [...src.matchAll(HINHBUOC)];
  if (opened !== all.length) errors.push('Hình từng bước chưa đóng \\end{hinhbuoc}');
  all.forEach((m, i) => {
    const h = parseHinhBuoc(m[1]), at = all.length > 1 ? ` thứ ${i + 1}` : '';
    if (h.pics !== 1) errors.push(`Hình từng bước${at} cần đúng một hình tikzpicture (đang có ${h.pics})`);
    if (h.caps.length < 2) errors.push(`Hình từng bước${at} cần ít nhất 2 dòng \\loibuoc{…}, mỗi bước một dòng`);
    if (h.caps.length > HB_MAX) errors.push(`Hình từng bước${at} tối đa ${HB_MAX} bước`);
    if (h.caps.some(c => !c)) errors.push(`Hình từng bước${at}: có \\loibuoc thiếu nội dung {…}`);
    if (h.pics === 1 && !h.steps.length) errors.push(`Hình từng bước${at} chưa có \\hien{số bước}{…} nào, các bước sẽ giống nhau`);
    const bad = h.steps.filter(k => k < 1 || k > h.caps.length);
    if (h.caps.length >= 2 && bad.length) errors.push(`Hình từng bước${at}: \\hien{${bad[0]}} vượt quá số bước (${h.caps.length} dòng \\loibuoc)`);
  });
  return errors;
}

// Bài giải mẫu từng bước (trong lythuyet; sau này dùng cho mục Bài mẫu và gợi ý Ôn tập tự luận):
//   \begin{giaimau}
//   \de{đề bài}
//   \begin{tikzpicture} … \hien{k}{hiện từ bước k} … \phu{a}{b}{nét phụ chỉ hiện từ bước a đến b} … \sang{k}{tô cam ở bước k} … \end{tikzpicture}   (tùy chọn, một hình)
//   \cau{Câu 1}{yêu cầu}                                   mở một câu (ý) của bài
//   \doan{câu hỏi}{đúng}{sai}{vì sao đúng}{vì sao sai}[{sai 2}{vì sao sai 2}]   học sinh đoán hướng trước bước then chốt
//   \buocgiai{mục tiêu}{các dòng biến đổi, xuống dòng \\}{vì sao}                bước k (đếm từ 1 trong cả bài)
//   \begin{sodo} \nut{cấp}{nội dung}{ghi chú} … \end{sodo}                       sơ đồ phân tích đi lên, cấp 1 là gốc
//   \nhanxet{…}
//   \end{giaimau}
// Hình: mỗi màn một khung. Khung = gmFrame(tikz, k, s): đã hiện tới bước k, tô sáng bước s (0 = không tô).
// Phần tô sáng được vẽ sau cùng, phần còn lại mờ đi; phần chưa hiện vẫn vẽ trong suốt nên mọi khung cùng kích thước.
const GIAIMAU = /\\begin\{giaimau\}([\s\S]*?)\\end\{giaimau\}/g;
function gmFrame(tikz, k, s) {
  let t = tikz;
  if (s && new RegExp('\\\\sang\\s*\\{\\s*' + s + '\\s*\\}').test(t)) {
    let i = t.indexOf('\\begin{tikzpicture}') + 19;
    while (/\s/.test(t[i] || '')) i++;
    if (t[i] === '[') { let d = 0; for (; i < t.length; i++) { if (t[i] === '[') d++; else if (t[i] === ']') { d--; if (!d) { i++; break; } } } }
    const e = t.lastIndexOf('\\end{tikzpicture}');

          q.pairs.push([a[0].trim(), c[0].trim()]);
          i = b.indexOf('\\pair', c[1]);
        }
        if (bad) { err('\\pair phải có 2 vế: \\pair{trái}{phải}'); continue; }
        if (q.pairs.length < 2) { err('Câu nối ý cần ít nhất 2 cặp'); continue; }
      }
      if (!q.stem) { err('Câu hỏi chưa có đề bài'); continue; }
      if (q.params) {
        try { for (let t = 0; t < 5; t++) instantiate(q); } catch (ex) { err('tham số: ' + ex.message); continue; }
      } else if (/\{\{[^{}]+\}\}/.test(JSON.stringify([q.stem, q.opts, q.items, q.ans, q.pairs, q.sol, q.traps, q.steps, q.nodes, q.bad, q.badc]))) {
        err('có {{...}} nhưng chưa khai báo tham số %@'); continue;
      }
      q.key = qkeyOf(q);
      qs.push(q);
    }
    const opened = (body.match(new RegExp('\\\\begin\\{(' + QTYPES + ')\\}', 'g')) || []).length;
    const closed = (body.match(new RegExp('\\\\begin\\{(' + QTYPES + ')\\}[\\s\\S]*?\\\\end\\{(' + QTYPES + ')\\}', 'g')) || []).length;
    if (opened > closed) errors.push({ level: n, msg: 'Có câu chưa đóng \\end{...} hoặc \\begin và \\end không cùng loại' });
    if (!qs.length && !errors.some(er => er.level === n)) errors.push({ level: n, msg: 'Màn này chưa có câu hỏi nào' });
    levels.push({ n, title: g2[0].trim(), qs });
  });
  const all = levels.flatMap(l => l.qs);
  if (all.some(q => q.type === 'extl') && all.some(q => q.type !== 'extl'))
    errors.push({ msg: 'Đề tự luận (\\begin{extl}) không trộn chung với câu trắc nghiệm, đúng/sai, điền số, nối ý. Thầy tách thành hai đề.' });
  return { topic, levels, errors, warnings, theory, lesson, chat };
}
// Đề tự luận: mọi câu là extl
const isTLBank = levels => levels.some(l => l.qs.some(q => q.type === 'extl'));

// Các mục của khối lý thuyết. Hai đối số {tiêu đề}{nội dung}, riêng \luuy{nội dung}; \vidu{đề}{lời giải}.
const THEORY_KINDS = { dinhnghia: 'Định nghĩa', quytac: 'Quy tắc', congthuc: 'Công thức', dinhly: 'Định lý', tinhchat: 'Tính chất', luuy: 'Lưu ý', vidu: 'Ví dụ' };
function parseTheory(body, errors) {
  const items = [], re = /\\(dinhnghia|quytac|congthuc|dinhly|tinhchat|luuy|vidu|loidan|minhhoa|thungay)\b|\\begin\{(hinhbuoc|giaimau)\}/g; let m;
  while ((m = re.exec(body))) {
    const k = m[1];
    if (!k) {
      // Hình từng bước đứng riêng trong lythuyet: hiện ở cột minh họa như \minhhoa (lỗi soạn đã báo ở hinhBuocErrors)
      const env = m[2], endTag = '\\end{' + env + '}', end = body.indexOf(endTag, m.index);
      if (end < 0) break;
      re.lastIndex = end + endTag.length;
      items.push({ k: env, body: body.slice(m.index, re.lastIndex) });
      continue;
    }
    if (k === 'loidan' || k === 'minhhoa' || k === 'thungay') {
      const args = [];
      let at = re.lastIndex, arg;
      while ((arg = group(body, at))) {
        args.push(arg[0].trim());
        at = arg[1];
      }
      re.lastIndex = at;
      const count = k === 'loidan' ? 1 : k === 'minhhoa' ? 2 : 5;
      if (args.length !== count || args.some(s => !s)) {
        errors.push({ msg: 'Lý thuyết: \\' + k + ' cần đúng ' + count + ' cặp {…} có nội dung' });
        continue;
      }
      if (k === 'minhhoa') {
        const [template, value] = args;
        if (template === 'gia-tri-theo-hang') {
          if (!/^(?:0|[1-9]\d{0,11})$/.test(value)) {
            errors.push({ msg: 'Mẫu gia-tri-theo-hang cần số tự nhiên tối đa 12 chữ số, viết liền và không thêm số 0 ở đầu' });
            continue;
          }
        } else if (template === 'ghep-so-la-ma') {
          if (!/^(?:[1-9]|[12]\d|3\d)$/.test(value)) {
            errors.push({ msg: 'Mẫu ghep-so-la-ma cần số nguyên từ 1 đến 39' });
            continue;
          }
        } else {
          errors.push({ msg: 'Lý thuyết: chưa có mẫu minh họa ' + template });
          continue;
        }
        items.push({ k, template, value });
      } else if (k === 'thungay') {
        const [body, correct, wrong, explainCorrect, explainWrong] = args;
        if (correct === wrong) {
          errors.push({ msg: 'Lý thuyết: hai đáp án của \\thungay phải khác nhau' });
          continue;
        }
        items.push({ k, body, correct, wrong, explainCorrect, explainWrong });
      } else {
        items.push({ k, body: args[0] });
      }
      continue;
    }
    const g1 = group(body, re.lastIndex);
    if (!g1) { errors.push({ msg: `Lý thuyết: \\${k} thiếu {…}` }); continue; }
    if (k === 'luuy') { items.push({ k, title: '', body: g1[0].trim() }); re.lastIndex = g1[1]; continue; }
    const g2 = group(body, g1[1]);
    if (!g2) { errors.push({ msg: `Lý thuyết: \\${k} cần hai cặp {…}{…}` }); re.lastIndex = g1[1]; continue; }
    items.push(k === 'vidu' ? { k, title: '', body: g1[0].trim(), sol: g2[0].trim() } : { k, title: g1[0].trim(), body: g2[0].trim() });
    re.lastIndex = g2[1];
  }
  if (!items.length) errors.push({ msg: 'Khối lý thuyết chưa có mục nào (\\dinhnghia, \\quytac, \\congthuc, \\dinhly, \\tinhchat, \\luuy, \\vidu)' });
  return items;
}

const LESSON_ARGS = {
  phan: 2, nhaclai: 1, hinhchung: 1, cherry: 1, loidan: 1, hinhrieng: 1,
  trangthai: 1, saukhitra: 1, chuyen: 4, cauhoi: 1, nutbuoc: 1,
  dinhnghia: 2, quytac: 2, congthuc: 2, dinhly: 2, tinhchat: 2, nhanxet: 2,
  luuy: 1, vidu: 2, thungay: 5, chamhinh: 4, nhac: 2, chamvung: 3,
  truot: 2, emtinh: 6, ketluan: 1, xemtungbuoc: 0, minhhoa: 2, hinhmau: 2,
};
const CHAT_ARGS = { dung: 2, sai: 2, thaotac: 3 };
const CHAT_ENVS = new Set(['thu', 'tinh']);
const LESSON_ENVS = new Set(['modau', 'ketbai', 'tikzpicture', 'hinhbuoc', 'giaimau']);
const LESSON_RECAP = new Set(['dinhnghia', 'quytac', 'congthuc', 'dinhly', 'tinhchat']);
const LESSON_REGIONS = new Set(['giua', 'tren', 'duoi']);
const LESSON_COLORS = new Set(['cam', 'lam', 'luc', 'tim', 'do']);
const LESSON_ANGLE = /^\p{L}[\p{L}\p{N}_'′]*[1-4]$/u;

// Chỉ đọc lệnh ở ngoài đối số và môi trường hình. Nội dung LaTeX bên trong được giữ nguyên.
function lessonTokens(body, chat = false) {
  const tokens = [], re = /\\([a-zA-Z]+)\b|\\./g;
  for (const match of body.matchAll(re)) {
    const previous = tokens.at(-1);
    if (previous && match.index < previous.end) continue;
    const start = match.index, name = match[1];
    if (!name) continue;
    let end = start + match[0].length;
    if (name === 'begin') {
      const arg = group(body, end);
      if (arg && (LESSON_ENVS.has(arg[0]) || (chat && CHAT_ENVS.has(arg[0])))) {
        const tag = '\\end{' + arg[0] + '}', close = body.indexOf(tag, arg[1]);
        end = close < 0 ? body.length : close + tag.length;
        tokens.push({ name: arg[0], start, end, args: [], env: true, closed: close >= 0,
          contentStart: arg[1], content: body.slice(arg[1], close < 0 ? end : close), raw: body.slice(start, end) });
        continue;
      }
    }
    let label = '';
    if (chat && name === 'thaotac') {
      const optional = lessonLabel(body.slice(end));
      label = optional.label;
      end += optional.end;
    }
    const args = [];
    let arg;
    while ((arg = group(body, end))) {
      args.push(arg[0].trim());
      end = arg[1];
    }
    tokens.push({ name, start, end, args, label, raw: body.slice(start, end) });
  }
  return tokens.filter(t => t.env || Object.hasOwn(LESSON_ARGS, t.name) || t.name === 'emdahoc' || (chat && (Object.hasOwn(CHAT_ARGS, t.name) || t.name === 'theobuoc')));
}

function lessonArgs(token, error) {
  const { name, args } = token;
  if (token.env) {
    if (!token.closed) error('Khối ' + name + ' chưa đóng \\end{' + name + '}');
    return token.closed;
  }
  if (name === 'theobuoc') {
    if (!args.length) error('\\theobuoc cần ít nhất một trạng thái {…}');
    return args.length > 0;
  }
  const count = LESSON_ARGS[name] ?? CHAT_ARGS[name];
  const filled = args.every((arg, index) => Boolean(arg) || (name === 'hinhmau' && index === 1));
  const valid = filled && (name === 'emdahoc'
    ? args.length >= 2 && args.length <= 5
    : args.length === count);
  if (!valid) error('\\' + name + ' cần ' + (name === 'emdahoc' ? '2–5' : count) + ' cặp {…} có nội dung');
  return valid;
}

function lessonLabel(source) {
  const match = /^\s*\[([^\]\n]*)\]/.exec(source);
  return { label: match?.[1].trim() || '', end: match?.[0].length || 0 };
}

function chatMath(text, warn) {
  if ([...text.matchAll(/(?<!\\)\$(?!\$)((?:\\.|[^$\\])+)\$/g)]
    .some(match => /[=<>]|\\Rightarrow\b/.test(match[1]))) {
    warn('Viết công thức có dấu so sánh hoặc suy ra trên dòng riêng \\[…\\]');
  }
}

function chatOptions(token, error, warn, locate) {
  const { label, end } = token.name === 'thu' ? lessonLabel(token.content) : { label: '', end: 0 };
  const question = group(token.content, end);
  const q = question?.[0].trim() || '';
  if (!q) error('Khối ' + token.name + ' cần câu hỏi {…}');
  const optionsSource = token.content.slice(question?.[1] ?? end);
  const opts = [];
  let cursor = 0;
  for (const cmd of lessonTokens(optionsSource, true)) {
    locate(token.contentStart + (question?.[1] ?? end) + cmd.start);
    if (optionsSource.slice(cursor, cmd.start).trim() || !['dung', 'sai'].includes(cmd.name)) {
      error('Chỉ đặt \\dung và \\sai sau câu hỏi trong khối ' + token.name);
    }
    cursor = cmd.end;
    if (!['dung', 'sai'].includes(cmd.name) || !lessonArgs(cmd, error)) continue;
    const [text, why] = cmd.args;
    opts.push({ text, ok: cmd.name === 'dung', why });
    chatMath(why, warn);
  }
  locate(token.start);
  if (optionsSource.slice(cursor).trim()) error('Khối ' + token.name + ' có nội dung ngoài phương án');
  if (opts.length < 2 || opts.length > 4 || opts.filter(option => option.ok).length !== 1) {
    error('Khối ' + token.name + ' cần 2–4 phương án, đúng một \\dung, mỗi phương án có giải thích');
  }
  if (new Set(opts.map(option => option.text)).size !== opts.length) error('Các phương án phải khác nhau');
  chatMath(q, warn);
  return { label, quiz: { q, opts } };
}

function chatFigureFields(name, source, error, state = false) {
  const result = {};
  for (const field of source.split(';').map(s => s.trim()).filter(Boolean)) {
    const [, key, value] = /^([a-z]+\d*)\s*=\s*(.*)$/.exec(field) || [];
    if (name === 'can') {
      if (key === 'trai' || key === 'phai') {
        const items = value ? value.split(/\s+\+\s+/).map(item => {
          const weight = /^q(?:\*([1-9]\d?))?$/.exec(item);
          const object = /^([ktb]):(.+)$/.exec(item);
          if (weight) return { kind: 'q', count: Number(weight[1] || 1) };
          if (object && object[2].trim()) return { kind: object[1], label: object[2].trim() };
          return null;
        }) : [];
        if (items.every(Boolean)) { result[key] = items; continue; }
      }
      if (key === 'nghieng' && /^(khong|trai|phai)$/.test(value)) { result[key] = value; continue; }
      if (key === 'ghichu') { result[key] = value; continue; }
    } else {
      if (/^dong[1-4]$/.test(key || '')) {
        const sides = value.split('=').map(side => side.trim()
          .replace(/(^|\s)([+-])\s+(?=\S)/g, '$1$2').split(/\s+/).filter(Boolean));
        if (sides.length === 2 && sides.every(side => side.length)) { result[key] = sides; continue; }
      }
      if (/^mui[1-3]$/.test(key || '')) { result[key] = value; continue; }
      if (state && key === 'dong' && /^[1-4]$/.test(value)) { result.dong = Number(value); continue; }
      if (state && key === 'to') {
        result.to = {};
        for (const pair of value.split(',').filter(Boolean)) {
          const [, term, color] = /^\s*([1-4][tp][1-9]\d*)\s*:\s*([a-z]+)\s*$/.exec(pair) || [];
          if (!term || !LESSON_COLORS.has(color)) error('Số hạng hoặc màu không hợp lệ: ' + pair);
          else result.to[term] = color;
        }
        continue;
      }
    }
    error('Tham số hoặc trạng thái hình ' + name + ' không hợp lệ: ' + field);
  }
  return result;
}

function chatTermExists(params, key) {
  const [, row, side, term] = /^([1-4])([tp])([1-9]\d*)$/.exec(key) || [];
  return Boolean(params['dong' + row]?.[side === 't' ? 0 : 1]?.[Number(term) - 1]);
}

function chatApplyState(figure, state, error) {
  if (!state || figure?.mau?.name !== 'dang-thuc') return figure;
  const params = { ...figure.mau.params, ...state };
  for (const key of Object.keys(state.to || {})) {
    if (!chatTermExists(params, key)) error('Khóa số hạng không có trong hình: ' + key);
  }
  if (state.dong && !params['dong' + state.dong]) error('Hình không có dòng ' + state.dong);
  return { ...figure, mau: { ...figure.mau, params } };
}

function lessonFigureToken(token, error, chat) {
  if (token.name === 'hinhmau' && lessonArgs(token, error)) {
    const [name, source] = token.args;
    if (chat && ['can', 'dang-thuc'].includes(name)) {
      const params = chatFigureFields(name, source, error);
      if (name === 'dang-thuc' && (!params.dong1 || [2, 3, 4].some(i => params['dong' + i] && !params['dong' + (i - 1)]))) {
        error('Hình dang-thuc cần các dòng liên tiếp, bắt đầu bằng dong1');
      }
      return { kind: 'mau', src: token.raw, mau: { name, params } };
    }
    if (name !== 'cat-tuyen') {
      error('Chưa có hình mẫu ' + name);
      return null;
    }
    const params = {};
    for (const field of source.split(';').map(s => s.trim()).filter(Boolean)) {
      const parts = field.match(/^(duong|diem|song-song|c)\s*=\s*(.+)$/);
      if (!parts) {
        error('Tham số hình mẫu không hợp lệ: ' + field);
        continue;
      }
      const [, key, value] = parts;
      const list = value.split(',').map(s => s.trim());
      if ((key === 'duong' && (list.length !== 3 || list.some(s => !s))) ||
          (key === 'diem' && (list.length !== 2 || list.some(s => !s))) ||
          (key === 'song-song' && !/^[01]$/.test(value)) ||
          (key === 'c' && !/^(trai|phai)$/.test(value))) {
        error('Tham số hình mẫu không hợp lệ: ' + field);
        continue;
      }
      params[key] = key === 'duong' || key === 'diem' ? list : value;
    }
    return { kind: 'mau', src: token.raw, mau: { name, params } };
  }
  if (token.name === 'hinhbuoc' || token.name === 'tikzpicture') {
    if (!lessonArgs(token, error)) return null;
    return { kind: token.name === 'hinhbuoc' ? 'hinhbuoc' : 'tikz', src: token.raw };
  }
  return null;
}

function lessonFigure(source, error, chat) {
  const tokens = lessonTokens(source);
  if (tokens.length !== 1 || (tokens[0]?.raw !== source.trim()) ||
      !['tikzpicture', 'hinhbuoc', 'hinhmau'].includes(tokens[0]?.name)) {
    error('Cần một hình TikZ, hinhbuoc hoặc \\hinhmau');
    return null;
  }
  return lessonFigureToken(tokens[0], error, chat);
}

function lessonState(source, error, figure) {
  const name = figure?.mau?.name;
  if (name === 'can' || name === 'dang-thuc') return chatFigureFields(name, source, error, true);
  const state = {};
  for (const field of source.split(';').map(s => s.trim()).filter(Boolean)) {
    const match = field.match(/^([a-z]+)\s*=\s*(.+)$/);
    const [, key, value] = match || [];
    if (key === 'to' || key === 'do') {
      const angles = state[key] ||= {};
      for (const pair of value.split(',')) {
        const entry = pair.trim().match(/^([^:\s]+)\s*:\s*(\S.*)$/);
        const [, angle, label] = entry || [];
        if (!LESSON_ANGLE.test(angle || '')) error('Khóa góc không hợp lệ: ' + (angle || pair.trim()));
        else if (key === 'to' && !LESSON_COLORS.has(label)) error('Màu góc không hợp lệ: ' + label);
        else angles[angle] = label;
      }
    } else if (key === 'so' && (value === 'an' || value === 'hien')) state.so = value;
    else if (key === 'vung' && LESSON_REGIONS.has(value)) state.vung = value;
    else if (key === 'buoc' && /^\d+$/.test(value) && Number(value) >= 1 && Number(value) <= HB_MAX) state.buoc = Number(value);
    else error('Trạng thái hình không hợp lệ: ' + field);
  }
  return state;
}

function lessonQuiz(args, error, chat = false) {
  const [q, correct, wrong, explainCorrect, explainWrong] = args;
  if (correct === wrong) error('Hai phương án phải khác nhau');
  if (chat) return { q, opts: [
    { text: correct, ok: true, why: explainCorrect },
    { text: wrong, ok: false, why: explainWrong },
  ] };
  return { q, correct, wrong, explainCorrect, explainWrong };
}

function lessonBoundary(token, error, warn, chat = false, locate = () => {}) {
  const opening = token.name === 'modau';
  const boundary = opening
    ? { cherry: '', cauhoi: '', nutbuoc: '', fig: null }
    : { cherry: '', fig: null, quiz: null, emdahoc: [] };
  if (!lessonArgs(token, error)) return boundary;
  let after;
  for (const cmd of lessonTokens(token.content, chat)) {
    locate(token.contentStart + cmd.start);
    const [a] = cmd.args;
    const { name } = cmd;
    if (['tikzpicture', 'hinhbuoc', 'hinhmau'].includes(name)) {
      boundary.fig = lessonFigureToken(cmd, error, chat);
      continue;
    }
    if (!lessonArgs(cmd, error)) continue;
    if (chat && !cmd.env) chatLessonMath(cmd, warn);
    if (name === 'cherry' || name === 'loidan') {
      boundary.cherry = a;
      if ([...a].length > 120) warn('\\cherry dài hơn 120 kí tự');
    } else if (opening && (name === 'cauhoi' || name === 'nutbuoc')) boundary[name] = a;
    else if (!opening && (name === 'thungay' || name === 'thu')) {
      if (chat && boundary.quiz) error('Khối ketbai chỉ có một câu hỏi');
      if (name === 'thu') {
        const parsed = chatOptions(cmd, error, warn, offset => locate(token.contentStart + offset));
        boundary.quiz = parsed.quiz;
        if (parsed.label) boundary.label = parsed.label;
      } else boundary.quiz = lessonQuiz(cmd.args, error, chat);
    } else if (chat && !opening && name === 'saukhitra') {
      if (!boundary.quiz) error('\\saukhitra cần theo sau câu hỏi');
      else after = { source: a, at: token.contentStart + cmd.start };
    }
    else if (!opening && name === 'emdahoc') boundary.emdahoc = cmd.args;
    else if (name === 'hinhrieng') boundary.fig = lessonFigure(a, error, chat);
  }
  if (after) {
    locate(after.at);
    boundary.after = lessonState(after.source, error, boundary.fig);
    chatApplyState(boundary.fig, boundary.after, error);
  }
  locate(token.start);
  if (opening && !boundary.fig) error('Khối modau cần có hình');
  if (opening && !boundary.cauhoi) error('Khối modau cần có \\cauhoi');
  if (!opening && !boundary.quiz) error(chat ? 'Khối ketbai cần có thu hoặc \\thungay' : 'Khối ketbai cần có \\thungay');
  return boundary;
}

function lessonPart(title = '', goal = '') {
  return { title, goal, recap: '', fig: null, screens: [] };
}

function legacyLesson(items, lesson) {
  let part = lessonPart(), started = false;
  for (const { k, title, body, sol, correct, wrong, explainCorrect, explainWrong, template, value } of items) {
    if (k === 'loidan') {
      if (started) lesson.parts.push(part);
      part = lessonPart();
      started = true;
      continue;
    }
    started = true;
    if (!part.title && title) part.title = title;
    if (!part.fig && (LESSON_RECAP.has(k) || k === 'luuy')) {
      const staticFigure = lessonTokens(body).find(token => token.name === 'tikzpicture' && token.closed);
      if (staticFigure) part.fig = { kind: 'tikz', src: staticFigure.raw };
    }
    if (k === 'thungay') part.screens.push({ type: 'quiz', quiz: { q: body, correct, wrong, explainCorrect, explainWrong } });
    else if (k === 'vidu') part.screens.push({ type: 'vidu', body, sol });
    else if (k === 'hinhbuoc' || k === 'giaimau') part.screens.push({ type: k === 'hinhbuoc' ? 'steps' : k, body });
    else if (k === 'minhhoa') part.screens.push({ type: 'lab', kind: k, template, value });
    else part.screens.push({ type: 'read', kind: k, title, body });
  }
  if (started) lesson.parts.push(part);
  for (const item of lesson.parts) item.recap = lessonRecap(item);
}

function lessonRecap(part) {
  return part.screens.filter(sc => LESSON_RECAP.has(sc.kind)).map(sc => sc.body).join(' \\\\ ');
}

function chatLessonMath(cmd, warn) {
  const { name, args } = cmd;
  if (['hinhchung', 'hinhrieng', 'hinhmau', 'trangthai', 'saukhitra', 'theobuoc'].includes(name)) return;
  if (name === 'thungay' || name === 'emtinh') {
    for (const i of [0, 3, 4]) chatMath(args[i] || '', warn);
  } else if (name === 'thaotac') {
    chatMath(args[2], warn);
  } else args.forEach(text => chatMath(text, warn));
}

function parseLesson(body, errors, warnings, chatLine = 0) {
  const chat = Boolean(chatLine);
  const tokens = lessonTokens(body, chat);
  const legacy = !chat && !tokens.some(t => t.name === 'phan');
  const lesson = { modau: null, parts: [], ketbai: null, legacy };
  let at = 0;
  const locate = offset => { at = offset; };
  const diagnostic = msg => chat
    ? { line: chatLine + body.slice(0, at).split('\n').length - 1, msg: 'Bài chat: ' + msg }
    : { msg: 'Bài giảng: ' + msg };
  const error = msg => errors.push(diagnostic(msg));
  const warn = msg => warnings.push(diagnostic(msg));
  const screenLocations = new Map();
  const partLocations = new Map();
  if (legacy) {
    const theory = parseTheory(body, errors);
    for (const cmd of tokens.filter(t => t.name === 'modau' || t.name === 'ketbai')) {
      lesson[cmd.name] = lessonBoundary(cmd, error, warn);
    }
    legacyLesson(theory, lesson);
    return { theory, lesson };
  }

  // Dùng bộ đọc cũ cho các lệnh cũ ở cấp màn. Các khối và đối số mới thuộc riêng lesson.
  const oldNames = new Set([...Object.keys(THEORY_KINDS), 'loidan', 'thungay', 'minhhoa', 'hinhbuoc', 'giaimau']);
  const oldCommands = tokens.filter(t => oldNames.has(t.name));
  const theory = !chat && oldCommands.length ? parseTheory(oldCommands.map(t => t.raw).join('\n'), errors) : [];
  let part, pending = {}, previous, lastName;
  let stepStates, calcCommand;
  const hasQuestion = screen => ['quiz', 'tap', 'region', 'calc'].includes(screen?.type);
  const figureFor = (screen = pending) => screen?.fig || part?.fig;
  const stateFor = (source, screen = pending) => lessonState(source, error, chat ? figureFor(screen) : undefined);
  const setAfter = (target, source, screen) => {
    target.after = stateFor(source, screen);
  };
  for (const [index, cmd] of tokens.entries()) {
    const { name, args: [a, b, c, d, e, f] } = cmd;
    locate(cmd.start);
    const preceding = lastName;
    lastName = name;
    if (stepStates && name !== 'vidu') {
      error('\\theobuoc phải đứng ngay trước \\vidu');
      stepStates = undefined;
    }
    if (name === 'modau' || name === 'ketbai') {
      if (lesson[name]) error('Chỉ được có một khối ' + name);
      lesson[name] = lessonBoundary(cmd, error, warn, chat, locate);
      part = undefined;
      continue;
    }
    if (name === 'phan') {
      if (!lessonArgs(cmd, error)) continue;
      part = lessonPart(a, b);
      lesson.parts.push(part);
      partLocations.set(part, cmd.start);
      pending = {};
      previous = undefined;
      continue;
    }
    if (!part) {
      error('\\' + name + ' cần nằm trong một phần');
      continue;
    }
    if (!lessonArgs(cmd, error)) continue;
    if (chat && !cmd.env) chatLessonMath(cmd, warn);
    if (name === 'cherry' || name === 'loidan') {
      pending.cherry = a;
      if ([...a].length > 120) warn('\\cherry dài hơn 120 kí tự');
      continue;
    }
    if (name === 'nhaclai') { part.recap = a; continue; }
    if (name === 'hinhchung') { part.fig = lessonFigure(a, error, chat); continue; }
    if (name === 'hinhrieng') { pending.fig = lessonFigure(a, error, chat); continue; }
    if (name === 'trangthai') { pending.state = stateFor(a); continue; }
    if (name === 'theobuoc') { stepStates = cmd.args; continue; }
    if (name === 'saukhitra' && chat) {
      if (previous?.type === 'calc' && ['tinh', 'emtinh'].includes(preceding)) {
        setAfter(previous.calc.items.at(-1), a, previous);
      } else if (hasQuestion(previous) && ['thu', 'thungay', 'chamhinh', 'chamvung', 'nhac'].includes(preceding)) {
        setAfter(previous, a, previous);
      } else if (tokens[index + 1]?.name === 'thungay') {
        pending.after = stateFor(a);
      } else error('\\saukhitra cần theo sau một câu hỏi hoặc thao tác chạm');
      continue;
    }
    if (name === 'saukhitra') {
      const after = lessonState(a, error);
      // Bài mẫu đặt sau câu hỏi; cú pháp soạn cũng cho phép đặt trước.
      if (previous?.type === 'quiz' && preceding === 'thungay' && tokens[index + 1]?.name !== 'thungay') previous.after = after;
      else pending.after = after;
      continue;
    }
    if (name === 'chuyen') {
      pending.toggle = [{ label: a, state: stateFor(b) }, { label: c, state: stateFor(d) }];
      continue;
    }
    if (name === 'nhac') {
      if (previous?.type !== 'tap' || !['chamhinh', 'nhac'].includes(preceding)) error('\\nhac cần theo sau \\chamhinh');
      else if (!(chat && figureFor(previous)?.mau?.name === 'dang-thuc') && !LESSON_ANGLE.test(a)) error('Khóa góc không hợp lệ: ' + a);
      else previous.tap.nhac[a] = b;
      continue;
    }
    if (name === 'ketluan') {
      if (previous?.type !== 'calc' || !(preceding === 'emtinh' || (chat && ['tinh', 'saukhitra'].includes(preceding)))) error('\\ketluan cần theo sau \\emtinh');
      else previous.calc.ketluan = a;
      continue;
    }

    let screen;
    if (LESSON_RECAP.has(name) || name === 'nhanxet') screen = { type: 'read', kind: name, title: a, body: b };
    else if (name === 'luuy') screen = { type: 'read', kind: name, title: 'Cần nhớ', body: a };
    else if (name === 'vidu') {
      screen = { type: 'vidu', body: a, sol: b };
      if (stepStates) {
        if (stepStates.length > b.split(/\\\\/).filter(step => step.trim()).length) {
          error('\\theobuoc có nhiều trạng thái hơn số bước của \\vidu');
        }
        screen.stepStates = stepStates.map(source => stateFor(source));
        stepStates = undefined;
      }
    } else if (name === 'thu') {
      const { label, quiz } = chatOptions(cmd, error, warn, locate);
      screen = { type: 'quiz', label: label || 'Thử ngay', quiz };
    } else if (name === 'thungay') screen = { type: 'quiz', quiz: lessonQuiz(cmd.args, error, chat) };
    else if (name === 'thaotac') {
      if (cmd.label && cmd.label !== 'lech') error('Nhãn của \\thaotac chỉ nhận [lech]');
      const act = { label: a, state: stateFor(b, preceding === name ? previous : pending), say: c, warn: cmd.label === 'lech' };
      if (preceding === name && previous?.type === 'act') {
        previous.acts.push(act);
        continue;
      }
      screen = { type: 'act', acts: [act] };
    }
    else if (name === 'chamhinh') {
      if (!(chat && figureFor()?.mau?.name === 'dang-thuc') && !LESSON_ANGLE.test(b)) error('Khóa góc không hợp lệ: ' + b);
      screen = { type: 'tap', tap: { prompt: a, ans: b, ok: c, hint: d, nhac: {} } };
    } else if (name === 'chamvung') {
      if (!LESSON_REGIONS.has(b)) error('Khóa vùng không hợp lệ: ' + b);
      screen = { type: 'region', region: { prompt: a, key: b, ok: c } };
    } else if (name === 'truot') screen = { type: 'slide', slide: { label: a, after: b } };
    else if (name === 'emtinh' || name === 'tinh') {
      const consecutive = previous?.type === 'calc' &&
        (preceding === name || (chat && preceding === 'saukhitra' && calcCommand === name));
      const item = name === 'tinh'
        ? chatOptions(cmd, error, warn, locate).quiz
        : { ...lessonQuiz([a, b, c, d, e], error, chat), state: stateFor(f, consecutive ? previous : pending) };
      calcCommand = name;
      if (consecutive) {
        previous.calc.items.push(item);
        continue;
      }
      screen = { type: 'calc', calc: { items: [item], ketluan: '' } };
    } else if (name === 'xemtungbuoc') screen = { type: 'steps' };
    else if (name === 'hinhbuoc') screen = { type: 'steps', body: cmd.raw, fig: lessonFigureToken(cmd, error) };
    else if (name === 'minhhoa') screen = { type: 'lab', kind: name, template: a, value: b };
    else if (name === 'giaimau') screen = { type: 'giaimau', body: cmd.raw };
    else {
      error('\\' + name + ' không phải lệnh màn hoặc lệnh gắn');
      continue;
    }
    previous = { ...pending, ...screen };
    part.screens.push(previous);
    screenLocations.set(previous, cmd.start);
    pending = {};
  }
  if (stepStates) error('\\theobuoc phải đứng ngay trước \\vidu');
  locate(0);
  if (chat && !lesson.parts.length) error('Cần ít nhất một \\phan');
  if (chat && !/\\ten\b/.test(body)) warn('Bài chưa dùng \\ten để gọi tên học sinh');
  if (!lesson.modau) warn('Thiếu khối modau');
  if (!lesson.ketbai) warn('Thiếu khối ketbai');
  for (const item of lesson.parts) {
    const { title, screens, fig } = item;
    locate(partLocations.get(item));
    if (!screens.length) error('Phần "' + title + '" chưa có màn');
    if (chat && screens.length && !screens.some(hasQuestion)) warn('Phần "' + title + '" chưa có câu hỏi');
    if (screens.length > 10) warn('Phần "' + title + '" có hơn 10 màn');
    if (!item.recap) item.recap = lessonRecap(item);
    for (const [index, screen] of screens.entries()) {
      locate(screenLocations.get(screen));
      const figure = screen.fig || fig;
      if (chat && figure?.mau?.name === 'dang-thuc') {
        let current = chatApplyState(figure, screen.state, error);
        if (screen.tap) {
          for (const key of [screen.tap.ans, ...Object.keys(screen.tap.nhac)]) {
            if (!chatTermExists(current.mau.params, key)) error('Khóa số hạng không có trong hình: ' + key);
          }
        }
        for (const toggle of screen.toggle || []) chatApplyState(current, toggle.state, error);
        for (const state of screen.stepStates || []) current = chatApplyState(current, state, error);
        for (const act of screen.acts || []) current = chatApplyState(current, act.state, error);
        for (const calc of screen.calc?.items || []) {
          current = chatApplyState(current, calc.state, error);
          current = chatApplyState(current, calc.after, error);
        }
        chatApplyState(current, screen.after, error);
      }
      if (['tap', 'region', 'slide'].includes(screen.type) && figure?.kind !== 'mau') {
        error('Phần "' + title + '", màn ' + (index + 1) + ' cần hình mẫu');
      }
      if (screen.type === 'read' && !figure && !lessonTokens(screen.body).some(token =>
        token.closed && (token.name === 'tikzpicture' || token.name === 'hinhbuoc'))) {
        warn('Phần "' + title + '", màn ' + (index + 1) + ' chỉ có chữ');
      }
    }
  }
  return { theory, lesson };
}

function errorText(e) {
  return (e.line ? 'Dòng ' + e.line + ': ' : '') + (e.level ? `Màn ${e.level}` : '') + (e.q ? `, câu ${e.q}` : '') + (e.level ? ': ' : '') + e.msg;
}


const CHAT_SETTING_KEY = 'bai_chat_khoi';

function chatGrades(value) {
  if (!Array.isArray(value)) return [];
  return [...new Set(value.map(Number).filter(grade => Number.isInteger(grade) && grade >= 6 && grade <= 12))]
    .sort((a, b) => a - b);
}

function chatMaskComments(source) {
  return source.replace(/(^|[^\\])%[^\r\n]*/gm, (_, prefix) =>
    prefix + ' '.repeat(_.length - prefix.length));
}

function chatBlockRange(source, environment) {
  const re = new RegExp('\\\\(begin|end)\\s*\\{' + environment + '\\}', 'g');
  const markers = [...chatMaskComments(source).matchAll(re)];
  if (!markers.length) return null;
  const [start, end] = markers;
  if (markers.length !== 2 || start[1] !== 'begin' || end[1] !== 'end') {
    return { error: 'Cần đúng một khối ' + environment + ' có đủ lệnh mở và đóng.', start: start.index };
  }
  return { start: start.index, end: end.index + end[0].length };
}

function inspectChatSource(source, { standalone = false } = {}) {
  const raw = String(source || '');
  const block = chatBlockRange(raw, 'baichat');
  const line = raw.slice(0, block?.start || 0).split(/\r\n|\n|\r/).length;
  const reject = msg => ({ chat: null, block: '', errors: [{ line, msg }], warnings: [] });
  if (!block || block.error) return reject(block?.error || 'Dán một khối \\begin{baichat}…\\end{baichat}.');
  if (standalone && chatMaskComments(raw.slice(0, block.start) + '\n' + raw.slice(block.end)).trim()) {
    return reject('Ô Bản chat chỉ nhận khối baichat.');
  }
  const text = raw.slice(block.start, block.end);
  const parsed = parseBank('\\chude{Bài chat}\n' + text);
  const locate = item => ({ ...item, line: Math.max(line, line + (item.line || 2) - 2) });
  return { chat: parsed.chat, block: text, errors: parsed.errors.map(locate), warnings: parsed.warnings.map(locate) };
}

function replaceChatBlock(topicSource, chatBlock) {
  const raw = String(topicSource || '');
  const current = chatBlockRange(raw, 'baichat');
  if (current?.error) throw new Error(current.error);
  if (current) return raw.slice(0, current.start) + chatBlock + raw.slice(current.end);

  const old = chatBlockRange(raw, 'lythuyet');
  if (old?.error) throw new Error(old.error);
  const masked = chatMaskComments(raw);
  const heading = /\\chude\s*\{/.exec(masked);
  const end = old?.end ?? (heading && group(masked, heading.index + 6)?.[1]);
  if (!end) throw new Error('Chủ đề cần có \\chude{Tên chủ đề} trước khi thêm bản chat.');
  const newline = raw.includes('\r\n') ? '\r\n' : '\n';
  const suffix = raw.slice(end);
  // Giữ bình luận cuối dòng đi cùng lệnh trước khi chèn.
  const sameLine = /^[ \t]*%[^\r\n]*/.exec(suffix)?.[0] || '';
  const at = end + sameLine.length;
  return raw.slice(0, at) + newline + newline + chatBlock + newline + raw.slice(at);
}

splay:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:2px solid var(--chat-line);padding:10px 14px}\n.chat-pane h2 {font:800 22px/1.2 \"Baloo 2\",system-ui,sans-serif;margin:0}\n.chat-pane-scroll {overflow:auto;min-height:0}\n.chat-toc-item {display:flex;align-items:center;gap:10px;text-align:left;width:100%;background:white!important;border:2px solid var(--chat-line)!important}\n.chat-toc-item[aria-current=\"step\"] {border-color:var(--chat-teal)!important}\n.chat-toc-item small {display:block;color:var(--chat-muted)}\n.chat-toc-item[aria-disabled=\"true\"] {color:var(--chat-muted)}\n.chat-summary-inner section {background:white;border:2px solid var(--chat-line);border-radius:16px;padding:12px;scroll-margin-top:10px}\n.chat-summary-inner h3 {margin:0 0 8px;color:var(--chat-teal)}\n.chat-summary-inner .chat-figure {margin:8px 0}\n.chat-summary-inner .chat-figure svg {max-height:235px}\n.chat-finished {flex-wrap:wrap;font-size:14px;background:#e8f7ef}\n.chat-finished button {background:white;border:1px solid var(--chat-teal);border-radius:10px;padding:4px 8px}\n.chat-toast {position:absolute;z-index:4;bottom:66px;left:50%;transform:translateX(-50%);background:var(--chat-ink);color:white;border-radius:12px;padding:7px 12px;text-align:center;width:max-content;max-width:90%}\n.chat-dots {display:flex;gap:5px;padding:12px 14px}\n.chat-dots i {width:8px;height:8px;border-radius:50%;background:#8f8267;animation:cherry-dot 1s infinite ease-in-out}\n.chat-dots i:nth-child(2) {animation-delay:.15s}\n.chat-dots i:nth-child(3) {animation-delay:.3s}\n@keyframes cherry-dot {0%,60%,100% {transform:none;opacity:.5} 30% {transform:translateY(-4px);opacity:1}}\n@media (prefers-reduced-motion:reduce) {\n  .chat-dots i {animation:none}\n  .chat-figure .cat-slide,.chat-progress b {transition:none}\n}\n@media (max-width:430px) {\n  .chat-top {gap:5px;padding-inline:9px}\n  .chat-top button {padding-inline:7px;font-size:13px}\n  .chat-stream,.chat-summary-inner {padding-inline:8px}\n  .chat-turn {grid-template-columns:34px minmax(0,1fr);gap:6px}\n  .chat-avatar {width:34px}\n}\n\n#thBody.chat-host {min-height:0;flex:1;padding:0}\n.chat-editor-preview,.chat-review-preview {height:min(660px,70vh);margin:8px 0;border:1px solid #ece3d1;border-radius:14px;overflow:hidden}\n#thChatDiagnostics button {display:block;width:100%;text-align:left;padding:6px 9px;white-space:normal}\n#thChatDiagnostics button.tnote {color:#755315;background:#fff5d4;border:1px solid #e8d197;border-radius:8px}\n\u003c/style>\n\u003cdiv id=\"stage\">\u003c/div>\n\u003cscript>window.MathJax={tex:{inlineMath:[['$','$'],['\\\\(','\\\\)']]},startup:{typeset:false},options:{enableMenu:false}};\u003c/script>\n\u003cscript defer src=\"https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-chtml.js\">\u003c/script>";
const CHAT_RENDERER="// Câu hỏi có tham số (giống cú pháp game lớp học):\n//   %@ a = ngaunhien(2, 9)        số nguyên ngẫu nhiên trong [2; 9]\n//   %@ b = chon(2, 3, 5)          chọn ngẫu nhiên một giá trị\n//   %@ c = a*b + 1                biểu thức từ các tham số trước\n//   %@ dieukien: a != b           điều kiện phải thỏa (thử lại tối đa 300 lần)\n// Trong đề viết {{a}}, {{2*a+b}}, {{+b}} (luôn có dấu), {{ps(p, q)}} (phân số tối giản).\n// Không dùng tham số bên trong hình TikZ.\n\nconst FUNCS = new Set(['ngaunhien', 'chon', 'ps', 'abs', 'min', 'max', 'ucln', 'bcnn', 'sqrt', 'tron']);\nconst gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };\n\n// ---- số hữu tỉ ----\nclass Frac {\n  constructor(p, q) {\n    if (!Number.isInteger(p) || !Number.isInteger(q) || q === 0) throw new Error('ps(p, q) cần p, q nguyên và q ≠ 0');\n    const g = gcd(p, q) || 1, s = q \u003c 0 ? -1 : 1;\n    this.p = (s * p) / g; this.q = (s * q) / g;\n  }\n  get v() { return this.p / this.q; }\n}\nconst isF = x => x instanceof Frac;\nconst toF = x => (isF(x) ? x : Number.isInteger(x) ? new Frac(x, 1) : null);\nfunction arith(op, a, b) {\n  if (isF(a) || isF(b)) {\n    const A = toF(a), B = toF(b);\n    if (A && B) {\n      if (op === '+') return new Frac(A.p * B.q + B.p * A.q, A.q * B.q);\n      if (op === '-') return new Frac(A.p * B.q - B.p * A.q, A.q * B.q);\n      if (op === '*') return new Frac(A.p * B.p, A.q * B.q);\n      if (op === '/') return new Frac(A.p * B.q, A.q * B.p);\n    }\n    a = isF(a) ? a.v : a; b = isF(b) ? b.v : b;\n  }\n  switch (op) {\n    case '+': return a + b; case '-': return a - b; case '*': return a * b;\n    case '/': if (b === 0) throw new Error('chia cho 0'); return a / b;\n    case '%': return a % b; case '^': return a ** b;\n  }\n}\nconst num = x => (isF(x) ? x.v : x);\n\n// ---- tách từ & phân tích biểu thức ----\nfunction tokenize(s) {\n  const t = []; let i = 0;\n  while (i \u003c s.length) {\n    const c = s[i];\n    if (/\\s/.test(c)) { i++; continue; }\n    const two = s.slice(i, i + 2);\n    if (['==', '!=', '\u003c=', '>=', '&&', '||'].includes(two)) { t.push(two); i += 2; continue; }\n    if ('+-*/%^(),\u003c>!'.includes(c)) { t.push(c); i++; continue; }\n    const m = s.slice(i).match(/^(\\d+(?:\\.\\d+)?|[A-Za-z_]\\w*)/);\n    if (!m) throw new Error(`ký tự lạ \"${c}\"`);\n    t.push(m[1]); i += m[1].length;\n  }\n  return t;\n}\nfunction evaluate(src, env, rng = Math.random) {\n  const t = tokenize(String(src)); let k = 0;\n  const peek = () => t[k], eat = x => { if (t[k] !== x) throw new Error(`thiếu \"${x}\"`); k++; };\n  const bin = (next, ops, f) => () => { let a = next(); while (ops.includes(peek())) { const o = t[k++]; a = f(o, a, next()); } return a; };\n  const atom = () => {\n    const x = t[k++];\n    if (x === undefined) throw new Error('biểu thức dở dang');\n    if (x === '(') { const v = or(); eat(')'); return v; }\n    if (/^\\d/.test(x)) return Number(x);\n    if (peek() === '(') {\n      if (!FUNCS.has(x)) throw new Error(`không có hàm ${x}`);\n      k++; const args = [];\n      if (peek() !== ')') { args.push(or()); while (peek() === ',') { k++; args.push(or()); } }\n      eat(')');\n      return call(x, args, rng);\n    }\n    if (!(x in env)) throw new Error(`chưa khai báo tham số ${x}`);\n    return env[x];\n  };\n  const pow = () => { const a = atom(); if (peek() === '^') { k++; return arith('^', num(a), num(unary())); } return a; };\n  const unary = () => {\n    if (peek() === '-') { k++; const v = unary(); return isF(v) ? new Frac(-v.p, v.q) : -v; }\n    if (peek() === '+') { k++; return unary(); }\n    if (peek() === '!') { k++; return !unary(); }\n    return pow();\n  };\n  const mul = bin(unary, ['*', '/', '%'], (o, a, b) => arith(o, a, b));\n  const add = bin(mul, ['+', '-'], (o, a, b) => arith(o, a, b));\n  const cmp = () => {\n    const a = add();\n    if (['==', '!=', '\u003c', '>', '\u003c=', '>='].includes(peek())) {\n      const o = t[k++], x = num(a), y = num(add()), e = 1e-9;\n      return o === '==' ? Math.abs(x - y) \u003c e : o === '!=' ? Math.abs(x - y) >= e : o === '\u003c' ? x \u003c y : o === '>' ? x > y : o === '\u003c=' ? x \u003c= y + e : x >= y - e;\n    }\n    return a;\n  };\n  const and = bin(cmp, ['&&'], (o, a, b) => a && b);\n  const or = bin(and, ['||'], (o, a, b) => a || b);\n  const v = or();\n  if (k \u003c t.length) throw new Error(`thừa \"${t[k]}\"`);\n  return v;\n}\nfunction call(f, a, rng) {\n  const n = a.map(num);\n  switch (f) {\n    case 'ngaunhien': {\n      const [lo, hi] = n;\n      if (!Number.isInteger(lo) || !Number.isInteger(hi) || lo > hi) throw new Error('ngaunhien(a, b) cần a ≤ b nguyên');\n      return lo + Math.floor(rng() * (hi - lo + 1));\n    }\n    case 'chon': if (!a.length) throw new Error('chon() cần ít nhất 1 giá trị'); return a[Math.floor(rng() * a.length)];\n    case 'ps': return new Frac(n[0], n[1]);\n    case 'abs': return isF(a[0]) ? new Frac(Math.abs(a[0].p), a[0].q) : Math.abs(n[0]);\n    case 'min': return Math.min(...n); case 'max': return Math.max(...n);\n    case 'ucln': return gcd(n[0], n[1]);\n    case 'bcnn': return Math.abs(n[0] * n[1]) / (gcd(n[0], n[1]) || 1);\n    case 'sqrt': return Math.sqrt(n[0]);\n    case 'tron': { const d = n[1] ?? 0; return Math.round(n[0] * 10 ** d) / 10 ** d; }\n  }\n}\n\n// ---- khai báo tham số ----\nfunction parseSpec(lines) {\n  const vars = [], conds = [];\n  for (const raw of lines) {\n    const l = raw.trim();\n    if (!l) continue;\n    let m = l.match(/^dieukien\\s*:\\s*(.+)$/i);\n    if (m) { conds.push(m[1]); continue; }\n    m = l.match(/^([A-Za-z_]\\w*)\\s*=\\s*(.+)$/);\n    if (!m) throw new Error(`dòng tham số không hiểu: \"${l}\"`);\n    if (FUNCS.has(m[1])) throw new Error(`không đặt tên tham số trùng tên hàm: ${m[1]}`);\n    vars.push({ name: m[1], expr: m[2] });\n  }\n  return { vars, conds };\n}\nfunction sampleEnv(spec, rng = Math.random) {\n  for (let tries = 0; tries \u003c 300; tries++) {\n    const env = {};\n    for (const v of spec.vars) env[v.name] = evaluate(v.expr, env, rng);\n    if (spec.conds.every(c => evaluate(c, env, rng))) return env;\n  }\n  throw new Error('không tìm được bộ tham số thỏa điều kiện sau 300 lần thử');\n}\n\n// ---- in giá trị ----\nfunction fmt(v, mode) {\n  if (typeof v === 'boolean') return v ? 'đúng' : 'sai';\n  if (isF(v)) {\n    if (v.q === 1) return String(v.p);\n    if (mode === 'ans') return `${v.p}/${v.q}`;\n    return (v.p \u003c 0 ? '-' : '') + `\\\\dfrac{${Math.abs(v.p)}}{${v.q}}`;\n  }\n  let s = Number.isInteger(v) ? String(v) : String(Math.round(v * 1e6) / 1e6);\n  if (s.includes('.')) s = mode === 'ans' ? s.replace('.', ',') : s.replace('.', '{,}');\n  return s;\n}\nfunction fill(str, env, mode = 'text') {\n  if (typeof str !== 'string') return str;\n  return str.replace(/\\{\\{(\\+?)([^{}]+)\\}\\}/g, (_, plus, e) => {\n    const v = evaluate(e, env);\n    const s = fmt(v, mode);\n    return plus && num(v) >= 0 ? '+' + s : s;\n  });\n}\nfunction fillQ(q, env) {\n  const f = s => fill(s, env);\n  return {\n    ...q, stem: f(q.stem), sol: f(q.sol),\n    ...(q.hints && { hints: q.hints.map(f) }),\n    ...(q.opts && { opts: q.opts.map(o => ({ ...o, t: f(o.t), ...(o.why && { why: f(o.why) }) })) }),\n    ...(q.items && { items: q.items.map(o => ({ ...o, t: f(o.t), ...(o.why && { why: f(o.why) }) })) }),\n    ...(q.traps && { traps: q.traps.map(x => ({ a: fill(x.a, env, 'ans'), why: f(x.why) })) }),\n    ...(q.pairs && { pairs: q.pairs.map(p => p.map(f)) }),\n    ...(q.ans && { ans: q.ans.map(a => fill(a, env, 'ans')) }),\n    ...(q.steps && { steps: q.steps.map(x => ({ ...x, t: f(x.t) })) }),\n    ...(q.nodes && { nodes: q.nodes.map(x => ({ ...x, t: f(x.t), c: f(x.c) })) }),\n    ...(q.bad && { bad: q.bad.map(x => ({ ...x, t: f(x.t), ...(x.why && { why: f(x.why) }) })) }),\n    ...(q.badc && { badc: q.badc.map(x => ({ ...x, t: f(x.t), ...(x.why && { why: f(x.why) }) })) }),\n  };\n}\n// Sinh một bản cụ thể của câu hỏi (câu không có tham số giữ nguyên)\nfunction instantiate(q, rng = Math.random) {\n  if (!q.params) return q;\n  const env = sampleEnv(parseSpec(q.params), rng);\n  const { params, ...rest } = fillQ(q, env);\n  return rest;\n}\n\n// Đọc ngân hàng câu hỏi LaTeX của game.\n// Cú pháp:\n//   \\chude{Tên chủ đề}\n//   \\man{1}{Nhận biết}\n//   \\begin{ex}    đề \\choice{..}{\\True ..}{..}{..}        \\loigiai{..} \\end{ex}     trắc nghiệm\n//   \\begin{extf}  đề \\choiceTF{\\True ..}{..}{\\True ..}{..} \\loigiai{..} \\end{extf}   đúng/sai từng ý\n//   \\begin{exfb}  đề \\shortans{đáp số;đáp số khác}          \\loigiai{..} \\end{exfb}   điền đáp số\n//   \\begin{exmatch} đề \\pair{trái}{phải} \\pair{..}{..}       \\loigiai{..} \\end{exmatch} nối ý\n//   \\begin{extl}  đề \\goiy{gợi ý 1} \\goiy{gợi ý 2}          \\end{extl}     tự luận (chỉ dùng trong đề ôn tập,\n//                 học sinh làm vào vở; app chỉ hiện đề và gợi ý, mỗi gợi ý mở lần đầu trừ XP)\n// Báo lỗi theo đáp án sai (hiện ngay khi học sinh chọn sai):\n//   ex:   \\sai{vì sao sai} đặt trong phương án sai, ví dụ \\choice{$5$ \\sai{Quên đổi dấu}}{\\True $-5$}..\n//   extf: \\sai{giải thích} đặt trong ý, hiện khi học sinh đánh giá sai ý đó\n//   exfb: \\saithuong{đáp số sai hay gặp}{vì sao sai}, viết nhiều lần được\n// Sắp xếp lời giải:\n//   \\begin{exsx} đề \\buoc{bước 1} \\buoc{bước 2} … \\nhieu{khối sai}{vì sao sai} \\loigiai{..} \\end{exsx}\n//   các bước liền nhau cùng nhãn \\buoc[1]{..} được đổi chỗ cho nhau\n// Sơ đồ phân tích đi lên:\n//   \\begin{exsd} đề \\nut{số}[ô cha]{mệnh đề}{căn cứ} … (ô kết luận không có [ô cha])\n//     \\an{2,3} ẩn mệnh đề, \\anly{3} ẩn căn cứ, \\nhieu{mệnh đề sai}{vì sao}, \\nhieuly{căn cứ sai}{vì sao} \\end{exsd}\n\n\nconst QTYPES = 'ex|extf|exfb|exmatch|extl|exsx|exsd';\nconst ENV = new RegExp('\\\\\\\\begin\\\\{(' + QTYPES + ')\\\\}([\\\\s\\\\S]*?)\\\\\\\\end\\\\{\\\\1\\\\}', 'g');\n\nfunction group(s, i) {\n  while (i \u003c s.length && /\\s/.test(s[i])) i++;\n  if (s[i] !== '{') return null;\n  let d = 0, j = i;\n  for (; j \u003c s.length; j++) {\n    if (s[j] === '\\\\') { j++; continue; }\n    if (s[j] === '{') d++;\n    else if (s[j] === '}') { d--; if (!d) break; }\n  }\n  if (d) return null;\n  return [s.slice(i + 1, j), j + 1];\n}\n\n// Hình từng bước (dùng ở mọi chỗ có nội dung, thường trong lythuyet):\n//   \\begin{hinhbuoc}\n//   \\begin{tikzpicture} … \\hien{2}{phần hiện từ bước 2} … \\end{tikzpicture}\n//   \\loibuoc{lời bước 1} \\loibuoc{lời bước 2} …\n//   \\end{hinhbuoc}\n// Mỗi bước là một khung hình dịch riêng: mã khung = hbFrame(tikz, k). Phần chưa đến lượt vẫn vẽ nhưng trong suốt\n// (xem PREAMBLE trong figcode.js) nên mọi khung cùng kích thước. Máy chủ và giao diện phải tính mã khung giống hệt nhau.\nconst HINHBUOC = /\\\\begin\\{hinhbuoc\\}([\\s\\S]*?)\\\\end\\{hinhbuoc\\}/g;\nconst HB_MAX = 8;\nconst TIKZ_ONE = /\\\\begin\\{tikzpicture\\}[\\s\\S]*?\\\\end\\{tikzpicture\\}/g;\nconst noComment = s => String(s || '').replace(/\\r/g, '').replace(/(^|[^\\\\])%.*$/gm, '$1');\nconst hbFrame = (tikz, k) => '\\\\lttbuoc{' + k + '}\\n' + tikz;\nfunction parseHinhBuoc(body) {\n  body = noComment(body);\n  const pics = body.match(TIKZ_ONE) || [];\n  const tikz = pics[0] || '';\n  const rest = pics.reduce((s, p) => s.replace(p, ''), body);\n  const caps = [], re = /\\\\loibuoc\\b/g; let m;\n  while ((m = re.exec(rest))) { const g = group(rest, re.lastIndex); if (!g) { caps.push(''); continue; } caps.push(g[0].trim()); re.lastIndex = g[1]; }\n  const steps = [...tikz.matchAll(/\\\\hien\\s*\\{\\s*(\\d+)\\s*\\}/g)].map(x => Number(x[1]));\n  return { tikz, pics: pics.length, caps, steps, frames: caps.map((_, i) => hbFrame(tikz, i + 1)) };\n}\n// Lỗi soạn của các khối hinhbuoc trong một đoạn mã\nfunction hinhBuocErrors(raw) {\n  const errors = [], src = noComment(raw);\n  const opened = (src.match(/\\\\begin\\{hinhbuoc\\}/g) || []).length, all = [...src.matchAll(HINHBUOC)];\n  if (opened !== all.length) errors.push('Hình từng bước chưa đóng \\\\end{hinhbuoc}');\n  all.forEach((m, i) => {\n    const h = parseHinhBuoc(m[1]), at = all.length > 1 ? ` thứ ${i + 1}` : '';\n    if (h.pics !== 1) errors.push(`Hình từng bước${at} cần đúng một hình tikzpicture (đang có ${h.pics})`);\n    if (h.caps.length \u003c 2) errors.push(`Hình từng bước${at} cần ít nhất 2 dòng \\\\loibuoc{…}, mỗi bước một dòng`);\n    if (h.caps.length > HB_MAX) errors.push(`Hình từng bước${at} tối đa ${HB_MAX} bước`);\n    if (h.caps.some(c => !c)) errors.push(`Hình từng bước${at}: có \\\\loibuoc thiếu nội dung {…}`);\n    if (h.pics === 1 && !h.steps.length) errors.push(`Hình từng bước${at} chưa có \\\\hien{số bước}{…} nào, các bước sẽ giống nhau`);\n    const bad = h.steps.filter(k => k \u003c 1 || k > h.caps.length);\n    if (h.caps.length >= 2 && bad.length) errors.push(`Hình từng bước${at}: \\\\hien{${bad[0]}} vượt quá số bước (${h.caps.length} dòng \\\\loibuoc)`);\n  });\n  return errors;\n}\n\n// Bài giải mẫu từng bước (trong lythuyet; sau này dùng cho mục Bài mẫu và gợi ý Ôn tập tự luận):\n//   \\begin{giaimau}\n//   \\de{đề bài}\n//   \\begin{tikzpicture} … \\hien{k}{hiện từ bước k} … \\phu{a}{b}{nét phụ chỉ hiện từ bước a đến b} … \\sang{k}{tô cam ở bước k} … \\end{tikzpicture}   (tùy chọn, một hình)\n//   \\cau{Câu 1}{yêu cầu}                                   mở một câu (ý) của bài\n//   \\doan{câu hỏi}{đúng}{sai}{vì sao đúng}{vì sao sai}[{sai 2}{vì sao sai 2}]   học sinh đoán hướng trước bước then chốt\n//   \\buocgiai{mục tiêu}{các dòng biến đổi, xuống dòng \\\\}{vì sao}                bước k (đếm từ 1 trong cả bài)\n//   \\begin{sodo} \\nut{cấp}{nội dung}{ghi chú} … \\end{sodo}                       sơ đồ phân tích đi lên, cấp 1 là gốc\n//   \\nhanxet{…}\n//   \\end{giaimau}\n// Hình: mỗi màn một khung. Khung = gmFrame(tikz, k, s): đã hiện tới bước k, tô sáng bước s (0 = không tô).\n// Phần tô sáng được vẽ sau cùng, phần còn lại mờ đi; phần chưa hiện vẫn vẽ trong suốt nên mọi khung cùng kích thước.\nconst GIAIMAU = /\\\\begin\\{giaimau\\}([\\s\\S]*?)\\\\end\\{giaimau\\}/g;\nfunction gmFrame(tikz, k, s) {\n  let t = tikz;\n  if (s && new RegExp('\\\\\\\\sang\\\\s*\\\\{\\\\s*' + s + '\\\\s*\\\\}').test(t)) {\n    let i = t.indexOf('\\\\begin{tikzpicture}') + 19;\n    while (/\\s/.test(t[i] || '')) i++;\n    if (t[i] === '[') { let d = 0; for (; i \u003c t.length; i++) { if (t[i] === '[') d++; else if (t[i] === ']') { d--; if (!d) { i++; break; } } } }\n    const e = t.lastIndexOf('\\\\end{tikzpicture}');\n    t = t.slice(0, i) + '\\\\begin{scope}[opacity=.3]' + t.slice(i, e) + '\\\\end{scope}\\\\lttsangve\\n' + t.slice(e);\n  }\n  return '\\\\lttbuoc{' + k + '}\\\\lttsang{' + s + '}\\n' + t;\n}\nfunction gmArgs(body, at, n) {\n  const args = []; let g;\n  while ((n == null || args.length \u003c n) && (g = group(body, at))) { args.push(g[0].trim()); at = g[1]; }\n  return [args, at];\n}\n// Hướng dẫn tự luận (\\begin{huongdan} trong \\begin{extl}): cùng cú pháp nhưng chỉ có \\buocgiai và sơ đồ, không cần \\de;\n// mỗi \\buocgiai hoặc sơ đồ là một gợi ý học sinh mở bằng XP. Không có lời giải chi tiết.\nconst HUONGDAN = /\\\\begin\\{huongdan\\}([\\s\\S]*?)\\\\end\\{huongdan\\}/g;\nfunction parseGiaiMau(raw, guide = false) {\n  const body = noComment(raw), errors = [];\n  const pics = body.match(TIKZ_ONE) || [], tikz = pics[0] || '';\n  if (pics.length > 1) errors.push(`Bài giải mẫu chỉ có một hình tikzpicture (đang có ${pics.length}); phần thay đổi theo bước dùng \\\\hien{k}{…} và \\\\sang{k}{…}`);\n  const rest = pics.reduce((x, p) => x.replace(p, ''), body);\n  const items = []; let de = '', n = 0, m;\n  const re = /\\\\(de|cau|doan|buocgiai|nhanxet)\\b|\\\\begin\\{sodo\\}/g;\n  while ((m = re.exec(rest))) {\n    const k = m[1];\n    if (!k) {\n      const end = rest.indexOf('\\\\end{sodo}', m.index);\n      if (end \u003c 0) { errors.push('Sơ đồ chưa đóng \\\\end{sodo}'); break; }\n      const inner = rest.slice(re.lastIndex, end), nodes = []; let q; const rn = /\\\\nut\\b/g;\n      while ((q = rn.exec(inner))) { const [a, at] = gmArgs(inner, rn.lastIndex, 3); rn.lastIndex = at; nodes.push({ lv: Number(a[0]) || 0, t: a[1] || '', note: a[2] || '' }); }\n      if (!nodes.length || nodes[0].lv !== 1) errors.push('Sơ đồ cần bắt đầu bằng \\\\nut{1}{điều cần chứng minh}{}');\n      if (nodes.some((x, i) => !x.lv || (i && x.lv > nodes[i - 1].lv + 1))) errors.push('Sơ đồ: cấp của \\\\nut phải là số, mỗi ô con chỉ sâu hơn ô trước tối đa một cấp');\n      items.push({ k: 'sodo', nodes, done: n });\n      re.lastIndex = end + 10; continue;\n    }\n    const want = { de: 1, cau: 2, buocgiai: 3, nhanxet: 1 }[k];\n    const [a, at] = gmArgs(rest, re.lastIndex, want); re.lastIndex = at;\n    if (k === 'de') { de = a[0] || ''; continue; }\n    if (k === 'doan') {\n      if (a.length \u003c 5 || a.length % 2 === 0) errors.push(`\\\\doan cần {câu hỏi}{đúng}{sai}{vì sao đúng}{vì sao sai}, thêm đáp án sai thì thêm từng cặp {sai}{vì sao} (đang có ${a.length} cặp ngoặc)`);\n      const opts = [{ t: a[1] || '', ok: true, ex: a[3] || '' }, { t: a[2] || '', ok: false, ex: a[4] || '' }];\n      for (let i = 5; i + 1 \u003c a.length; i += 2) opts.push({ t: a[i], ok: false, ex: a[i + 1] });\n      if (opts.some(o => !o.t)) errors.push('\\\\doan có đáp án để trống');\n      items.push({ k: 'doan', q: a[0] || '', opts, done: n }); continue;\n    }\n    if (a.length \u003c want) errors.push(`\\\\${k} cần ${want} cặp ngoặc {…} (đang có ${a.length})`);\n    if (k === 'cau') items.push({ k, title: a[0] || '', body: a[1] || '', done: n });\n    if (k === 'buocgiai') { n++; items.push({ k, n, goal: a[0] || '', body: a[1] || '', why: a[2] || '' }); }\n    if (k === 'nhanxet') items.push({ k, body: a[0] || '', done: n });\n  }\n  if (guide) {\n    if (items.some(x => !['buocgiai', 'sodo'].includes(x.k))) errors.push('Hướng dẫn tự luận chỉ dùng \\\\buocgiai{mục tiêu}{gợi ý}{vì sao} và sơ đồ \\\\begin{sodo}');\n    if (!items.length) errors.push('Hướng dẫn tự luận cần ít nhất một \\\\buocgiai hoặc một sơ đồ');\n  } else {\n    if (!de) errors.push('Bài giải mẫu thiếu \\\\de{đề bài}');\n    if (!n) errors.push('Bài giải mẫu cần ít nhất một \\\\buocgiai{mục tiêu}{lời giải}{vì sao}');\n  }\n  if (tikz) {\n    const bad = [...tikz.matchAll(/\\\\(hien|sang)\\s*\\{\\s*(\\d+)\\s*\\}/g)].filter(x => +x[2] \u003c 1 || +x[2] > n);\n    if (bad.length) errors.push(`Hình bài giải mẫu: \\\\${bad[0][1]}{${bad[0][2]}} không khớp số bước (có ${n} \\\\buocgiai)`);\n    const badPhu = [...tikz.matchAll(/\\\\phu\\s*\\{\\s*(\\d+)\\s*\\}\\s*\\{\\s*(\\d+)\\s*\\}/g)].filter(x => +x[1] \u003c 1 || +x[2] \u003c +x[1] || +x[2] > n);\n    if (badPhu.length) errors.push(`Hình bài giải mẫu: \\\\phu{${badPhu[0][1]}}{${badPhu[0][2]}} cần 1 ≤ bước đầu ≤ bước cuối ≤ ${n}`);\n  }\n  // khung hình của từng màn\n  const fr = (k, s) => tikz ? gmFrame(tikz, k, s) : '';\n  const full = fr(99, 0);\n  for (const it of items) it.frame = it.k === 'buocgiai' ? fr(it.n, it.n) : fr(it.done, 0);\n  const frames = tikz ? [...new Set([...(guide ? [] : [full]), ...items.map(it => it.frame)])] : [];\n  return { de, tikz, full, items, steps: n, frames, errors };\n}\nfunction giaiMauErrors(raw) {\n  const src = noComment(raw), errors = [];\n  const opened = (src.match(/\\\\begin\\{giaimau\\}/g) || []).length, all = [...src.matchAll(GIAIMAU)];\n  if (opened !== all.length) errors.push('Bài giải mẫu chưa đóng \\\\end{giaimau}');\n  all.forEach((m, i) => { for (const e of parseGiaiMau(m[1]).errors) errors.push(all.length > 1 ? `Bài giải mẫu thứ ${i + 1}: ${e}` : e); });\n  const hd = [...src.matchAll(HUONGDAN)];\n  if ((src.match(/\\\\begin\\{huongdan\\}/g) || []).length !== hd.length) errors.push('Hướng dẫn tự luận chưa đóng \\\\end{huongdan}');\n  hd.forEach((m, i) => { for (const e of parseGiaiMau(m[1], true).errors) errors.push(`Hướng dẫn tự luận${hd.length > 1 ? ` thứ ${i + 1}` : ''}: ${e}`); });\n  return errors;\n}\n\nfunction takeCmd(body, cmd) {\n  const k = body.indexOf('\\\\' + cmd);\n  if (k \u003c 0) return [body, null];\n  const g = group(body, k + cmd.length + 1);\n  if (!g) return [body, null];\n  return [body.slice(0, k) + body.slice(g[1]), g[0].trim()];\n}\n\nfunction readGroups(b, i) {\n  const out = []; let g;\n  while ((g = group(b, i))) { out.push(g[0]); i = g[1]; }\n  return out;\n}\n\nfunction takeAll(body, cmd) {\n  const out = []; let r;\n  for (;;) { [body, r] = takeCmd(body, cmd); if (r === null) break; out.push(r); }\n  return [body, out];\n}\n// Mã nhận diện câu hỏi (ổn định khi soạn lại không đổi nội dung câu)\nfunction qkeyOf(q) {\n  // Lời báo lỗi (\\sai, \\saithuong) không tính vào mã: thêm/sửa lời báo lỗi không làm mất lịch ôn của câu\n  const strip = a => a && a.map(({ why, ...o }) => o);\n  const base = [q.type, q.stem, strip(q.opts), strip(q.items), q.ans, q.pairs, q.params];\n  // Dạng mới (sắp xếp, sơ đồ): thêm trường riêng; dạng cũ giữ nguyên chuỗi băm để không đổi mã câu\n  if (q.steps || q.nodes) base.push(q.steps, strip(q.bad), q.nodes, q.hid, q.hidc, strip(q.badc));\n  const str = JSON.stringify(base);\n  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;\n  for (let i = 0; i \u003c str.length; i++) { const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }\n  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);\n  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);\n  return (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0');\n}\n\n// Lấy mọi lệnh \\ten[tùy chọn]{..}{..} (đúng tên, không nhầm \\an với \\angle hay \\anly).\n// Trả về [phần còn lại, [{o, a:[..]}]]. Thiếu đối số bắt buộc thì ghi vào bad.\nfunction takeArgs(body, name, n, min, withOpt, bad) {\n  const out = [], re = new RegExp('\\\\\\\\' + name + '(?![a-zA-Z])');\n  for (let m; (m = re.exec(body));) {\n    let i = m.index + m[0].length, o = null;\n    if (withOpt) { let k = ts.length !== 1) return roots.length ? 'Chỉ được một ô kết luận (ô không có [ô cha])' : 'Chưa có ô kết luận (ô không có [ô cha])';\n  for (const n of q.nodes) {\n    if (n.p && !by[n.p]) return `Ô ${n.id} ghi ô cha [${n.p}] nhưng chưa có \\\\nut{${n.p}}`;\n    let x = n, d = 0; while (x.p && d++ \u003c= q.nodes.length) x = by[x.p];\n    if (d > q.nodes.length) return `Ô ${n.id} nằm trong một vòng lặp ô cha`;\n  }\n  for (const id of [...q.hid, ...q.hidc]) if (!by[id]) return `\\\\an hoặc \\\\anly nhắc ô ${id} nhưng chưa có ô này`;\n  for (const id of q.hidc) if (!by[id].c) return `Ô ${id} chưa có căn cứ nên không ẩn được bằng \\\\anly`;\n  if (q.hid.includes(roots[0].id)) return 'Không ẩn ô kết luận: học sinh cần biết phải chứng minh gì';\n  if (!q.hid.length && !q.hidc.length) return 'Chưa ẩn ô nào: thêm \\\\an{…} hoặc \\\\anly{…}';\n  return '';\n}\nconst isTrue = t => /\\\\True\\b/.test(t);\nconst clean = t => t.replace(/\\\\True\\b/g, '').trim();\n// Tách \\sai{...} khỏi một phương án / một ý (không nhầm với \\saithuong)\nfunction takeWhy(t) {\n  const m = /\\\\sai(?![a-zA-Z])/.exec(t);\n  if (!m) return [t, null];\n  const g = group(t, m.index + 4);\n  if (!g) return [t, null];\n  return [t.slice(0, m.index) + t.slice(g[1]), g[0].trim()];\n}\nconst opt = o => { const [t, why] = takeWhy(o); const r = { t: clean(t), ok: isTrue(t) }; if (why) r.why = why; return r; };\n\nfunction parseBank(raw) {\n  const errors = [], warnings = [];\n  raw = String(raw || '').replace(/\\r/g, '')\n    .replace(/^[ \\t]*%@(.*)$/gm, (_, x) => '\\\\lttp{' + x.replace(/[{}]/g, '').replace(/%/g, '\\u0001') + '}')\n    .replace(/(^|[^\\\\])%.*$/gm, '$1');\n  const t = raw.match(/\\\\chude\\s*\\{/);\n  const tg = t ? group(raw, t.index + 6) : null;\n  const topic = tg ? tg[0].trim() : '';\n  if (!topic) errors.push({ msg: 'Thiếu \\\\chude{Tên chủ đề}' });\n  for (const msg of hinhBuocErrors(raw)) errors.push({ msg });\n  for (const msg of giaiMauErrors(raw)) errors.push({ msg });\n\n  //
