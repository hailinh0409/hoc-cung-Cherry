(e2) { err(e2); continue; }\n      } else {\n        const k = b.indexOf('\\\\pair');\n        if (k \u003c 0) { err('Câu nối ý thiếu \\\\pair{..}{..}'); continue; }\n        q.stem = b.slice(0, k).trim(); q.pairs = [];\n        let i = k, bad = false;\n        while (i >= 0) {\n          const a = group(b, i + 5), c = a && group(b, a[1]);\n          if (!a || !c) { bad = true; break; }\n          q.pairs.push([a[0].trim(), c[0].trim()]);\n          i = b.indexOf('\\\\pair', c[1]);\n        }\n        if (bad) { err('\\\\pair phải có 2 vế: \\\\pair{trái}{phải}'); continue; }\n        if (q.pairs.length \u003c 2) { err('Câu nối ý cần ít nhất 2 cặp'); continue; }\n      }\n      if (!q.stem) { err('Câu hỏi chưa có đề bài'); continue; }\n      if (q.params) {\n        try { for (let t = 0; t \u003c 5; t++) instantiate(q); } catch (ex) { err('tham số: ' + ex.message); continue; }\n      } else if (/\\{\\{[^{}]+\\}\\}/.test(JSON.stringify([q.stem, q.opts, q.items, q.ans, q.pairs, q.sol, q.traps, q.steps, q.nodes, q.bad, q.badc]))) {\n        err('có {{...}} nhưng chưa khai báo tham số %@'); continue;\n      }\n      q.key = qkeyOf(q);\n      qs.push(q);\n    }\n    const opened = (body.match(new RegExp('\\\\\\\\begin\\\\{(' + QTYPES + ')\\\\}', 'g')) || []).length;\n    const closed = (body.match(new RegExp('\\\\\\\\begin\\\\{(' + QTYPES + ')\\\\}[\\\\s\\\\S]*?\\\\\\\\end\\\\{(' + QTYPES + ')\\\\}', 'g')) || []).length;\n    if (opened > closed) errors.push({ level: n, msg: 'Có câu chưa đóng \\\\end{...} hoặc \\\\begin và \\\\end không cùng loại' });\n    if (!qs.length && !errors.some(er => er.level === n)) errors.push({ level: n, msg: 'Màn này chưa có câu hỏi nào' });\n    levels.push({ n, title: g2[0].trim(), qs });\n  });\n  const all = levels.flatMap(l => l.qs);\n  if (all.some(q => q.type === 'extl') && all.some(q => q.type !== 'extl'))\n    errors.push({ msg: 'Đề tự luận (\\\\begin{extl}) không trộn chung với câu trắc nghiệm, đúng/sai, điền số, nối ý. Thầy tách thành hai đề.' });\n  return { topic, levels, errors, warnings, theory, lesson, chat };\n}\n// Đề tự luận: mọi câu là extl\nconst isTLBank = levels => levels.some(l => l.qs.some(q => q.type === 'extl'));\n\n// Các mục của khối lý thuyết. Hai đối số {tiêu đề}{nội dung}, riêng \\luuy{nội dung}; \\vidu{đề}{lời giải}.\nconst THEORY_KINDS = { dinhnghia: 'Định nghĩa', quytac: 'Quy tắc', congthuc: 'Công thức', dinhly: 'Định lý', tinhchat: 'Tính chất', luuy: 'Lưu ý', vidu: 'Ví dụ' };\nfunction parseTheory(body, errors) {\n  const items = [], re = /\\\\(dinhnghia|quytac|congthuc|dinhly|tinhchat|luuy|vidu|loidan|minhhoa|thungay)\\b|\\\\begin\\{(hinhbuoc|giaimau)\\}/g; let m;\n  while ((m = re.exec(body))) {\n    const k = m[1];\n    if (!k) {\n      // Hình từng bước đứng riêng trong lythuyet: hiện ở cột minh họa như \\minhhoa (lỗi soạn đã báo ở hinhBuocErrors)\n      const env = m[2], endTag = '\\\\end{' + env + '}', end = body.indexOf(endTag, m.index);\n      if (end \u003c 0) break;\n      re.lastIndex = end + endTag.length;\n      items.push({ k: env, body: body.slice(m.index, re.lastIndex) });\n      continue;\n    }\n    if (k === 'loidan' || k === 'minhhoa' || k === 'thungay') {\n      const args = [];\n      let at = re.lastIndex, arg;\n      while ((arg = group(body, at))) {\n        args.push(arg[0].trim());\n        at = arg[1];\n      }\n      re.lastIndex = at;\n      const count = k === 'loidan' ? 1 : k === 'minhhoa' ? 2 : 5;\n      if (args.length !== count || args.some(s => !s)) {\n        errors.push({ msg: 'Lý thuyết: \\\\' + k + ' cần đúng ' + count + ' cặp {…} có nội dung' });\n        continue;\n      }\n      if (k === 'minhhoa') {\n        const [template, value] = args;\n        if (template === 'gia-tri-theo-hang') {\n          if (!/^(?:0|[1-9]\\d{0,11})$/.test(value)) {\n            errors.push({ msg: 'Mẫu gia-tri-theo-hang cần số tự nhiên tối đa 12 chữ số, viết liền và không thêm số 0 ở đầu' });\n            continue;\n          }\n        } else if (template === 'ghep-so-la-ma') {\n          if (!/^(?:[1-9]|[12]\\d|3\\d)$/.test(value)) {\n            errors.push({ msg: 'Mẫu ghep-so-la-ma cần số nguyên từ 1 đến 39' });\n            continue;\n          }\n        } else {\n          errors.push({ msg: 'Lý thuyết: chưa có mẫu minh họa ' + template });\n          continue;\n        }\n        items.push({ k, template, value });\n      } else if (k === 'thungay') {\n        const [body, correct, wrong, explainCorrect, explainWrong] = args;\n        if (correct === wrong) {\n          errors.push({ msg: 'Lý thuyết: hai đáp án của \\\\thungay phải khác nhau' });\n          continue;\n        }\n        items.push({ k, body, correct, wrong, explainCorrect, explainWrong });\n      } else {\n        items.push({ k, body: args[0] });\n      }\n      continue;\n    }\n    const g1 = group(body, re.lastIndex);\n    if (!g1) { errors.push({ msg: `Lý thuyết: \\\\${k} thiếu {…}` }); continue; }\n    if (k === 'luuy') { items.push({ k, title: '', body: g1[0].trim() }); re.lastIndex = g1[1]; continue; }\n    const g2 = group(body, g1[1]);\n    if (!g2) { errors.push({ msg: `Lý thuyết: \\\\${k} cần hai cặp {…}{…}` }); re.lastIndex = g1[1]; continue; }\n    items.push(k === 'vidu' ? { k, title: '', body: g1[0].trim(), sol: g2[0].trim() } : { k, title: g1[0].trim(), body: g2[0].trim() });\n    re.lastIndex = g2[1];\n  }\n  if (!items.length) errors.push({ msg: 'Khối lý thuyết chưa có mục nào (\\\\dinhnghia, \\\\quytac, \\\\congthuc, \\\\dinhly, \\\\tinhchat, \\\\luuy, \\\\vidu)' });\n  return items;\n}\n\nconst LESSON_ARGS = {\n  phan: 2, nhaclai: 1, hinhchung: 1, cherry: 1, loidan: 1, hinhrieng: 1,\n  trangthai: 1, saukhitra: 1, chuyen: 4, cauhoi: 1, nutbuoc: 1,\n  dinhnghia: 2, quytac: 2, congthuc: 2, dinhly: 2, tinhchat: 2, nhanxet: 2,\n  luuy: 1, vidu: 2, thungay: 5, chamhinh: 4, nhac: 2, chamvung: 3,\n  truot: 2, emtinh: 6, ketluan: 1, xemtungbuoc: 0, minhhoa: 2, hinhmau: 2,\n};\nconst CHAT_ARGS = { dung: 2, sai: 2, thaotac: 3 };\nconst CHAT_ENVS = new Set(['thu', 'tinh']);\nconst LESSON_ENVS = new Set(['modau', 'ketbai', 'tikzpicture', 'hinhbuoc', 'giaimau']);\nconst LESSON_RECAP = new Set(['dinhnghia', 'quytac', 'congthuc', 'dinhly', 'tinhchat']);\nconst LESSON_REGIONS = new Set(['giua', 'tren', 'duoi']);\nconst LESSON_COLORS = new Set(['cam', 'lam', 'luc', 'tim', 'do']);\nconst LESSON_ANGLE = /^\\p{L}[\\p{L}\\p{N}_'′]*[1-4]$/u;\n\n// Chỉ đọc lệnh ở ngoài đối số và môi trường hình. Nội dung LaTeX bên trong được giữ nguyên.\nfunction lessonTokens(body, chat = false) {\n  const tokens = [], re = /\\\\([a-zA-Z]+)\\b|\\\\./g;\n  for (const match of body.matchAll(re)) {\n    const previous = tokens.at(-1);\n    if (previous && match.index \u003c previous.end) continue;\n    const start = match.index, name = match[1];\n    if (!name) continue;\n    let end = start + match[0].length;\n    if (name === 'begin') {\n      const arg = group(body, end);\n      if (arg && (LESSON_ENVS.has(arg[0]) || (chat && CHAT_ENVS.has(arg[0])))) {\n        const tag = '\\\\end{' + arg[0] + '}', close = body.indexOf(tag, arg[1]);\n        end = close \u003c 0 ? body.length : close + tag.length;\n        tokens.push({ name: arg[0], start, end, args: [], env: true, closed: close >= 0,\n          contentStart: arg[1], content: body.slice(arg[1], close \u003c 0 ? end : close), raw: body.slice(start, end) });\n        continue;\n      }\n    }\n    let label = '';\n    if (chat && name === 'thaotac') {\n      const optional = lessonLabel(body.slice(end));\n      label = optional.label;\n      end += optional.end;\n    }\n    const args = [];\n    let arg;\n    while ((arg = group(body, end))) {\n      args.push(arg[0].trim());\n      end = arg[1];\n    }\n    tokens.push({ name, start, end, args, label, raw: body.slice(start, end) });\n  }\n  return tokens.filter(t => t.env || Object.hasOwn(LESSON_ARGS, t.name) || t.name === 'emdahoc' || (chat && (Object.hasOwn(CHAT_ARGS, t.name) || t.name === 'theobuoc')));\n}\n\nfunction lessonArgs(token, error) {\n  const { name, args } = token;\n  if (token.env) {\n    if (!token.closed) error('Khối ' + name + ' chưa đóng \\\\end{' + name + '}');\n    return token.closed;\n  }\n  if (name === 'theobuoc') {\n    if (!args.length) error('\\\\theobuoc cần ít nhất một trạng thái {…}');\n    return args.length > 0;\n  }\n  const count = LESSON_ARGS[name] ?? CHAT_ARGS[name];\n  const filled = args.every((arg, index) => Boolean(arg) || (name === 'hinhmau' && index === 1));\n  const valid = filled && (name === 'emdahoc'\n    ? args.length >= 2 && args.length \u003c= 5\n    : args.length === count);\n  if (!valid) error('\\\\' + name + ' cần ' + (name === 'emdahoc' ? '2–5' : count) + ' cặp {…} có nội dung');\n  return valid;\n}\n\nfunction lessonLabel(source) {\n  const match = /^\\s*\\[([^\\]\\n]*)\\]/.exec(source);\n  return { label: match?.[1].trim() || '', end: match?.[0].length || 0 };\n}\n\nfunction chatMath(text, warn) {\n  if ([...text.matchAll(/(?\u003c!\\\\)\\$(?!\\$)((?:\\\\.|[^$\\\\])+)\\$/g)]\n    .some(match => /[=\u003c>]|\\\\Rightarrow\\b/.test(match[1]))) {\n    warn('Viết công thức có dấu so sánh hoặc suy ra trên dòng riêng \\\\[…\\\\]');\n  }\n}\n\nfunction chatOptions(token, error, warn, locate) {\n  const { label, end } = token.name === 'thu' ? lessonLabel(token.content) : { label: '', end: 0 };\n  const question = group(token.content, end);\n  const q = question?.[0].trim() || '';\n  if (!q) error('Khối ' + token.name + ' cần câu hỏi {…}');\n  const optionsSource = token.content.slice(question?.[1] ?? end);\n  const opts = [];\n  let cursor = 0;\n  for (const cmd of lessonTokens(optionsSource, true)) {\n    locate(token.contentStart + (question?.[1] ?? end) + cmd.start);\n    if (optionsSource.slice(cursor, cmd.start).trim() || !['dung', 'sai'].includes(cmd.name)) {\n      error('Chỉ đặt \\\\dung và \\\\sai sau câu hỏi trong khối ' + token.name);\n    }\n    cursor = cmd.end;\n    if (!['dung', 'sai'].includes(cmd.name) || !lessonArgs(cmd, error)) continue;\n    const [text, why] = cmd.args;\n    opts.push({ text, ok: cmd.name === 'dung', why });\n    chatMath(why, warn);\n  }\n  locate(token.start);\n  if (optionsSource.slice(cursor).trim()) error('Khối ' + token.name + ' có nội dung ngoài phương án');\n  if (opts.length \u003c 2 || opts.length > 4 || opts.filter(option => option.ok).length !== 1) {\n    error('Khối ' + token.name + ' cần 2–4 phương án, đúng một \\\\dung, mỗi phương án có giải thích');\n  }\n  if (new Set(opts.map(option => option.text)).size !== opts.length) error('Các phương án phải khác nhau');\n  chatMath(q, warn);\n  return { label, quiz: { q, opts } };\n}\n\nfunction chatFigureFields(name, source, error, state = false) {\n  const result = {};\n  for (const field of source.split(';').map(s => s.trim()).filter(Boolean)) {\n    const [, key, value] = /^([a-z]+\\d*)\\s*=\\s*(.*)$/.exec(field) || [];\n    if (name === 'can') {\n      if (key === 'trai' || key === 'phai') {\n        const items = value ? value.split(/\\s+\\+\\s+/).map(item => {\n          const weight = /^q(?:\\*([1-9]\\d?))?$/.exec(item);\n          const object = /^([ktb]):(.+)$/.exec(item);\n          if (weight) return { kind: 'q', count: Number(weight[1] || 1) };\n          if (object && object[2].trim()) return { kind: object[1], label: object[2].trim() };\n          return null;\n        }) : [];\n        if (items.every(Boolean)) { result[key] = items; continue; }\n      }\n      if (key === 'nghieng' && /^(khong|trai|phai)$/.test(value)) { result[key] = value; continue; }\n      if (key === 'ghichu') { result[key] = value; continue; }\n    } else {\n      if (/^dong[1-4]$/.test(key || '')) {\n        const sides = value.split('=').map(side => side.trim()\n          .replace(/(^|\\s)([+-])\\s+(?=\\S)/g, '$1$2').split(/\\s+/).filter(Boolean));\n        if (sides.length === 2 && sides.every(side => side.length)) { result[key] = sides; continue; }\n      }\n      if (/^mui[1-3]$/.test(key || '')) { result[key] = value; continue; }\n      if (state && key === 'dong' && /^[1-4]$/.test(value)) { result.dong = Number(value); continue; }\n      if (state && key === 'to') {\n        result.to = {};\n        for (const pair of value.split(',').filter(Boolean)) {\n          const [, term, color] = /^\\s*([1-4][tp][1-9]\\d*)\\s*:\\s*([a-z]+)\\s*$/.exec(pair) || [];\n          if (!term || !LESSON_COLORS.has(color)) error('Số hạng hoặc màu không hợp lệ: ' + pair);\n          else result.to[term] = color;\n        }\n        continue;\n      }\n    }\n    error('Tham số hoặc trạng thái hình ' + name + ' không hợp lệ: ' + field);\n  }\n  return result;\n}\n\nfunction chatTermExists(params, key) {\n  const [, row, side, term] = /^([1-4])([tp])([1-9]\\d*)$/.exec(key) || [];\n  return Boolean(params['dong' + row]?.[side === 't' ? 0 : 1]?.[Number(term) - 1]);\n}\n\nfunction chatApplyState(figure, state, error) {\n  if (!state || figure?.mau?.name !== 'dang-thuc') return figure;\n  const params = { ...figure.mau.params, ...state };\n  for (const key of Object.keys(state.to || {})) {\n    if (!chatTermExists(params, key)) error('Khóa số hạng không có trong hình: ' + key);\n  }\n  if (state.dong && !params['dong' + state.dong]) error('Hình không có dòng ' + state.dong);\n  return { ...figure, mau: { ...figure.mau, params } };\n}\n\nfunction lessonFigureToken(token, error, chat) {\n  if (token.name === 'hinhmau' && lessonArgs(token, error)) {\n    const [name, source] = token.args;\n    if (chat && ['can', 'dang-thuc'].includes(name)) {\n      const params = chatFigureFields(name, source, error);\n      if (name === 'dang-thuc' && (!params.dong1 || [2, 3, 4].some(i => params['dong' + i] && !params['dong' + (i - 1)]))) {\n        error('Hình dang-thuc cần các dòng liên tiếp, bắt đầu bằng dong1');\n      }\n      return { kind: 'mau', src: token.raw, mau: { name, params } };\n    }\n    if (name !== 'cat-tuyen') {\n      error('Chưa có hình mẫu ' + name);\n      return null;\n    }\n    const params = {};\n    for (const field of source.split(';').map(s => s.trim()).filter(Boolean)) {\n      const parts = field.match(/^(duong|diem|song-song|c)\\s*=\\s*(.+)$/);\n      if (!parts) {\n        error('Tham số hình mẫu không hợp lệ: ' + field);\n        continue;\n      }\n      const [, key, value] = parts;\n      const list = value.split(',').map(s => s.trim());\n      if ((key === 'duong' && (list.length !== 3 || list.some(s => !s))) ||\n          (key === 'diem' && (list.length !== 2 || list.some(s => !s))) ||\n          (key === 'song-song' && !/^[01]$/.test(value)) ||\n          (key === 'c' && !/^(trai|phai)$/.test(value))) {\n        error('Tham số hình mẫu không hợp lệ: ' + field);\n        continue;\n      }\n      params[key] = key === 'duong' || key === 'diem' ? list : value;\n    }\n    return { kind: 'mau', src: token.raw, mau: { name, params } };\n  }\n  if (token.name === 'hinhbuoc' || token.name === 'tikzpicture') {\n    if (!lessonArgs(token, error)) return null;\n    return { kind: token.name === 'hinhbuoc' ? 'hinhbuoc' : 'tikz', src: token.raw };\n  }\n  return null;\n}\n\nfunction lessonFigure(source, error, chat) {\n  const tokens = lessonTokens(source);\n  if (tokens.length !== 1 || (tokens[0]?.raw !== source.trim()) ||\n      !['tikzpicture', 'hinhbuoc', 'hinhmau'].includes(tokens[0]?.name)) {\n    error('Cần một hình TikZ, hinhbuoc hoặc \\\\hinhmau');\n    return null;\n  }\n  return lessonFigureToken(tokens[0], error, chat);\n}\n\nfunction lessonState(source, error, figure) {\n  const name = figure?.mau?.name;\n  if (name === 'can' || name === 'dang-thuc') return chatFigureFields(name, source, error, true);\n  const state = {};\n  for (const field of source.split(';').map(s => s.trim()).filter(Boolean)) {\n    const match = field.match(/^([a-z]+)\\s*=\\s*(.+)$/);\n    const [, key, value] = match || [];\n    if (key === 'to' || key === 'do') {\n      const angles = state[key] ||= {};\n      for (const pair of value.split(',')) {\n        const entry = pair.trim().match(/^([^:\\s]+)\\s*:\\s*(\\S.*)$/);\n        const [, angle, label] = entry || [];\n        if (!LESSON_ANGLE.test(angle || '')) error('Khóa góc không hợp lệ: ' + (angle || pair.trim()));\n        else if (key === 'to' && !LESSON_COLORS.has(label)) error('Màu góc không hợp lệ: ' + label);\n        else angles[angle] = label;\n      }\n    } else if (key === 'so' && (value === 'an' || value === 'hien')) state.so = value;\n    else if (key === 'vung' && LESSON_REGIONS.has(value)) state.vung = value;\n    else if (key === 'buoc' && /^\\d+$/.test(value) && Number(value) >= 1 && Number(value) \u003c= HB_MAX) state.buoc = Number(value);\n    else error('Trạng thái hình không hợp lệ: ' + field);\n  }\n  return state;\n}\n\nfunction lessonQuiz(args, error, chat = false) {\n  const [q, correct, wrong, explainCorrect, explainWrong] = args;\n  if (correct === wrong) error('Hai phương án phải khác nhau');\n  if (chat) return { q, opts: [\n    { text: correct, ok: true, why: explainCorrect },\n    { text: wrong, ok: false, why: explainWrong },\n  ] };\n  return { q, correct, wrong, explainCorrect, explainWrong };\n}\n\nfunction lessonBoundary(token, error, warn, chat = false, locate = () => {}) {\n  const opening = token.name === 'modau';\n  const boundary = opening\n    ? { cherry: '', cauhoi: '', nutbuoc: '', fig: null }\n    : { cherry: '', fig: null, quiz: null, emdahoc: [] };\n  if (!lessonArgs(token, error)) return boundary;\n  let after;\n  for (const cmd of lessonTokens(token.content, chat)) {\n    locate(token.contentStart + cmd.start);\n    const [a] = cmd.args;\n    const { name } = cmd;\n    if (['tikzpicture', 'hinhbuoc', 'hinhmau'].includes(name)) {\n      boundary.fig = lessonFigureToken(cmd, error, chat);\n      continue;\n    }\n    if (!lessonArgs(cmd, error)) continue;\n    if (chat && !cmd.env) chatLessonMath(cmd, warn);\n    if (name === 'cherry' || name === 'loidan') {\n      boundary.cherry = a;\n      if ([...a].length > 120) warn('\\\\cherry dài hơn 120 kí tự');\n    } else if (opening && (name === 'cauhoi' || name === 'nutbuoc')) boundary[name] = a;\n    else if (!opening && (name === 'thungay' || name === 'thu')) {\n      if (chat && boundary.quiz) error('Khối ketbai chỉ có một câu hỏi');\n      if (name === 'thu') {\n        const parsed = chatOptions(cmd, error, warn, offset => locate(token.contentStart + offset));\n        boundary.quiz = parsed.quiz;\n        if (parsed.label) boundary.label = parsed.label;\n      } else boundary.quiz = lessonQuiz(cmd.args, error, chat);\n    } else if (chat && !opening && name === 'saukhitra') {\n      if (!boundary.quiz) error('\\\\saukhitra cần theo sau câu hỏi');\n      else after = { source: a, at: token.contentStart + cmd.start };\n    }\n    else if (!opening && name === 'emdahoc') boundary.emdahoc = cmd.args;\n    else if (name === 'hinhrieng') boundary.fig = lessonFigure(a, error, chat);\n  }\n  if (after) {\n    locate(after.at);\n    boundary.after = lessonState(after.source, error, boundary.fig);\n    chatApplyState(boundary.fig, boundary.after, error);\n  }\n  locate(token.start);\n  if (opening && !boundary.fig) error('Khối modau cần có hình');\n  if (opening && !boundary.cauhoi) error('Khối modau cần có \\\\cauhoi');\n  if (!opening && !boundary.quiz) error(chat ? 'Khối ketbai cần có thu hoặc \\\\thungay' : 'Khối ketbai cần có \\\\thungay');\n  return boundary;\n}\n\nfunction lessonPart(title = '', goal = '') {\n  return { title, goal, recap: '', fig: null, screens: [] };\n}\n\nfunction legacyLesson(items, lesson) {\n  let part = lessonPart(), started = false;\n  for (const { k, title, body, sol, correct, wrong, explainCorrect, explainWrong, template, value } of items) {\n    if (k === 'loidan') {\n      if (started) lesson.parts.push(part);\n      part = lessonPart();\n      started = true;\n      continue;\n    }\n    started = true;\n    if (!part.title && title) part.title = title;\n    if (!part.fig && (LESSON_RECAP.has(k) || k === 'luuy')) {\n      const staticFigure = lessonTokens(body).find(token => token.name === 'tikzpicture' && token.closed);\n      if (staticFigure) part.fig = { kind: 'tikz', src: staticFigure.raw };\n    }\n    if (k === 'thungay') part.screens.push({ type: 'quiz', quiz: { q: body, correct, wrong, explainCorrect, explainWrong } });\n    else if (k === 'vidu') part.screens.push({ type: 'vidu', body, sol });\n    else if (k === 'hinhbuoc' || k === 'giaimau') part.screens.push({ type: k === 'hinhbuoc' ? 'steps' : k, body });\n    else if (k === 'minhhoa') part.screens.push({ type: 'lab', kind: k, template, value });\n    else part.screens.push({ type: 'read', kind: k, title, body });\n  }\n  if (started) lesson.parts.push(part);\n  for (const item of lesson.parts) item.recap = lessonRecap(item);\n}\n\nfunction lessonRecap(part) {\n  return part.screens.filter(sc => LESSON_RECAP.has(sc.kind)).map(sc => sc.body).join(' \\\\\\\\ ');\n}\n\nfunction chatLessonMath(cmd, warn) {\n  const { name, args } = cmd;\n  if (['hinhchung', 'hinhrieng', 'hinhmau', 'trangthai', 'saukhitra', 'theobuoc'].includes(name)) return;\n  if (name === 'thungay' || name === 'emtinh') {\n    for (const i of [0, 3, 4]) chatMath(args[i] || '', warn);\n  } else if (name === 'thaotac') {\n    chatMath(args[2], warn);\n  } else args.forEach(text => chatMath(text, warn));\n}\n\nfunction parseLesson(body, errors, warnings, chatLine = 0) {\n  const chat = Boolean(chatLine);\n  const tokens = lessonTokens(body, chat);\n  const legacy = !chat && !tokens.some(t => t.name === 'phan');\n  const lesson = { modau: null, parts: [], ketbai: null, legacy };\n  let at = 0;\n  const locate = offset => { at = offset; };\n  const diagnostic = msg => chat\n    ? { line: chatLine + body.slice(0, at).split('\\n').length - 1, msg: 'Bài chat: ' + msg }\n    : { msg: 'Bài giảng: ' + msg };\n  const error = msg => errors.push(diagnostic(msg));\n  const warn = msg => warnings.push(diagnostic(msg));\n  const screenLocations = new Map();\n  const partLocations = new Map();\n  if (legacy) {\n    const theory = parseTheory(body, errors);\n    for (const cmd of tokens.filter(t => t.name === 'modau' || t.name === 'ketbai')) {\n      lesson[cmd.name] = lessonBoundary(cmd, error, warn);\n    }\n    legacyLesson(theory, lesson);\n    return { theory, lesson };\n  }\n\n  // Dùng bộ đọc cũ cho các lệnh cũ ở cấp màn. Các khối và đối số mới thuộc riêng lesson.\n  const oldNames = new Set([...Object.keys(THEORY_KINDS), 'loidan', 'thungay', 'minhhoa', 'hinhbuoc', 'giaimau']);\n  const oldCommands = tokens.filter(t => oldNames.has(t.name));\n  const theory = !chat && oldCommands.length ? parseTheory(oldCommands.map(t => t.raw).join('\\n'), errors) : [];\n  let part, pending = {}, previous, lastName;\n  let stepStates, calcCommand;\n  const hasQuestion = screen => ['quiz', 'tap', 'region', 'calc'].includes(screen?.type);\n  const figureFor = (screen = pending) => screen?.fig || part?.fig;\n  const stateFor = (source, screen = pending) => lessonState(source, error, chat ? figureFor(screen) : undefined);\n  const setAfter = (target, source, screen) => {\n    target.after = stateFor(source, screen);\n  };\n  for (const [index, cmd] of tokens.entries()) {\n    const { name, args: [a, b, c, d, e, f] } = cmd;\n    locate(cmd.start);\n    const preceding = lastName;\n    lastName = name;\n    if (stepStates && name !== 'vidu') {\n      error('\\\\theobuoc phải đứng ngay trước \\\\vidu');\n      stepStates = undefined;\n    }\n    if (name === 'modau' || name === 'ketbai') {\n      if (lesson[name]) error('Chỉ được có một khối ' + name);\n      lesson[name] = lessonBoundary(cmd, error, warn, chat, locate);\n      part = undefined;\n      continue;\n    }\n    if (name === 'phan') {\n      if (!lessonArgs(cmd, error)) continue;\n      part = lessonPart(a, b);\n      lesson.parts.push(part);\n      partLocations.set(part, cmd.start);\n      pending = {};\n      previous = undefined;\n      continue;\n    }\n    if (!part) {\n      error('\\\\' + name + ' cần nằm trong một phần');\n      continue;\n    }\n    if (!lessonArgs(cmd, error)) continue;\n    if (chat && !cmd.env) chatLessonMath(cmd, warn);\n    if (name === 'cherry' || name === 'loidan') {\n      pending.cherry = a;\n      if ([...a].length > 120) warn('\\\\cherry dài hơn 120 kí tự');\n      continue;\n    }\n    if (name === 'nhaclai') { part.recap = a; continue; }\n    if (name === 'hinhchung') { part.fig = lessonFigure(a, error, chat); continue; }\n    if (name === 'hinhrieng') { pending.fig = lessonFigure(a, error, chat); continue; }\n    if (name === 'trangthai') { pending.state = stateFor(a); continue; }\n    if (name === 'theobuoc') { stepStates = cmd.args; continue; }\n    if (name === 'saukhitra' && chat) {\n      if (previous?.type === 'calc' && ['tinh', 'emtinh'].includes(preceding)) {\n        setAfter(previous.calc.items.at(-1), a, previous);\n      } else if (hasQuestion(previous) && ['thu', 'thungay', 'chamhinh', 'chamvung', 'nhac'].includes(preceding)) {\n        setAfter(previous, a, previous);\n      } else if (tokens[index + 1]?.name === 'thungay') {\n        pending.after = stateFor(a);\n      } else error('\\\\saukhitra cần theo sau một câu hỏi hoặc thao tác chạm');\n      continue;\n    }\n    if (name === 'saukhitra') {\n      const after = lessonState(a, error);\n      // Bài mẫu đặt sau câu hỏi; cú pháp soạn cũng cho phép đặt trước.\n      if (previous?.type === 'quiz' && preceding === 'thungay' && tokens[index + 1]?.name !== 'thungay') previous.after = after;\n      else pending.after = after;\n      continue;\n    }\n    if (name === 'chuyen') {\n      pending.toggle = [{ label: a, state: stateFor(b) }, { label: c, state: stateFor(d) }];\n      continue;\n    }\n    if (name === 'nhac') {\n      if (previous?.type !== 'tap' || !['chamhinh', 'nhac'].includes(preceding)) error('\\\\nhac cần theo sau \\\\chamhinh');\n      else if (!(chat && figureFor(previous)?.mau?.name === 'dang-thuc') && !LESSON_ANGLE.test(a)) error('Khóa góc không hợp lệ: ' + a);\n      else previous.tap.nhac[a] = b;\n      continue;\n    }\n    if (name === 'ketluan') {\n      if (previous?.type !== 'calc' || !(preceding === 'emtinh' || (chat && ['tinh', 'saukhitra'].includes(preceding)))) error('\\\\ketluan cần theo sau \\\\emtinh');\n      else previous.calc.ketluan = a;\n      continue;\n    }\n\n    let screen;\n    if (LESSON_RECAP.has(name) || name === 'nhanxet') screen = { type: 'read', kind: name, title: a, body: b };\n    else if (name === 'luuy') screen = { type: 'read', kind: name, title: 'Cần nhớ', body: a };\n    else if (name === 'vidu') {\n      screen = { type: 'vidu', body: a, sol: b };\n      if (stepStates) {\n        if (stepStates.length > b.split(/\\\\\\\\/).filter(step => step.trim()).length) {\n          error('\\\\theobuoc có nhiều trạng thái hơn số bước của \\\\vidu');\n        }\n        screen.stepStates = stepStates.map(source => stateFor(source));\n        stepStates = undefined;\n      }\n    } else if (name === 'thu') {\n      const { label, quiz } = chatOptions(cmd, error, warn, locate);\n      screen = { type: 'quiz', label: label || 'Thử ngay', quiz };\n    } else if (name === 'thungay') screen = { type: 'quiz', quiz: lessonQuiz(cmd.args, error, chat) };\n    else if (name === 'thaotac') {\n      if (cmd.label && cmd.label !== 'lech') error('Nhãn của \\\\thaotac chỉ nhận [lech]');\n      const act = { label: a, state: stateFor(b, preceding === name ? previous : pending), say: c, warn: cmd.label === 'lech' };\n      if (preceding === name && previous?.type === 'act') {\n        previous.acts.push(act);\n        continue;\n      }\n      screen = { type: 'act', acts: [act] };\n    }\n    else if (name === 'chamhinh') {\n      if (!(chat && figureFor()?.mau?.name === 'dang-thuc') && !LESSON_ANGLE.test(b)) error('Khóa góc không hợp lệ: ' + b);\n      screen = { type: 'tap', tap: { prompt: a, ans: b, ok: c, hint: d, nhac: {} } };\n    } else if (name === 'chamvung') {\n      if (!LESSON_REGIONS.has(b)) error('Khóa vùng không hợp lệ: ' + b);\n      screen = { type: 'region', region: { prompt: a, key: b, ok: c } };\n    } else if (name === 'truot') screen = { type: 'slide', slide: { label: a, after: b } };\n    else if (name === 'emtinh' || name === 'tinh') {\n      const consecutive = previous?.type === 'calc' &&\n        (preceding === name || (chat && preceding === 'saukhitra' && calcCommand === name));\n      const item = name === 'tinh'\n        ? chatOptions(cmd, error, warn, locate).quiz\n        : { ...lessonQuiz([a, b, c, d, e], error, chat), state: stateFor(f, consecutive ? previous : pending) };\n      calcCommand = name;\n      if (consecutive) {\n        previous.calc.items.push(item);\n        continue;\n      }\n      screen = { type: 'calc', calc: { items: [item], ketluan: '' } };\n    } else if (name === 'xemtungbuoc') screen = { type: 'steps' };\n    else if (name === 'hinhbuoc') screen = { type: 'steps', body: cmd.raw, fig: lessonFigureToken(cmd, error) };\n    else if (name === 'minhhoa') screen = { type: 'lab', kind: name, template: a, value: b };\n    else if (name === 'giaimau') screen = { type: 'giaimau', body: cmd.raw };\n    else {\n      error('\\\\' + name + ' không phải lệnh màn hoặc lệnh gắn');\n      continue;\n    }\n    previous = { ...pending, ...screen };\n    part.screens.push(previous);\n    screenLocations.set(previous, cmd.start);\n    pending = {};\n  }\n  if (stepStates) error('\\\\theobuoc phải đứng ngay trước \\\\vidu');\n  locate(0);\n  if (chat && !lesson.parts.length) error('Cần ít nhất một \\\\phan');\n  if (chat && !/\\\\ten\\b/.test(body)) warn('Bài chưa dùng \\\\ten để gọi tên học sinh');\n  if (!lesson.modau) warn('Thiếu khối modau');\n  if (!lesson.ketbai) warn('Thiếu khối ketbai');\n  for (const item of lesson.parts) {\n    const { title, screens, fig } = item;\n    locate(partLocations.get(item));\n    if (!screens.length) error('Phần \"' + title + '\" chưa có màn');\n    if (chat && screens.length && !screens.some(hasQuestion)) warn('Phần \"' + title + '\" chưa có câu hỏi');\n    if (screens.length > 10) warn('Phần \"' + title + '\" có hơn 10 màn');\n    if (!item.recap) item.recap = lessonRecap(item);\n    for (const [index, screen] of screens.entries()) {\n      locate(screenLocations.get(screen));\n      const figure = screen.fig || fig;\n      if (chat && figure?.mau?.name === 'dang-thuc') {\n        let current = chatApplyState(figure, screen.state, error);\n        if (screen.tap) {\n          for (const key of [screen.tap.ans, ...Object.keys(screen.tap.nhac)]) {\n            if (!chatTermExists(current.mau.params, key)) error('Khóa số hạng không có trong hình: ' + key);\n          }\n        }\n        for (const toggle of screen.toggle || []) chatApplyState(current, toggle.state, error);\n        for (const state of screen.stepStates || []) current = chatApplyState(current, state, error);\n        for (const act of screen.acts || []) current = chatApplyState(current, act.state, error);\n        for (const calc of screen.calc?.items || []) {\n          current = chatApplyState(current, calc.state, error);\n          current = chatApplyState(current, calc.after, error);\n        }\n        chatApplyState(current, screen.after, error);\n      }\n      if (['tap', 'region', 'slide'].includes(screen.type) && figure?.kind !== 'mau') {\n        error('Phần \"' + title + '\", màn ' + (index + 1) + ' cần hình mẫu');\n      }\n      if (screen.type === 'read' && !figure && !lessonTokens(screen.body).some(token =>\n        token.closed && (token.name === 'tikzpicture' || token.name === 'hinhbuoc'))) {\n        warn('Phần \"' + title + '\", màn ' + (index + 1) + ' chỉ có chữ');\n      }\n    }\n  }\n  return { theory, lesson };\n}\n\nfunction errorText(e) {\n  return (e.line ? 'Dòng ' + e.line + ': ' : '') + (e.level ? `Màn ${e.level}` : '') + (e.q ? `, câu ${e.q}` : '') + (e.level ? ': ' : '') + e.msg;\n}\n\nconst CAT_COLORS={cam:'#f28c28',lam:'#3b7be0',luc:'#2fa36b',tim:'#8b5cf6',do:'#e0475a'};\nconst CAT_NUMBERS=[3,2,1,4];\nconst CAT_SCALE=56;\nconst catEsc=value=>String(value??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n\nfunction catIntersection([a,b],[c,d]){\n  const x=b[0]-a[0],y=b[1]-a[1],u=d[0]-c[0],v=d[1]-c[1];\n  const fraction=((c[0]-a[0])*v-(c[1]-a[1])*u)/(x*v-y*u);\n  return [a[0]+x*fraction,a[1]+y*fraction];\n}\n\nfunction catAngles(point,rays){\n  const boundaries=rays.map(([x,y])=>Math.atan2(y-point[1],x-point[0]));\n  for(let i=1;i\u003cboundaries.length;i++){\n    while(boundaries[i]\u003cboundaries[i-1])boundaries[i]+=2*Math.PI;\n  }\n  return boundaries.map((from,i)=>({from,to:boundaries[i+1]??boundaries[0]+2*Math.PI,number:CAT_NUMBERS[i]}));\n}\n\nfunction catText(x,y,value,kind){\n  return `\u003ctext class=\"cat-${kind}\" x=\"${x}\" y=\"${y}\" dy=\".35em\" text-anchor=\"middle\">${catEsc(value)}\u003c/text>`;\n}\n\nfunction catTuyen(params={},state={}, {tap=false,region=false,slide=false}={}){\n  const [a,b,c]=params.duong||['a','b','c'];\n  const [A,B]=params.diem||['A','B'];\n  const isParallel=String(params['song-song'])==='1', direction=params.c==='phai'?-1:1;\n  const lines=isParallel?[[[-2.8,2],[3.3,2]],[[-2.8,0],[3.3,0]]]:\n    [[[-2.8,2.3],[3.3,2.75]],[[-2.8,.3],[3.3,-.12]]];\n  const cut=[[-.85*direction,3.75],[1.75*direction,-1.5]];\n  const vertices=lines.map((line,i)=>{\n    const point=catIntersection(line,cut);\n    return {point,name:[A,B][i],angles:catAngles(point,[line[1],cut[0],line[0],cut[1]])};\n  });\n  const pointX=x=>Number(((x+3.1)*CAT_SCALE).toFixed(1));\n  const pointY=y=>Number(((4.05-y)*CAT_SCALE).toFixed(1));\n  const XY=([x,y])=>[pointX(x),pointY(y)];\n  const vector=(origin,radius,theta)=>XY([origin[0]+radius*Math.cos(theta),origin[1]+radius*Math.sin(theta)]);\n  const pointList=points=>points.map(p=>XY(p).join(',')).join(' ');\n\n  function sector(point,{from,to},radius){\n    const [cx,cy]=XY(point), [sx,sy]=vector(point,radius,from), [ex,ey]=vector(point,radius,to);\n    const r=radius*CAT_SCALE;\n    return `M${cx} ${cy}L${sx} ${sy}A${r} ${r} 0 ${to-from>Math.PI?1:0} 0 ${ex} ${ey}Z`;\n  }\n\n  function drawAngle(vertex,angle,{number,color,value}){\n    const {point}=vertex,{from,to}=angle, middle=(from+to)/2;\n    let out=color?`\u003cpath d=\"${sector(point,angle,.55)}\" fill=\"${color}\" fill-opacity=\".33\" stroke=\"${color}\" stroke-width=\"2\"/>`:'';\n    if(number){\n      const [x,y]=vector(point,.38,middle);\n      out+=`\u003cg fill=\"${color||'#111'}\">${catText(x,y,angle.number,'number')}\u003c/g>`;\n    }\n    if(value){\n      const [x,y]=vector(point,.86,middle);\n      out+=`\u003cg fill=\"${color||CAT_COLORS.do}\">${catText(x,y,value,'value')}\u003c/g>`;\n    }\n    return out;\n  }\n\n  const [top,bottom]=lines;\n  const regions={\n    tren:[[-2.8,4.05],[3.3,4.05],top[1],top[0]],\n    giua:[top[0],top[1],bottom[1],bottom[0]],\n    duoi:[bottom[0],bottom[1],[3.3,-1.75],[-2.8,-1.75]],\n  };\n  let out=state.vung&&regions[state.vung]?`\u003cpolygon points=\"${pointList(regions[state.vung])}\" fill=\"#ffe08a\" fill-opacity=\".5\"/>`:'';\n  for(const [start,end] of [...lines,cut]){\n    const [x1,y1]=XY(start),[x2,y2]=XY(end);\n    out+=`\u003cline x1=\"${x1}\" y1=\"${y1}\" x2=\"${x2}\" y2=\"${y2}\" stroke=\"#111\" stroke-width=\"2.2\" stroke-linecap=\"round\"/>`;\n  }\n  for(const vertex of vertices){\n    for(const angle of vertex.angles){\n      const key=vertex.name+angle.number;\n      out+=drawAngle(vertex,angle,{number:state.so!=='an'&&(!slide||vertex!==vertices[0]),\n        color:CAT_COLORS[state.to?.[key]],value:state.do?.[key]});\n    }\n    const [x,y]=XY(vertex.point), [nx,ny]=vector(vertex.point,1,98*Math.PI/180);\n    out+=`\u003ccircle cx=\"${x}\" cy=\"${y}\" r=\"4.5\"/>${catText(nx+10,ny,vertex.name,'label')}`;\n  }\n  for(const [index, [start,end]] of [...lines,cut].entries()){\n    const [first,last]=[a,b,c][index].split('-'),[x1,y1]=XY(start),[x2,y2]=XY(end);\n    const cutLine=index===2;\n    out+=catText(x1+(cutLine?12:-6),y1+(cutLine?4:-14),first,'label');\n    if(last)out+=catText(x2+(cutLine?-12:6),y2+(cutLine?-4:14),last,'label');\n  }\n\n  if(slide){\n    const [from,to]=vertices,[x1,y1]=XY(from.point),[x2,y2]=XY(to.point);\n    const moving=from.angles.map(angle=>drawAngle(from,angle,{number:true,color:Object.values(CAT_COLORS)[angle.number-1]})).join('');\n    out+=`\u003cg class=\"cat-slide\" data-dx=\"${x2-x1}\" data-dy=\"${y2-y1}\"${slide==='to'?` style=\"transform:translate(${x2-x1}px,${y2-y1}px)\"`: ''}>${moving}\u003c/g>`;\n  }\n  if(tap){\n    for(const vertex of vertices){\n      for(const angle of vertex.angles){\n        const key=catEsc(vertex.name+angle.number);\n        out+=`\u003cpath class=\"cat-hit\" data-angle=\"${key}\" d=\"${sector(vertex.point,angle,1)}\" fill=\"transparent\" tabindex=\"0\" role=\"button\" aria-label=\"Góc ${key}\"/>`;\n      }\n    }\n  }\n  if(region){\n    const regionLabels={tren:'Phía trên đường thứ nhất',giua:'Giữa hai đường thẳng',duoi:'Phía dưới đường thứ hai'};\n    for(const [key,points] of Object.entries(regions)){\n      out+=`\u003cpolygon class=\"cat-hit\" data-region=\"${key}\" points=\"${pointList(points)}\" fill=\"transparent\" tabindex=\"0\" role=\"button\" aria-label=\"${regionLabels[key]}\"/>`;\n    }\n  }\n  return `\u003csvg viewBox=\"0 0 395 325\" role=\"${tap||region?'group':'img'}\" aria-label=\"${catEsc('Đường thẳng '+c+' cắt '+a+' và '+b+' tại '+A+' và '+B)}\">\n    \u003cstyle>.cat-label{font:italic 19px \"Times New Roman\",serif}.cat-number{font:16px \"Times New Roman\",serif}.cat-value{font:700 13.5px Nunito,sans-serif}\u003c/style>${out}\u003c/svg>`;\n}\n\nconst CHAT_FIG_INK='#14323a';\nfunction scaleItem(it,x,y,w,h){\n  if(it.k==='w')return `\u003ccircle cx=\"${x}\" cy=\"${y}\" r=\"11\" fill=\"#9fb4c2\" stroke=\"#4d6372\" stroke-width=\"1.5\"/>\u003ctext x=\"${x}\" y=\"${y}\" dy=\".35em\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\" font-family=\"Be Vietnam Pro\">${catEsc(it.label||'1')}\u003c/text>`;\n  if(it.k==='big')return `\u003crect x=\"${x-w/2}\" y=\"${y-h/2}\" width=\"${w}\" height=\"${h}\" rx=\"7\" fill=\"#9fb4c2\" stroke=\"#4d6372\" stroke-width=\"1.5\"/>\u003ctext x=\"${x}\" y=\"${y}\" dy=\".35em\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\" font-family=\"Be Vietnam Pro\">${catEsc(it.label)}\u003c/text>`;\n  if(it.k==='pom')return `\u003ccircle cx=\"${x}\" cy=\"${y}\" r=\"22\" fill=\"#d7e87a\" stroke=\"#8aa536\" stroke-width=\"2\"/>\u003cpath d=\"M${x} ${y-22}q6 -10 14 -8q-4 8 -14 8\" fill=\"#4fa34a\"/>\u003ctext x=\"${x}\" y=\"${y+2}\" dy=\".35em\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"${CHAT_FIG_INK}\" font-family=\"Be Vietnam Pro\">${catEsc(it.label||'?')}\u003c/text>`;\n  return `\u003cpath d=\"M${x-18} ${y+20}q-6 -22 8 -30l-2 -8h24l-2 8q14 8 8 30z\" fill=\"#f2b14a\" stroke=\"#b9770e\" stroke-width=\"2\"/>\u003ctext x=\"${x}\" y=\"${y+8}\" text-anchor=\"middle\" font-size=\"22\" font-style=\"italic\" font-family=\"Times New Roman\" fill=\"${CHAT_FIG_INK}\">${catEsc(it.label||'x')}\u003c/text>`;\n}\nfunction drawScale(o={}){\n  const cx=210,py=60,half=140,a=(({bal:0,L:-9,R:9})[o.tilt||'bal'])*Math.PI/180;\n  const Lx=cx-half*Math.cos(a),Ly=py-half*Math.sin(a),Rx=cx+half*Math.cos(a),Ry=py+half*Math.sin(a);\n  const dims=it=>it.k==='w'?[24,24]:it.k==='big'?[70,28]:it.k==='pom'?[46,46]:[44,40];\n  const pan=(ex,ey,items)=>{\n    const p2=ey+80;let g=`\u003cline x1=\"${ex}\" y1=\"${ey}\" x2=\"${ex-52}\" y2=\"${p2}\" stroke=\"#7a5a2f\" stroke-width=\"2\"/>\u003cline x1=\"${ex}\" y1=\"${ey}\" x2=\"${ex+52}\" y2=\"${p2}\" stroke=\"#7a5a2f\" stroke-width=\"2\"/>`;\n    const rows=[];let row=[],wr=0;\n    items.forEach(it=>{const[w,h]=dims(it);if(row.length&&wr+w+4>108){rows.push(row);row=[];wr=0}row.push({it,w,h});wr+=w+4});if(row.length)rows.push(row);\n    let y=p2-3;\n    rows.forEach(r=>{const rh=Math.max(...r.map(q=>q.h)),tw=r.reduce((t,q)=>t+q.w+4,-4);let x=ex-tw/2;r.forEach(q=>{g+=scaleItem(q.it,x+q.w/2,y-q.h/2,q.w,q.h);x+=q.w+4});y-=rh+3});\n    return g+`\u003cpath d=\"M${ex-60} ${p2}A60 24 0 0 0 ${ex+60} ${p2}Z\" fill=\"#efe3c6\" stroke=\"#9a7b4f\" stroke-width=\"2.5\"/>`};\n  let s=`\u003cpolygon points=\"140,238 280,238 258,216 162,216\" fill=\"#d9c7a0\" stroke=\"#9a7b4f\" stroke-width=\"2\"/>\u003crect x=\"203\" y=\"${py}\" width=\"14\" height=\"${216-py}\" fill=\"#b08d5a\"/>`;\n  s+=pan(Lx,Ly,o.L||[])+pan(Rx,Ry,o.R||[]);\n  s+=`\u003cline x1=\"${Lx}\" y1=\"${Ly}\" x2=\"${Rx}\" y2=\"${Ry}\" stroke=\"#7a5a2f\" stroke-width=\"9\" stroke-linecap=\"round\"/>\u003ccircle cx=\"${cx}\" cy=\"${py}\" r=\"10\" fill=\"#b08d5a\" stroke=\"#7a5a2f\" stroke-width=\"2\"/>`;\n  if(o.note)s+=`\u003ctext x=\"210\" y=\"22\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"${(o.tilt||'bal')==='bal'?'#1f8a57':'#c2410c'}\" font-family=\"Be Vietnam Pro\">${catEsc(o.note)}\u003c/text>`;\n  return `\u003csvg viewBox=\"0 0 420 250\" role=\"img\" aria-label=\"${catEsc(o.label||'Cân đĩa')}\">${s}\u003c/svg>`;\n}\nfunction drawEquation(o={}){\n  const rows=o.rows||[],cx=210,RH=58,AG=32,y0=14;\n  const H=y0+rows.length*(RH+AG)-AG+14;\n  const parse=t=>{const m=t.match(/^([+−])?(.+)$/);return{sg:m[1]||'',b:m[2]}};\n  const isFr=b=>/^\\d+\\/\\d+$/.test(b);\n  const bodyW=b=>isFr(b)?Math.max(...b.split('/').map(z=>z.length))*15+8:b.length*16+2;\n  const tw=t=>{const p=parse(t);return(p.sg?30:0)+bodyW(p.b)+12};\n  const draw=(t,x,y,c,key)=>{const p=parse(t),w=tw(t),col=c||CHAT_FIG_INK;let g='',xx=x;\n    if(p.sg){g+=`\u003ctext x=\"${xx+13}\" y=\"${y}\" dy=\".35em\" text-anchor=\"middle\" font-size=\"26\" font-weight=\"600\" fill=\"${col}\" font-family=\"Be Vietnam Pro\">${p.sg}\u003c/text>`;xx+=30}\n    const bw=bodyW(p.b);\n    if(isFr(p.b)){const[n,d]=p.b.split('/');g+=`\u003ctext x=\"${x {yb-6}L${cx} ${yb}L${cx+6} ${yb-6}\" stroke=\"#149c8c\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/>`;\n      if((o.arrows||[])[i])s+=`\u003ctext x=\"${cx+14}\" y=\"${ya+AG/2-1}\" dy=\".35em\" font-size=\"13\" font-weight=\"600\" fill=\"#0f7a6e\" font-family=\"Be Vietnam Pro\">${catEsc(o.arrows[i])}\u003c/text>`}\n  });\n  return `\u003csvg viewBox=\"0 0 420 ${H}\" role=\"${o.tap?'group':'img'}\" aria-label=\"${catEsc(o.label||'Đẳng thức')}\">${s}\u003c/svg>`;\n}\n\nfunction can(params = {}, state = {}) {\n  const values = { ...params, ...state };\n  const side = items => (items || []).flatMap(({ kind, count, label }) => {\n    if (kind === 'q') return count \u003c= 12\n      ? Array.from({ length: count }, () => ({ k: 'w' }))\n      : [{ k: 'big', label: count + ' × 1' }];\n    return [{ k: { k: 'big', t: 'bag', b: 'pom' }[kind], label }];\n  });\n  const L = side(values.trai), R = side(values.phai);\n  const describe = items => items.map(item => item.label || '1').join(', ') || 'trống';\n  return drawScale({\n    L, R, tilt: { trai: 'L', phai: 'R' }[values.nghieng], note: values.ghichu,\n    label: 'Cân đĩa. Trái: ' + describe(L) + '. Phải: ' + describe(R),\n  });\n}\n\nfunction dangThuc(params = {}, state = {}, { tap = false } = {}) {\n  const values = { ...params, ...state, to: { ...params.to, ...state.to } };\n  const rows = [];\n  for (let i = 1; i \u003c= (values.dong || 4); i++) {\n    const row = values['dong' + i];\n    if (!row) break;\n    const [l, r] = row.map(side => side.map(term => term.replace(/^-/, '−')));\n    rows.push({ l, r });\n  }\n  if (!rows.length) return '';\n  return drawEquation({\n    rows, colors: values.to, tap, arrows: [values.mui1, values.mui2, values.mui3],\n    label: rows.map(({ l, r }) => l.join(' ') + ' = ' + r.join(' ')).join('. '),\n  });\n}\n\n\nconst CHAT_AVATAR=`\u003csvg class=\"chat-avatar\" viewBox=\"0 0 60 70\" aria-hidden=\"true\">\u003cellipse cx=\"30\" cy=\"66\" rx=\"16\" ry=\"3\" fill=\"#0001\"/> [$\\\\]/g) || [];\n  const lines = [''];\n  for (const token of tokens) {\n    if (token === '\\\\\\\\') lines.push('');\n    else lines[lines.length - 1] += token;\n  }\n  return lines.map(line => line.trim()).filter(Boolean);\n}\n\nfunction chatPlan(chat) {\n  const lastPart = chat.parts.length + 1;\n  const parts = [{ title: 'Mở đầu' }, ...chat.parts, { title: 'Kết bài' }];\n  const screens = [];\n  if (chat.modau) screens.push({ ...chat.modau, p: 0, type: 'opening', figure: chat.modau.fig });\n  screens.push({ p: 0, type: 'contents' });\n  for (const [index, part] of chat.parts.entries()) {\n    part.screens.forEach((screen, i) => {\n      const { type, fig, state, after, toggle, stepStates, calc } = screen;\n      const useShared = !i || state || after || toggle || stepStates ||\n        ['tap', 'region', 'act', 'slide', 'steps'].includes(type) || calc?.items.some(item => item.state || item.after);\n      const figure = fig || (useShared ? part.fig : null);\n      screens.push({ ...screen, p: index + 1, figure,\n        steps: type === 'vidu' ? chatExampleSteps(screen.sol) : null,\n        frames: chatHinhBuoc(figure),\n      });\n    });\n    screens.push({ p: index + 1, type: 'recap' });\n  }\n  if (chat.ketbai) {\n    const { fig, ...closing } = chat.ketbai;\n    screens.push({ ...closing, p: lastPart, type: 'closing', figure: fig });\n  } else {\n    screens.push({ p: lastPart, type: 'closing' });\n  }\n  for (const sc of screens) {\n    if (sc.type === 'opening') sc.frames = chatHinhBuoc(sc.figure);\n  }\n  return { parts, screens };\n}\n\nfunction chatMerge(base, change) {\n  if (!change) return base;\n  return { ...base, ...change, to: { ...base.to, ...change.to }, do: { ...base.do, ...change.do } };\n}\n\nfunction chatFigureState(sc, state) {\n  let result = { ...sc.state };\n  if (sc.toggle && Number.isInteger(state.toggle)) result = chatMerge(result, sc.toggle[state.toggle]?.state);\n  if (sc.type === 'vidu') {\n    for (const step of (sc.stepStates | c.figure;\n    if (!figure) return '';\n    const view = chatFigureState(sc, state);\n    const renderer = CHAT_FIGURES[figure.mau?.name];\n    let html;\n    if (renderer) {\n      html = renderer(figure.mau.params, view, {\n        tap: live && sc.type === 'tap' && !state.correct,\n        region: live && sc.type === 'region' && !state.correct,\n        slide: sc.type === 'slide' && (state.correct ? 'to' : true),\n      });\n    } else if (sc.frames) {\n      const frame = sc.frames.frames[Math.max(0, Math.min(sc.frames.frames.length, view.buoc || 1) - 1)];\n      html = frame ? staticFigure(frame) : placeholder();\n    } else html = staticFigure(figure.src);\n    return html ? `\u003cdiv class=\"chat-figure\">${html}\u003c/div>` : '';\n  }\n\n  function quizHTML(quiz, state, live, index, isCalc = false) {\n    if (!quiz) return '';\n    const id = 'q' + index;\n    const attempts = state[id] || [];\n    const order = state['order' + index] || (state['order' + index] = chatOrder(quiz.opts.length));\n    const last = quiz.opts[attempts.at(-1)];\n    const locked = attempts.includes(order.find(i => quiz.opts[i]?.ok));\n    let content = bubble(quiz.q, true);\n    if (last) {\n      const intro = last.ok && state['praise' + index] ? state['praise' + index] + ' ' : '';\n      const why = last.why.replace(/^(Đúng rồi|Đúng hướng|Chính xác|Chuẩn|Đúng)[!.:]?\\s+/u, '');\n      content += answer(last.text) + feedback(last.ok ? intro + why : last.why + ' Cậu thử lại nhé.', last.ok ? '' : 'wrong');\n    }\n    if (live && !locked) {\n      for (const i of order) {\n        const wrong = attempts.includes(i);\n        const disabled = state.waiting || (wrong && !isCalc);\n        content += `\u003cbutton class=\"chat-choice\" type=\"button\" data-option=\"${index},${i}\"${wrong ? ' data-wrong' : ''}${disabled ? ' disabled' : ''}>${text(quiz.opts[i].text)}\u003c/button>`;\n      }\n    }\n    return content;\n  }\n\n  function knowledgeHTML(sc, count) {\n    const label = tag( "${!reached && !options.teacher}\">\u003cb>${done ? '✓' : (p || '★')}\u003c/b>\u003cspan>${text(partLabel(p))}\n          \u003csmall>${done ? 'Đã xong' : reached ? 'Đang học' : 'Chưa tới'}\u003c/small>\u003c/span>\u003c/button>`;\n      }).join('') + '\u003c/div>\u003c/div>';\n    toc.showModal();\n  }\n\n  function summaryHTML() {\n    const correct = topic.chat.ketbai?.quiz?.opts.find(option => option.ok);\n    const section = (p, body) => `\u003csection data-section=\"${p}\">\u003ch3>${text(partLabel(p))}\u003c/h3>${body}\u003c/section>`;\n    const opening = screens.find(sc => sc.type === 'opening');\n    const start = opening ? figureHTML(opening, {}) + bubble(opening.cauhoi, true) +\n      (correct ? feedback(correct.text + ' ' + correct.why) : '') : '';\n    const content = parts.slice(1, -1).map((part, i) => {\n      const p = i + 1;\n      const included = screens.filter(sc => sc.p === p && ['read', 'vidu'].includes(sc.type));\n      const material = included.map(sc => {\n        const state = { steps: sc.steps?.length || 0 };\n        return figureHTML(sc, state) + knowledgeHTML(sc, state.steps);\n      }).join('');\n      return section(p, material || (part.recap ? bubble(part.recap) : ''));\n    }).join('');\n    const closing = topic.chat.ketbai?.emdahoc;\n    const end = closing?.length ? section(lastPart, '\u003cul>' + closing.map(item => '\u003cli>' + text(item) + '\u003c/li>').join('') + '\u003c/ul>') : '';\n    return (start ? section(0, start) : '') + content + end;\n  }\n\n  function showSummary() {\n    clearMath(summary);\n    summary.innerHTML = '\u003cheader>\u003ch2>Tóm tắt\u003c/h2>\u003cbutton type=\"button\" data-dismiss>Đóng\u003c/button>\u003c/header>' +\n      '\u003cdiv class=\"chat-pane-scroll\">\u003cdiv class=\"chat-summary-inner\">' + summaryHTML() + '\u003c/div>\u003c/div>';\n    summary.showModal();\n    typeset(summary);\n    summary.querySelector(`[data-section=\"${focusedPart}\"]`)?.scrollIntoView({ block: 'start' });\n  }\n\n  function restart() {\n    clearMath(stream);\n    stream.replaceChildren();\n    visits = [{}];\n    complete = false;\n    seenOptions = 0;\n    rows.length = 0;\n    anchors.clear();\n    storage.write(null);\n    append(0);\n    feed.scrollTop = 0;\n  }\n\n  shell.addEventListener('click', event => {\n    const target = event.target.closest('button');\n    if (!target) return;\n    if (target.hasAttribute('data-close')) options.onClose?.();\n    else if (target.hasAttribute('data-edit')) options.teacherEdit?.();\n    else if (target.hasAttribute('data-old-version')) options.onOldVersion?.();\n    else if (target.hasAttribute('data-summary')) showSummary();\n    else if (target.hasAttribute('data-toc')) showToc();\n    else if (target.hasAttribute('data-dismiss')) target.closest('dialog').close();\n    else if (target.hasAttribute('data-reset')) restart();\n    else if (target === pip) scroll(rows.at(-1)?.querySelector('.chat-figure'));\n    else if (target.dataset.part !== undefined) {\n      const p = Number(target.dataset.part);\n      toc.close();\n      if (!anchors.has(p) && !options.teacher) return notify('Học tới phần đó thì mở nhé');\n      if (busy) return;\n      if (!anchors.has(p)) {\n        while (activeScreen().p \u003c p) {\n          finishState(activeScreen(), visits.at(-1));\n          render(visits.length - 1);\n          visits.push({});\n          append(visits.length - 1);\n        }\n      }\n      setTitle(p);\n      scroll(anchors.get(p));\n    }\n  });\n  stream.addEventListener('click', change);\n  stream.addEventListener('keydown', event => {\n    if ((event.key === 'Enter' || event.key === ' ') && event.target.closest('.cat-hit')) change(event, true);\n  });\n  next.onclick = () => {\n    if (busy) return;\n    const sc = activeScreen(), state = visits.at(-1);\n    if (!ready(sc, state)) return;\n    if (sc.type === 'closing') {\n      complete = true;\n      state.final = true;\n      refresh();\n      options.finish?.();\n (function preview() {
  const source = document.querySelector('#source');
  const name = document.querySelector('#student');
  const status = document.querySelector('#status');
  const diagnostics = document.querySelector('#diagnostics');
  const viewport = document.querySelector('#viewport');
  const copy = document.querySelector('#copy');
  const restart = document.querySelector('#restart');
  const frame = document.querySelector('#phone');
  const key = 'ltt-xem-thu-baichat';
  let block = '', lastValid = null;

  try { source.value = localStorage.getItem(key) || ''; } catch { /* Có thể bật trang ở chế độ riêng tư. */ }

  function remember() {
    try { localStorage.setItem(key, source.value); } catch { /* Trang vẫn chạy khi bộ nhớ bị chặn. */ }
  }

  function start() {
    if (!lastValid) return;
    const parameters = JSON.stringify(lastValid).replace(/</g, '\\u003c');
    frame.srcdoc = FRAME_HEAD + '<script>' + CHAT_RENDERER +
      '\nconst run=' + parameters + ';\nrenderChatLesson(document.querySelector("#stage"),' +
      '{chat:run.chat,title:"Bài xem thử"},{studentName:run.name,persist:false});<' + '/script></html>';
    viewport.hidden = false;
  }

  function showDiagnostics(errors, warnings) {
    diagnostics.replaceChildren();
    const seen = new Set();
    for (const [className, entries] of [['error', errors], ['warning', warnings]]) {
      for (const item of entries) {
        const key = className + ':' + errorText(item);
        if (seen.has(key)) continue;
        seen.add(key);
        const button = document.createElement('button');
        button.type = 'button';
        button.className = className;
        button.textContent = errorText(item);
        button.onclick = () => {
          const rows = source.value.split('\n');
          const start = rows.slice(0, item.line - 1).reduce((n, row) => n + row.length + 1, 0);
          source.focus();
          source.setSelectionRange(start, start + (rows[item.line - 1] || '').length);
          const style = getComputedStyle(source);
          source.scrollTop = Math.max(0, (item.line - 2) * parseFloat(style.lineHeight) - source.clientHeight * .2);
        };
        diagnostics.appendChild(button);
      }
    }
  }

  function run() {
    remember();
    const result = inspectChatSource(source.value);
    showDiagnostics(result.errors, result.warnings);
    if (!result.chat || result.errors.length) {
      block = '';
      lastValid = null;
      viewport.hidden = copy.disabled = restart.disabled = true;
      frame.removeAttribute('srcdoc');
      status.textContent = 'Sửa các lỗi trước khi chạy thử.';
      return;
    }
    block = result.block;
    lastValid = { chat: result.chat, name: name.value.trim() || 'An' };
    copy.disabled = restart.disabled = false;
    status.textContent = result.warnings.length ? 'Chạy thử được. Hãy xem các cảnh báo.' : 'Bản xem thử đã sẵn sàng.';
    start();
  }

  function changed() {
    remember();
    copy.disabled = true;
    lastValid = null;
    restart.disabled = true;
    if (source.value) status.textContent = 'Bấm Chạy thử để cập nhật.';
  }

  source.addEventListener('input', changed);
  name.addEventListener('input', () => {
    if (lastValid) lastValid.name = name.value.trim() || 'An';
  });
  document.querySelector('#run').onclick = run;
  restart.onclick = start;
  copy.onclick = async () => {
    if (!block || !lastValid) return;
    try {
      await navigator.clipboard.writeText(block);
      status.textContent = 'Đã sao chép khối baichat.';
    } catch {
      const buffer = document.createElement('textarea');
      buffer.value = block;
      buffer.setAttribute('aria-label', 'Khối baichat');
      buffer.style.position = 'fixed';
      buffer.style.left = '-9999px';
      document.body.appendChild(buffer);
      buffer.select();
      const ok = document.execCommand('copy');
      buffer.remove();
      copy.focus();
      status.textContent = ok ? 'Đã sao chép khối baichat.' : 'Trình duyệt chưa cho sao chép. Hãy sao chép trong ô LaTeX.';
    }
  };
  if (source.value) run();
})();
