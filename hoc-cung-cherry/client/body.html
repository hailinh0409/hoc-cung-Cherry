</head>
<body>
<div class="app" id="app">
  <div class="sky" id="sky"></div>

  <section class="scr on" id="intro">
    <div class="imas" id="imas"></div>
    <div class="brand" id="brand">Học cùng Cherry</div>
    <div class="tap">Chạm để bắt đầu</div>
    <div class="credit">CLB Toán - Anh<b>NGỌC LINH</b></div>
  </section>

  <section class="scr" id="login">
    <div class="lwrap" id="lwrap"></div>
  </section>

  <section class="scr" id="subj">
    <div class="ubar" data-ubar></div>
    <div class="scrollv" id="subjBody"></div>
  </section>

  <section class="scr" id="anh">
    <div class="ubar" data-ubar></div>
    <div class="scrollv" id="anhBody"></div>
  </section>

  <section class="scr" id="grades">
    <div class="ubar" data-ubar></div>
    <div class="sub" id="gsub" style="padding-top:6px"></div>
    <div class="gwrap"><div class="ggrid" id="ggrid"></div></div>
    <div id="gteach"></div>
  </section>

  <section class="scr" id="area">
    <div class="ubar" data-ubar></div>
    <div class="scrollv" id="areaBody"></div>
  </section>

  <section class="scr" id="journey">
    <div class="ubar" data-ubar></div>
    <div class="tmap" id="tmap"></div>
  </section>

  <section class="scr" id="ontap">
    <div class="ubar" data-ubar></div>
    <div class="scrollv" id="ontapBody"></div>
  </section>

  <section class="scr" id="redo">
    <div class="ubar" data-ubar></div>
    <div class="scrollv" id="redoBody"></div>
  </section>

  <section class="scr" id="ranked">
    <div class="ubar" data-ubar></div>
    <div class="scrollv" id="rankedBody"></div>
  </section>

  <section class="scr" id="friends">
    <div class="top"><button class="ico" id="frBack" aria-label="Quay lại"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h1>Bạn bè</h1></div>
    <div class="scrollv" id="frBody"></div>
  </section>

  <section class="scr" id="shop">
    <div class="top"><button class="ico" id="shBack" aria-label="Quay lại"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h1>Cửa hàng Cherry</h1></div>
    <div class="scrollv" id="shopBody"></div>
    <div class="shbar" id="shopBar"></div>
  </section>

  <section class="scr" id="board">
    <div class="top"><button class="ico" id="bBack" aria-label="Quay lại"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h1>Bảng xếp hạng</h1></div>
    <div class="scrollv" id="boardBody"></div>
  </section>

  <section class="scr" id="profile">
    <div class="top"><button class="ico" id="pBack" aria-label="Quay lại"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h1>Trang cá nhân</h1></div>
    <div class="scrollv" id="profBody"></div>
  </section>

  <section class="scr" id="track">
    <div class="top"><button class="ico" id="trBack" aria-label="Quay lại"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h1 id="trTitle">Quản lý</h1></div>
    <div class="scrollv" id="trk"></div>
  </section>

  <section class="scr" id="play">
    <div class="bar">
      <button class="ico" id="quit" aria-label="Thoát"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M4 4l12 12M16 4L4 16" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg></button>
      <div class="prog"><b id="progB"></b></div>
      <div class="hearts" id="hearts"></div><span class="pill sm" id="modeLbl" style="display:none"></span><button class="ico sm" id="snd" aria-label="Bật/tắt âm thanh"></button>
    </div>
    <div class="timer" id="timer" style="display:none"><b id="timerB"></b></div>
    <div class="meta"><span id="qnum"></span><span class="combo" id="combo"></span><span id="score"></span></div>
    <div class="stage" id="stage"></div>
    <div id="dock"></div>
    <div class="sheet" id="sheet"></div>
  </section>

  <div class="ovl" id="ovl"><div class="panel" id="panel"></div></div>
  <div class="toast" id="toast"></div>
  <canvas id="fx"></canvas>
</div>
