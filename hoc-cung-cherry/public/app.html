/* ---------- Dán bài mới (giáo viên): tạo chủ đề nháp cho bài chưa có câu hỏi ---------- */
// Nhận LaTeX do Gemini/Claude soạn; bỏ dấu ``` và các dòng %%% của file ngân hàng; thiếu \chude thì lấy tên bài SGK.
const cleanPaste=v=>String(v||'').replace(/\r/g,'').split('\n').filter(l=>!/^\s*```/.test(l)&&!/^\s*%%%/.test(l)).join('\n').trim();
function pasteNew(L){const k=curK,name=L.lt?lessonName(L):L.title;
  overlay(`<h2 style="font-size:24px">Dán bài mới</h2><p class="tnote">${esc(lessonName(L))} · Khối ${k}<br>Dán toàn bộ LaTeX của bài (lý thuyết và câu hỏi). Bài mới ở trạng thái <b>Nháp</b>; hình TikZ tự hiện sau khoảng 15 phút.</p>
    <textarea class="code" id="pn" spellcheck="false" placeholder="\\chude{${esc(name)}}"></textarea><div id="pnErr"></div>
    <button class="btn" id="pnS">Kiểm tra và tạo bài nháp</button><button class="btn alt" id="pnC">Hủy</button>`);
  $('#pnC').onclick=closeOvl;
  $('#pnS').onclick=async()=>{let text=cleanPaste($('#pn').value);const er=m=>{$('#pnErr').innerHTML=`<div class="err">${m}</div>`};
    if(!text)return er('Thầy dán nội dung bài vào ô trên.');
    if(!/\\chude\s*\{/.test(text))text=`\\chude{${name.replace(/[{}\\]/g,'')}}\n\n`+text;
    const P=parseTopic(text);if(P.errors.length)return er(P.errors.map(esc).join('<br>'));
    const nq=P.levels.reduce((s,l)=>s+l.qs.length,0);if(!nq&&!P.theory&&!P.chat)return er('Chưa thấy câu hỏi hay lý thuyết nào trong nội dung đã dán.');
    if(TOPICS.some(t=>t.khoi===k&&t.chuong===L.id))return er('Bài này vừa có chủ đề (có thể do máy khác tạo). Thầy đóng hộp này để tải lại bản đồ.');
    const nf=(text.match(/\\begin\{tikzpicture\}/g)||[]).length,idx=currOf(k).filter(c=>c.id).findIndex(c=>c.id===L.id);
    $('#pnS').disabled=true;
    try{await DB.collection('topics').doc().set({title:P.title||name,khoi:k,phan:L.ch.phan,chuong:L.id,text,thutu:(idx+1)*10,nguon:'Dán bài mới (giáo viên)'});
      closeOvl();sfx.ok();toast(`Đã tạo bài nháp: ${nq} câu${P.theory||P.chat?' + lý thuyết':''}${nf?` · ${nf} hình đang chờ dịch`:''}.`);journey()}
    catch(e){$('#pnS').disabled=false;er(esc(e&&e.message||'Lỗi kết nối'))}}}

/* ---------- Bài mẫu theo chương (lời giải từng bước) ----------
   Mỗi bài mẫu là một chủ đề phan 'bai-mau', chuong 'k<khối>-c<chương>'. Nội dung: \chude{tên}, \saubai{mã bài} (tùy chọn)
   và khối \begin{giaimau}…\end{giaimau} (cú pháp ở lib/latex.js). Học sinh thấy bài mẫu khi đã qua bài ghi ở \saubai;
   không ghi thì khi đã qua mọi bài có câu hỏi của chương. Giáo viên luôn thấy. Đã xem: P.bm[mã] = {d, f: đoán đúng ngay, n: số câu đoán}. */
const bmOf=(k,n)=>gradeTopics(k).filter(t=>isBM(t)&&t.chuong===`k${k}-c${n}`).sort((a,b)=>a.order-b.order||a.title.localeCompare(b.title));
const bmAfter=raw=>(String(raw||'').replace(/(^|[^\\])%.*$/gm,'$1').match(/\\saubai\s*\{\s*([^}]*?)\s*\}/)||[])[1]||''; // bỏ dòng chú thích %
const bmItems=raw=>[...String(raw||'').matchAll(GIAIMAU)].map(m=>({k:'giaimau',body:m[0]}));
function bmNeed(t){const k=t.khoi,n=chapOf(t),id=bmAfter(t.raw);
  const ls=id?currOf(k).filter(c=>c.id===id):currOf(k).filter(c=>c.id&&c.ch&&c.ch.n===n);
  const ts=ls.flatMap(L=>gradeTopics(k).filter(x=>(x.chuong||ALIAS[x.id])===L.id&&!isDe(x)&&!isTL(x)&&!isKho(x)&&!isBM(x)&&hasQ(x)));
  return {L:id?ls[0]:null,ts}}
const bmOpen=t=>GV()||bmNeed(t).ts.every(x=>topicPassed(x)>0);
const bmLockText=t=>{const {L}=bmNeed(t);return L?`Mở khi em qua ${lessonName(L)}`:'Mở khi em qua hết các bài của chương'};
// Yêu cầu soạn một bài mẫu cho Gemini (giống docs/soan-bai-mau.txt), có sẵn chương, mã bài và quy trình kiểm tra
function bmAsk(k,n){const ch=(chapsOf(k).find(c=>c.ch&&c.ch.n===n)||{}).ch,ls=currOf(k).filter(c=>c.id&&c.ch&&c.ch.n===n&&!c.lt);
  return [`Soạn MỘT bài tự luận cho chặng Tự luận của Chương ${n}. ${ch?ch.title:''}, Toán ${k}, SGK Kết nối tri thức, app Học cùng Cherry.`,
  'Học sinh giải cùng Cherry kiểu chat: mỗi bước Cherry nêu mục tiêu và hướng, học sinh viết vào vở (bí thì xin gợi ý), trả lời một câu kiểm tra nhỏ, rồi so vở với dòng trình bày mẫu. App không chấm vở.',
  'Các bài trong chương (mã bài: tên bài):',...ls.map(L=>`- ${L.id}: ${lessonName(L)}`),'',
  'Đề bài thầy chọn (nếu trống thì tự chọn một bài tự luận 2–3 câu sát Luyện tập chung, câu cuối phân loại theo mức độ hiểu bài, không "tính mẹo"; chỉ dùng kiến thức đã học):','[DÁN ĐỀ BÀI Ở ĐÂY]','',
  ...TL_SYNTAX,'',...TL_CHECKLIST].join('\n')}

const TL_SYNTAX=['KẾT QUẢ: trả đúng MỘT khối mã, không giải thích xen giữa:',
  '\\chude{Tên bài ngắn}',

  '\\cau{Câu a}{yêu cầu của câu}',

/* ---------- Chặng Tự luận (thầy duyệt 28/11/2026) ----------
   Bài tự luận = chủ đề Bài mẫu (phan 'bai-mau', chuong 'k<khối>-c<chương>'), giải kiểu chat cùng Cherry (client/tuluan.js).
   Chặng đứng ngay sau bài cuối của chương (sau Luyện tập chung), trước chương mới; bên cạnh có rương nhỏ.
   - Không khóa đường đi: bỏ qua chặng vẫn sang chương mới, chỉ không có quà.
   - Rương mở khi làm trọn 2 bài bất kỳ (chương có 1 bài thì làm trọn bài đó). Rương đã mở không bị lấy lại khi thầy thêm bài.
   - Không có điểm; giáo viên chỉ thấy đánh dấu đã làm (Theo dõi khối).
   Tiến độ: P.bm[mã] = {d, f, n, c: số câu đã xong, x: đã làm trọn}; bản cũ chỉ có {d, f, n} (đã xem hết) cũng tính là làm trọn.
   Rương: P.tlr['k<khối>-c<chương>'] = ngày mở. */
const TL_NEED=2,TL_CHEST_XP=50;
const pencilSVG='<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><rect x="4" y="3" width="13" height="18" rx="2" fill="#fff" stroke="#b85a1a" stroke-width="1.6"/><path d="M7 8h7M7 11h7M7 14h4" stroke="#b85a1a" stroke-width="1.5" stroke-linecap="round"/><path d="M14.5 19.5l6-9 1.8 1.2-6 9-2.3.9z" fill="#ffb703" stroke="#8a4a10" stroke-width="1.2" stroke-linejoin="round"/></svg>';
const tlDone=e=>!!e&&(e.x===true||(e.c===undefined&&!!e.d));
const tlLive=(k,n)=>bmOf(k,n).filter(t=>t.status==='giao'&&!t.errors.length);
function tlStat(k,n,p=P){const all=bmOf(k,n),live=tlLive(k,n),bm=(p&&p.bm)||{},done=live.filter(t=>tlDone(bm[t.id])).length,need=Math.min(TL_NEED,live.length),key=`k${k}-c${n}`,opened=!!(p&&p.tlr&&p.tlr[key]);
  return {total:live.length,done,need,full:need>0&&done>=live.length,ready:need>0&&done>=need&&!opened,opened,key,draft:all.length-live.length}}
// Chèn chặng Tự luận sau bài cuối của mỗi chương (trước cờ hết học kì hoặc chương sau); học sinh chỉ thấy khi chương có bài đã duyệt
function withTL(k,items){const out=[];let ch=null;const flush=()=>{if(ch&&ch.n&&(GV()||tlLive(k,ch.n).length))out.push({tl:ch});ch=null};
  for(const x of items){if(x.hk||(x.ch&&!x.L)){flush();if(x.ch&&!x.L)ch=x.ch}out.push(x)}flush();return out}
function tlChest(n){const S=tlStat(curK,n);if(!S.ready||GV())return;P.tlr=P.tlr||{};P.tlr[S.key]=vnDay();addXP(TL_CHEST_XP);save();syncMine();sfx.win();
  overlay(`${chestSVG(true,110)}<h2>Rương Tự luận!</h2><p>Em đã làm trọn ${S.need} bài tự luận của Chương ${n}. Em nhận được <b>+${TL_CHEST_XP} XP</b>!</p><button class="btn" id="tlOk">Tuyệt quá!</button>`);
  $('#tlOk').onclick=()=>{closeOvl();journey();setTimeout(()=>bmList(n),50)}}

/* ---------- Soạn bằng Gemini theo chương (giáo viên) ----------
   Sao chép phần lý thuyết của cả chương kèm lời nhờ → dán vào Gemini → dán kết quả lại một lần.
   Khi dán, app CHỈ thay khối lythuyet của bài đã có (câu hỏi được khóa); bài chưa có thì tạo bài nháp mới.
   Mỗi bài trong đoạn dán mở đầu bằng dòng  %%% bai: <slug>  (bài đã có) hoặc  %%% bai: <mã bài>  (bài chưa có). */
const LT_RE=/\\begin\{lythuyet\}[\s\S]*?\\end\{lythuyet\}/;
function withTheory(raw,blk){const m=raw.match(LT_RE);if(m)return raw.slice(0,m.index)+blk+raw.slice(m.index+m[0].length);
  const title=raw.match(/\\chude\s*\{/),heading=title&&group(raw,title.index+6),at=heading?.[1]||0;return raw.slice(0,at)+'\n\n'+blk+'\n\n'+raw.slice(at)}
function chapLessons(k,n){return currOf(k).filter(c=>c.id&&c.ch&&c.ch.n===n&&!c.lt).map(L=>({L,ts:gradeTopics(k).filter(t=>t.chuong===L.id&&!isDe(t)&&!isKho(t))}))}
const GEM_ASK='Thêm hình minh họa cho phần lý thuyết của từng bài: dùng hình từng bước (\\begin{hinhbuoc}) cho các ý cần thấy quá trình (cách vẽ, chứng minh, phép tính trên trục số, chia hình…), hình TikZ tĩnh cho phần còn lại. App chia lý thuyết thành từng màn ngắn theo dấu \\\\: mỗi dòng 1–2 câu, \\loidan 1–2 câu, \\luuy mỗi ý một câu, lời giải \\vidu mỗi bước một dòng, mỗi mục có một \\thungay; viết lại các mục cũ còn là đoạn dài. Hình vẽ cho điện thoại dọc: rộng 5–7 cm, nhãn ngắn và không đè nhau (nhãn dài thì xuống dòng bằng align=center và \\\\), câu giải thích để ngoài hình, đặt hình ngay sau câu nó minh họa; sửa luôn các hình cũ bị rộng quá 8 cm hoặc đè nhãn. Bài chưa có lý thuyết thì soạn lý thuyết tương tác đầy đủ. Giữ nguyên các mục đang tốt.';
function chapterText(k,n,ask){const c=currOf(k).find(x=>x.ch&&!x.id&&x.ch.n===n);const out=[];
  out.push(`Thầy Linh nhờ (app Học cùng Cherry, Toán ${k}, Chương ${n}. ${c?c.ch.title:''}):`,ask,'',
   'Quy tắc trả lời:',
   '- Làm theo skill soạn bài Học cùng Cherry (mục Lý thuyết tương tác và Hình từng bước).',
   '- Trả lời bằng MỘT khối mã. Mỗi bài mở đầu bằng đúng dòng "%%% bai: …" như bên dưới, rồi \\chude{…} và khối \\begin{lythuyet} … \\end{lythuyet}.',
   '- Chỉ gửi lại khối lythuyet. Không gửi câu hỏi: app bỏ qua mọi thứ ngoài khối lythuyet của bài đã có.',
   '- Hình vẽ cho điện thoại, rộng 6–8 cm; tọa độ cụ thể; nhãn điểm không đè lên nét; chỉ dùng thư viện tikz trong skill.',
   '- Hình từng bước: một tikzpicture, phần hiện từ bước k bọc \\hien{k}{…}, mỗi bước một dòng \\loibuoc{…} (2–8 bước).','');
  for(const {L,ts} of chapLessons(k,n)){
    if(!ts.length){out.push(`%%% bai: ${L.id}`,`\\chude{${L.title}}`,'% Bài này CHƯA CÓ trên app: soạn lý thuyết tương tác đầy đủ (có thể kèm câu hỏi \\man{1}…\\man{4}).','');continue}
    for(const t of ts){const m=t.raw.match(LT_RE);out.push(`%%% bai: ${t.id}`,`\\chude{${t.title}}`,m?m[0]:'% Bài này chưa có lý thuyết: soạn mới khối lythuyet.','')}}
  return out.join('\n')}

function parseChapterPaste(v){const text=String(v||'').replace(/\r/g,'').split('\n').filter(l=>!/^\s*```/.test(l)).join('\n');
  const re=/^[ \t]*%%%[ \t]*bai:[ \t]*(\S+).*$/gm,heads=[...text.matchAll(re)];
  return heads.map((h,i)=>({key:h[1],body:text.slice(h.index+h[0].length,i+1<heads.length?heads[i+1].index:text.length).split('\n').filter(l=>!/^\s*%%%/.test(l)).join('\n').trim()}))}
function planChapter(k,n,v){const lessons=chapLessons(k,n),blocks=parseChapterPaste(v),last={};blocks.forEach((b,i)=>last[b.key]=i);
  return blocks.map((b,i)=>{const t=TOPICS.find(x=>x.id===b.key),L=t?lessonOf(t):lessons.find(x=>x.L.id===b.key)?.L;
    const r={key:b.key,name:L?lessonName(L):(t?t.title:b.key)};
    if(last[b.key]!==i)return {...r,skip:true,note:'Bài này xuất hiện lần nữa ở dưới, app dùng bản ở dưới.'};
    if(!t&&L&&!LT_RE.test(b.body)&&!/\\man\s*\{/.test(b.body))return {...r,skip:true,note:'Gemini chưa soạn bài này, bỏ qua.'};
    if(t&&t.khoi!==k)return {...r,err:'Bài này thuộc khối khác.'};
    if(!t&&!L)return {...r,err:'Không nhận ra bài (mã sau "%%% bai:" bị đổi?).'};
    const blk=b.body.match(LT_RE);
    if(t){if(!blk)return {...r,err:'Không thấy khối \\begin{lythuyet} … \\end{lythuyet}.'};
      const text=withTheory(t.raw,blk[0]),P=parseTopic(text);
      if(P.errors.length>t.errors.length)return {...r,err:P.errors.map(e=>esc(e)).join('<br>')};
      if(text===t.raw)return {...r,skip:true,note:'Không có gì thay đổi.'};
      return {...r,t,text,theory:P.theory,lesson:P.lesson,live:t.status==='giao'}}
    if(TOPICS.some(x=>x.khoi===k&&x.chuong===L.id))return {...r,err:'Bài này vừa có trên app (có thể đã dán trước đó). Thầy sao chép lại chương rồi nhờ Gemini lần nữa.'};
    let text=b.body;if(!/\\chude\s*\{/.test(text))text=`\\chude{${L.title.replace(/[{}\\]/g,'')}}\n\n`+text;
    const P=parseTopic(text),nq=P.levels.reduce((s,l)=>s+l.qs.length,0);
    if(P.errors.length)return {...r,err:P.errors.map(e=>esc(e)).join('<br>')};
    if(!nq&&!P.theory)return {...r,err:'Chưa có lý thuyết hay câu hỏi.'};
    return {...r,L,text,theory:P.theory,lesson:P.lesson,title:P.title||L.title,nq,isNew:true}})}
const countHb=s=>(String(s).match(/\\begin\{hinhbuoc\}/g)||[]).length,countPic=s=>(String(s).match(/\\begin\{tikzpicture\}/g)||[]).length;

      <details data-pv="${i}"><summary>Xem trước</summary><div class="lesson-material"></div></details>`}</div>`).join('')}</div>
      ${good.length?`<p class="tnote">Hình mới hiện “chưa dịch” trong xem trước; khoảng 15 phút sau khi lưu sẽ có hình.</p><button class="btn" id="pcSave">Lưu ${good.length} bài</button>`:''}`;

    $('#pcSave')&&($('#pcSave').onclick=async()=>{const btn=$('#pcSave');btn.disabled=true;let ok=0;const bad=[];

const bookSVG='<svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 5.5C5.5 4 8.5 4 12 6c3.5-2 6.5-2 9-.5V19c-2.5-1.3-5.5-1.3-9 .7-3.5-2-6.5-2-9-.7z" fill="#fff" stroke="#2584b8" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 6v13.7" stroke="#2584b8" stroke-width="1.6"/></svg>';
const CAT_COLORS={cam:'#f28c28',lam:'#3b7be0',luc:'#2fa36b',tim:'#8b5cf6',do:'#e0475a'};
const CAT_NUMBERS=[3,2,1,4];
const CAT_SCALE=56;
const catEsc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function catIntersection([a,b],[c,d]){
  const x=b[0]-a[0],y=b[1]-a[1],u=d[0]-c[0],v=d[1]-c[1];
  const fraction=((c[0]-a[0])*v-(c[1]-a[1])*u)/(x*v-y*u);
  return [a[0]+x*fraction,a[1]+y*fraction];
}

function catAngles(point,rays){
  const boundaries=rays.map(([x,y])=>Math.atan2(y-point[1],x-point[0]));
  for(let i=1;i<boundaries.length;i++){
    while(boundaries[i]<boundaries[i-1])boundaries[i]+=2*Math.PI;
  }
  return boundaries.map((from,i)=>({from,to:boundaries[i+1]??boundaries[0]+2*Math.PI,number:CAT_NUMBERS[i]}));
}

function catText(x,y,value,kind){
  return `<text class="cat-${kind}" x="${x}" y="${y}" dy=".35em" text-anchor="middle">${catEsc(value)}</text>`;
}

function catTuyen(params={},state={}, {tap=false,region=false,slide=false}={}){
  const [a,b,c]=params.duong||['a','b','c'];
  const [A,B]=params.diem||['A','B'];
  const isParallel=String(params['song-song'])==='1', direction=params.c==='phai'?-1:1;
  const lines=isParallel?[[[-2.8,2],[3.3,2]],[[-2.8,0],[3.3,0]]]:
    [[[-2.8,2.3],[3.3,2.75]],[[-2.8,.3],[3.3,-.12]]];
  const cut=[[-.85*direction,3.75],[1.75*direction,-1.5]];
  const vertices=lines.map((line,i)=>{
    const point=catIntersection(line,cut);
    return {point,name:[A,B][i],angles:catAngles(point,[line[1],cut[0],line[0],cut[1]])};
  });
  const pointX=x=>Number(((x+3.1)*CAT_SCALE).toFixed(1));
  const pointY=y=>Number(((4.05-y)*CAT_SCALE).toFixed(1));
  const XY=([x,y])=>[pointX(x),pointY(y)];
  const vector=(origin,radius,theta)=>XY([origin[0]+radius*Math.cos(theta),origin[1]+radius*Math.sin(theta)]);
  const pointList=points=>points.map(p=>XY(p).join(',')).join(' ');

  function sector(point,{from,to},radius){
    const [cx,cy]=XY(point), [sx,sy]=vector(point,radius,from), [ex,ey]=vector(point,radius,to);
    const r=radius*CAT_SCALE;
    return `M${cx} ${cy}L${sx} ${sy}A${r} ${r} 0 ${to-from>Math.PI?1:0} 0 ${ex} ${ey}Z`;
  }

  function drawAngle(vertex,angle,{number,color,value}){
    const {point}=vertex,{from,to}=angle, middle=(from+to)/2;
    let out=color?`<path d="${sector(point,angle,.55)}" fill="${color}" fill-opacity=".33" stroke="${color}" stroke-width="2"/>`:'';
    if(number){
      const [x,y]=vector(point,.38,middle);
      out+=`<g fill="${color||'#111'}">${catText(x,y,angle.number,'number')}</g>`;
    }
    if(value){
      const [x,y]=vector(point,.86,middle);
      out+=`<g fill="${color||CAT_COLORS.do}">${catText(x,y,value,'value')}</g>`;
    }
    return out;
  }

  const [top,bottom]=lines;
  const regions={
    tren:[[-2.8,4.05],[3.3,4.05],top[1],top[0]],
    giua:[top[0],top[1],bottom[1],bottom[0]],
    duoi:[bottom[0],bottom[1],[3.3,-1.75],[-2.8,-1.75]],
  };
  let out=state.vung&&regions[state.vung]?`<polygon points="${pointList(regions[state.vung])}" fill="#ffe08a" fill-opacity=".5"/>`:'';
  for(const [start,end] of [...lines,cut]){
    const [x1,y1]=XY(start),[x2,y2]=XY(end);
    out+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#111" stroke-width="2.2" stroke-linecap="round"/>`;
  }
  for(const vertex of vertices){
    for(const angle of vertex.angles){
      const key=vertex.name+angle.number;
      out+=drawAngle(vertex,angle,{number:state.so!=='an'&&(!slide||vertex!==vertices[0]),
        color:CAT_COLORS[state.to?.[key]],value:state.do?.[key]});
    }
    const [x,y]=XY(vertex.point), [nx,ny]=vector(vertex.point,1,98*Math.PI/180);
    out+=`<circle cx="${x}" cy="${y}" r="4.5"/>${catText(nx+10,ny,vertex.name,'label')}`;
  }
  for(const [index, [start,end]] of [...lines,cut].entries()){
    const [first,last]=[a,b,c][index].split('-'),[x1,y1]=XY(start),[x2,y2]=XY(end);
    const cutLine=index===2;
    out+=catText(x1+(cutLine?12:-6),y1+(cutLine?4:-14),first,'label');
    if(last)out+=catText(x2+(cutLine?-12:6),y2+(cutLine?-4:14),last,'label');
  }

  if(slide){
    const [from,to]=vertices,[x1,y1]=XY(from.point),[x2,y2]=XY(to.point);
    const moving=from.angles.map(angle=>drawAngle(from,angle,{number:true,color:Object.values(CAT_COLORS)[angle.number-1]})).join('');
    out+=`<g class="cat-slide" data-dx="${x2-x1}" data-dy="${y2-y1}"${slide==='to'?` style="transform:translate(${x2-x1}px,${y2-y1}px)"`: ''}>${moving}</g>`;
  }
  if(tap){
    for(const vertex of vertices){
      for(const angle of vertex.angles){
        const key=catEsc(vertex.name+angle.number);
        out+=`<path class="cat-hit" data-angle="${key}" d="${sector(vertex.point,angle,1)}" fill="transparent" tabindex="0" role="button" aria-label="Góc ${key}"/>`;
      }
    }
  }
  if(region){
    const regionLabels={tren:'Phía trên đường thứ nhất',giua:'Giữa hai đường thẳng',duoi:'Phía dưới đường thứ hai'};
    for(const [key,points] of Object.entries(regions)){
      out+=`<polygon class="cat-hit" data-region="${key}" points="${pointList(points)}" fill="transparent" tabindex="0" role="button" aria-label="${regionLabels[key]}"/>`;
    }
  }
  return `<svg viewBox="0 0 395 325" role="${tap||region?'group':'img'}" aria-label="${catEsc('Đường thẳng '+c+' cắt '+a+' và '+b+' tại '+A+' và '+B)}">
    <style>.cat-label{font:italic 19px "Times New Roman",serif}.cat-number{font:16px "Times New Roman",serif}.cat-value{font:700 13.5px Nunito,sans-serif}</style>${out}</svg>`;
}

  if(it.k==='pom')return `<circle cx="${x}" cy="${y}" r="22" fill="#d7e87a" stroke="#8aa536" stroke-width="2"/><path d="M${x} ${y-22}q6 -10 14 -8q-4 8 -14 8" fill="#4fa34a"/><text x="${x}" y="${y+2}" dy=".35em" text-anchor="middle" font-size="22" font-weight="700" fill="${CHAT_FIG_INK}" font-family="Be Vietnam Pro">${catEsc(it.label||'?')}</text>`;

}
function drawScale(o={}){
  const cx=210,py=60,half=140,a=(({bal:0,L:-9,R:9})[o.tilt||'bal'])*Math.PI/180;
  const Lx=cx-half*Math.cos(a),Ly=py-half*Math.sin(a),Rx=cx+half*Math.cos(a),Ry=py+half*Math.sin(a);
  const dims=it=>it.k==='w'?[24,24]:it.k==='big'?[70,28]:it.k==='pom'?[46,46]:[44,40];
  const pan=(ex,ey,items)=>{
    const p2=ey+80;let g=`<line x1="${ex}" y1="${ey}" x2="${ex-52}" y2="${p2}" stroke="#7a5a2f" stroke-width="2"/><line x1="${ex}" y1="${ey}" x2="${ex+52}" y2="${p2}" stroke="#7a5a2f" stroke-width="2"/>`;
    const rows=[];let row=[],wr=0;
    items.forEach(it=>{const[w,h]=dims(it);if(row.length&&wr+w+4>108){rows.push(row);row=[];wr=0}row.push({it,w,h});wr+=w+4});if(row.length)rows.push(row);
    let y=p2-3;
    rows.forEach(r=>{const rh=Math.max(...r.map(q=>q.h)),tw=r.reduce((t,q)=>t+q.w+4,-4);let x=ex-tw/2;r.forEach(q=>{g+=scaleItem(q.it,x+q.w/2,y-q.h/2,q.w,q.h);x+=q.w+4});y-=rh+3});
    return g+`<path d="M${ex-60} ${p2}A60 24 0 0 0 ${ex+60} ${p2}Z" fill="#efe3c6" stroke="#9a7b4f" stroke-width="2.5"/>`};
  let s=`<polygon points="140,238 280,238 258,216 162,216" fill="#d9c7a0" stroke="#9a7b4f" stroke-width="2"/><rect x="203" y="${py}" width="14" height="${216-py}" fill="#b08d5a"/>`;
  s+=pan(Lx,Ly,o.L||[])+pan(Rx,Ry,o.R||[]);
  s+=`<line x1="${Lx}" y1="${Ly}" x2="${Rx}" y2="${Ry}" stroke="#7a5a2f" stroke-width="9" stroke-linecap="round"/><circle cx="${cx}" cy="${py}" r="10" fill="#b08d5a" stroke="#7a5a2f" stroke-width="2"/>`;
  if(o.note)s+=`<text x="210" y="22" text-anchor="middle" font-size="15" font-weight="700" fill="${(o.tilt||'bal')==='bal'?'#1f8a57':'#c2410c'}" font-family="Be Vietnam Pro">${catEsc(o.note)}</text>`;
  return `<svg viewBox="0 0 420 250" role="img" aria-label="${catEsc(o.label||'Cân đĩa')}">${s}</svg>`;
}
function drawEquation(o={}){
  const rows=o.rows||[],cx=210,RH=58,AG=32,y0=14;
  const H=y0+rows.length*(RH+AG)-AG+14;
  const parse=t=>{const m=t.match(/^([+−])?(.+)$/);return{sg:m[1]||'',b:m[2]}};
  const isFr=b=>/^\d+\/\d+$/.test(b);
  const bodyW=b=>isFr(b)?Math.max(...b.split('/').map(z=>z.length))*15+8:b.length*16+2;
  const tw=t=>{const p=parse(t);return(p.sg?30:0)+bodyW(p.b)+12};
  const draw=(t,x,y,c,key)=>{const p=parse(t),w=tw(t),col=c||CHAT_FIG_INK;let g='',xx=x;
    if(p.sg){g+=`<text x="${xx+13}" y="${y}" dy=".35em" text-anchor="middle" font-size="26" font-weight="600" fill="${col}" font-family="Be Vietnam Pro">${p.sg}</text>`;xx+=30}
    const bw=bodyW(p.b);
    if(isFr(p.b)){const[n,d]=p.b.split('/');g+=`<text x="${xx+bw/2}" y="${y-12}" text-anchor="middle" font-size="20" fill="${col}" font-family="Times New Roman">${n}</text><line x1="${xx}" x2="${xx+bw}" y1="${y}" y2="${y}" stroke="${col}" stroke-width="2"/><text x="${xx+bw/2}" y="${y+18}" text-anchor="middle" font-size="20" fill="${col}" font-family="Times New Roman">${d}</text>`}
    else g+=`<text x="${xx+bw/2}" y="${y}" dy=".35em" text-anchor="middle" font-size="28" ${/^[a-z]$/.test(p.b)?'font-style="italic"':''} font-family="Times New Roman" fill="${col}" font-weight="${c?700:400}">${catEsc(p.b)}</text>`;
    if(o.tap&&key)g+=`<rect class="cat-hit" data-angle="${key}" tabindex="0" role="button" aria-label="${catEsc(t)}" x="${x-4}" y="${y-28}" width="${w}" height="56" rx="10" fill="transparent"><title>${catEsc(t)}</title></rect>`;
    return g};
  let s='';
  rows.forEach((r,i)=>{const yc=y0+i*(RH+AG)+RH/2;
    s+=`<rect x="12" y="${yc-RH/2}" width="396" height="${RH}" rx="14" fill="#fffaf2" stroke="#ece3d1" stroke-width="2"/>`;
    const L=r.l||[],Rr=r.r||[],totL=L.reduce((t,z)=>t+tw(z),0),totR=Rr.reduce((t,z)=>t+tw(z),0),kk=Math.min(1,186/(30+Math.max(totL,totR)));
    s+=`<g transform="translate(${cx} ${yc}) scale(${kk.toFixed(3)}) translate(${-cx} ${-yc})">`;let x=cx-30-totL;
    L.forEach((t,j)=>{s+=draw(t,x,yc,CAT_COLORS[o.colors?.[`${i+1}t${j+1}`]],`${i+1}t${j+1}`);x+=tw(t)});
    s+=`<text x="${cx}" y="${yc}" dy=".35em" text-anchor="middle" font-size="30" fill="${CHAT_FIG_INK}" font-family="Be Vietnam Pro">=</text>`;
    x=cx+30;Rr.forEach((t,j)=>{s+=draw(t,x,yc,CAT_COLORS[o.colors?.[`${i+1}p${j+1}`]],`${i+1}p${j+1}`);x+=tw(t)});s+='</g>';
    if(i<rows.length-1){const ya=yc+RH/2+3,yb=ya+AG-6;
      s+=`<path d="M${cx} ${ya}V${yb}" stroke="#149c8c" stroke-width="2.5" fill="none"/><path d="M${cx-6} ${yb-6}L${cx} ${yb}L${cx+6} ${yb-6}" stroke="#149c8c" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
      if((o.arrows||[])[i])s+=`<text x="${cx+14}" y="${ya+AG/2-1}" dy=".35em" font-size="13" font-weight="600" fill="#0f7a6e" font-family="Be Vietnam Pro">${catEsc(o.arrows[i])}</text>`}
  });
  return `<svg viewBox="0 0 420 ${H}" role="${o.tap?'group':'img'}" aria-label="${catEsc(o.label||'Đẳng thức')}">${s}</svg>`;
}

function can(params = {}, state = {}) {
  const values = { ...params, ...state };
  const side = items => (items || []).flatMap(({ kind, count, label }) => {
    if (kind === 'q') return count <= 12
      ? Array.from({ length: count }, () => ({ k: 'w' }))
      : [{ k: 'big', label: count + ' × 1' }];
    return [{ k: { k: 'big', t: 'bag', b: 'pom' }[kind], label }];
  });
  const L = side(values.trai), R = side(values.phai);
  const describe = items => items.map(item => item.label || '1').join(', ') || 'trống';
  return drawScale({
    L, R, tilt: { trai: 'L', phai: 'R' }[values.nghieng], note: values.ghichu,
    label: 'Cân đĩa. Trái: ' + describe(L) + '. Phải: ' + describe(R),
  });
}

function dangThuc(params = {}, state = {}, { tap = false } = {}) {
  const values = { ...params, ...state, to: { ...params.to, ...state.to } };
  const rows = [];
  for (let i = 1; i <= (values.dong || 4); i++) {
    const row = values['dong' + i];
    if (!row) break;
    const [l, r] = row.map(side => side.map(term => term.replace(/^-/, '−')));
    rows.push({ l, r });
  }
  if (!rows.length) return '';
  return drawEquation({
    rows, colors: values.to, tap, arrows: [values.mui1, values.mui2, values.mui3],
    label: rows.map(({ l, r }) => l.join(' ') + ' = ' + r.join(' ')).join('. '),
  });
}

  }
