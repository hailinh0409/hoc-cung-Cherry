<!DOCTYPE html>
<html lang="vi">
<head>
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0b4654"><link rel="apple-touch-icon" href="/apple-icon.png"><link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Học cùng Cherry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: vui, khích lệ, như một trò chơi phiêu lưu trên điện thoại
   IDEA: tháp đảo bay — mỗi màn là một hòn đảo, leo từ Mức 1 lên Mức 4
   PICTURE: bản đồ đảo nối bằng đường chấm, chú cú Toán đứng ở màn hiện tại
   COLOUR and TYPE: nền xanh biển sâu, đảo san hô cam, nhấn vàng chanh; Baloo 2 + Be Vietnam Pro
   LAYOUT: một cột dọc toàn màn hình, nút bấm lớn ở nửa dưới cho ngón cái */
:root{color-scheme:dark;--bg:#0b4654;--bg2:#06303a;--ink:#fffaf2;--mute:#a9d3d6;--coral:#ff7a59;--coral2:#e85a3a;--sun:#ffd23f;--ok:#2fd18b;--bad:#ff5d6c;--card:#fffaf2;--cink:#12313a}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg2);overflow:hidden}
body{color:var(--ink);font:16px/1.5 "Be Vietnam Pro",system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.app{position:relative;height:100%;height:100dvh;overflow:hidden;background:radial-gradient(120% 70% at 50% 0%,#127083 0%,var(--bg) 45%,var(--bg2) 100%)}
.scr{position:absolute;inset:0;display:none;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.scr.on{display:flex;animation:fade .35s ease}
h1,h2,.disp{font-family:"Baloo 2",system-ui,sans-serif;line-height:1.05;margin:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:16px;font-weight:700;font-size:17px;background:var(--sun);color:#3a2a00;box-shadow:0 5px 0 #c99a08;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c99a08}
.btn.alt{background:#fffaf2;color:var(--cink);box-shadow:0 5px 0 #b9c9c9}
.btn.co{background:var(--coral);color:#fff;box-shadow:0 5px 0 var(--coral2)}
.btn[disabled]{opacity:.45;pointer-events:none}
.sky i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.5;animation:tw 3s infinite ease-in-out}
/* intro */
#intro{align-items:center;justify-content:center;text-align:center;gap:18px;z-index:5}
.logo{position:relative;width:150px;height:150px}
.logo .ring{position:absolute;inset:0;border-radius:50%;border:6px dashed var(--sun);animation:spin 9s linear infinite}
.logo .core{position:absolute;inset:18px;border-radius:50%;background:var(--coral);display:grid;place-items:center;font:800 54px "Baloo 2";color:#fff;box-shadow:inset 0 -8px 0 var(--coral2),0 12px 30px #0006;animation:pop .7s cubic-bezier(.3,1.6,.5,1) both}
.brand{font:800 30px "Baloo 2";letter-spacing:.5px}
.brand span{display:inline-block;animation:rise .5s both}
.tap{color:var(--mute);animation:blink 1.4s infinite}
/* home */
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
.top h1{font-size:26px;flex:1}
.pill{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:#0006;font-weight:700;white-space:nowrap}
.ico{width:44px;height:44px;border-radius:14px;background:#0005;display:grid;place-items:center}
.sub{padding:0 16px;color:var(--mute);font-size:14px}
.map{position:relative;flex:1;margin:4px 0}
.map svg.path{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;z-index:1;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:130px}
.isle{position:relative;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font:800 36px "Baloo 2";background:var(--coral);color:#fff;box-shadow:inset 0 -7px 0 var(--coral2),0 16px 0 -6px #04232b88}
.isle::after{content:"";position:absolute;left:-14px;right:-14px;bottom:-18px;height:26px;border-radius:50%;background:#2fa58b;z-index:-1;box-shadow:inset 0 -6px 0 #1d7d68}
.node.open .isle{animation:pulse 1.6s infinite}
.node.lock .isle{background:#557b82;box-shadow:inset 0 -7px 0 #3f6168;color:#c5dadc}
.node.done .isle{background:var(--sun);color:#5a3f00;box-shadow:inset 0 -7px 0 #d6a90b}
.nlab{font-weight:700;font-size:14px;text-align:center;margin-top:16px;text-shadow:0 2px 4px #0008}
.stars{display:flex;gap:2px}
.stars svg{width:18px;height:18px}
.owl{position:absolute;width:74px;transition:left .8s cubic-bezier(.5,0,.3,1.3),top .8s cubic-bezier(.5,0,.3,1.3);transform:translate(-50%,-100%);pointer-events:none;animation:bob 2.2s ease-in-out infinite}
.owl.cheer{animation:jump .6s 2}
.owl.sad{animation:tilt .8s}
.owl .w1{transform-origin:24px 60px;animation:flap 2.2s infinite}
.owl .w2{transform-origin:76px 60px;animation:flap 2.2s infinite reverse}
.foot{display:flex;gap:10px;padding:8px 16px 16px}
.foot .btn{flex:1}
/* play */
.bar{display:flex;align-items:center;gap:10px;padding:12px 14px}
.prog{flex:1;height:14px;border-radius:99px;background:#0006;overflow:hidden}
.prog b{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--sun),#ffe98a);transition:width .5s}
.hearts{display:flex;gap:2px}
.hearts svg{width:24px;height:24px;transition:transform .3s,opacity .3s}
.hearts svg.lost{opacity:.25;transform:scale(.7)}
.meta{display:flex;justify-content:space-between;padding:0 16px 6px;font-weight:700;font-size:14px;color:var(--mute)}
.meta .combo{color:var(--sun)}
.stage{flex:1;overflow-y:auto;padding:4px 14px 16px;-webkit-overflow-scrolling:touch}
.card{background:var(--card);color:var(--cink);border-radius:22px;padding:18px 16px;box-shadow:0 8px 0 #0003;animation:slideIn .45s cubic-bezier(.2,1.2,.4,1)}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;background:#ffe8df;color:var(--coral2);font-size:13px;font-weight:700;margin-bottom:8px}
.stem{font-size:17px;line-height:1.6}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 14px;border-radius:16px;background:#fff;color:var(--cink);text-align:left;box-shadow:0 4px 0 #0002,inset 0 0 0 2px #d9e6e6;font-size:17px;animation:slideIn .45s both}
.opt .k{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:#e7f2f2;font-weight:800}
.opt.ok{background:#dcfbe9;box-shadow:0 4px 0 #1fa86b,inset 0 0 0 2px var(--ok)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.no{background:#ffe3e6;box-shadow:0 4px 0 #d23f4f,inset 0 0 0 2px var(--bad);animation:shake .4s}
.opt.no .k{background:var(--bad);color:#fff}
.lock .opt,.lock .mi{pointer-events:none}
.ansbox{margin-top:14px;min-height:58px;border-radius:16px;background:#eef6f6;box-shadow:inset 0 0 0 2px #cfe2e2;display:flex;align-items:center;justify-content:center;font:800 30px "Baloo 2";color:var(--cink);letter-spacing:1px}
.ansbox.ok{background:#dcfbe9;box-shadow:inset 0 0 0 3px var(--ok)}
.ansbox.no{background:#ffe3e6;box-shadow:inset 0 0 0 3px var(--bad);animation:shake .4s}
.ansbox:empty::before{content:"Nhập đáp số";font:600 16px "Be Vietnam Pro";color:#8aa7ab;letter-spacing:0}
.pad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:10px 14px 14px;background:#04262e}
.pad button{min-height:52px;border-radius:14px;background:#174d58;font:800 22px "Baloo 2";box-shadow:0 4px 0 #0a3038}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #0a3038}
.pad .go{grid-column:span 2;background:var(--sun);color:#3a2a00;box-shadow:0 4px 0 #c99a08;font-size:19px}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:14px}
.mcol{display:grid;gap:10px;align-content:start}
.mi{position:relative;min-height:62px;padding:10px 8px 10px 10px;border-radius:14px;background:#fff;box-shadow:0 4px 0 #0002,inset 0 0 0 2px #d9e6e6;font-size:15px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--cink);overflow-x:auto;animation:slideIn .45s both}
.mi.sel{box-shadow:0 4px 0 #c99a08,inset 0 0 0 3px var(--sun);transform:translateY(-2px)}
.mi .bd{position:absolute;top:-8px;right:-6px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;animation:pop .3s}
.mi.ok{box-shadow:0 4px 0 #1fa86b,inset 0 0 0 3px var(--ok)}
.mi.no{box-shadow:0 4px 0 #d23f4f,inset 0 0 0 3px var(--bad);animation:shake .4s}
.hint{font-size:13px;color:#5f7d82;margin-top:8px}
.chk{padding:10px 14px 14px}
.chk .btn{width:100%}
/* feedback sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:18px 16px calc(16px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .35s cubic-bezier(.2,1.1,.4,1);max-height:70%;overflow-y:auto}
.sheet.on{transform:none}
.sheet.ok{background:#dcfbe9;color:#0c4a2f}
.sheet.no{background:#ffe3e6;color:#6b1420}
.sheet h2{font-size:28px;margin-bottom:4px}
.sheet .sol{background:#fff9;border-radius:14px;padding:10px 12px;margin:10px 0;font-size:15px}
.sheet .btn{width:100%;margin-top:8px}
.float{position:absolute;z-index:6;font:800 30px "Baloo 2";color:var(--sun);text-shadow:0 3px 0 #0006;pointer-events:none;animation:up 1s forwards}
/* overlay + result */
.ovl{position:absolute;inset:0;z-index:7;display:none;align-items:center;justify-content:center;background:#03222acc;padding:20px}
.ovl.on{display:flex;animation:fade .25s}
.panel{width:100%;max-width:380px;background:var(--card);color:var(--cink);border-radius:26px;padding:24px 20px;text-align:center;animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
.panel h2{font-size:34px}
.panel p{margin:6px 0 14px;color:#4c6a70}
.panel .btn{width:100%;margin-top:10px}
.bigstars{display:flex;justify-content:center;gap:6px;margin:12px 0}
.bigstars svg{width:58px;height:58px;animation:pop .5s both}
.bigstars svg:nth-child(2){transform:translateY(-12px);animation-delay:.25s}
.bigstars svg:nth-child(3){animation-delay:.5s}
.stat{display:flex;justify-content:space-around;margin:6px 0 4px}
.stat b{display:block;font:800 26px "Baloo 2";color:var(--coral2)}
.lvlcard .num{font:800 72px "Baloo 2";color:var(--coral)}
input.name{width:100%;min-height:52px;border-radius:14px;border:2px solid #cfe2e2;padding:0 14px;font:600 17px "Be Vietnam Pro";color:var(--cink);background:#fff;margin-top:6px}
.cert{text-align:left}
.cert .row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed #cfe2e2}
.cert .row .stars svg{width:20px;height:20px}
canvas#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}
mjx-container{max-width:100%;overflow-x:auto;overflow-y:hidden}
@keyframes fade{from{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.2);opacity:0}}
@keyframes rise{from{transform:translateY(30px);opacity:0}}
@keyframes blink{50%{opacity:.3}}
@keyframes tw{50%{opacity:.1}}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes bob{50%{margin-top:-6px}}
@keyframes jump{40%{margin-top:-34px}}
@keyframes tilt{30%{rotate:-14deg}70%{rotate:10deg}}
@keyframes flap{0%,80%,100%{transform:rotate(0)}90%{transform:rotate(-18deg)}}
@keyframes slideIn{from{transform:translateY(24px);opacity:0}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.scr{overflow:hidden}
.gwrap{position:relative;flex:1;min-height:0;overflow-y:auto;display:flex;padding:12px 16px}
.ggrid{width:100%;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.gtile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:170px;padding:16px;border-radius:26px;background:var(--c);color:var(--t);box-shadow:inset 0 -9px 0 var(--d),0 10px 0 -2px #0003;text-align:left;overflow:hidden;transition:transform .1s}
.gtile:active{transform:scale(.96)}
.gtile::after{content:"";position:absolute;right:-30px;bottom:-30px;width:110px;height:110px;border-radius:50%;background:#ffffff26}
.gtile .gk{font-weight:700;font-size:15px;opacity:.9}
.gtile .gn{font:800 64px/0.9 "Baloo 2",sans-serif}
.gtile .gm{font-weight:700;font-size:14px;margin-top:auto}
.gtile .gs{display:flex;align-items:center;gap:4px;font-weight:800;font-size:14px}
.gtile .gs svg{width:18px;height:18px}
.gtile .gme{position:absolute;top:12px;right:12px;padding:2px 8px;border-radius:99px;background:#fffaf2;color:#12313a;font-size:11px;font-weight:800}
.gtile.mine{outline:4px solid #fffaf2;outline-offset:3px}
.ahead .top{justify-content:space-between}
.aband{position:relative;display:flex;align-items:center;gap:14px;margin:4px 16px 12px;padding:16px;border-radius:24px;background:var(--kc);color:var(--kt);box-shadow:inset 0 -8px 0 var(--kd);overflow:hidden;animation:slideIn .45s both}
.aband::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:#ffffff26}
.abig{flex:none;width:72px;height:72px;border-radius:20px;background:#fffaf2;color:var(--kd);display:grid;place-items:center;font:800 46px "Baloo 2",sans-serif}
.ak{font-size:13px;font-weight:700;opacity:.85}
.aband h1{font-size:34px}
.asub{font-size:14px;font-weight:600;opacity:.9}
.tlist{position:relative;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:4px 16px 12px}
.tcard{position:relative;display:flex;gap:14px;align-items:center;width:100%;padding:16px;border-radius:22px;background:var(--card);color:var(--cink);box-shadow:0 7px 0 #0003;animation:slideIn .45s both}
.tcard .badge{flex:none;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:var(--kc);color:var(--kt);font:800 24px "Baloo 2",sans-serif;box-shadow:inset 0 -5px 0 var(--kd)}
.tcard.done .badge{background:var(--ok);color:#fff;box-shadow:inset 0 -5px 0 #1fa86b}
.tcard h3{font:800 20px/1.1 "Baloo 2",sans-serif;margin:0}
.tcard .row{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#4c6a70;margin-top:4px}
.meter{height:8px;border-radius:99px;background:#e3eeee;overflow:hidden;margin-top:6px}
.meter b{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--kc),var(--sun))}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.mapscroll{position:relative;flex:1;overflow-y:auto}
.map{flex:none}
.node.open .isle{background:var(--kc);color:var(--kt);box-shadow:inset 0 -7px 0 var(--kd),0 16px 0 -6px #04232b88}
.node.done .isle{background:#fffaf2;color:var(--kd);box-shadow:inset 0 -7px 0 #c9d6da,0 16px 0 -6px #04232b88}
.tf{display:grid;gap:10px;margin-top:14px}
.tfrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 10px 10px 12px;border-radius:16px;background:#fff;box-shadow:0 4px 0 #0002,inset 0 0 0 2px #d9e6e6;animation:slideIn .45s both}
.tfrow .lbl{font-size:16px;overflow-x:auto}
.tfrow.ok{box-shadow:0 4px 0 #1fa86b,inset 0 0 0 2px var(--ok)}
.tfrow.no{box-shadow:0 4px 0 #d23f4f,inset 0 0 0 2px var(--bad);animation:shake .4s}
.tfb{display:flex;gap:6px}
.tfb button{width:52px;height:44px;border-radius:12px;font-weight:800;background:#e7f2f2;color:var(--cink)}
.tfb button.on.t{background:var(--ok);color:#fff}
.tfb button.on.f{background:var(--bad);color:#fff}
.lock .tfb button{pointer-events:none}
.mi .tx{max-width:100%;overflow-x:auto}
.cert .row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed #cfe2e2;text-align:left}
.pill svg{width:20px;height:20px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:800;background:#e7f2f2;color:#12313a;white-space:nowrap;margin-bottom:4px}
.chip.giao{background:#dcfbe9;color:#0c6b3f}.chip.nhap{background:#fff3c4;color:#7a5a00}.chip.an{background:#e3e3e3;color:#555}
#tbar{position:relative;padding:8px 16px 0}
.tbar{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:16px;background:#fffaf2;color:#12313a;font-size:14px}
.tbar .tinfo{flex:1}
.tbar .terr{margin-top:6px;color:#c0303f;font-size:13px}
.tbar .tsrc{margin-top:4px;font-size:12px;color:#5f7d82}
.tbar .tbtns{display:flex;flex-direction:column;gap:8px}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px;box-shadow:0 3px 0 #c99a08;white-space:nowrap}
.btn.sm.alt{box-shadow:0 3px 0 #b9c9c9}
.foot .btn{flex:1}
.rwrap{position:relative;flex:1;overflow-y:auto;padding:8px 16px 20px}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:#0005}
.seg button{flex:1;padding:9px 6px;border-radius:11px;font-weight:700;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--sun);color:#3a2a00}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:flex-end;gap:8px;margin:18px 0 8px}
.pod{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;animation:rise .6s both}
.pod .av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font:800 22px "Baloo 2",sans-serif;color:#fff;border:4px solid #fff3}
.pod .nm{font-weight:700;font-size:14px;line-height:1.2;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pod .sc{font-size:13px;color:var(--mute)}
.pod .blk{width:100%;border-radius:14px 14px 4px 4px;display:grid;place-items:center;font:800 30px "Baloo 2",sans-serif;color:#5a3f00}
.pod:nth-child(1) .blk{height:70px;background:#c9d6da}.pod:nth-child(2) .blk{height:100px;background:var(--sun)}.pod:nth-child(3) .blk{height:54px;background:#e7a36a}
.pod:nth-child(2){animation-delay:.15s}.pod:nth-child(3){animation-delay:.3s}
.pod:nth-child(2) .av{width:66px;height:66px;border-color:var(--sun)}
.rlist{display:grid;gap:8px}
.rrow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:16px;background:#ffffff12;animation:slideIn .4s both}
.rrow .rk{font:800 20px "Baloo 2",sans-serif;text-align:center;color:var(--mute)}
.rrow .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .cl{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--mute)}
.rrow .cl svg{width:14px;height:14px}
.rrow .pt{text-align:right;font-weight:800;white-space:nowrap}
.rrow .pt small{display:block;font-weight:600;font-size:12px;color:var(--mute)}
.rrow.me{background:var(--card);color:var(--cink)}
.rrow.me .rk,.rrow.me .cl,.rrow.me .pt small{color:#4c6a70}
.mine{margin:12px 0}
.mau{display:inline-block;padding:0 6px;border-radius:6px;background:#ffffff26;font-size:11px;font-weight:700;vertical-align:1px}
.pill.sm{padding:4px 10px;font-size:13px}
.ctop{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}

/* Chiều rộng nội dung theo từng màn, nền app luôn phủ hết khung nhìn. */
@media (min-width: 600px) {
  .app {
    --content-width: 960px;
    --reading-width: 760px;
    --gutter: clamp(20px, 4vw, 44px);
  }

  .scrollv, .gwrap, .ubar, .scr > .top, #gsub {
    width: 100%;
    max-width: var(--content-width);
    margin-inline: auto;
    padding-inline: var(--gutter);
  }

  #thBody, #tlBody, #redoBody, #frBody, #profBody, #boardBody {
    max-width: var(--reading-width);
  }

  .lwrap {
    width: 100%;
    max-width: 500px;
    margin-inline: auto;
    padding: 32px var(--gutter);
  }

  .mons, #subjBody > .foot, .opts {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  #subjBody > .foot { display: grid; padding-inline: 0; }
  #sOut:only-child { grid-column: 1 / -1; justify-self: center; min-width: 160px; }
  .ggrid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .dgrid { grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); }
  .shgrid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }

  .tmap {
    width: calc(100% - 2 * var(--gutter));
    max-width: 1100px;
    margin-inline: auto;
  }
  .plank { max-width: 460px; }
  .jbtns { right: max(var(--gutter), calc((100% - 1100px) / 2 + 12px)); }
  .jpanel {
    width: calc(100% - 108px);
    max-width: 440px;
    left: auto;
    right: max(calc(var(--gutter) + 72px), calc((100% - 1100px) / 2 + 84px));
  }

  #play > .bar, #play > .meta, #play > #dock, .stage {
    width: 100%;
    max-width: var(--reading-width);
    margin-inline: auto;
  }
  #play > .timer {
    width: calc(100% - 32px);
    max-width: calc(var(--reading-width) - 32px);
    margin-inline: auto;
  }
  .stage .card { padding: 24px; }
  .opt .ot { overflow-wrap: anywhere; }
  .pad { max-width: 420px; margin-inline: auto; border-radius: 18px 18px 0 0; }
  .chk .btn { max-width: 360px; margin-inline: auto; }
  .sheet, .shbar { width: 100%; max-width: var(--reading-width); margin-inline: auto; }
  .panel { max-width: 520px; }
}

@media (min-width: 720px) {
  #login .lwrap {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
    align-items: center;
    gap: 28px;
    max-width: 860px;
  }
  .lhead { margin-bottom: 0; }
}

@media (min-width: 960px) {
  .ggrid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}

@media (min-width: 480px) and (max-height: 580px) {
  .jbtns {
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: flex-end;
    left: 10px;
    bottom: calc(18px + env(safe-area-inset-bottom));
  }
  .jbtns .jbtn { width: 48px; height: 48px; }
  .jbtns .jbtn + .jbtn { margin-top: 0; }
  .jpanel {
    bottom: calc(84px + env(safe-area-inset-bottom));
    max-height: calc(100% - 140px);
  }
}

/* Đề và bàn phím đáp số cùng hàng khi chiều cao bị giới hạn. */
@media (min-width: 600px) and (max-height: 680px) {
  #play.on:has(#dock .pad) {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(214px, 32%);
    grid-template-rows: auto auto auto minmax(0, 1fr);
    max-width: 1000px;
    margin-inline: auto;
  }
  #play:has(#dock .pad) > :is(.bar, .timer, .meta) { grid-column: 1 / -1; }
  #play:has(#dock .pad) > .bar { grid-row: 1; }
  #play:has(#dock .pad) > .timer { grid-row: 2; }
  #play:has(#dock .pad) > .meta { grid-row: 3; }
  #play:has(#dock .pad) > .stage { grid-area: 4 / 1; min-height: 0; }
  #play:has(#dock .pad) > #dock { grid-area: 4 / 2; min-height: 0; overflow-y: auto; }
  #play:has(#dock .pad) .pad { padding-top: 4px; }
}

<script>
{
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

// Câu hỏi có tham số (giống cú pháp game lớp học):
//   %@ a = ngaunhien(2, 9)        số nguyên ngẫu nhiên trong [2; 9]
//   %@ b = chon(2, 3, 5)          chọn ngẫu nhiên một giá trị
//   %@ c = a*b + 1                biểu thức từ các tham số trước
//   %@ dieukien: a != b           điều kiện phải thỏa (thử lại tối đa 300 lần)
// Trong đề viết {{a}}, {{2*a+b}}, {{+b}} (luôn có dấu), {{ps(p, q)}} (phân số tối giản).
// Không dùng tham số bên trong hình TikZ.

const FUNCS = new Set(['ngaunhien', 'chon', 'ps', 'abs', 'min', 'max', 'ucln', 'bcnn', 'sqrt', 'tron']);
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };

// ---- số hữu tỉ ----
class Frac {
  constructor(p, q) {
    if (!Number.isInteger(p) || !Number.isInteger(q) || q === 0) throw new Error('ps(p, q) cần p, q nguyên và q ≠ 0');
    const g = gcd(p, q) || 1, s = q < 0 ? -1 : 1;
    this.p = (s * p) / g; this.q = (s * q) / g;
  }
  get v() { return this.p / this.q; }
}
const isF = x => x instanceof Frac;
const toF = x => (isF(x) ? x : Number.isInteger(x) ? new Frac(x, 1) : null);
function arith(op, a, b) {
  if (isF(a) || isF(b)) {
    const A = toF(a), B = toF(b);
    if (A && B) {
      if (op === '+') return new Frac(A.p * B.q + B.p * A.q, A.q * B.q);
      if (op === '-') return new Frac(A.p * B.q - B.p * A.q, A.q * B.q);
      if (op === '*') return new Frac(A.p * B.p, A.q * B.q);
      if (op === '/') return new Frac(A.p * B.q, A.q * B.p);
    }
    a = isF(a) ? a.v : a; b = isF(b) ? b.v : b;
  }
  switch (op) {
    case '+': return a + b; case '-': return a - b; case '*': return a * b;
    case '/': if (b === 0) throw new Error('chia cho 0'); return a / b;
    case '%': return a % b; case '^': return a ** b;
  }
}
const num = x => (isF(x) ? x.v : x);

// ---- tách từ & phân tích biểu thức ----
function tokenize(s) {
  const t = []; let i = 0;
  while (i < s.length) {
    const c = s[i];
    if (/\s/.test(c)) { i++; continue; }
    const two = s.slice(i, i + 2);
    if (['==', '!=', '<=', '>=', '&&', '||'].includes(two)) { t.push(two); i += 2; continue; }
    if ('+-*/%^(),<>!'.includes(c)) { t.push(c); i++; continue; }
    const m = s.slice(i).match(/^(\d+(?:\.\d+)?|[A-Za-z_]\w*)/);
    if (!m) throw new Error(`ký tự lạ "${c}"`);
    t.push(m[1]); i += m[1].length;
  }
  return t;
}
function evaluate(src, env, rng = Math.random) {
  const t = tokenize(String(src)); let k = 0;
  const peek = () => t[k], eat = x => { if (t[k] !== x) throw new Error(`thiếu "${x}"`); k++; };
  const bin = (next, ops, f) => () => { let a = next(); while (ops.includes(peek())) { const o = t[k++]; a = f(o, a, next()); } return a; };
  const atom = () => {
    const x = t[k++];
    if (x === undefined) throw new Error('biểu thức dở dang');
    if (x === '(') { const v = or(); eat(')'); return v; }
    if (/^\d/.test(x)) return Number(x);
    if (peek() === '(') {
      if (!FUNCS.has(x)) throw new Error(`không có hàm ${x}`);
      k++; const args = [];
      if (peek() !== ')') { args.push(or()); while (peek() === ',') { k++; args.push(or()); } }
      eat(')');
      return call(x, args, rng);
    }
    if (!(x in env)) throw new Error(`chưa khai báo tham số ${x}`);
    return env[x];
  };
  const pow = () => { const a = atom(); if (peek() === '^') { k++; return arith('^', num(a), num(unary())); } return a; };
  const unary = () => {
    if (peek() === '-') { k++; const v = unary(); return isF(v) ? new Frac(-v.p, v.q) : -v; }
    if (peek() === '+') { k++; return unary(); }
    if (peek() === '!') { k++; return !unary(); }
    return pow();
  };
  const mul = bin(unary, ['*', '/', '%'], (o, a, b) => arith(o, a, b));
  const add = bin(mul, ['+', '-'], (o, a, b) => arith(o, a, b));
  const cmp = () => {
    const a = add();
    if (['==', '!=', '<', '>', '<=', '>='].includes(peek())) {
      const o = t[k++], x = num(a), y = num(add()), e = 1e-9;
      return o === '==' ? Math.abs(x - y) < e : o === '!=' ? Math.abs(x - y) >= e : o === '<' ? x < y : o === '>' ? x > y : o === '<=' ? x <= y + e : x >= y - e;
    }
    return a;
  };
  const and = bin(cmp, ['&&'], (o, a, b) => a && b);
  const or = bin(and, ['||'], (o, a, b) => a || b);
  const v = or();
  if (k < t.length) throw new Error(`thừa "${t[k]}"`);
  return v;
}
function call(f, a, rng) {
  const n = a.map(num);
  switch (f) {
    case 'ngaunhien': {
      const [lo, hi] = n;
      if (!Number.isInteger(lo) || !Number.isInteger(hi) || lo > hi) throw new Error('ngaunhien(a, b) cần a ≤ b nguyên');
      return lo + Math.floor(rng() * (hi - lo + 1));
    }
    case 'chon': if (!a.length) throw new Error('chon() cần ít nhất 1 giá trị'); return a[Math.floor(rng() * a.length)];
    case 'ps': return new Frac(n[0], n[1]);
    case 'abs': return isF(a[0]) ? new Frac(Math.abs(a[0].p), a[0].q) : Math.abs(n[0]);
    case 'min': return Math.min(...n); case 'max': return Math.max(...n);
    case 'ucln': return gcd(n[0], n[1]);
    case 'bcnn': return Math.abs(n[0] * n[1]) / (gcd(n[0], n[1]) || 1);
    case 'sqrt': return Math.sqrt(n[0]);
    case 'tron': { const d = n[1] ?? 0; return Math.round(n[0] * 10 ** d) / 10 ** d; }
  }
}

// ---- khai báo tham số ----
function parseSpec(lines) {
  const vars = [], conds = [];
  for (const raw of lines) {
    const l = raw.trim();
    if (!l) continue;
    let m = l.match(/^dieukien\s*:\s*(.+)$/i);
    if (m) { conds.push(m[1]); continue; }
    m = l.match(/^([A-Za-z_]\w*)\s*=\s*(.+)$/);
    if (!m) throw new Error(`dòng tham số không hiểu: "${l}"`);
    if (FUNCS.has(m[1])) throw new Error(`không đặt tên tham số trùng tên hàm: ${m[1]}`);
    vars.push({ name: m[1], expr: m[2] });
  }
  return { vars, conds };
}
function sampleEnv(spec, rng = Math.random) {
  for (let tries = 0; tries < 300; tries++) {
    const env = {};
    for (const v of spec.vars) env[v.name] = evaluate(v.expr, env, rng);
    if (spec.conds.every(c => evaluate(c, env, rng))) return env;
  }
  throw new Error('không tìm được bộ tham số thỏa điều kiện sau 300 lần thử');
}

// ---- in giá trị ----
function fmt(v, mode) {
  if (typeof v === 'boolean') return v ? 'đúng' : 'sai';
  if (isF(v)) {
    if (v.q === 1) return String(v.p);
    if (mode === 'ans') return `${v.p}/${v.q}`;
    return (v.p < 0 ? '-' : '') + `\\dfrac{${Math.abs(v.p)}}{${v.q}}`;
  }
  let s = Number.isInteger(v) ? String(v) : String(Math.round(v * 1e6) / 1e6);
  if (s.includes('.')) s = mode === 'ans' ? s.replace('.', ',') : s.replace('.', '{,}');
  return s;
}
function fill(str, env, mode = 'text') {
  if (typeof str !== 'string') return str;
  return str.replace(/\{\{(\+?)([^{}]+)\}\}/g, (_, plus, e) => {
    const v = evaluate(e, env);
    const s = fmt(v, mode);
    return plus && num(v) >= 0 ? '+' + s : s;
  });
}
function fillQ(q, env) {
  const f = s => fill(s, env);
  return {
    ...q, stem: f(q.stem), sol: f(q.sol),
    ...(q.hints && { hints: q.hints.map(f) }),
    ...(q.opts && { opts: q.opts.map(o => ({ ...o, t: f(o.t), ...(o.why && { why: f(o.why) }) })) }),
    ...(q.items && { items: q.items.map(o => ({ ...o, t: f(o.t), ...(o.why && { why: f(o.why) }) })) }),
    ...(q.traps && { traps: q.traps.map(x => ({ a: fill(x.a, env, 'ans'), why: f(x.why) })) }),
    ...(q.pairs && { pairs: q.pairs.map(p => p.map(f)) }),
    ...(q.ans && { ans: q.ans.map(a => fill(a, env, 'ans')) }),
    ...(q.steps && { steps: q.steps.map(x => ({ ...x, t: f(x.t) })) }),
    ...(q.nodes && { nodes: q.nodes.map(x => ({ ...x, t: f(x.t), c: f(x.c) })) }),
    ...(q.bad && { bad: q.bad.map(x => ({ ...x, t: f(x.t), ...(x.why && { why: f(x.why) }) })) }),
    ...(q.badc && { badc: q.badc.map(x => ({ ...x, t: f(x.t), ...(x.why && { why: f(x.why) }) })) }),
  };
}
// Sinh một bản cụ thể của câu hỏi (câu không có tham số giữ nguyên)
function instantiate(q, rng = Math.random) {
  if (!q.params) return q;
  const env = sampleEnv(parseSpec(q.params), rng);
  const { params, ...rest } = fillQ(q, env);
  return rest;
}

// Đọc ngân hàng câu hỏi LaTeX của game.
// Cú pháp:
//   \chude{Tên chủ đề}
//   \man{1}{Nhận biết}
//   \begin{ex}    đề \choice{..}{\True ..}{..}{..}        \loigiai{..} \end{ex}     trắc nghiệm
//   \begin{extf}  đề \choiceTF{\True ..}{..}{\True ..}{..} \loigiai{..} \end{extf}   đúng/sai từng ý
//   \begin{exfb}  đề \shortans{đáp số;đáp số khác}          \loigiai{..} \end{exfb}   điền đáp số
//   \begin{exmatch} đề \pair{trái}{phải} \pair{..}{..}       \loigiai{..} \end{exmatch} nối ý
//   \begin{extl}  đề \goiy{gợi ý 1} \goiy{gợi ý 2}          \end{extl}     tự luận (chỉ dùng trong đề ôn tập,
//                 học sinh làm vào vở; app chỉ hiện đề và gợi ý, mỗi gợi ý mở lần đầu trừ XP)
// Báo lỗi theo đáp án sai (hiện ngay khi học sinh chọn sai):
//   ex:   \sai{vì sao sai} đặt trong phương án sai, ví dụ \choice{$5$ \sai{Quên đổi dấu}}{\True $-5$}..
//   extf: \sai{giải thích} đặt trong ý, hiện khi học sinh đánh giá sai ý đó
//   exfb: \saithuong{đáp số sai hay gặp}{vì sao sai}, viết nhiều lần được
// Sắp xếp lời giải:
//   \begin{exsx} đề \buoc{bước 1} \buoc{bước 2} … \nhieu{khối sai}{vì sao sai} \loigiai{..} \end{exsx}
//   các bước liền nhau cùng nhãn \buoc[1]{..} được đổi chỗ cho nhau
// Sơ đồ phân tích đi lên:
//   \begin{exsd} đề \nut{số}[ô cha]{mệnh đề}{căn cứ} … (ô kết luận không có [ô cha])
//     \an{2,3} ẩn mệnh đề, \anly{3} ẩn căn cứ, \nhieu{mệnh đề sai}{vì sao}, \nhieuly{căn cứ sai}{vì sao} \end{exsd}


const QTYPES = 'ex|extf|exfb|exmatch|extl|exsx|exsd';
const ENV = new RegExp('\\\\begin\\{(' + QTYPES + ')\\}([\\s\\S]*?)\\\\end\\{\\1\\}', 'g');

function group(s, i) {
  while (i < s.length && /\s/.test(s[i])) i++;
  if (s[i] !== '{') return null;
  let d = 0, j = i;
  for (; j < s.length; j++) {
    if (s[j] === '\\') { j++; continue; }
    if (s[j] === '{') d++;
    else if (s[j] === '}') { d--; if (!d) break; }
  }
  if (d) return null;
  return [s.slice(i + 1, j), j + 1];
}

function takeCmd(body, cmd) {
  const k = body.indexOf('\\' + cmd);
  if (k < 0) return [body, null];
  const g = group(body, k + cmd.length + 1);
  if (!g) return [body, null];
  return [body.slice(0, k) + body.slice(g[1]), g[0].trim()];
}

function readGroups(b, i) {
  const out = []; let g;
  while ((g = group(b, i))) { out.push(g[0]); i = g[1]; }
  return out;
}

function takeAll(body, cmd) {
  const out = []; let r;
  for (;;) { [body, r] = takeCmd(body, cmd); if (r === null) break; out.push(r); }
  return [body, out];
}
// Mã nhận diện câu hỏi (ổn định khi soạn lại không đổi nội dung câu)
function qkeyOf(q) {
  // Lời báo lỗi (\sai, \saithuong) không tính vào mã: thêm/sửa lời báo lỗi không làm mất lịch ôn của câu
  const strip = a => a && a.map(({ why, ...o }) => o);
  const base = [q.type, q.stem, strip(q.opts), strip(q.items), q.ans, q.pairs, q.params];
  // Dạng mới (sắp xếp, sơ đồ): thêm trường riêng; dạng cũ giữ nguyên chuỗi băm để không đổi mã câu
  if (q.steps || q.nodes) base.push(q.steps, strip(q.bad), q.nodes, q.hid, q.hidc, strip(q.badc));
  const str = JSON.stringify(base);
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0');
}

// Lấy mọi lệnh \ten[tùy chọn]{..}{..} (đúng tên, không nhầm \an với \angle hay \anly).
// Trả về [phần còn lại, [{o, a:[..]}]]. Thiếu đối số bắt buộc thì ghi vào bad.
function takeArgs(body, name, n, min, withOpt, bad) {
  const out = [], re = new RegExp('\\\\' + name + '(?![a-zA-Z])');
  for (let m; (m = re.exec(body));) {
    let i = m.index + m[0].length, o = null;
    if (withOpt) { let k = i; while (/\s/.test(body[k] || '')) k++; if (body[k] === '[') { const e = body.indexOf(']', k); if (e > 0) { o = body.slice(k + 1, e).trim(); i = e + 1; } } }
    const a = [];
    for (let x = 0; x < n; x++) { const g = group(body, i); if (!g) break; a.push(g[0].trim()); i = g[1]; }
    if (a.length < min) bad.push('\\' + name + ' thiếu phần trong ngoặc {…}');
    else out.push({ o, a });
    body = body.slice(0, m.index) + body.slice(a.length < min ? m.index + m[0].length : i);
  }
  return [body, out];
}
const ids = xs => xs.flatMap(x => x.a[0].split(',').map(v => v.trim()).filter(Boolean));
const trap = x => (x.a[1] ? { t: x.a[0], why: x.a[1] } : { t: x.a[0] });

// \nut{số}[ô cha]{mệnh đề}{căn cứ}: phần [ô cha] nằm giữa {số} và {mệnh đề}
function takeNut(body, bad) {
  const out = [], re = /\\nut(?![a-zA-Z])/;
  for (let m; (m = re.exec(body));) {
    const g1 = group(body, m.index + 4);

// Lịch ôn ngắt quãng + sổ câu sai + chuỗi ngày học. Ngày tính theo giờ Việt Nam.
const INTERVALS = [1, 1, 3, 7, 14, 30]; // theo hộp 0..5 (ngày)
const VN = 7 * 3600e3;
const vnDay = (t = Date.now()) => new Date(t + VN).toISOString().slice(0, 10);
const addDays = (day, n) => new Date(Date.parse(day + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10);
const dayDiff = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5);

// Cập nhật một dòng ltt_reviews sau một lần trả lời. row = dòng cũ hoặc null.
function nextReview(row, ok, today = vnDay()) {
  if (!ok) {
    return { box: 0, due: addDays(today, 1), in_notebook: true, nb_hits: 0, last_ok: row?.last_ok ?? null, wrong_count: (row?.wrong_count || 0) + 1 };
  }
  if (!row) return { box: 1, due: addDays(today, INTERVALS[1]), in_notebook: false, nb_hits: 0, last_ok: today, wrong_count: 0 };
  if (row.last_ok === today) return null; // đúng nhiều lần trong cùng một ngày chỉ tính một lần
  const box = Math.min((row.box || 0) + 1, 5);
  const nb_hits = row.in_notebook ? (row.nb_hits || 0) + 1 : 0;
  return {
    box, due: addDays(today, INTERVALS[box]), last_ok: today, wrong_count: row.wrong_count || 0,
    nb_hits, in_notebook: row.in_notebook && nb_hits < 2, // đúng ở 2 ngày khác nhau thì ra khỏi sổ
  };
}

// Chuỗi ngày học: mỗi ngày đạt mục tiêu (qua 1 màn hoặc làm xong 1 lượt ôn) thì +1.
// Lỡ đúng 1 ngày mà còn lá chắn thì tự dùng lá chắn để giữ chuỗi. Cứ 7 ngày liên tiếp được thêm 1 lá chắn (tối đa 2).
function nextStreak(p, today = vnDay()) {
  const last = p.last_day ? String(p.last_day).slice(0, 10) : null;
  if (last === today) return null;
  let streak = p.streak || 0, shields = p.shields ?? 1, shieldUsed = false;
  const gap = last ? dayDiff(last, today) : null;
  if (gap === 1) streak += 1;
  else if (gap === 2 && shields > 0) { shields -= 1; streak += 1; shieldUsed = true; }
  else streak = 1;
  if (streak % 7 === 0) shields = Math.min(2, shields + 1);
  return { streak, best_streak: Math.max(p.best_streak || 0, streak), last_day: today, shields, shieldUsed };
}
// Chuỗi đang hiển thị (đã đứt nếu quá 1 ngày mà không có lá chắn)
function liveStreak(p, today = vnDay()) {
  if (!p.last_day) return 0;
  const gap = dayDiff(String(p.last_day).slice(0, 10), today);
  return gap <= 1 || (gap === 2 && (p.shields || 0) > 0) ? p.streak || 0 : 0;
}

const TOP = TIER_LP.length - 1;

function applyMatch({ tier, lp, shield = 0 }, d) {
  let t = tier, x = Math.max(0, (lp || 0) + d);

// Sang mùa mới: tụt SEASON_DROP bậc, thanh tiến trình về đầu bậc
const seasonStart = tier => { const t = Math.max(0, (tier || 0) - SEASON_DROP); return { tier: t, lp: TIER_LP[t] }; };

// Bài kiểm tra thăng hạng
const PROMO_N = 12;            // số câu
const PROMO_PER_DAY = 2;       // mỗi ngày thi tối đa 2 lần
const PROMO_FAIL = 20;         // trượt: thanh tiến trình lùi 20 điểm
const promoPass = to => 0.55 + 0.05 * to;          // lên Bạc 60%, mỗi bậc +5%, lên Thách Đấu 90%
const promoNeed3 = to => (to >= 3 ? 2 : 0);         // từ Bạch Kim: đúng ít nhất 2 câu mức 3 trở lên
// Chấm bài kiểm tra: score là điểm bài (đã trừ câu sai), max là tổng điểm các câu; ok3/n3: số câu mức ≥ 3 đúng / có trong đề.
function promoResult({ score, max, ok3, n3, to }) {
  const pc = max > 0 ? Math.max(0, score) / max : 0, need3 = Math.min(promoNeed3(to), n3);
  return { pc: Math.round(pc * 100), pass: pc >= promoPass(to) - 1e-9 && ok3 >= need3, need3 };
}

// Thách Đấu: điểm phong độ = trung bình tỉ lệ điểm trận của PD_N trận gần nhất × 1000 (đánh nhiều không tăng điểm)
const PD_N = 10, PD_MIN = 3;
const pdOf = h => { const a = (Array.isArray(h) ? h : []).slice(-PD_N).map(Number).filter(Number.isFinite); return a.length ? Math.round(1000 * a.reduce((s, x) => s + Math.max(0, Math.min(1, x)), 0) / a.length) : 0; };

function seasonOf(day = vnDay()) {
  const k = Math.max(0, Math.floor(dayDiff(SEASON0, day) / SEASON_DAYS));
  const start = addDays(SEASON0, k * SEASON_DAYS), end = addDays(start, SEASON_DAYS - 1);
  const f = d => d.slice(8, 10) + '/' + d.slice(5, 7);
  return { n: k + 1, start, end, name: `Mùa ${k + 1} (${f(start)}–${f(end)})`, left: dayDiff(day, end) + 1 };
}
const seasonName = (day = vnDay()) => seasonOf(day).name;

// Mức chuẩn của bậc (tỉ lệ điểm trận so với điểm tối đa): Đồng 40%, mỗi bậc +6%, Thách Đấu 82%.
// Điểm tối đa = điểm các câu × (1 + RANK_SPEED); thưởng thời gian nhỏ nên mức chuẩn chủ yếu đo số câu đúng.
// Câu sai bị trừ điểm (RANK_WRONG) nên mức chuẩn để như cũ: học sinh đúng 60% vẫn lên được ở Đồng, chọn bừa thì tụt.
const rankTarget = tier => 0.4 + 0.06 * tier;
// Điểm bị trừ khi trả lời sai một câu được pts điểm
const wrongPenalty = pts => Math.round(pts * RANK_WRONG);
// Thưởng thời gian cuối trận: điểm câu đúng × RANK_SPEED × tỉ lệ thời gian còn dư
const speedBonus = (score, leftFrac) => Math.round(score * RANK_SPEED * Math.max(0, Math.min(1, leftFrac)));
// Thưởng chính xác theo số câu đúng trong trận
const accBonus = (correct, n) => { const a = n ? correct / n : 0; return a >= 1 ? 6 : a >= 0.9 ? 4 : a >= 0.8 ? 2 : 0; };

// Điểm thi đấu cộng/trừ sau một trận. score: điểm trận; max: điểm trận tối đa (đúng hết, thật nhanh).
function rankDelta({ score, max, correct, n, tier }) {
  const r = max > 0 ? score / max : 0;
  const base = Math.max(-RANK_DOWN, Math.min(RANK_UP - 6, Math.round((r - rankTarget(tier)) * 100)));
  const bonus = accBonus(correct, n);
  return { d: Math.min(RANK_UP, base + bonus), base, bonus };
}

/* danh sách phẳng: {hk} | {ch:{n,title,phan}} | {id,num,title,lt,ch} */
const currOf=k=>{const out=[];let num=0,cn=0;for(const c of CURR[k]||[]){if(c==='HK1'){out.push({hk:1});continue}
  cn++;const ch={n:cn,title:c[0],phan:c[1]};out.push({ch});let lt=0;
  for(const b of c[2]){if(b==='LT'){lt++;out.push({id:`k${k}-c${cn}-lt${lt}`,num:0,title:'Luyện tập chung',lt:true,coin:'LT',ch})}else if(b==='CC'){out.push({id:`k${k}-c${cn}-cc`,num:0,title:'Bài tập cuối chương',lt:true,coin:'ÔT',ch})}else{num++;out.push({id:`k${k}-b${num}`,num,title:b,ch})}}}return out};
const lessonName=L=>L.lt?`${L.title} · Chương ${L.ch.n}`:`Bài ${L.num}. ${L.title}`;
function mapItems(k){const all=gradeTopics(k).filter(t=>!isDe(t)&&!isTL(t)&&!isKho(t)),used=new Set(),items=[];
  for(const c of currOf(k)){if(!c.id){items.push(c);continue}
    const ts=all.filter(t=>!used.has(t)&&((t.chuong||ALIAS[t.id])===c.id));ts.forEach(t=>used.add(t));
    if(ts.length)ts.forEach((t,i)=>items.push({L:c,t,sub:ts.length>1?i+1:0}));else items.push({L:c,t:null})}
  const rest=all.filter(t=>!used.has(t));if(rest.length){items.push({ch:{n:0,title:'Chủ đề bổ sung',phan:'dai-so'}});rest.forEach(t=>items.push({L:{id:'',num:0,title:t.title,ch:null},t}))}
  return items}

/* ---------- Dán bài mới (giáo viên): tạo chủ đề nháp cho bài chưa có câu hỏi ---------- */
// Nhận LaTeX do Gemini/Claude soạn; bỏ dấu ``` và các dòng %%% của file ngân hàng; thiếu \chude thì lấy tên bài SGK.
const cleanPaste=v=>String(v||'').replace(/\r/g,'').split('\n').filter(l=>!/^\s*```/.test(l)&&!/^\s*%%%/.test(l)).join('\n').trim();
function pasteNew(L){const k=curK,name=L.lt?lessonName(L):L.title;
  overlay(`<h2 style="font-size:24px">Dán bài mới</h2><p class="tnote">${esc(lessonName(L))} · Khối ${k}<br>Dán toàn bộ LaTeX của bài (lý thuyết và câu hỏi). Bài mới ở trạng thái <b>Nháp</b>; hình TikZ tự hiện sau khoảng 15 phút.</p>
    <textarea class="code" id="pn" spellcheck="false" placeholder="\\chude{${esc(name)}}"></textarea><div id="pnErr"></div>
    <button class="btn" id="pnS">Kiểm tra và tạo bài nháp</button><button class="btn alt" id="pnC">Hủy</button>`);
  $('#pnC').onclick=closeOvl;
  $('#pnS').onclick=async()=>{let text=cleanPaste($('#pn').value);const er=m=>{$('#pnErr').innerHTML=`<div class="err">${m}</div>`};
    if(!text)return er('Thầy dán nội dung bài vào ô trên.');
    if(!/\\chude\s*\{/.test(text))text=`\\chude{${name.replace(/[{}\\]/g,'')}}\n\n`+text;
    const P=parseTopic(text);if(P.errors.length)return er(P.errors.map(esc).join('<br>'));
    const nq=P.levels.reduce((s,l)=>s+l.qs.length,0);if(!nq&&!P.theory)return er('Chưa thấy câu hỏi hay lý thuyết nào trong nội dung đã dán.');
    if(TOPICS.some(t=>t.khoi===k&&t.chuong===L.id))return er('Bài này vừa có chủ đề (có thể do máy khác tạo). Thầy đóng hộp này để tải lại bản đồ.');
    const nf=(text.match(/\\begin\{tikzpicture\}/g)||[]).length,idx=currOf(k).filter(c=>c.id).findIndex(c=>c.id===L.id);
    $('#pnS').disabled=true;
    try{await DB.collection('topics').doc().set({title:P.title||name,khoi:k,phan:L.ch.phan,chuong:L.id,text,thutu:(idx+1)*10,nguon:'Dán bài mới (giáo viên)'});
      closeOvl();sfx.ok();toast(`Đã tạo bài nháp: ${nq} câu${P.theory?' + lý thuyết':''}${nf?` · ${nf} hình đang chờ dịch`:''}.`);journey()}
    catch(e){$('#pnS').disabled=false;er(esc(e&&e.message||'Lỗi kết nối'))}}}

function builtInLesson(t){

  return null;
}
function hasTheory(t){return Boolean(t?.theory?.length||builtInLesson(t))}
function theoryTopics(k){return mapItems(k).map(item=>item.t).filter(hasTheory)}

const placeNames=['đơn vị','chục','trăm','nghìn','chục nghìn','trăm nghìn','triệu','chục triệu','trăm triệu','tỷ','chục tỷ','trăm tỷ'];
const romanGroups=[['X',10],['IX',9],['V',5],['IV',4],['I',1]];
const groupedNumber=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'\u202f');

function authoredTheoryHTML(item){
  if(item.k==='thungay'){
    const answer=[item.correct,item.wrong],feedback=[item.explainCorrect,item.explainWrong];
    return `<div class="lesson-check authored-check"><h3>Thử ngay</h3><p>${tex(item.body)}</p><div class="lesson-choices" role="group" aria-label="Chọn đáp án">${shuffle([0,1]).map(i=>`<button type="button" data-response="${i}" aria-pressed="false">${tex(answer[i])}</button>`).join('')}</div><div class="lesson-feedback" aria-live="polite"></div>${feedback.map((text,i)=>`<template data-explanation="${i}">${tex(text)}</template>`).join('')}</div>`;
  }
  if(item.template==='gia-tri-theo-hang'){
    const digits=[...item.value];
    return `<section class="theory-lab" data-place="${item.value}"><h3>Giá trị theo hàng</h3><p>Chạm vào một chữ số trong <strong>${groupedNumber(item.value)}</strong>.</p><div class="place-cards lesson-choices" role="group" aria-label="Các chữ số">${digits.map((digit,i)=>`<button type="button" data-place-index="${i}" aria-pressed="false"><b>${digit}</b><small>${placeNames[digits.length-i-1]}</small></button>`).join('')}</div><div class="lab-feedback" aria-live="polite"></div></section>`;
  }
  if(item.template==='ghep-so-la-ma')return `<section class="theory-lab" data-roman="${item.value}"><h3>Ghép số La Mã</h3><p>Ghép các mảnh từ trái sang phải để viết số <strong>${item.value}</strong>.</p><div class="roman-built" aria-live="polite">Chưa có mảnh nào</div><div class="lesson-choices roman-options" role="group" aria-label="Các mảnh số La Mã">${[...romanGroups].reverse().map(([symbol,value])=>`<button type="button" data-roman-piece="${symbol}"><b>${symbol}</b><small>${value}</small></button>`).join('')}</div><div class="lab-feedback" aria-live="polite"></div><button type="button" data-roman-reset>Ghép lại</button></section>`;
  return '';
}

function bindAuthoredTheory(root){
  for(const card of root.querySelectorAll('.authored-check')){
    const buttons=card.querySelectorAll('[data-response]'),feedback=card.querySelector('.lesson-feedback');
    buttons.forEach(button=>button.onclick=()=>{
      buttons.forEach(option=>option.setAttribute('aria-pressed',String(option===button)));
      const i=button.dataset.response;
      feedback.dataset.correct=String(i==='0');
      feedback.replaceChildren(card.querySelector(`[data-explanation="${i}"]`).content.cloneNode(true));
      typeset(feedback);
    });
  }
  for(const card of root.querySelectorAll('[data-place]')){
    const number=card.dataset.place,buttons=card.querySelectorAll('[data-place-index]'),feedback=card.querySelector('.lab-feedback');
    buttons.forEach(button=>button.onclick=()=>{
      buttons.forEach(option=>option.setAttribute('aria-pressed',String(option===button)));
      const index=Number(button.dataset.placeIndex),digit=Number(number[index]),position=number.length-index-1;
      const unit=10**position,name=placeNames[position],value=groupedNumber(digit*unit),quantity=groupedNumber(number.slice(0,index+1));
      feedback.innerHTML=`<dl><div><dt>Chữ số hàng ${name}</dt><dd>${digit}</dd></div><div><dt>Giá trị của chữ số</dt><dd>${digit} × ${groupedNumber(unit)} = ${value}</dd></div><div><dt>Số ${name} trong ${groupedNumber(number)}</dt><dd>${quantity}</dd></div></dl>`;
    });
  }
  for(const card of root.querySelectorAll('[data-roman]')){
    const total=Number(card.dataset.roman),steps=[];
    let remaining=total;
    for(const [symbol,value] of romanGroups)while(remaining>=value){steps.push({symbol,value});remaining-=value}
    const output=card.querySelector('.roman-built'),feedback=card.querySelector('.lab-feedback'),buttons=card.querySelectorAll('[data-roman-piece]');
    let count=0;
    buttons.forEach(button=>button.onclick=()=>{
      if(count===steps.length)return;
      const step=steps[count];
      if(button.dataset.romanPiece!==step.symbol){
        feedback.textContent=`Thử lại nhé. Theo cách viết chuẩn, mảnh tiếp theo biểu diễn ${step.value}.`;
        return;
      }
      const chosen=steps.slice(0,++count),sum=chosen.reduce((n,part)=>n+part.value,0);
      output.textContent=chosen.map(part=>part.symbol).join('');
      feedback.textContent=count===steps.length?`${chosen.map(part=>part.value).join(' + ')} = ${total}. Vậy ${total} viết là ${output.textContent}.`:`Đã ghép được ${sum}. Còn ${total-sum}.`;
      if(count===steps.length)buttons.forEach(piece=>{piece.disabled=true});
    });
    card.querySelector('[data-roman-reset]').onclick=()=>{
      count=0;output.textContent='Chưa có mảnh nào';feedback.textContent='';buttons.forEach(piece=>{piece.disabled=false});
    };
  }
}

function authoredLessonPages(items){
  if(!items?.some(it=>['loidan','minhhoa','thungay'].includes(it.k)))return [];
  const groups=[];
  let group={guide:null,items:[]};
  for(const item of items){
    if(item.k==='loidan'){
      if(group.guide||group.items.length)groups.push(group);
      group={guide:item.body,items:[]};
    }else group.items.push(item);
  }
  groups.push(group);
  return groups.map(({guide,items},i)=>{
    const visuals=items.filter(it=>it.k==='minhhoa');
    const checks=items.filter(it=>it.k==='thungay');
    const notes=items.filter(it=>it.k!=='minhhoa'&&it.k!=='thungay');
    const label=notes.find(it=>it.title)?.title||`Ý ${i+1}`;
    return {label,title:label,guide:guide?tex(guide):'',visual:visuals.map(authoredTheoryHTML).join(''),
      notes:theoryHTML(notes),checks:checks.map(authoredTheoryHTML).join('')};
  });
}

function renderLessonMaterial(root,t){
  const builtIn=builtInLesson(t),pages=builtIn?builtIn.map(builtInPageHTML):authoredLessonPages(t.theory);
  const summary=(!pages.length||builtIn)?theoryHTML(t.theory):'';
  if(!pages.length){
    root.innerHTML=summary||'<div class="tbox"><p>Bài này chưa có tóm tắt lý thuyết.</p></div>';
    typeset(root);
    return;
  }
  const navigation=pages.length>1?`<nav class="lesson-nav" aria-label="Nội dung bài học">${pages.map((p,i)=>`<button type="button" data-lesson-page="${i}" ${i===0?'aria-current="step"':''}>${esc(p.label)}</button>`).join('')}</nav>`:'';
  root.innerHTML=navigation+pages.map((p,i)=>`<section class="lesson-page" aria-label="${esc(p.label)}" ${i===0?'':'hidden'}>
    ${p.guide?`<div class="lesson-guide"><div aria-hidden="true">${owlSVG}</div><div><b>Cherry</b><h2>${esc(p.title)}</h2><div>${p.guide}</div></div></div>`:''}
    ${p.visual||p.notes?`<div class="lesson-explore${p.visual&&p.notes?' lesson-explore--split':''}">
      ${p.visual?`<div class="lesson-visual${builtIn?'':' lesson-visual--authored'}">${p.visual}</div>`:''}
      ${p.notes?`<div class="lesson-notes">${p.notes}</div>`:''}
    </div>`:''}
    ${p.checks}
  </section>`).join('')+ (summary?`<details class="lesson-summary"><summary>Xem tóm tắt đầy đủ</summary>${summary}</details>`:'');

  const tabs=[...root.querySelectorAll('[data-lesson-page]')];
  const sections=[...root.querySelectorAll('.lesson-page')];
  tabs.forEach((tab,i)=>tab.onclick=()=>{
    tabs.forEach((item,n)=>{if(n===i)item.setAttribute('aria-current','step');else item.removeAttribute('aria-current')});
    sections.forEach((section,n)=>{section.hidden=n!==i});
    typeset(sections[i]);
  });
  if(builtIn)sections.forEach((section,i)=>{
    const page=builtIn[i];
    const bindChoices=(selector,handle)=>{
      const buttons=section.querySelectorAll(selector);
      buttons.forEach((button,n)=>button.onclick=()=>{
        buttons.forEach(item=>item.setAttribute('aria-pressed',String(button===item)));
        handle(n);
      });
    };
    bindChoices('[data-visual]',n=>{
      section.querySelector('.lesson-caption').textContent=page.captions[n];
      if(page.illustrations)section.querySelector('[data-illustration]').textContent=page.illustrations[n];
    });
    bindChoices('[data-lesson-answer]',n=>{
      const correct=n===page.correct,feedback=section.querySelector('.lesson-feedback');
      feedback.dataset.correct=String(correct);
      feedback.textContent=page.feedback[n];
    });
  });
  bindAuthoredTheory(root);
  typeset(root);
}

function openTheoryReview(t,returnLabel='Tiếp tục làm bài'){
  if(!hasTheory(t))return;
  const dialog=$('#theoryReview'),content=$('#reviewContent'),close=$('#reviewClose');
  const lesson=lessonOf(t);
  $('#theoryReviewTitle').textContent=lesson?lessonName(lesson):t.title;
  close.textContent=returnLabel;
  close.onclick=()=>dialog.close();
  dialog.showModal();
  renderLessonMaterial(content,t);
  dialog.scrollTop=0;
}

const TH_TPL='\\begin{lythuyet}\n\\dinhnghia{Tên khái niệm}{Nội dung, công thức viết trong $...$}\n\\quytac{Tên quy tắc}{Nội dung}\n\\luuy{Lỗi hay gặp}\n\\vidu{Đề ví dụ}{Lời giải}\n\\end{lythuyet}';

/* Thi đấu: không lặp câu với cùng một người chơi.
   P.rseen[key] = "số trận|mã đề đã ra" — ưu tiên câu chưa gặp; câu có tham số gặp lại thì bắt buộc đổi số;
   câu cố định đã gặp chỉ dùng khi kho cạn, và lấy câu gặp lâu nhất. */
const hashS=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return (h>>>0).toString(36)};
function rankRank(x){const v=(P.rseen||{})[x.q.key];if(v==null)return 0;const m=+String(v).split('|')[0]||0;return (x.q.params?1e6:2e6)+m}
function rankPick(pools,want,used=new Set()){const picks=[];
  // ok(x): được phép lấy ở lượt này; lần 1 chỉ câu chưa gặp hoặc câu có tham số (đổi số), lần 2 mới tới câu cố định đã gặp
  const take=(li,n,ok)=>{const c=shuffle(pools[li].filter(x=>!used.has(x.q.key)&&ok(x))).sort((a,b)=>rankRank(a)-rankRank(b));
    for(const x of c){if(n<=0)break;used.add(x.q.key);picks.push(x);n--}return n};
  const fresh=x=>rankRank(x)<2e6,any=()=>true,near=[0,-1,1,-2,2,-3,3],top=want.reduce((m,n,i)=>n?i:m,0);
  want.forEach((n,i)=>{let left=n;
    // chỉ mượn câu chưa gặp ở mức liền kề để trận không bị dễ/khó bất thường; kho cạn hẳn mới lặp câu gặp lâu nhất
    for(const [ok,ds] of [[fresh,[0,-1,1]],[any,near]])for(const d of ds){if(left<=0)break;const j=i+d;if(j>=0&&j<=top)left=take(j,left,ok)}}); // không mượn câu khó hơn mức cao nhất của bậc
  return picks.sort((a,b)=>a.li-b.li)}
function rankInst(x){const old=String((P.rseen||{})[x.q.key]||'').split('|')[1];let q;
  for(let k=0;k<8;k++){q=inst(x.q,{tid:x.t.id,level:x.li,title:x.t.title});if(!x.q.params||!old||hashS(q.stem)!==old)break}
  delete q.hints;q.raw=null;q.rh=hashS(q.stem);return q}
function rankSeen(qs){const r=P.rseen||(P.rseen={}),m=P.matches||0;qs.forEach(q=>{if(q.key)r[q.key]=m+'|'+q.rh});
  const ks=Object.keys(r);if(ks.length>1500)ks.sort((a,b)=>(+String(r[a]).split('|')[0])-(+String(r[b]).split('|')[0])).slice(0,ks.length-1500).forEach(k=>delete r[k])}
/* Mốc chương: chỉ rút câu của chương 1..N (bài chưa gắn chương luôn được dùng);
   có mốc thì khoảng một nửa số câu thuộc chương N, phần còn lại từ các chương trước; thiếu thì bù từ toàn kho. */
function rankPools(k){const m=mocOf(k),P4=()=>[[],[],[],[]],all=P4(),rec=P4(),old=P4();
  for(const t of TOPICS){if(t.khoi!==k||t.status!=='giao'||t.errors.length||isDe(t)||!inMoc(t))continue;const c=chapOf(t);
    t.levels.forEach((l,i)=>{const L=Math.min(3,Math.max(0,(Number(l.n)||i+1)-1));l.qs.forEach(q=>{if(q.type==='extl')return;const x={q,t,li:L};all[L].push(x);(m&&c===m?rec:old)[L].push(x)})})}
  return {m,all,rec,old}}
const cntLv=(ps,i)=>ps.filter(x=>Math.min(3,x.li)===i).length;
function rankMix(R,want){if(!R.m)return rankPick(R.all,want);
  const used=new Set(),tot=want.reduce((a,b)=>a+b,0),wr=want.map(n=>Math.floor(n/2));let more=Math.round(tot/2)-wr.reduce((a,b)=>a+b,0);
  want.forEach((n,i)=>{if(more>0&&n%2){wr[i]++;more--}});
  const pr=rankPick(R.rec,wr,used),po=rankPick(R.old,want.map((n,i)=>Math.max(0,n-cntLv(pr,i))),used).slice(0,tot-pr.length),got=[...pr,...po];

function weekId(){const t=vnDay(),d=new Date(t+'T00:00:00Z');return addDays(t,-((d.getUTCDay()+6)%7))}
function wkE(){const w=weekId();if(!P.wk||P.wk.w!==w)P.wk={w,xp:0,c:0,lv:0};return P.wk}
function addXP(n){P.xp=(P.xp||0)+n;wkE().xp+=n}
const bal=()=>Math.max(0,(P.xp||0)-(P.spent||0));
const titleOf=p=>{const id=p&&p.eq&&p.eq.title;return id&&ITEM[id]?ITEM[id].name:''};
function checkSeason(){const s=seasonName();if(!P.season){P.season=s;return}if(P.season===s)return;
  const old=tierMe();P.seasons=[...(P.seasons||[]),{s:P.season,lp:P.lp||0,t:old}].slice(-12);const S=seasonStart(old);P.tier=S.tier;P.lp=S.lp;P.shield=0;P.tdh=[];P.prw=[];P.season=s;
  setTimeout(()=>msgBox(`${s} bắt đầu!`,`Mùa trước em đạt <b>${TIERS[old].n}</b>, đã lưu vào trang cá nhân. Sang mùa mới mọi người tụt ${SEASON_DROP} bậc: em bắt đầu ở <b>${TIERS[S.tier].n}</b>. Mỗi mùa kéo dài ${SEASON_DAYS} ngày.`),800)}
/* Thi đấu: câu sai chưa làm lại đúng lần nào. Quá NB_LOCK câu thì khóa; khóa rồi làm lại đến khi còn ≤ NB_UNLOCK câu mới mở lại. */
function nbOpen(){const ix=qIndex();return Object.entries(P.rev||{}).filter(([k,r])=>ix[k]&&r.in_notebook&&!(r.nb_hits>0)).length}
function rankLock(){if(!ACC||ACC.teacher)return 0;const n=nbOpen();if(n>NB_LOCK)P.rlock=1;else if(n<=NB_UNLOCK&&P.rlock){P.rlock=0;save()}return P.rlock?n:0}

const QUESTS=[{id:'man',n:'Qua 1 bài trên bản đồ',t:1},{id:'sao3',n:'Đạt 3 sao ở một bài',t:1},{id:'dung10',n:'Trả lời đúng 10 câu',t:10},{id:'chuoi5',n:'Đúng liên tiếp 5 câu',t:5},

function dq(){const d=vnDay();if(!P.dq||P.dq.d!==d){let pool=QUESTS.map(q=>q.id);const k=ACC.khoi;
    if(counts().nb<3)pool=pool.filter(x=>x!=='sua3');if(!deTopics(k).length)pool=pool.filter(x=>x!=='de');if(!routeTopics(k).length)pool=pool.filter(x=>!['man','sao3','kogoiy'].includes(x));
    let h=7;for(const ch of d+ACC.id)h=(h*31+ch.charCodeAt(0))>>>0;const ids=[];while(ids.length<3&&pool.length){ids.push(pool.splice(h%pool.length,1)[0]);h=(Math.floor(h/7)+101)>>>0}
    P.dq={d,ids,p:{},c:{},chest:false};save()}return P.dq}
function qev(id,n=1,max=false){if(!P||!ACC||ACC.teacher)return;const q=dq();if(!q.ids.includes(id))return;const Q=QUESTS.find(x=>x.id===id),old=q.p[id]||0;
  q.p[id]=Math.min(Q.t,max?Math.max(old,n):old+n);if(old<Q.t&&q.p[id]>=Q.t)setTimeout(()=>toast(`${chestSVG(false,30)}<span><b>Xong nhiệm vụ!</b><br>${Q.n}. Về khu vực để nhận thưởng.</span>`),1300)}

/* Bài kiểm tra thăng hạng 14 ngày gần nhất + em đang chờ thi (đầy thanh) */
function promoBox(st){const lim=Date.now()-14*864e5,dt=a=>new Date(a).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  const rows=[];for(const v of st)for(const h of (v.prh||[]))if(Date.parse(h.at)>lim)rows.push({v,h});rows.sort((a,b)=>b.h.at.localeCompare(a.h.at));
  const wait=st.filter(v=>barFull(tierP(v),v.lp));
  return `<h2 class="sect">Bài kiểm tra thăng hạng (14 ngày)</h2><div class="tbox">${wait.length?`<p class="tnote">Đầy thanh, đang chờ thi: ${wait.map(v=>`${esc(v.name)} (lên ${TIERS[tierP(v)+1].n})`).join(', ')}.</p>`:''}${rows.length?rows.slice(0,15).map(({v,h})=>`<div class="row2"><span>${esc(v.name)}<br><small>${dt(h.at)} · ${TIERS[h.from].n} → ${TIERS[h.to].n} · ${h.c}/${h.n} câu${h.n3?` · mức 3 đúng ${h.ok3}/${h.n3}`:''}</small></span><b class="${h.ok?'y':'n'}">${h.pc}% ${h.ok?'Đạt':'Trượt'}</b></div>`).join(''):'<p class="tnote">Chưa có em nào làm bài kiểm tra thăng hạng.</p>'}</div>`}
function teacherExtra(kh,st,ix){const today=vnDay(),real=st.filter(v=>!v.mau);
  const idle=real.map(v=>{const d=v.st&&v.st.last_day;return {v,d:d?dayDiff(d,today):999}}).filter(x=>x.d>=3).sort((a,b)=>b.d-a.d);
  const stuck=[];for(const v of real)for(const [k,n] of Object.entries(v.fails||{})){if(n<3)continue;const b=v.best&&v.best[k];if(b&&b.st>0)continue;const [tid,lv]=k.split('|'),t=TOPICS.find(x=>x.id===tid);if(t)stuck.push({v,t,lv:+lv,n})}
  const tm={};for(const v of real)for(const [k,x] of Object.entries(v.lvt||{})){const g=tm[k]||(tm[k]={n:0,s:0});g.n+=x.n;g.s+=x.s}
  const tms=Object.entries(tm).map(([k,g])=>{const [tid,lv]=k.split('|'),t=TOPICS.find(x=>x.id===tid);return t&&t.khoi===kh?{t,lv:+lv,avg:g.s/g.n,n:g.n}:null}).filter(Boolean).sort((a,b)=>b.avg-a.avg);
  const mm=s=>`${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`;
  return promoBox(st)+`<h2 class="sect">Cần chú ý</h2><div class="tbox">${idle.length||stuck.length?
     idle.map(x=>`<div class="row2"><span>${esc(x.v.name)}</span><b class="n">${x.d>=999?'Chưa học lần nào':`Nghỉ ${x.d} ngày`}</b></div>`).join('')+
     stuck.map(x=>`<div class="row2"><span>${esc(x.v.name)}<br><small>${esc(x.t.title)}</small></span><b class="n">Hết tim ${x.n} lần</b></div>`).join('')
    :'<p class="tnote">Chưa có em nào nghỉ từ 3 ngày hoặc kẹt màn.</p>'}</div>
   <h2 class="sect">Thời gian trung bình mỗi bài</h2><div class="tbox">${tms.length?tms.slice(0,12).map(x=>`<div class="row2"><span>${esc(x.t.title)}<br><small>${x.n} lượt</small></span><b class="${x.avg>600?'n':''}">${mm(x.avg)}</b></div>`).join('')+'<p class="tnote">Đỏ: quá 10 phút, nên bớt câu hoặc chia nhỏ bài.</p>':'<p class="tnote">Chưa có dữ liệu.</p>'}</div>`}
/* ---------- điểm ôn tập cho giáo viên ---------- */
// Đề của khối có học sinh làm hoặc đã duyệt; nhãn TN1, TN2… / TL1, TL2… như màn Ôn tập của học sinh.
function deList(kh,st){const all=deTopics(kh),used=t=>t.status==='giao'||st.some(v=>v.best&&v.best[key(t,0)]);
  const tn=all.filter(t=>!isTL(t)),tl=all.filter(isTL);
  return [...tn.map((t,i)=>({t,lab:'TN'+(i+1)})),...tl.map((t,i)=>({t,lab:'TL'+(i+1)}))].filter(x=>used(x.t))}
// Một ô điểm của học sinh v ở đề t: điểm cao nhất, lần đầu, số lần làm (đề trắc nghiệm); đã làm/chưa (đề tự luận, học sinh tự báo)
function deCell(v,t){const k=key(t,0),b=v.best&&v.best[k],h=(v.deh&&v.deh[k])||[];
  if(!b)return {c:'part',txt:'—'};
  if(isTL(t))return {c:'ok',txt:'✓'};
  const best=b.s||0,first=h.length?h[0].pc:null,n=h.length;
  return {c:best>=80?'ok':best>=50?'late':'miss',txt:best+'%',sub:n>1?`đầu ${first}% · ${n} lần`:n===1?'1 lần':''}}
function deScores(kh,st){const D=deList(kh,st);
  if(!D.length)return `<h2 class="sect">Điểm ôn tập</h2><div class="tbox"><p class="tnote">Khối ${kh} chưa có đề ôn tập nào được duyệt.</p></div>`;
  const avg=x=>{const ps=st.map(v=>v.best&&v.best[key(x.t,0)]).filter(Boolean);return isTL(x.t)?`${ps.length}/${st.length} em`:ps.length?Math.round(ps.reduce((a,b)=>a+(b.s||0),0)/ps.length)+'% TB':'chưa ai làm'};

/* ---------- dạng mới: Sắp xếp lời giải (exsx) và Sơ đồ phân tích đi lên (exsd) ----------
   Chạm ô trống (dòng lời giải / ô sơ đồ) rồi chạm khối ở kho bên dưới để điền; chạm lại ô đang sáng để gỡ khối.
   Bản đồ: phải đúng hết mới tính đúng. Thi đấu: được điểm theo tỉ lệ dòng/ô đúng (G.frac). */
const SD_SLOT_S=20,SX_EXTRA_S=20; // giây cộng thêm khi Thi đấu: mỗi ô trống của sơ đồ / mỗi câu sắp xếp
const isQ2=q=>q&&(q.type==='exsx'||q.type==='exsd');

const tsP=el=>window.__mjReady?MathJax.typesetPromise([el]).catch(()=>{}):Promise.resolve();
const sdById=q=>Object.fromEntries(q.nodes.map(n=>[n.id,n]));
const sdOrder=q=>{const out=[],root=q.nodes.find(n=>!n.p),walk=n=>{out.push(n);q.nodes.filter(c=>c.p===n.id).forEach(walk)};if(root)walk(root);return out};

function q2Init(q){
  if(q.type==='exsx'){let id=0;const bl=[...q.steps.map((s,i)=>({t:s.t,k:'s',i})),...(q.bad||[]).filter(b=>!q.steps.some(s=>s.t===b.t)).map(b=>({t:b.t,k:'x',why:b.why||''}))];
    G.q2={blocks:shuffle(bl).map(b=>({...b,id:id++})),place:q.steps.map(()=>null),sel:null};return}
  const order=sdOrder(q),hid=new Set(q.hid),hidc=new Set(q.hidc),slots=[];
  order.forEach(n=>{if(hid.has(n.id))slots.push({key:'n'+n.id,kind:'n',id:n.id});if(hidc.has(n.id))slots.push({key:'c'+n.id,kind:'c',id:n.id})});
  const dedup=a=>a.filter(b=>!b.trap||!a.some(x=>!x.trap&&x.t===b.t));
  const nb=order.filter(n=>hid.has(n.id)).map(n=>({t:n.t,k:'n',nid:n.id})).concat((q.bad||[]).map(b=>({t:b.t,k:'n',why:b.why||'',trap:1})));
  const cb=order.filter(n=>hidc.has(n.id)).map(n=>({t:n.c,k:'c',nid:n.id})).concat((q.badc||[]).map(b=>({t:b.t,k:'c',why:b.why||'',trap:1})));
  let id=0;const nblk=shuffle(dedup(nb)).map(b=>({...b,id:id++})),cblk=shuffle(dedup(cb)).map(b=>({...b,id:id++}));
  G.q2={slots,nblk,cblk,fill:{},sel:(slots.find(s=>s.kind==='n')||slots[0]||{}).key||null}}
const q2Blk=id=>{const S=G.q2;return (S.blocks||S.nblk.concat(S.cblk)).find(b=>b.id===id)};

function sdHTML(q,v){const by=sdById(q),hid=new Set(q.hid),hidc=new Set(q.hidc),kids=id=>q.nodes.some(c=>c.p===id),H=k=>v.hl&&v.hl.has(k)?' hl':'';let h='';

/* ---- xếp cây nhánh ngang: kết luận ở trên, các ô cần có ở dưới, mũi tên đi lên.
   Mỗi nhánh con đặt sát nhánh bên cạnh nhất có thể, chỉ cần không chồng nhau ở cùng một tầng. ---- */
function sdPlace(ti){const GAP=14,VG=24,PAD=6;ti.style.width='2000px';
  const E={},J={},Wd={},dep={},par={},ids=[];
  ti.querySelectorAll('.sd-node').forEach(e=>{const id=e.dataset.node;ids.push(id);E[id]=e;J[id]=ti.querySelector(`.sd-jn[data-jn="${CSS.escape(id)}"]`);par[id]=e.querySelector('.sd-tb').dataset.par||'';
    Wd[id]=Math.max(e.offsetWidth,J[id]?J[id].offsetWidth:0)});
  const kids=id=>ids.filter(c=>par[c]===id),root=ids.find(id=>!par[id]);if(!root)return;
  const ht=k=>{const c=kids(k);return c.length?1+Math.max(...c.map(ht)):0};
  // nhánh lá đứng cạnh nhau, nhánh sâu nằm về một phía để mũi tên ngắn và không cắt nhau
  const order=id=>{const ks=kids(id),lv=ks.filter(k=>!ht(k)),dp=ks.filter(k=>ht(k));if(!dp.length||!lv.length)return ks;
    const before=lv.slice(0,Math.ceil(lv.length/2)),after=lv.slice(before.length);return dp.length===1?[...before,...dp,...after]:[...lv,...dp]};
  const lay=(id,d)=>{dep[id]=d;const half=Wd[id]/2,ks=order(id);if(!ks.length)return{pos:{[id]:0},L:[-half],R:[half]};
    const subs=ks.map(k=>lay(k,d+1)),offs=[];let L=null,R=null;
    subs.forEach(sb=>{if(!L){offs.push(0);L=sb.L.slice();R=sb.R.slice();return}
      let off=-Infinity;for(let k=0;k<Math.min(R.length,sb.L.length);k++)off=Math.max(off,R[k]+GAP-sb.L[k]);offs.push(off);
      sb.L.forEach((v,k)=>{L[k]=k<L.length?Math.min(L[k],v+off):v+off;R[k]=k<R.length?Math.max(R[k],sb.R[k]+off):sb.R[k]+off})});
    const mid=(offs[0]+offs[offs.length-1])/2,pos={[id]:0};subs.forEach((sb,i)=>{for(const x in sb.pos)pos[x]=sb.pos[x]+offs[i]-mid});
    return{pos,L:[-half,...L.map(v=>v-mid)],R:[half,...R.map(v=>v-mid)]}};
  const r=lay(root,0),minL=Math.min(...r.L),maxR=Math.max(...r.R),nd=Math.max(...Object.values(dep))+1,BH=Array(nd).fill(0),JH=Array(nd).fill(0);
  ids.forEach(id=>{BH[dep[id]]=Math.max(BH[dep[id]],E[id].offsetHeight);if(J[id])JH[dep[id]]=Math.max(JH[dep[id]],J[id].offsetHeight)});
  const Y=[PAD];for(let d=0;d<nd-1;d++)Y.push(Y[d]+BH[d]+VG+JH[d]+VG);
  ids.forEach(id=>{const x=r.pos[id]-minL+PAD,d=dep[id],e=E[id];e.style.left=(x-e.offsetWidth/2)+'px';e.style.top=Y[d]+'px';
    if(J[id]){J[id].style.left=(x-J[id].offsetWidth/2)+'px';J[id].style.top=(Y[d]+BH[d]+VG)+'px'}});
  ti.style.width=(maxR-minL+2*PAD)+'px';ti.style.height=(Y[nd-1]+BH[nd-1]+PAD)+'px'}
function sdArrow(x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,h=9,w=5.5,bx=x2-ux*h,by=y2-uy*h;
  return `<line x1="${x1}" y1="${y1}" x2="${bx}" y2="${by}"/><polygon points="${x2},${y2} ${bx-uy*w},${by+ux*w} ${bx+uy*w},${by-ux*w}"/>`}
function sdLayOne(wrap){const sz=wrap.firstElementChild,ti=sz.firstElementChild,svg=ti.querySelector('svg.sd-ar');if(!wrap.clientWidth)return;ti.style.transform='none';sdPlace(ti);
  // đo bằng offset (không bị ảnh hưởng bởi hiệu ứng phóng to/thu nhỏ của khung chứa)
  const R=e=>{let l=0,t=0,x=e;while(x&&x!==ti){l+=x.offsetLeft;t+=x.offsetTop;x=x.offsetParent}return{l,t,w:e.offsetWidth,h:e.offsetHeight}};let p='';

  const W=ti.offsetWidth,H=ti.offsetHeight;svg.setAttribute('width',W);svg.setAttribute('height',H);svg.innerHTML=p;
  // vừa màn thì thu nhỏ; quá rộng (nhỏ hơn 70%) thì giữ 70% và cho vuốt ngang, mở ra ở giữa (ngay dưới kết luận)
  let s=Math.min(1,(wrap.clientWidth-8)/W);const pan=s<.7;if(pan)s=.7;const box=wrap.parentElement;box.classList.toggle('pan',pan);

/* ---- chấm ---- */
function q2Check(q){const S=G.q2,wrong=[];let ok=0,tot=0,right='';S.mark={};
  if(q.type==='exsx'){const runs=[];q.steps.forEach((s,i)=>{const r=runs[runs.length-1];if(r&&s.g&&r.g===s.g)r.e=i;else runs.push({g:s.g,s:i,e:i})});
    const runOf=i=>runs.findIndex(r=>r.s<=i&&i<=r.e);
    S.place.forEach((id,i)=>{const B=q2Blk(id);tot++;const good=B.k==='s'&&runOf(B.i)===runOf(i);S.mark[i]=good?'ok':'no';if(good){ok++;return}
      const r=runs[runOf(B.i)];wrong.push(B.k==='x'?`Dòng ${i+1}: <span class="q2b">${tex(B.t)}</span> là khối sai.${B.why?' '+tex(B.why):''}`:`Dòng ${i+1}: <span class="q2b">${tex(B.t)}</span> đúng nhưng phải ở dòng ${r.s===r.e?r.s+1:(r.s+1)+' hoặc '+(r.e+1)}.`)});
    G.ansTxt=S.place.map((id,i)=>(i+1)+') '+q2Blk(id).t).join('; ');right=sxRight(q)}
  else{const by=sdById(q),nodeOk={},hl=new Set(),groups={};
    // các ô lá cùng ô cha được đổi chỗ cho nhau
    S.slots.filter(s=>s.kind==='n').forEach(s=>{const n=by[s.id],leaf=!q.nodes.some(c=>c.p===n.id),g=leaf?'L'+n.p:'N'+n.id;(groups[g]=groups[g]||[]).push(s)});
    Object.values(groups).forEach(ss=>{const need=ss.map(s=>by[s.id].t);ss.forEach(s=>{const B=q2Blk(S.fill[s.key]);tot++;const j=!B.trap?need.indexOf(B.t):-1,good=j>=0;
      if(good){need.splice(j,1);ok++;nodeOk[s.id]=B.nid}S.mark[s.key]=good?'ok':'no';
      if(!good){if(!B.trap)hl.add('n'+B.nid);wrong.push(B.trap?`<span class="q2b">${tex(B.t)}</span> là khối sai.${B.why?' '+tex(B.why):''}`:`<span class="q2b">${tex(B.t)}</span> đúng nhưng đặt nhầm ô. Chỗ đúng của nó được tô viền vàng trong sơ đồ đúng.`)}})});
    S.slots.filter(s=>s.kind==='c').forEach(s=>{const B=q2Blk(S.fill[s.key]);tot++;const occ=nodeOk[s.id]||s.id,exp=by[occ].c,good=!B.trap&&B.t===exp;
      S.mark[s.key]=good?'ok':'no';if(good){ok++;return}if(!B.trap)hl.add('c'+B.nid);
      wrong.push(B.trap?`Căn cứ <span class="q2b">${tex(B.t)}</span> chưa đúng.${B.why?' '+tex(B.why):''}`:`Căn cứ <span class="q2b">${tex(B.t)}</span> đặt nhầm chỗ (ô này cần: ${tex(exp)}). Chỗ đúng của nó được tô viền vàng.`)});
    G.ansTxt=S.slots.map(s=>'ô '+s.key+': '+q2Blk(S.fill[s.key]).t).join('; ');right=sdFull(q,hl)}
  const all=ok===tot;G.done=true;G.frac=tot?ok/tot:0;$('#qc').classList.add('lock');q2Draw();
  result(all,$('#q2a'),all?'':whyBox(wrong)+`<div class="q2r">Đúng ${ok}/${tot} ${q.type==='exsx'?'dòng':'ô'}${G.mode==='rank'&&ok?` · được ${Math.round(100*G.frac)}% điểm câu`:''}. ${q.type==='exsx'?'Lời giải đúng:':'Sơ đồ đúng:'}</div>${right}`)}
function sxRight(q){const runs={};q.steps.forEach((s,i)=>{if(s.g)(runs[s.g]=runs[s.g]||[]).push(i+1)});
  return `<ol class="sx-sol">${q.steps.map((s,i)=>`<li><div class="sx-ln full"><span class="n">${i+1}</span><span class="t">${tex(s.t)}</span></div></li>`).join('')}</ol>`+
    Object.values(runs).filter(r=>r.length>1).map(r=>`<div class="q2r">Dòng ${r.join(', ')} đổi chỗ cho nhau được.</div>`).join('')}

function qBlocks(text){const out=[],re=/\\man\s*\{([^}]*)\}\s*\{([^}]*)\}|\\begin\{(ex|extf|exfb|exmatch|extl|exsx|exsd)\}[\s\S]*?\\end\{\3\}/g;let m,lv=-1;
  while((m=re.exec(text))){if(m[1]!==undefined){lv++;out.push({man:true,lv,n:m[1].trim(),name:m[2].trim(),start:m.index,end:m.index+m[0].length})}
    else out.push({lv:Math.max(lv,0),type:m[3],start:m.index,end:m.index+m[0].length,raw:m[0]})}
  return out}
function parseOne(raw){const P=parseBank('\\chude{x}\n\\man{1}{x}\n'+raw);const n=(raw.match(/\\begin\{(ex|extf|exfb|exmatch|extl|exsx|exsd)\}/g)||[]).length;
  const errs=P.errors.map(e=>e.msg);if(n!==1)errs.push(n?'Mỗi lần chỉ sửa một câu (một cặp \\begin…\\end).':'Chưa có \\begin{ex|extf|exfb|exmatch|extl}…\\end{…}.');
  return {q:P.levels[0]&&P.levels[0].qs[0],errors:errs}}
const QT={ex:'\\begin{ex}\nĐề bài\n\\choice{$A$ \\sai{Vì sao A sai}}{\\True $B$}{$C$ \\sai{Vì sao C sai}}{$D$ \\sai{Vì sao D sai}}\n\\goiy{Gợi ý}\n\\loigiai{Lời giải}\n\\end{ex}',
  extf:'\\begin{extf}\nĐề bài. Mỗi khẳng định sau đúng hay sai?\n\\choiceTF{\\True Ý a}{Ý b}{\\True Ý c}{Ý d}\n\\loigiai{Lời giải}\n\\end{extf}',
  exfb:'\\begin{exfb}\nĐề bài\n\\shortans{đáp số}\n\\saithuong{đáp số sai hay gặp}{Vì sao sai}\n\\loigiai{Lời giải}\n\\end{exfb}',
  extl:'\\begin{extl}\nĐề bài tự luận (học sinh làm vào vở).\n\\goiy{Gợi ý 1: hướng làm}\n\\goiy{Gợi ý 2: bước tiếp theo}\n\\end{extl}',
  exsx:'\\begin{exsx}\nĐề bài. Sắp xếp các bước thành lời giải đúng.\n\\buoc{Bước 1}\n\\buoc[1]{Bước 2 (đổi chỗ được với bước 3)}\n\\buoc[1]{Bước 3}\n\\buoc{Bước 4}\n\\nhieu{Khối sai}{Vì sao sai}\n\\loigiai{Lời giải}\n\\end{exsx}',
  exsd:'\\begin{exsd}\nĐề bài. Chứng minh ...\n\\nut{1}{Kết luận}{căn cứ của kết luận}\n\\nut{2}[1]{Ô cần có để suy ra ô 1}{căn cứ}\n\\nut{3}[2]{Giả thiết}{giả thiết}\n\\nut{4}[2]{Điều đã biết}{căn cứ}\n\\an{2}\n\\anly{2}\n\\nhieu{Mệnh đề sai}{Vì sao sai}\n\\nhieuly{Căn cứ sai}{Vì sao sai}\n\\end{exsd}',
  exmatch:'\\begin{exmatch}\nNối mỗi ý ở cột trái với ý đúng ở cột phải.\n\\pair{trái 1}{phải 1}\n\\pair{trái 2}{phải 2}\n\\pair{trái 3}{phải 3}\n\\end{exmatch}'};

function mergeP(d){const m0=P.matches||0;
  if(d.rev&&Object.keys(d.rev).length>Object.keys(P.rev||{}).length)P.rev=d.rev;
  if(d.saved&&Object.keys(d.saved).length>Object.keys(P.saved||{}).length)P.saved=d.saved;
  if(d.st&&(d.st.last_day||'')>(P.st.last_day||''))P.st=d.st;
  for(const f of ['xp','matches'])if((d[f]||0)>(P[f]||0))P[f]=d[f];
  // bậc + thanh tiến trình đi cùng nhau: lấy bản ghi của máy có nhiều trận hơn (cùng mùa)
  if(!(d.season&&P.season&&d.season!==P.season)&&((d.matches||0)>m0||!Number.isInteger(P.tier))&&(Number.isInteger(d.tier)||d.lp!=null)){P.tier=tierOfP(d);P.lp=d.lp||0;if(d.shield!=null)P.shield=d.shield}
  for(const f of ['tdh','prh','prw'])if(Array.isArray(d[f])&&d[f].length>(P[f]||[]).length)P[f]=d[f];
  if(d.pr&&d.pr.d===vnDay()&&(!P.pr||P.pr.d!==d.pr.d||(d.pr.n||0)>(P.pr.n||0)))P.pr=d.pr;
  if(d.hist&&d.hist.length>(P.hist||[]).length)P.hist=d.hist;
  if(d.nick&&!P.nick)P.nick=d.nick;if(d.avatar!=null&&!P.avatar)P.avatar=d.avatar;
  if(d.ach)for(const [k,v] of Object.entries(d.ach))if(!P.ach[k])P.ach[k]=v;
  if(d.stats)for(const [k,v] of Object.entries(d.stats))if((v||0)>(P.stats[k]||0))P.stats[k]=v;
  if(d.best)for(const [k,b] of Object.entries(d.best)){if((b.st||0)>(P.best[k]||0))P.best[k]=b.st;if((b.s||0)>(P.score[k]||0))P.score[k]=b.s;if(b.t&&!P.pt[k])P.pt[k]=b.t}
  if(d.deh){P.deh=P.deh||{};for(const [k,h] of Object.entries(d.deh))if(Array.isArray(h)&&h.length>(P.deh[k]||[]).length)P.deh[k]=h}
  if(d.own)for(const [k,v] of Object.entries(d.own))if(!P.own[k])P.own[k]=v;
  if((d.spent||0)>(P.spent||0))P.spent=d.spent;if(d.eq&&!Object.keys(P.eq||{}).length)P.eq=d.eq;
  if(d.wk&&d.wk.w&&(!P.wk||!P.wk.w||d.wk.w>P.wk.w||(d.wk.w===P.wk.w&&(d.wk.xp||0)>(P.wk.xp||0))))P.wk=d.wk;
  if(d.dq&&d.dq.d===vnDay()&&(!P.dq||P.dq.d!==d.dq.d))P.dq=d.dq;
  if(d.season&&!P.season)P.season=d.season;if(d.seasons&&d.seasons.length>(P.seasons||[]).length)P.seasons=d.seasons;
  for(const f of ['fails','lvt','ccl'])if(d[f])for(const [k,v] of Object.entries(d[f]))if(!P[f][k])P[f][k]=v;
  if(d.tut)P.tut=1;if(d.follow&&!Object.keys(P.follow||{}).length)P.follow=d.follow;if((d.fseen||'')>(P.fseen||''))P.fseen=d.fseen;
  if(d.tlh){P.tlh=P.tlh||{};for(const [k,v] of Object.entries(d.tlh))if((v||0)>(P.tlh[k]||0))P.tlh[k]=v}
  if(d.rseen){P.rseen=P.rseen||{};for(const [k,v] of Object.entries(d.rseen)){const a=+String(v).split('|')[0],b=+String(P.rseen[k]||'').split('|')[0];if(P.rseen[k]==null||a>b)P.rseen[k]=v}}
  save()}
