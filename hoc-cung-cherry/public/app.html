function chatMark(node) {
  for (const el of [node, ...node.querySelectorAll('*')]) {
    el.chatSrc = el.outerHTML;
    el.chatInner = el.innerHTML;
  }
}

function chatElementOnly(node) {
  return [...node.childNodes].every(child => child.nodeType === 1 || (child.nodeType === 3 && !child.textContent.trim()));
}

function chatSyncAttrs(node, fresh) {
  for (const { name } of [...node.attributes]) if (!fresh.hasAttribute(name)) node.removeAttribute(name);
  for (const { name, value } of [...fresh.attributes]) if (node.getAttribute(name) !== value) node.setAttribute(name, value);
}

function chatSwapFigure(node, fresh, onSwap) {
  const children = [...fresh.childNodes];
  const token = node.chatSwap = {};
  const swap = () => {
    if (node.chatSwap !== token) return;
    const height = node.offsetHeight;
    if (height) node.style.minHeight = height + 'px';
    node.replaceChildren(...children);
    const release = () => { if (node.chatSwap === token) node.style.minHeight = ''; };
    const images = [...node.querySelectorAll('img')].filter(img => !img.complete);
    if (!images.length) release();
    else {
      let left = images.length;
      for (const img of images) {
        const done = () => { if (--left <= 0) release(); };
        img.addEventListener('load', done, { once: true });
        img.addEventListener('error', done, { once: true });
      }
      setTimeout(release, 3000);
    }
    onSwap?.();
  };
  // Ảnh mới (bước tiếp của hình từng bước) được tải trước, ảnh cũ ở lại trên màn cho tới lúc đó.
  const sources = [...fresh.querySelectorAll('img')].map(img => img.getAttribute('src')).filter(Boolean);
  if (!sources.length || typeof Image !== 'function') return swap();
  let left = sources.length;
  const done = () => { if (--left <= 0) swap(); };
  for (const src of sources) {
    const probe = new Image();
    probe.onload = probe.onerror = done;
    probe.src = src;
  }
  setTimeout(swap, 1500);
}

function chatMorph(parent, fresh, added = [], removed = [], onSwap) {
  const olds = [...parent.children];
  let k = 0;
  for (const item of [...fresh.children]) {
    const source = item.outerHTML, inner = item.innerHTML;
    let m = -1, node = null;
    for (let i = k; i < olds.length; i++) {
      if (olds[i].chatSrc === source) { m = i; node = olds[i]; break; }
    }
    if (!node) {
      const old = olds[k];
      if (old && old.tagName === item.tagName && old.getAttribute('class') === item.getAttribute('class')) {
        let kept = true;
        chatSyncAttrs(old, item);
        if (old.chatInner !== inner) {
          if (old.classList.contains('chat-figure')) chatSwapFigure(old, item, onSwap);
          else if (chatElementOnly(item) && chatElementOnly(old)) chatMorph(old, item, added, removed, onSwap);
          else kept = false;
        }
        if (kept) {
          old.chatSrc = source;
          old.chatInner = inner;
          m = k;
          node = old;
        }
      }
    }
    if (!node) {
      parent.insertBefore(item, olds[k] || null);
      chatMark(item);
      added.push(item);
      continue;
    }
    for (let i = k; i < m; i++) {
      removed.push(olds[i]);
      olds[i].remove();
    }
    k = m + 1;
  }
  for (let i = k; i < olds.length; i++) {
    removed.push(olds[i]);
    olds[i].remove();
  }
  return { added, removed };
}

function chatHinhBuoc(figure) {
  return figure?.kind === 'hinhbuoc' ? parseHinhBuoc(figure.src) : null;
}

function chatExampleSteps(value) {
  const tokens = String(value || '').match(/\\\[[\s\S]*?\\\]|\$(?:\\.|[^$\\])*\$|\\\\|\\.|[^\\$]+|[$\\]/g) || [];
  const lines = [''];
  for (const token of tokens) {
    if (token === '\\\\') lines.push('');
    else lines[lines.length - 1] += token;
  }
  return lines.map(line => line.trim()).filter(Boolean);
}

function chatPlan(chat) {
  const lastPart = chat.parts.length + 1;
  const parts = [{ title: 'Mở đầu' }, ...chat.parts, { title: 'Kết bài' }];
  const screens = [];
  if (chat.modau) screens.push({ ...chat.modau, p: 0, type: 'opening', figure: chat.modau.fig });
  screens.push({ p: 0, type: 'contents' });
  for (const [index, part] of chat.parts.entries()) {
    part.screens.forEach((screen, i) => {
      const { type, fig, state, after, toggle, stepStates, calc } = screen;
      const useShared = !i || state || after || toggle || stepStates ||
        ['tap', 'region', 'act', 'slide', 'steps'].includes(type) || calc?.items.some(item => item.state || item.after);
      const figure = fig || (useShared ? part.fig : null);
      screens.push({ ...screen, p: index + 1, figure,
        steps: type === 'vidu' ? chatExampleSteps(screen.sol) : null,
        frames: chatHinhBuoc(figure),
      });
    });
    screens.push({ p: index + 1, type: 'recap' });
  }
  if (chat.ketbai) {
    const { fig, ...closing } = chat.ketbai;
    screens.push({ ...closing, p: lastPart, type: 'closing', figure: fig });
  } else {
    screens.push({ p: lastPart, type: 'closing' });
  }
  for (const sc of screens) {
    if (sc.type === 'opening') sc.frames = chatHinhBuoc(sc.figure);
  }
  return { parts, screens };
}

function chatMerge(base, change) {
  if (!change) return base;
  return { ...base, ...change, to: { ...base.to, ...change.to }, do: { ...base.do, ...change.do } };
}

function chatFigureState(sc, state) {
  let result = { ...sc.state };
  if (sc.toggle && Number.isInteger(state.toggle)) result = chatMerge(result, sc.toggle[state.toggle]?.state);
  if (sc.type === 'vidu') {
    for (const step of (sc.stepStates || []).slice(0, state.steps || 1)) result = chatMerge(result, step);
  }
  if (sc.type === 'act') {
    for (const act of sc.acts.slice(0, state.steps || 0)) result = chatMerge(result, act.state);
  }
  if (sc.type === 'calc') {
    for (const item of sc.calc.items.slice(0, state.steps || 0)) result = chatMerge(chatMerge(result, item.state), item.after);
  }
  if (state.hit) {
    const color = state.correct ? 'luc' : 'do';
    result = sc.type === 'tap' ? chatMerge(result, { to: { [state.hit]: color } }) :
      { ...result, vung: state.hit };
  }
  if (state.correct) result = chatMerge(result, sc.after);
  if (sc.type === 'steps' || sc.type === 'opening' && sc.nutbuoc) result.buoc = state.steps || 1;
  return result;
}

function chatOrder(length) {
  const items = Array.from({ length }, (_, i) => i);
  for (let i = length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }
  return items;
}

function chatStorage(topic, options) {
  const key = topic.id && options.persist !== false && !options.teacher ? 'ltt-chat:' + topic.id : '';
  const scope = 'account:' + (options.progressScope || '');
  let fingerprint = 0;
  for (const c of JSON.stringify(topic.chat)) fingerprint = (Math.imul(fingerprint, 31) + c.codePointAt(0)) | 0;
  function readAll() {
    return JSON.parse(localStorage.getItem(key) || '{}') || {};
  }
  return {
    read() {
      if (!key) return null;
      try {
        const saved = readAll()[scope];
        return saved?.fingerprint === fingerprint && Array.isArray(saved.visits) ? saved : null;
      } catch { return null; }
    },
    write(data) {
      if (!key) return;
      try {
        const saved = readAll();
        if (data) saved[scope] = { ...data, fingerprint };
        else delete saved[scope];
        if (Object.keys(saved).length) localStorage.setItem(key, JSON.stringify(saved));
        else localStorage.removeItem(key);
      } catch { /* Việc học vẫn hoạt động khi trình duyệt chặn bộ nhớ. */ }
    },
  };
}

function renderChatLesson(root, topic, options = {}) {
  if (!topic.chat) return;
  const { parts, screens } = chatPlan(topic.chat);
  const lastPart = parts.length - 1;
  const name = String(options.studentName || '').trim().split(/\s+/).at(-1);
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const storage = chatStorage(topic, options);
  const saved = storage.read();
  let visits = saved?.visits.slice(0, screens.length) || [];
  let complete = Boolean(saved?.complete && visits.length === screens.length);
  let busy = false, focusedPart = 0, seenOptions = 0, toastTimer;
  const anchors = new Map(), rows = [];
  const title = options.title || topic.title || 'Chat với Cherry';
  const praise = ['Giỏi quá, \\ten!', 'Chuẩn luôn!', 'Cậu nhanh thật!', 'Chính xác!'];
  const partLabel = p => p === 0 || p === lastPart ? parts[p].title :
    'Phần ' + p + '/' + (lastPart - 1) + ' · ' + parts[p].title;
  const typeset = node => {
    if (options.typeset) return Promise.resolve(options.typeset(node)).catch(() => {});
    const math = globalThis.MathJax;
    return Promise.resolve(math?.startup?.promise?.then(() => node.isConnected && math.typesetPromise([node])).catch(() => {}));
  };
  const clearMath = node => globalThis.MathJax?.typesetClear?.([node]);
  const placeholder = () => '<div class="chat-placeholder">' +
    chatEscape(options.figurePlaceholder || 'Hình TikZ, sẽ hiện sau khi nạp lên app') + '</div>';
  const staticFigure = source => options.renderTikz?.(source) || placeholder();

  function text(value) {
    const source = String(value ?? '').replace(/\\ten\b/g, () => name || 'cậu');
    const tokens = /\\begin\{tikzpicture\}[\s\S]*?\\end\{tikzpicture\}|\\\[[\s\S]*?\\\]|\$\$[\s\S]*?\$\$|\\\([\s\S]*?\\\)|\$(?:\\.|[^$\\])*\$|\\textbf\s*\{([^{}]*)\}|\\\\/g;
    let result = '', from = 0;
    for (const match of source.matchAll(tokens)) {
      const token = match[0];
      result += chatEscape(source.slice(from, match.index));
      if (token.startsWith('\\begin{tikzpicture}')) result += '<div class="chat-figure">' + staticFigure(token) + '</div>';
      else if (token.startsWith('\\[') || token.startsWith('$$')) result += '<div class="chat-math">' + chatEscape(token) + '</div>';
      else if (match[1] !== undefined) result += '<strong>' + text(match[1]) + '</strong>';
      else if (token === '\\\\') result += '<br>';
      else result += chatEscape(token);
      from = match.index + token.length;
    }
    return result + chatEscape(source.slice(from));
  }

  const bubble = (value, question = false) => `<div class="chat-bubble${question ? ' chat-question' : ''}">${text(value)}</div>`;
  const answer = value => `<div class="chat-answer">${text(value)}</div>`;
  const tag = (label, kind = '') => `<span class="chat-label" data-kind="${kind}">${chatEscape(label)}</span>`;
  const feedback = (value, style = '') => `<div class="chat-feedback"${style ? ' data-' + style : ''} role="status">${text(value)}</div>`;
  const action = (id, label, disabled = false) => `<button type="button" class="chat-action" data-${id}${disabled ? ' disabled' : ''}>${text(label)}</button>`;
  // Nút đi tiếp và nút quay lại cùng một hàng: quay lại nhỏ, bên trái; đi tiếp chính, bên phải.
  const stepRow = (back, forward) => back || forward ? `<div class="chat-step-row">${back}${forward}</div>` : '';
  const backAction = (id, label) => `<button type="button" class="chat-action chat-back" data-${id}>‹ ${text(label)}</button>`;
  const activeScreen = () => screens[visits.length - 1];
  const setTitle = p => { focusedPart = p; current.textContent = partLabel(p); };
  const save = () => storage.write({ visits, complete });
  const scroll = (node, animation = true) => {
    if (!node) return;
    const top = node.getBoundingClientRect().top - feed.getBoundingClientRect().top + feed.scrollTop - 9;
    feed.scrollTo({ top: Math.max(0, top), behavior: animation && !reduced ? 'smooth' : 'instant' });
  };

  function figureHTML(sc, state, live = false) {
    const figure = sc.figure;
    if (!figure) return '';
    const view = chatFigureState(sc, state);
    const renderer = CHAT_FIGURES[figure.mau?.name];
    let html;
    if (renderer) {
      html = renderer(figure.mau.params, view, {
        tap: live && sc.type === 'tap' && !state.correct,
        region: live && sc.type === 'region' && !state.correct,
        slide: sc.type === 'slide' && (state.correct ? 'to' : true),
      });
    } else if (sc.frames) {
      const frame = sc.frames.frames[Math.max(0, Math.min(sc.frames.frames.length, view.buoc || 1) - 1)];
      html = frame ? staticFigure(frame) : placeholder();
    } else html = staticFigure(figure.src);
    return html ? `<div class="chat-figure">${html}</div>` : '';
  }

  function quizHTML(quiz, state, live, index, isCalc = false) {
    if (!quiz) return '';
    const id = 'q' + index;
    const attempts = state[id] || [];
    const order = state['order' + index] || (state['order' + index] = chatOrder(quiz.opts.length));
    const last = quiz.opts[attempts.at(-1)];
    const locked = attempts.includes(order.find(i => quiz.opts[i]?.ok));
    let content = bubble(quiz.q, true);
    if (last) {
      const intro = last.ok && state['praise' + index] ? state['praise' + index] + ' ' : '';
      const why = last.why.replace(/^(Đúng rồi|Đúng hướng|Chính xác|Chuẩn|Đúng)[!.:]?\s+/u, '');
      content += answer(last.text) + feedback(last.ok ? intro + why : last.why + ' Cậu thử lại nhé.', last.ok ? '' : 'wrong');
    }
    if (live && !locked) {
      for (const i of order) {
        const wrong = attempts.includes(i);
        const disabled = state.waiting || (wrong && !isCalc);
        content += `<button class="chat-choice" type="button" data-option="${index},${i}"${wrong ? ' data-wrong' : ''}${disabled ? ' disabled' : ''}>${text(quiz.opts[i].text)}</button>`;
      }
    }
    return content;
  }

  function knowledgeHTML(sc, count) {
    const label = tag(CHAT_LABELS[sc.kind || sc.type] || 'Kiến thức', sc.kind || sc.type);
    let body = sc.body || '';
    if (sc.steps?.length) body = body.replace(CHAT_TIKZ, '');
    const title = sc.title ? '<h2>' + text(sc.title) + '</h2>' : '';
    const steps = sc.steps?.length ? '<ol class="chat-steps">' +
      sc.steps.slice(0, count).map(line => '<li>' + text(line) + '</li>').join('') + '</ol>' : '';
    return `<div class="chat-knowledge">${label}${title}<div>${text(body)}</div>${steps}</div>`;
  }

  function blockHTML(sc, state, live) {
    let html = sc.cherry ? bubble(sc.cherry) : '';
    html += figureHTML(sc, state, live);
    if (sc.type === 'opening') {
      html += bubble(sc.cauhoi, true) + bubble('Học xong bài này, cậu sẽ tự trả lời được.');
      if (sc.nutbuoc && sc.frames?.caps.length) {
        if (state.steps > 1) html += bubble(sc.frames.caps[state.steps - 1]);
        if (live && state.steps !== sc.frames.caps.length) html += stepRow('', action('frame', sc.nutbuoc));
      }
    }
    if (sc.type === 'contents') {
      html += bubble('Bài học hôm nay', true) + '<div class="chat-knowledge"><ol>' +
        parts.slice(1, -1).map(part => '<li>' + text(part.title) + '</li>').join('') + '</ol></div>';
    }
    if (['read', 'vidu'].includes(sc.type)) {
      const count = state.steps || 1;
      html += knowledgeHTML(sc, count);
      if (live && count < (sc.steps?.length || 0)) html += stepRow('', action('step', 'Bước tiếp ›'));
    }
    if (sc.type === 'tap' || sc.type === 'region') {
      const prompt = sc.tap || sc.region;
      html += bubble(prompt.prompt, true);
      if (state.correct) html += feedback(prompt.ok);
      else if (state.hit) html += feedback(prompt.nhac?.[state.hit] || prompt.hint || 'Nhìn lại hình rồi chạm lần nữa nhé.', 'wrong');
    }
    if (sc.type === 'quiz' || sc.type === 'closing') {
      if (sc.quiz) html += tag(sc.label || 'Thử ngay') + quizHTML(sc.quiz, state, live, 0);
      if (sc.emdahoc?.length && (!sc.quiz || state.correct)) {
        html += '<div class="chat-knowledge"><h2>Cậu đã học</h2><ul>' +
          sc.emdahoc.map(item => '<li>' + text(item) + '</li>').join('') + '</ul></div>';
      }
    }
    if (sc.type === 'calc') {
      html += tag('Cậu tính');
      const count = state.steps || 0;
      for (const [index, quiz] of sc.calc.items.entries()) {
        if (index > count) break;
        html += quizHTML(quiz, state, live && index === count, index, true);
      }
      if (count === sc.calc.items.length && sc.calc.ketluan) html += feedback(sc.calc.ketluan);
    }
    if (sc.type === 'act') {
      const count = state.steps || 0;
      for (const act of sc.acts.slice(0, count)) html += answer(act.label) + feedback(act.say, act.warn ? 'warn' : '');
      if (live && sc.acts[count]) html += action('step', sc.acts[count].label);
    }
    if (sc.type === 'steps' && sc.frames) {
      const index = (state.steps || 1) - 1;
      html += tag('Hình từng bước') + bubble('Bước ' + (index + 1) + '/' + sc.frames.caps.length + '. ' + sc.frames.caps[index]);
      if (live) html += stepRow(index ? backAction('back-frame', 'Bước trước') : '',
        index + 1 < sc.frames.caps.length ? action('frame', 'Bước sau ›') : '');
    }
    if (sc.type === 'slide') {
      html += state.correct ? feedback(sc.slide.after) : live ? action('slide', sc.slide.label, state.waiting) : '';
    }
    if (sc.toggle) {
      sc.toggle.forEach((choice, i) => {
        if (live) html += `<button class="chat-action" type="button" data-toggle="${i}" aria-pressed="${state.toggle === i}">${text(choice.label)}</button>`;
      });
    }
    if (sc.type === 'recap') {
      html += bubble('Xong phần ' + sc.p + ' rồi, ' + (name || 'cậu') + '! Cậu thấy phần này thế nào?', true);
      if (state.recap) html += answer('Hơi rối, nhắc lại giúp tớ') + bubble(parts[sc.p].recap || 'Mở Tóm tắt để xem các ý chính nhé.');
    }
    if (sc.type === 'lab') html += options.renderLab?.(sc) || '';
    if (sc.type === 'giaimau') {
      const clean = sc.body.replace(/\\(?:begin|end)\{giaimau\}/g, '').replace(CHAT_TIKZ, '');
      const prompt = clean.match(/\\de\s*\{([^{}]*)\}/)?.[1];
      if (prompt) html += bubble(prompt);
    }
    if (state.echo) html += answer(state.echo);
    return html;
  }

  // Chỉ trang Tóm tắt (phần Lý thuyết riêng, bảng chọn trên bản đồ): không chat, không đụng tiến độ học.
  if (options.summaryOnly) {
    const acts = options.summaryActions || [];
    root.innerHTML = `<div class="cherry-chat chat-summary-page" role="region" aria-label="${chatEscape('Tóm tắt · ' + title)}">
      <div class="chat-top">${options.onClose ? '<button class="chat-close" type="button" data-close aria-label="Đóng tóm tắt">×</button>' : ''}
        <div class="chat-sumtitle"><small>Tóm tắt lý thuyết</small><b>${chatEscape(title)}</b></div></div>
      <div class="chat-feed"><div class="chat-summary-inner">${summaryHTML()}</div></div>
      ${acts.length ? `<div class="chat-dock">${acts.map((x, i) => `<button type="button" data-act="${i}"${x.alt ? ' class="chat-recap-button"' : ''}>${chatEscape(x.label)}</button>`).join('')}</div>` : ''}
    </div>`;
    const page = root.firstElementChild;
    page.querySelector('[data-close]')?.addEventListener('click', () => options.onClose?.());
    page.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => acts[+b.dataset.act].onClick?.()));
    typeset(page);
    return {};
  }
  const turn = html => `<div class="chat-turn">${CHAT_AVATAR}<div class="chat-col">${html}</div></div>`;
  root.innerHTML = `<div class="cherry-chat" role="region" aria-label="${chatEscape(title)}">
    <div class="chat-top">
      ${options.onClose ? '<button class="chat-close" type="button" data-close aria-label="Đóng lý thuyết">×</button>' : ''}
      <div class="chat-progress" role="progressbar" aria-label="Tiến độ bài học" aria-valuemin="0" aria-valuemax="100"><b></b></div>
      <button type="button" data-summary>Tóm tắt</button>
      <button type="button" data-toc>Mục lục</button>
      ${options.teacherEdit ? '<button type="button" data-edit>Sửa</button>' : ''}
      ${options.onOldVersion ? '<button type="button" data-old-version>Bản cũ</button>' : ''}
    </div>
    <div class="chat-current"></div>
    <div class="chat-finished" hidden>Cậu đã học xong <button type="button" data-summary>Xem tóm tắt</button><button type="button" data-reset>Học lại từ đầu</button></div>
    <div class="chat-feed"><div class="chat-stream" role="log" aria-label="Trò chuyện với Cherry"></div></div>
    <button type="button" class="chat-pip" aria-label="Cuộn về hình" hidden></button>
    <div class="chat-dock"><button class="chat-recap-button" type="button" data-recap hidden>Hơi rối, nhắc lại</button><button type="button" data-next>Tiếp tục</button></div>
    <dialog class="chat-pane chat-toc-pane" aria-label="Mục lục"></dialog>
    <dialog class="chat-pane chat-summary-pane" aria-label="Tóm tắt"></dialog>
    <div class="chat-toast" role="status" hidden></div>
  </div>`;
  const shell = root.firstElementChild;
  const $ = selector => shell.querySelector(selector);
  const feed = $('.chat-feed'), stream = $('.chat-stream'), current = $('.chat-current');
  const next = $('[data-next]'), recap = $('[data-recap]'), pip = $('.chat-pip');
  const toc = $('.chat-toc-pane'), summary = $('.chat-summary-pane'), toast = $('.chat-toast');
  const finished = $('.chat-finished'), progress = $('.chat-progress');
  let pipFigure = null, pipInner = null, scrollAfterMath = false;

  function ready(sc, state) {
    if (sc.quiz || ['tap', 'region', 'slide'].includes(sc.type)) return !!state.correct;
    if (sc.type === 'calc') return state.steps === sc.calc.items.length;
    if (sc.type === 'act') return state.steps === sc.acts.length;
    if (sc.type === 'vidu') return (state.steps || 1) >= sc.steps.length;
    if (sc.type === 'steps' && sc.frames) return (state.steps || 1) === sc.frames.caps.length || state.viewedFrames;
    if (sc.type === 'opening' && sc.nutbuoc && sc.frames) return state.steps === sc.frames.caps.length;
    if (sc.toggle) return state.toggles?.length === sc.toggle.length;
    return true;
  }

  function dock() {
    const sc = activeScreen(), state = visits.at(-1);
    if (!sc) return;
    const enabled = ready(sc, state);
    next.disabled = busy || !enabled;
    recap.hidden = busy || sc.type !== 'recap' || Boolean(state.recap);
    const hints = {
      quiz: 'Chọn một đáp án', closing: 'Chọn một đáp án', tap: 'Chạm vào hình',

    }

  };

    if (busy || activeScreen().type !== 'recap') return;

  };

  feed.addEventListener('scroll', () => {
    updatePip();

    let p = 0;

      if (anchor.getBoundingClientRect().top > cutoff) break;

    }

    setTitle(p);
  }, { passive: true });
  if (!visits.length) restart();
  else {
    for (const [i, state] of visits.entries()) {
      delete state.waiting;
      if (i < visits.length - 1 || complete) state.final = true;
      append(i);
    }
    scroll(rows.at(-1), false);
    updatePip();
  }
  if (options.openSummary) showSummary();
  return { restart, showSummary };
}

    <div id="thChatDiagnostics" aria-live="polite"></div><div id="thChatPreview"></div>
    <button class="btn" id="thChatSave">Lưu bản chat</button><button class="btn alt" id="thChatCancel">Hủy</button>`);
  const field=$('#thChatSource'),result=$('#thChatDiagnostics'),preview=$('#thChatPreview'),save=$('#thChatSave');
  const diagnose=(items,style)=>items.map(item=>`<button class="${style}" type="button" data-line="${item.line}">${esc(errorText(item))}</button>`).join('');
  const validate=()=>{
    if(!field.isConnected)return;
    const draft=inspectChatSource(field.value,{standalone:true});
    result.innerHTML=diagnose(draft.errors,'err')+diagnose(draft.warnings,'tnote');
    preview.classList.toggle('chat-editor-preview',!!draft.chat&&!draft.errors.length);
    if(draft.chat&&!draft.errors.length)renderChatInApp(preview,{...t,chat:draft.chat},{persist:false});
    else preview.replaceChildren();
    save.disabled=!!draft.errors.length;
    return draft;
  };
  result.onclick=event=>{
    const line=Number(event.target.closest('[data-line]')?.dataset.line);
    if(!line)return;
    const rows=field.value.split('\n'),start=rows.slice(0,line-1).reduce((i, row)=>i+row.length+1,0);
    field.focus();field.setSelectionRange(start,start+(rows[line-1]||'').length);
  };
  let timer;
  field.oninput=()=>{clearTimeout(timer);timer=setTimeout(validate,300)};
  bindTheoryTabs(t,drafts,'chat',()=>{clearTimeout(timer);return field.value});
  $('#thChatCancel').onclick=closeOvl;
  validate();
  save.onclick=async()=>{
    clearTimeout(timer);
    const draft=validate();
    if(!draft||draft.errors.length)return;
    let text;
    try{text=replaceChatBlock(t.raw,draft.block)}
    catch(e){result.textContent=e.message;return}
    save.disabled=true;
    const saved=await saveText(t,text,'Đã lưu bản chat.',{action:'replace-chat',chatSource:draft.block});
    if(saved&&$$('.scr.on')[0]?.id==='theory')theory(TOPICS.find(x=>x.id===t.id)||t,true,'chat');
    else if(save.isConnected)save.disabled=false;
  };
}

/* ---------- làm lại câu sai + câu đã lưu ---------- */
let redoTab='sai';
function qIndex(){const ix={};for(const t of TOPICS){if(!visible(t)||t.khoi!==(ACC?.khoi||curK))continue;t.levels.forEach((l,li)=>l.qs.forEach(q=>{ix[q.key]={q,t,li}}))}return ix}
// Sổ Câu sai: chỉ câu của Bản đồ kho báu và Ôn tập (câu Kho Thi đấu không vào, để không lộ đáp án kho Thi đấu)
function nbList(ix=qIndex()){return Object.entries(P.rev||{}).filter(([k,r])=>ix[k]&&r.in_notebook&&!isKho(ix[k].t))}
/* Làm lại câu sai bằng câu thay thế (thầy chốt 28/11/2026): không đưa lại đúng câu đã sai.
   Thứ tự: câu khác cùng bài, cùng mức em chưa gặp → cùng mức em chưa làm đúng → cùng bài ở mức cao hơn, rồi mức thấp hơn (cũng chưa gặp / chưa đúng)
   → câu gốc nếu có tham số (đổi số) → đường cùng: câu gốc (đảo phương án), chỉ mở lại sau 1 ngày. */
function pickTwin(k,ix,used,today=vnDay()){const {q,t,li}=ix[k],r=P.rev[k]||{},n=t.levels.length;
  // 0: em chưa gặp; 1: đã gặp nhưng chưa làm đúng lần nào (và không đang nằm trong Câu sai); -1: không dùng
  const rk=x=>{if(x.key===k||used.has(x.key)||x.type==='extl')return -1;const v=P.rev[x.key],w=P.wst[x.key];if(!v&&!w)return 0;
    if(v&&(v.in_notebook||v.last_ok))return -1;return w&&w.n>0&&w.w<w.n?-1:1};
  const order=[li,...Array.from({length:n},(_,i)=>i).filter(i=>i>li),...Array.from({length:n},(_,i)=>n-1-i).filter(i=>i<li)];
  for(const want of [0,1])for(const L of order){const c=shuffle(t.levels[L].qs.filter(x=>rk(x)===want));if(c.length)return {q:c[0],t,li:L,twin:true}}
  if(q.params||!r.due||r.due<=today)return {q,t,li,twin:false};
  return null}
function redo(){show('redo');const ix=qIndex(),wr=nbList(ix),sv=Object.entries(P.saved||{}).sort((a,b)=>b[1].at.localeCompare(a[1].at));
  const byT={};wr.forEach(([k])=>{const t=ix[k].t.title;byT[t]=(byT[t]||0)+1});const used=new Set(),wait=wr.filter(([k])=>{const x=pickTwin(k,ix,used);if(x)used.add(x.q.key);return !x}).length,ready=wr.length-wait;
  $('#redoBody').innerHTML=`<div class="phead" style="--c:#ff7a59;--d:#e85a3a"><b>Làm lại câu sai</b><span>Mỗi câu sai được thay bằng một câu khác cùng bài để em luyện cách làm, không phải nhớ đáp án. Làm đúng 1 lần là câu được gạch khỏi danh sách.${ACC&&!ACC.teacher&&P.rlock?` Thi đấu đang khóa đến khi còn không quá ${NB_UNLOCK} câu.`:''}</span></div>
   <div class="seg"><button data-tab="sai" class="${redoTab==='sai'?'on':''}">Câu sai (${wr.length})</button><button data-tab="luu" class="${redoTab==='luu'?'on':''}">Đã lưu (${sv.length})</button></div>
   ${redoTab==='sai'?(wr.length?`${ready?`<button class="btn big" id="rGo">Làm lại ${Math.min(10,ready)} câu</button>`:''}${wait?`<p class="tnote2">${wait} câu (bài đã hết câu mới) mở lại vào ngày mai.</p>`:''}<div class="tbox">${Object.entries(byT).map(([t,n])=>`<div class="row2"><span>${esc(t)}</span><b>${n} câu</b></div>`).join('')}</div>`

const RLK=()=>'ltt:rlast:'+(ACC&&ACC.id||'');

const rankLast=()=>{const v=store.get(RLK(),null);return v&&Array.isArray(v.log)&&v.log.length?v:null};
let rvOnlyWrong=false;
// Phần em đã trả lời, không lộ đáp án: trắc nghiệm hiện các phương án và tô phương án em chọn; dạng khác hiện câu trả lời của em
function myAnsHTML(q,ans){if(ans==null)return '<div class="va">Em chưa trả lời câu này.</div>';
  if(q.type==='ex')return (q.opts||[]).map((o,i)=>`<div class="va${o.t===ans?' me':''}">${'ABCDEF'[i]}. ${tex(o.t)}${o.t===ans?' <b>← em chọn</b>':''}</div>`).join('');

  if(q.type==='exfb')return `<div class="va me">Em ghi: <b>${tex(String(ans))}</b></div>`;
  return `<div class="va me">Em trả lời: ${String(ans).split('; ').map(x=>tex(x)).join('<br>')}</div>`}
const okMark=x=>x.ok?'<b class="y">✅ Đúng</b>':x.part?'<b class="n">❌ Đúng một phần</b>':x.ans==null?'<b class="n">❌ Chưa làm</b>':'<b class="n">❌ Sai</b>';

const hashS=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return (h>>>0).toString(36)};
function rankRank(x){const v=(P.rseen||{})[x.q.key];if(v==null)return 0;const m=+String(v).split('|')[0]||0;return (x.q.params?1e6:2e6)+m}

/* ---------- XP, tuần, mùa giải ---------- */
function weekId(){const t=vnDay(),d=new Date(t+'T00:00:00Z');return addDays(t,-((d.getUTCDay()+6)%7))}
function wkE(){const w=weekId();if(!P.wk||P.wk.w!==w)P.wk={w,xp:0,c:0,lv:0};return P.wk}
function addXP(n){P.xp=(P.xp||0)+n;wkE().xp+=n}
const bal=()=>Math.max(0,(P.xp||0)-(P.spent||0));
const titleOf=p=>{const id=p&&p.eq&&p.eq.title;return id&&ITEM[id]?ITEM[id].name:''};
function checkSeason(){const s=seasonName();if(!P.season){P.season=s;return}if(P.season===s)return;
  const old=tierMe();P.seasons=[...(P.seasons||[]),{s:P.season,lp:P.lp||0,t:old}].slice(-12);const S=seasonStart(old);P.tier=S.tier;P.lp=S.lp;P.shield=0;P.tdh=[];P.prw=[];P.season=s;
  setTimeout(()=>msgBox(`${s} bắt đầu!`,`Mùa trước em đạt <b>${TIERS[old].n}</b>, đã lưu vào trang cá nhân. Sang mùa mới mọi người tụt ${SEASON_DROP} bậc: em bắt đầu ở <b>${TIERS[S.tier].n}</b>. Mỗi mùa kéo dài ${SEASON_DAYS} ngày.`),800)}
/* Thi đấu: số câu đang ở Câu sai (chỉ câu Bản đồ và Ôn tập). Quá NB_LOCK câu thì khóa; khóa rồi làm lại đến khi còn ≤ NB_UNLOCK câu mới mở lại. */
function nbOpen(){return nbList().length}
function rankLock(){if(!ACC||ACC.teacher)return 0;const n=nbOpen();if(n>NB_LOCK)P.rlock=1;else if(n<=NB_UNLOCK&&P.rlock){P.rlock=0;save()}return P.rlock?n:0}

const QUESTS=[{id:'man',n:'Qua 1 bài trên bản đồ',t:1},{id:'sao3',n:'Đạt 3 sao ở một bài',t:1},{id:'dung10',n:'Trả lời đúng 10 câu',t:10},{id:'chuoi5',n:'Đúng liên tiếp 5 câu',t:5},

function dq(){const d=vnDay();if(!P.dq||P.dq.d!==d){let pool=QUESTS.map(q=>q.id);const k=ACC.khoi;
    if(counts().nb<3)pool=pool.filter(x=>x!=='sua3');if(!deTopics(k).length)pool=pool.filter(x=>x!=='de');if(!routeTopics(k).length)pool=pool.filter(x=>!['man','sao3','kogoiy'].includes(x));
    let h=7;for(const ch of d+ACC.id)h=(h*31+ch.charCodeAt(0))>>>0;const ids=[];while(ids.length<3&&pool.length){ids.push(pool.splice(h%pool.length,1)[0]);h=(Math.floor(h/7)+101)>>>0}
    P.dq={d,ids,p:{},c:{},chest:false};save()}return P.dq}
function qev(id,n=1,max=false){if(!P||!ACC||ACC.teacher)return;const q=dq();if(!q.ids.includes(id))return;const Q=QUESTS.find(x=>x.id===id),old=q.p[id]||0;
  q.p[id]=Math.min(Q.t,max?Math.max(old,n):old+n);if(old<Q.t&&q.p[id]>=Q.t)setTimeout(()=>toast(`${chestSVG(false,30)}<span><b>Xong nhiệm vụ!</b><br>${Q.n}. Về khu vực để nhận thưởng.</span>`),1300)}
function questCard(){const q=dq(),all=q.ids.every(id=>q.c[id]);
  return `<div class="qcard"><div class="qhd"><b>Nhiệm vụ hôm nay</b><small>Làm mới lúc 0 giờ</small></div>
   ${q.ids.map(id=>{const Q=QUESTS.find(x=>x.id===id),p=q.p[id]||0,done=p>=Q.t;return `<div class="qrow2${q.c[id]?' got':''}"><div class="qtx"><span>${Q.n}</span><i class="qbar"><i style="width:${p/Q.t*100}%"></i></i></div>${q.c[id]?'<span class="qok">✓</span>':done?`<button class="btn sm" data-claim="${id}">+30 XP</button>`:`<small>${p}/${Q.t}</small>`}</div>`}).join('')}
   <button class="qchest${all&&!q.chest?' ready':''}" id="qChest" ${all&&!q.chest?'':'disabled'}>${chestSVG(q.chest,46)}<span>${q.chest?'Đã mở rương hôm nay. Mai quay lại nhé!':all?'Mở rương thưởng!':'Nhận đủ 3 nhiệm vụ để mở rương'}</span></button></div>`}
function bindQuest(){$$('#jdock [data-claim]').forEach(b=>b.onclick=()=>{const q=dq(),id=b.dataset.claim;if(q.c[id])return;q.c[id]=1;addXP(30);sfx.ok();floatText('+30 XP',b);save();syncMine();setTimeout(area,500)});

    const pool=ITEMS.filter(x=>!x.special&&x.price<900&&!P.own[x.id]);let gift=null;if(pool.length&&Math.random()<.35){gift=pool[Math.random()*pool.length|0];P.own[gift.id]=new Date().toISOString()}

/* Bài kiểm tra thăng hạng 14 ngày gần nhất + em đang chờ thi (đầy thanh) */
function promoBox(st){const lim=Date.now()-14*864e5,dt=a=>new Date(a).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  const rows=[];for(const v of st)for(const h of (v.prh||[]))if(Date.parse(h.at)>lim)rows.push({v,h});rows.sort((a,b)=>b.h.at.localeCompare(a.h.at));
  const wait=st.filter(v=>barFull(tierP(v),v.lp));
  return `<h2 class="sect">Bài kiểm tra thăng hạng (14 ngày)</h2><div class="tbox">${wait.length?`<p class="tnote">Đầy thanh, đang chờ thi: ${wait.map(v=>`${esc(v.name)} (lên ${TIERS[tierP(v)+1].n})`).join(', ')}.</p>`:''}${rows.length?rows.slice(0,15).map(({v,h})=>`<div class="row2"><span>${esc(v.name)}<br><small>${dt(h.at)} · ${TIERS[h.from].n} → ${TIERS[h.to].n} · ${h.c}/${h.n} câu${h.n3?` · mức 3 đúng ${h.ok3}/${h.n3}`:''}</small></span><b class="${h.ok?'y':'n'}">${h.pc}% ${h.ok?'Đạt':'Trượt'}</b></div>`).join(''):'<p class="tnote">Chưa có em nào làm bài kiểm tra thăng hạng.</p>'}</div>`}
function teacherExtra(kh,st,ix){const today=vnDay(),real=st.filter(v=>!v.mau);
  const idle=real.map(v=>{const d=v.st&&v.st.last_day;return {v,d:d?dayDiff(d,today):999}}).filter(x=>x.d>=3).sort((a,b)=>b.d-a.d);
  const stuck=[];for(const v of real)for(const [k,n] of Object.entries(v.fails||{})){if(n<3)continue;const b=v.best&&v.best[k];if(b&&b.st>0)continue;const [tid,lv]=k.split('|'),t=TOPICS.find(x=>x.id===tid);if(t)stuck.push({v,t,lv:+lv,n})}
  const tm={};for(const v of real)for(const [k,x] of Object.entries(v.lvt||{})){const g=tm[k]||(tm[k]={n:0,s:0});g.n+=x.n;g.s+=x.s}
  const tms=Object.entries(tm).map(([k,g])=>{const [tid,lv]=k.split('|'),t=TOPICS.find(x=>x.id===tid);return t&&t.khoi===kh?{t,lv:+lv,avg:g.s/g.n,n:g.n}:null}).filter(Boolean).sort((a,b)=>b.avg-a.avg);
  const mm=s=>`${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`;
  return promoBox(st)+`<h2 class="sect">Cần chú ý</h2><div class="tbox">${idle.length||stuck.length?

function deList(kh,st){const all=deTopics(kh),used=t=>t.status==='giao'||st.some(v=>v.best&&v.best[key(t,0)]);
  const tn=all.filter(t=>!isTL(t)),tl=all.filter(isTL);
  return [...tn.map((t,i)=>({t,lab:'TN'+(i+1)})),...tl.map((t,i)=>({t,lab:'TL'+(i+1)}))].filter(x=>used(x.t))}

function deCell(v,t){const k=key(t,0),b=v.best&&v.best[k],h=(v.deh&&v.deh[k])||[];
  if(!b)return {c:'part',txt:'—'};

  const best=b.s||0,first=h.length?h[0].pc:null,n=h.length;
  return {c:best>=80?'ok':best>=50?'late':'miss',txt:best+'%',sub:n>1?`đầu ${first}% · ${n} lần`:n===1?'1 lần':''}}

  const avg=x=>{const ps=st.map(v=>v.best&&v.best[key(x.t,0)]).filter(Boolean);return isTL(x.t)?`${ps.length}/${st.length} em`:ps.length?Math.round(ps.reduce((a,b)=>a+(b.s||0),0)/ps.length)+'% TB':'chưa ai làm'};
  return `<h2 class="sect">Điểm ôn tập</h2><div class="tbox"><div class="scrollx"><table class="trk de"><thead><tr><th>Học sinh</th>${D.map(x=>`<th>${x.lab}<div class="th2">${esc(x.t.title.slice(0,14))}</div></th>`).join('')}</tr></thead>
    <tbody>${st.map(v=>`<tr><td class="nm">${esc(v.name||'?')}${v.mau?' <small>(mẫu)</small>':''}</td>${D.map(x=>{const c=deCell(v,x.t);return `<td class="cell ${c.c}">${c.txt!=='—'&&!isTL(x.t)?`<button class="lnk dh" data-dh="${v.id}|${x.t.id}">${c.txt}</button>`:c.txt}${c.sub?`<div class="th2">${c.sub}</div>`:''}</td>`}).join('')}</tr>`).join('')}
    <tr class="avg"><td class="nm"><b>Cả khối</b></td>${D.map(x=>`<td class="th2">${avg(x)}</td>`).join('')}</tr></tbody></table></div>
    <p class="tnote">TN: điểm cao nhất (xanh ≥ 80%, vàng ≥ 50%, đỏ dưới 50%), dòng nhỏ là điểm lần đầu và số lần làm. Bấm điểm để xem từng lần. TL: ✓ là em đã bấm "Đã làm xong" (bài làm trong vở, thầy chấm trên lớp).</p></div>`}
function deHistBox(v,t){if(!v||!t)return;const h=(v.deh&&v.deh[key(t,0)])||[],b=(v.best||{})[key(t,0)]||{};

const fmtT=ms=>{const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};

  q.items.forEach((it,i)=>{const ok=G.tf[i]===it.ok;all=all&&ok;if(G.mode!=='rank')rows[i].classList.add(ok?'ok':'no')});G.ansTxt=q.items.map((it,i)=>`${'abcdef'[i]}) ${G.tf[i]?'Đúng':'Sai'}`).join('; ');

const norm=s=>s.replace(/\s/g,'').replace(/−/g,'-').replace(/,/g,'.');
function val(s){s=norm(s);if(/^-?\d+(\.\d+)?\/-?\d+(\.\d+)?$/.test(s)){const [a,b]=s.split('/').map(Number);return b?a/b:NaN}return /^-?\d*\.?\d+$/.test(s)?Number(s):NaN}

/* ---------- dạng mới: Sắp xếp lời giải (exsx) và Sơ đồ phân tích đi lên (exsd) ----------
   Chạm ô trống (dòng lời giải / ô sơ đồ) rồi chạm khối ở kho bên dưới để điền; chạm lại ô đang sáng để gỡ khối.
   Bản đồ: phải đúng hết mới tính đúng. Thi đấu: được điểm theo tỉ lệ dòng/ô đúng (G.frac). */
const SD_SLOT_S=20,SX_EXTRA_S=20; // giây cộng thêm khi Thi đấu: mỗi ô trống của sơ đồ / mỗi câu sắp xếp
const isQ2=q=>q&&(q.type==='exsx'||q.type==='exsd');
const q2Slots=q=>q.type==='exsd'?q.hid.length+q.hidc.length:q.steps.length;
const tsP=el=>window.__mjReady?MathJax.typesetPromise([el]).catch(()=>{}).then(()=>mathFit(el)):Promise.resolve();
const sdById=q=>Object.fromEntries(q.nodes.map(n=>[n.id,n]));
const sdOrder=q=>{const out=[],root=q.nodes.find(n=>!n.p),walk=n=>{out.push(n);q.nodes.filter(c=>c.p===n.id).forEach(walk)};if(root)walk(root);return out};

function q2Init(q){
  if(q.type==='exsx'){let id=0;const bl=[...q.steps.map((s,i)=>({t:s.t,k:'s',i})),...(q.bad||[]).filter(b=>!q.steps.some(s=>s.t===b.t)).map(b=>({t:b.t,k:'x',why:b.why||''}))];
    G.q2={blocks:shuffle(bl).map(b=>({...b,id:id++})),place:q.steps.map(()=>null),sel:null};return}
  const order=sdOrder(q),hid=new Set(q.hid),hidc=new Set(q.hidc),slots=[];
  order.forEach(n=>{if(hid.has(n.id))slots.push({key:'n'+n.id,kind:'n',id:n.id});if(hidc.has(n.id))slots.push({key:'c'+n.id,kind:'c',id:n.id})});
  const dedup=a=>a.filter(b=>!b.trap||!a.some(x=>!x.trap&&x.t===b.t));
  const nb=order.filter(n=>hid.has(n.id)).map(n=>({t:n.t,k:'n',nid:n.id})).concat((q.bad||[]).map(b=>({t:b.t,k:'n',why:b.why||'',trap:1})));
  const cb=order.filter(n=>hidc.has(n.id)).map(n=>({t:n.c,k:'c',nid:n.id})).concat((q.badc||[]).map(b=>({t:b.t,k:'c',why:b.why||'',trap:1})));
  let id=0;const nblk=shuffle(dedup(nb)).map(b=>({...b,id:id++})),cblk=shuffle(dedup(cb)).map(b=>({...b,id:id++}));
  G.q2={slots,nblk,cblk,fill:{},sel:(slots.find(s=>s.kind==='n')||slots[0]||{}).key||null}}
const q2Blk=id=>{const S=G.q2;return (S.blocks||S.nblk.concat(S.cblk)).find(b=>b.id===id)};

/* ---- sơ đồ: HTML (dùng cho màn làm bài, lời giải đúng, xem đáp án). v = {txt(key), cls(key), src(n), hl, live} ---- */
function sdHTML(q,v){const by=sdById(q),hid=new Set(q.hid),hidc=new Set(q.hidc),kids=id=>q.nodes.some(c=>c.p===id),H=k=>v.hl&&v.hl.has(k)?' hl':'';let h='';

    const why=hidc.has(n.id)?slot('c'+n.id,true,'? căn cứ'):(src&&src.c?`<span class="sd-chip${H('c'+n.id)}">${tex(src.c)}</span>`:'');

    if(!leaf)h+=`<div class="sd-jn" data-jn="${esc(n.id)}">${why||(hid.has(n.id)&&!src?'<span class="sd-pend">…</span>':'<span class="sd-dot"></span>')}</div>`});

// Sơ đồ đã điền đúng hết (lời giải đúng / xem đáp án)

/* ---- xếp cây nhánh ngang: kết luận ở trên, các ô cần có ở dưới, mũi tên đi lên.
   Mỗi nhánh con đặt sát nhánh bên cạnh nhất có thể, chỉ cần không chồng nhau ở cùng một tầng. ---- */
function sdPlace(ti){const GAP=14,VG=24,PAD=6;ti.style.width='2000px';
  const E={},J={},Wd={},dep={},par={},ids=[];
  ti.querySelectorAll('.sd-node').forEach(e=>{const id=e.dataset.node;ids.push(id);E[id]=e;J[id]=ti.querySelector(`.sd-jn[data-jn="${CSS.escape(id)}"]`);par[id]=e.querySelector('.sd-tb').dataset.par||'';
    Wd[id]=Math.max(e.offsetWidth,J[id]?J[id].offsetWidth:0)});
  const kids=id=>ids.filter(c=>par[c]===id),root=ids.find(id=>!par[id]);if(!root)return;
  const ht=k=>{const c=kids(k);return c.length?1+Math.max(...c.map(ht)):0};
  // nhánh lá đứng cạnh nhau, nhánh sâu nằm về một phía để mũi tên ngắn và không cắt nhau
  const order=id=>{const ks=kids(id),lv=ks.filter(k=>!ht(k)),dp=ks.filter(k=>ht(k));if(!dp.length||!lv.length)return ks;
    const before=lv.slice(0,Math.ceil(lv.length/2)),after=lv.slice(before.length);return dp.length===1?[...before,...dp,...after]:[...lv,...dp]};
  const lay=(id,d)=>{dep[id]=d;const half=Wd[id]/2,ks=order(id);if(!ks.length)return{pos:{[id]:0},L:[-half],R:[half]};
    const subs=ks.map(k=>lay(k,d+1)),offs=[];let L=null,R=null;
    subs.forEach(sb=>{if(!L){offs.push(0);L=sb.L.slice();R=sb.R.slice();return}
      let off=-Infinity;for(let k=0;k<Math.min(R.length,sb.L.length);k++)off=Math.max(off,R[k]+GAP-sb.L[k]);offs.push(off);
      sb.L.forEach((v,k)=>{L[k]=k<L.length?Math.min(L[k],v+off):v+off;R[k]=k<R.length?Math.max(R[k],sb.R[k]+off):sb.R[k]+off})});
    const mid=(offs[0]+offs[offs.length-1])/2,pos={[id]:0};subs.forEach((sb,i)=>{for(const x in sb.pos)pos[x]=sb.pos[x]+offs[i]-mid});
    return{pos,L:[-half,...L.map(v=>v-mid)],R:[half,...R.map(v=>v-mid)]}};
  const r=lay(root,0),minL=Math.min(...r.L),maxR=Math.max(...r.R),nd=Math.max(...Object.values(dep))+1,BH=Array(nd).fill(0),JH=Array(nd).fill(0);
  ids.forEach(id=>{BH[dep[id]]=Math.max(BH[dep[id]],E[id].offsetHeight);if(J[id])JH[dep[id]]=Math.max(JH[dep[id]],J[id].offsetHeight)});
  const Y=[PAD];for(let d=0;d<nd-1;d++)Y.push(Y[d]+BH[d]+VG+JH[d]+VG);
  ids.forEach(id=>{const x=r.pos[id]-minL+PAD,d=dep[id],e=E[id];e.style.left=(x-e.offsetWidth/2)+'px';e.style.top=Y[d]+'px';
    if(J[id]){J[id].style.left=(x-J[id].offsetWidth/2)+'px';J[id].style.top=(Y[d]+BH[d]+VG)+'px'}});

function sdArrow(x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,h=9,w=5.5,bx=x2-ux*h,by=y2-uy*h;

function q2Check(q){const S=G.q2,wrong=[];let ok=0,tot=0,right='';S.mark={};
  if(q.type==='exsx'){const runs=[];q.steps.forEach((s,i)=>{const r=runs[runs.length-1];if(r&&s.g&&r.g===s.g)r.e=i;else runs.push({g:s.g,s:i,e:i})});
    const runOf=i=>runs.findIndex(r=>r.s<=i&&i<=r.e);
    S.place.forEach((id,i)=>{const B=q2Blk(id);tot++;const good=B.k==='s'&&runOf(B.i)===runOf(i);S.mark[i]=good?'ok':'no';if(good){ok++;return}
      const r=runs[runOf(B.i)];wrong.push(B.k==='x'?`Dòng ${i+1}: <span class="q2b">${tex(B.t)}</span> là khối sai.${B.why?' '+tex(B.why):''}`:`Dòng ${i+1}: <span class="q2b">${tex(B.t)}</span> đúng nhưng phải ở dòng ${r.s===r.e?r.s+1:(r.s+1)+' hoặc '+(r.e+1)}.`)});
    G.ansTxt=S.place.map((id,i)=>(i+1)+') '+q2Blk(id).t).join('; ');right=sxRight(q)}

    // các ô lá cùng ô cha được đổi chỗ cho nhau
    S.slots.filter(s=>s.kind==='n').forEach(s=>{const n=by[s.id],leaf=!q.nodes.some(c=>c.p===n.id),g=leaf?'L'+n.p:'N'+n.id;(groups[g]=groups[g]||[]).push(s)});
    Object.values(groups).forEach(ss=>{const need=ss.map(s=>by[s.id].t);ss.forEach(s=>{const B=q2Blk(S.fill[s.key]);tot++;const j=!B.trap?need.indexOf(B.t):-1,good=j>=0;
      if(good){need.splice(j,1);ok++;nodeOk[s.id]=B.nid}S.mark[s.key]=good?'ok':'no';
      if(!good){if(!B.trap)hl.add('n'+B.nid);wrong.push(B.trap?`<span class="q2b">${tex(B.t)}</span> là khối sai.${B.why?' '+tex(B.why):''}`:`<span class="q2b">${tex(B.t)}</span> đúng nhưng đặt nhầm ô. Chỗ đúng của nó được tô viền vàng trong sơ đồ đúng.`)}})});
    S.slots.filter(s=>s.kind==='c').forEach(s=>{const B=q2Blk(S.fill[s.key]);tot++;const occ=nodeOk[s.id]||s.id,exp=by[occ].c,good=!B.trap&&B.t===exp;

    G.ansTxt=S.slots.map(s=>'ô '+s.key+': '+q2Blk(S.fill[s.key]).t).join('; ');right=sdFull(q,hl)}
  const all=ok===tot;G.done=true;G.frac=tot?ok/tot:0;$('#qc').classList.add('lock');if(G.mode==='rank')S.mark={}; // Thi đấu: không tô đúng/sai trong trận
  q2Draw();

  if(G.timeUp){G.qs.slice(G.k).forEach(x=>G.log.push(rankLogOf(x,false,null)));G.miss+=G.qs.length-G.k;G.k=G.qs.length}

function qBlocks(text){const out=[],re=/\\man\s*\{([^}]*)\}\s*\{([^}]*)\}|\\begin\{(ex|extf|exfb|exmatch|extl|exsx|exsd)\}[\s\S]*?\\end\{\3\}/g;let m,lv=-1;

    else out.push({lv:Math.max(lv,0),type:m[3],start:m.index,end:m.index+m[0].length,raw:m[0]})}
  return out}

function mergeP(d){const m0=P.matches||0;
  if(d.thd)P.thd={...d.thd,...(P.thd||{})}; // bài đã học lý thuyết cùng Cherry (gộp hai máy)
  if(d.rev&&Object.keys(d.rev).length>Object.keys(P.rev||{}).length)P.rev=d.rev;
  if(d.saved&&Object.keys(d.saved).length>Object.keys(P.saved||{}).length)P.saved=d.saved;
  if(d.st&&(d.st.last_day||'')>(P.st.last_day||''))P.st=d.st;
  for(const f of ['xp','matches'])if((d[f]||0)>(P[f]||0))P[f]=d[f];
  // bậc + thanh tiến trình đi cùng nhau: lấy bản ghi của máy có nhiều trận hơn (cùng mùa)
  if(!(d.season&&P.season&&d.season!==P.season)&&((d.matches||0)>m0||!Number.isInteger(P.tier))&&(Number.isInteger(d.tier)||d.lp!=null)){P.tier=tierOfP(d);P.lp=d.lp||0;if(d.shield!=null)P.shield=d.shield}
  for(const f of ['tdh','prh','prw'])if(Array.isArray(d[f])&&d[f].length>(P[f]||[]).length)P[f]=d[f];
  if(d.pr&&d.pr.d===vnDay()&&(!P.pr||P.pr.d!==d.pr.d||(d.pr.n||0)>(P.pr.n||0)))P.pr=d.pr;
  if(d.hist&&d.hist.length>(P.hist||[]).length)P.hist=d.hist;
  if(d.nick&&!P.nick)P.nick=d.nick;if(d.avatar!=null&&!P.avatar)P.avatar=d.avatar;
  if(d.ach)for(const [k,v] of Object.entries(d.ach))if(!P.ach[k])P.ach[k]=v;
  if(d.stats)for(const [k,v] of Object.entries(d.stats))if((v||0)>(P.stats[k]||0))P.stats[k]=v;
  if(d.best)for(const [k,b] of Object.entries(d.best)){if((b.st||0)>(P.best[k]||0))P.best[k]=b.st;if((b.s||0)>(P.score[k]||0))P.score[k]=b.s;if(b.t&&!P.pt[k])P.pt[k]=b.t}
  if(d.deh){P.deh=P.deh||{};for(const [k,h] of Object.entries(d.deh))if(Array.isArray(h)&&h.length>(P.deh[k]||[]).length)P.deh[k]=h}
  if(d.own)for(const [k,v] of Object.entries(d.own))if(!P.own[k])P.own[k]=v;
  if((d.spent||0)>(P.spent||0))P.spent=d.spent;if(d.eq&&!Object.keys(P.eq||{}).length)P.eq=d.eq;
  if(d.wk&&d.wk.w&&(!P.wk||!P.wk.w||d.wk.w>P.wk.w||(d.wk.w===P.wk.w&&(d.wk.xp||0)>(P.wk.xp||0))))P.wk=d.wk;
  if(d.dq&&d.dq.d===vnDay()&&(!P.dq||P.dq.d!==d.dq.d))P.dq=d.dq;
  if(d.season&&!P.season)P.season=d.season;if(d.seasons&&d.seasons.length>(P.seasons||[]).length)P.seasons=d.seasons;
  for(const f of ['fails','lvt','ccl'])if(d[f])for(const [k,v] of Object.entries(d[f]))if(!P[f][k])P[f][k]=v;
  if(d.tut)P.tut=1;if(d.follow&&!Object.keys(P.follow||{}).length)P.follow=d.follow;if((d.fseen||'')>(P.fseen||''))P.fseen=d.fseen;
  if(d.tlh){P.tlh=P.tlh||{};for(const [k,v] of Object.entries(d.tlh))if((v||0)>(P.tlh[k]||0))P.tlh[k]=v}
  if(d.rseen){P.rseen=P.rseen||{};for(const [k,v] of Object.entries(d.rseen)){const a=+String(v).split('|')[0],b=+String(P.rseen[k]||'').split('|')[0];if(P.rseen[k]==null||a>b)P.rseen[k]=v}}
  save()}

// Danh sách người chơi (bảng xếp hạng, bạn bè, theo dõi) chỉ tải lại sau mỗi 10 phút để giảm lưu lượng Supabase.
const PLAYERS_EVERY = 10 * 60000;
async function loadAll(force = false) {
  const sequence = ++syncSequence;
  // Phiên bản bài đã gồm cả hình đã dịch, nên chỉ tải lại kho bài khi bài hoặc hình thật sự đổi.
  // Dự phòng: 3 giờ tải lại hẳn một lần, phòng khi bài bị sửa thẳng trên Supabase mà không đổi updated_at.
  const version = !force && Date.now() - lastCatalog < 3 * 3600000 ? topicVersion : '';
  const withPlayers = force || Date.now() - lastPlayers >= PLAYERS_EVERY;
  const q = [version ? 'topics=' + encodeURIComponent(version) : '', withPlayers ? '' : 'players=0'].filter(Boolean).join('&');
  const j = await api('/api/sync' + (q ? '?' + q : ''));
  if (sequence !== syncSequence) return;
  specialAccess = j.specialAccess === true;
  if (Array.isArray(j.topics)) {
    TOPICS = j.topics.map(t => fromDoc(wrapDoc(t)));
    FIGS = j.figs || {};
    topicVersion = j.topicVersion || '';
    lastCatalog = Date.now();
  }
  ASG=j.assignments||[]; MOC=j.moc||{}; BAI_CHAT_KHOI=chatGrades(j.chatGrades);
  if (Array.isArray(j.players)) { PLAYERS=j.players; ACCS=j.accounts||[]; ACCS_DEL=j.removed||[]; REPS=j.reports||[]; lastPlayers = Date.now(); }
  lastSync = Date.now();
}

function reconcile(sent,r){if(!r||!P)return;if(r.xp<sent.xp)P.xp-=sent.xp-r.xp;if(r.lp<sent.lp)P.lp=Math.max(0,P.lp-(sent.lp-r.lp));
  for(const id of Object.keys(sent.own||{}))if(!r.own[id]){delete P.own[id];for(const [k,v] of Object.entries(P.eq))if(v===id)delete P.eq[k]}
  P.spent=r.spent+Math.max(0,(P.spent||0)-(sent.spent||0));save()}

const TIKZ_RE=/\\begin\{tikzpicture\}[\s\S]*?\\end\{tikzpicture\}/g;
// Hình từng bước (\begin{hinhbuoc}): mỗi bước là một khung đã dịch, khóa trong FIGS là hbFrame(tikz,k) (lib/latex.js).
// HBS chỉ sống trong một lần gọi tex(): figSwap ghi, figImg đọc ngay sau đó.
let HBS=[];
const figSwap=s=>{HBS=[];return String(s??'').replace(HINHBUOC,(_,b)=>{const h=parseHinhBuoc(b);HBS.push({hs:h.frames.map(f=>FIGS[f]),caps:h.caps});return `@@HB:${HBS.length-1}@@`})
  .replace(TIKZ_RE,c=>{const k=c.replace(/(^|[^\\])%.*$/gm,'$1'),h=FIGS[k];return h?`@@FIG:${h}@@`:'@@FIG:none@@'})};
const hbHTML=x=>{if(!x||!x.caps.length)return '';const n=x.caps.length;
  if(x.hs.some(h=>!h))return '<span class="figmiss">Hình từng bước chưa dịch xong</span>';
  return `<div class="hb"><div class="hb-pic" role="button" tabindex="0" aria-label="Chạm để xem bước tiếp theo">${x.hs.map((h,i)=>`<img class="fig${i?'':' on'}" src="/hinh/${h}" alt="Hình bước ${i+1}">`).join('')}<span class="hb-hint">chạm để tiếp ›</span></div>`+
    `<div class="hb-dots" aria-hidden="true">${x.caps.map((_,i)=>`<i${i?'':' class="on"'}></i>`).join('')}</div>`+
    `<div class="hb-cap" aria-live="polite"><b>Bước 1/${n}</b><span>${brOut(esc(x.caps[0]))}</span></div>${x.caps.map(c=>`<template>${brOut(esc(c))}</template>`).join('')}`+
    `<div class="hb-btns"><button type="button" class="hb-prev" disabled>‹ Lùi</button><button type="button" class="hb-next">Tiếp ›</button></div></div>`};
const figImg=s=>s.replace(/@@HB:(\d+)@@/g,(_,i)=>hbHTML(HBS[+i])).replace(/@@FIG:([0-9a-f]{40}|none)@@/g,(_,h)=>h==='none'?'<span class="figmiss">Hình chưa dịch</span>':`<img class="fig" src="/hinh/${h}" alt="Hình vẽ" loading="lazy">`);

     <button class="btn" type="submit">Báo thầy</button><button type="button" class="btn alt" id="lBack">Quay lại đăng nhập</button></form>`;
  if(view==='gv')w.innerHTML=`${head}<form id="lf" class="lform"><h2>Giáo viên</h2><label>Tên đăng nhập<input class="name" id="gU" autocomplete="username" autocapitalize="off"></label>
     <label>Mật khẩu<input class="name" id="gP" type="password" autocomplete="current-password"></label>${err}<button class="btn" type="submit">Đăng nhập</button><button type="button" class="btn alt" id="lBack">Quay lại</button></form>`;
  bindPins();
  $('#lChg')&&($('#lChg').onclick=()=>login('chg','',{name:$('#lName').value}));$('#lForgot')&&($('#lForgot').onclick=()=>login('forgot','',{name:$('#lName').value}));
  $('#lBack')&&($('#lBack').onclick=()=>login('in'));$('#lGv')&&($('#lGv').onclick=()=>login('gv'));
  if($('#lName'))$('#lName').oninput=()=>{const k=$('#lK');if(k)k.parentNode.remove()};
  const btn=$('#lf button[type=submit]');
  $('#lf').onsubmit=async e=>{e.preventDefault();if(btn.disabled)return;btn.disabled=true;btn.textContent='Đang kiểm tra…';
    const name=$('#lName')?.value.trim(),khoi=$('#lK')?.value,P0={name,khoi};
    try{
      if(view==='gv'){const r=await api('/api/auth/teacher',{username:$('#gU').value,password:$('#gP').value});return onLogin(r)}
      if(!name)return login(view,'Em nhập họ và tên.');
      if(view==='forgot'){const r=await api('/api/auth/forgot',{name,khoi});if(r.choose)return login(view,'',{...P0,choose:r.choose});msgBox('Đã báo thầy','Khi thầy đặt lại, mật khẩu của em là <b>0000</b>.');return login('in','',P0)}
      if(view==='chg'){const o=$('#lOld').value,n1=$('#lNew').value,n2=$('#lNew2').value;
        if(!pinOk(o)||!pinOk(n1))return login('chg','Mật khẩu gồm đúng 4 chữ số.',P0);if(n1!==n2)return login('chg','Hai lần nhập mật khẩu mới chưa khớp.',P0);
        const r=await api('/api/auth/pin',{name,khoi,old:o,pin:n1});if(r.choose)return login('chg','Có nhiều bạn trùng tên, em chọn khối rồi nhập lại.',{...P0,choose:r.choose});
        sfx.ok();msgBox('Đã đổi mật khẩu','Lần sau em đăng nhập bằng mật khẩu mới.');return login('in','',P0)}
      const pin=$('#lPin').value;if(!pinOk(pin))return login('in','Mật khẩu gồm đúng 4 chữ số.',P0);
      const r=await api('/api/auth/login',{name,khoi,pin});if(r.choose)return login('in','Có nhiều bạn trùng tên, em chọn khối rồi nhập lại mật khẩu.',{...P0,choose:r.choose});
      onLogin(r)
    }catch(err){sfx.no();login(view,esc(err.message),{...P0,choose:$('#lK')?[...$('#lK').options].map(o=>o.value):undefined})}}}
async function onLogin(r){TEACHER=r.acc.role==='teacher';SERVERP=r.data||null;
  topicVersion=''; lastCatalog=0;
  try{await loadAll(true)}catch(e){return msgBox('Chưa tải được dữ liệu',esc(e.message))}DBSTATE='ok';
  if(TEACHER)enter({id:'gv',name:r.acc.name||'Giáo viên',khoi:'8',teacher:true});else enter(r.acc,r.isDefault)}
function start(){started=true;if(SESS){const s=SESS;SESS=null;onLogin(s)}else login()}
(async()=>{try{const me=await api('/api/me');if(me&&me.acc)SESS=me}catch(e){}DBSTATE='ok';if(!started)start();else if(!ACC&&SESS){const s=SESS;SESS=null;onLogin(s)}})();
let refreshing = false;
async function refreshVisible() {
  if (!ACC || document.hidden || refreshing || Date.now() - lastSync < 45000) return;
  refreshing = true;
  const account = ACC;
  try { await loadAll(); if (ACC === account) softRefresh(); }
  catch (e) { if (e.status === 401 && ACC === account) { ACC=null; P=null; login('in','Phiên đăng nhập đã hết, em đăng nhập lại nhé.'); } }
  finally { refreshing = false; }
}
setInterval(refreshVisible, 60000);
document.addEventListener('visibilitychange', refreshVisible);
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});

/* đổi mật khẩu trong app: máy chủ kiểm tra mật khẩu cũ */
async function changePin(o,n){await api('/api/me/pin',{old:o,pin:n})}

/* ---------- thông báo bài tập (Web Push) ----------
   Học sinh bấm "Bật thông báo" ở màn chọn môn → máy gửi địa chỉ nhận thông báo lên /api/push.
   Máy chủ báo ngay khi thầy giao bài (app/api/admin/assign) và nhắc mỗi tối nếu chưa làm (scripts/nhac-bai.mjs). */
const pushOK=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const isIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
// an: không hiện gì · ios: iPhone chưa thêm app vào Màn hình chính · hoi: chưa bật · chan: em đã chặn · bat: đã bật
function pushState(){if(!ACC||ACC.teacher)return 'an';if(!pushOK())return isIOS()&&!standalone()?'ios':'an';const p=Notification.permission;return p==='granted'?'bat':p==='denied'?'chan':'hoi'}
const b64u=s=>{const r=atob((s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0))};
const sameKey=(a,b)=>{if(!a)return false;a=new Uint8Array(a);return a.length===b.length&&a.every((x,i)=>x===b[i])};
async function pushSubscribe(){const reg=await navigator.serviceWorker.ready,{publicKey}=await api('/api/push'),key=b64u(publicKey);
  let sub=await reg.pushManager.getSubscription();
  if(sub&&!sameKey(sub.options&&sub.options.applicationServerKey,key)){await sub.unsubscribe().catch(()=>{});sub=null}
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});
  await api('/api/push',{sub:sub.toJSON()});return sub}
async function pushOn(){if(Notification.permission!=='granted'&&await Notification.requestPermission()!=='granted')return false;await pushSubscribe();return true}
// Đăng nhập lại trên máy đã bật: cập nhật để thông báo về đúng tài khoản đang dùng máy này.
function pushRefresh(){if(pushState()==='bat')pushSubscribe().catch(()=>{})}
// Đăng xuất: máy này thôi nhận thông báo của tài khoản vừa thoát.
async function pushForget(){try{if(!pushOK())return;const reg=await navigator.serviceWorker.getRegistration(),sub=reg&&await reg.pushManager.getSubscription();if(sub)await api('/api/push',{endpoint:sub.endpoint},'DELETE')}catch(e){}}
function pushCard(){const s=pushState();
  if(s==='hoi')return `<div class="pushcard"><span class="pushico" aria-hidden="true">🔔</span><span><b>Bật thông báo bài tập</b><small>Cherry báo ngay khi thầy giao bài và nhắc em nếu chưa làm.</small></span><button class="btn" id="pushOn">Bật</button></div>`;
  if(s==='ios')return `<div class="pushcard"><span class="pushico" aria-hidden="true">🔔</span><span><b>Nhận thông báo bài tập trên iPhone</b><small>Mở app bằng Safari, bấm nút Chia sẻ <b>⬆︎</b> → <b>Thêm vào MH chính</b>. Sau đó mở app từ biểu tượng Cherry và bấm Bật thông báo.</small></span></div>`;
  if(s==='chan')return `<div class="pushcard off"><span class="pushico" aria-hidden="true">🔕</span><span><b>Thông báo đang bị chặn</b><small>Em vào Cài đặt của máy (hoặc biểu tượng ổ khóa cạnh địa chỉ web) để cho phép thông báo từ Học cùng Cherry.</small></span></div>`;
  return ''}
function bindPushCard(){const b=$('#pushOn');if(!b)return;b.onclick=async()=>{sfx.tap();b.disabled=true;
  try{if(await pushOn()){sfx.ok();toast('Đã bật thông báo. Thầy giao bài là máy em sẽ báo!')}else toast('Em chưa cho phép thông báo.')}
  catch(e){b.disabled=false;return msgBox('Chưa bật được thông báo','Máy em chưa kết nối được dịch vụ thông báo. Em kiểm tra mạng rồi bấm Bật lại nhé.')}
  const c=b.closest('.pushcard');if(c)c.outerHTML=pushCard()}}

function refresh(){const on=$$('.scr.on')[0]?.id;
  if(curK===CHUYEN_TOAN&&((on==='ontap'&&!canOpenSpecial())||(on==='tlde'&&(!canOpenSpecial()||!TOPICS.some(t=>t.id===tlT?.id)))))return grades();
  if(on==='login'&&!$('#lName')?.value)login();else if(on==='grades')refreshGrades();else if(on==='subj')subjects();else if(on==='shop')shop();else if(on==='friends'&&!$('#fq'))friends();else if(on==='area')area();else if(on==='journey')journey();else if(on==='thidx')thIdx();else if(on==='theory'&&thT){const x=TOPICS.find(y=>y.id===thT.id);
    // Làm mới tự động (60 giây/lần, khi quay lại tab) không được vẽ lại trang lý thuyết nếu nội dung không đổi, để học sinh không bị nhảy về ý 1.
    if(x&&(showsChat(x,thVersion)!==!!$('#thBody .cherry-chat')||JSON.stringify(showsChat(x,thVersion)?x.chat:x.lesson||x.theory)!==JSON.stringify(showsChat(x,thVersion)?thT.chat:thT.lesson||thT.theory)))theory(x,true)}else if(on==='ontap')onTap();else if(on==='tlde'&&tlT){const x=TOPICS.find(y=>y.id===tlT.id);if(x)tlDe(x)}else if(on==='redo')redo();else if(on==='ranked')ranked();else if(on==='board')board();
}

}
