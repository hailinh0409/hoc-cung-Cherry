<!DOCTYPE html>
<html lang="vi">
<head>
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0b4654"><link rel="apple-touch-icon" href="/apple-icon.png"><link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Học cùng Cherry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: vui, khích lệ, như một trò chơi phiêu lưu trên điện thoại
   IDEA: tháp đảo bay — mỗi màn là một hòn đảo, leo từ Mức 1 lên Mức 4
   PICTURE: bản đồ đảo nối bằng đường chấm, chú cú Toán đứng ở màn hiện tại
   COLOUR and TYPE: nền xanh biển sâu, đảo san hô cam, nhấn vàng chanh; Baloo 2 + Be Vietnam Pro
   LAYOUT: một cột dọc toàn màn hình, nút bấm lớn ở nửa dưới cho ngón cái */
:root{color-scheme:dark;--bg:#0b4654;--bg2:#06303a;--ink:#fffaf2;--mute:#a9d3d6;--coral:#ff7a59;--coral2:#e85a3a;--sun:#ffd23f;--ok:#2fd18b;--bad:#ff5d6c;--card:#fffaf2;--cink:#12313a}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg2);overflow:hidden}
body{color:var(--ink);font:16px/1.5 "Be Vietnam Pro",system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.app{position:relative;height:100%;height:100dvh;overflow:hidden;background:radial-gradient(120% 70% at 50% 0%,#127083 0%,var(--bg) 45%,var(--bg2) 100%)}
.scr{position:absolute;inset:0;display:none;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.scr.on{display:flex;animation:fade .35s ease}
h1,h2,.disp{font-family:"Baloo 2",system-ui,sans-serif;line-height:1.05;margin:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:16px;font-weight:700;font-size:17px;background:var(--sun);color:#3a2a00;box-shadow:0 5px 0 #c99a08;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c99a08}
.btn.alt{background:#fffaf2;color:var(--cink);box-shadow:0 5px 0 #b9c9c9}
.btn.co{background:var(--coral);color:#fff;box-shadow:0 5px 0 var(--coral2)}
.btn[disabled]{opacity:.45;pointer-events:none}
.sky i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.5;animation:tw 3s infinite ease-in-out}
/* intro */
#intro{align-items:center;justify-content:center;text-align:center;gap:18px;z-index:5}
.logo{position:relative;width:150px;height:150px}
.logo .ring{position:absolute;inset:0;border-radius:50%;border:6px dashed var(--sun);animation:spin 9s linear infinite}
.logo .core{position:absolute;inset:18px;border-radius:50%;background:var(--coral);display:grid;place-items:center;font:800 54px "Baloo 2";color:#fff;box-shadow:inset 0 -8px 0 var(--coral2),0 12px 30px #0006;animation:pop .7s cubic-bezier(.3,1.6,.5,1) both}
.brand{font:800 30px "Baloo 2";letter-spacing:.5px}
.brand span{display:inline-block;animation:rise .5s both}
.tap{color:var(--mute);animation:blink 1.4s infinite}
/* home */
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
.top h1{font-size:26px;flex:1}
.pill{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:#0006;font-weight:700;white-space:nowrap}
.ico{width:44px;height:44px;border-radius:14px;background:#0005;display:grid;place-items:center}
.sub{padding:0 16px;color:var(--mute);font-size:14px}
.map{position:relative;flex:1;margin:4px 0}
.map svg.path{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;z-index:1;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:130px}
.isle{position:relative;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font:800 36px "Baloo 2";background:var(--coral);color:#fff;box-shadow:inset 0 -7px 0 var(--coral2),0 16px 0 -6px #04232b88}
.isle::after{content:"";position:absolute;left:-14px;right:-14px;bottom:-18px;height:26px;border-radius:50%;background:#2fa58b;z-index:-1;box-shadow:inset 0 -6px 0 #1d7d68}
.node.open .isle{animation:pulse 1.6s infinite}
.node.lock .isle{background:#557b82;box-shadow:inset 0 -7px 0 #3f6168;color:#c5dadc}
.node.done .isle{background:var(--sun);color:#5a3f00;box-shadow:inset 0 -7px 0 #d6a90b}
.nlab{font-weight:700;font-size:14px;text-align:center;margin-top:16px;text-shadow:0 2px 4px #0008}
.stars{display:flex;gap:2px}
.stars svg{width:18px;height:18px}
.owl{position:absolute;width:74px;transition:left .8s cubic-bezier(.5,0,.3,1.3),top .8s cubic-bezier(.5,0,.3,1.3);transform:translate(-50%,-100%);pointer-events:none;animation:bob 2.2s ease-in-out infinite}
.owl.cheer{animation:jump .6s 2}
.owl.sad{animation:tilt .8s}
.owl .w1{transform-origin:24px 60px;animation:flap 2.2s infinite}
.owl .w2{transform-origin:76px 60px;animation:flap 2.2s infinite reverse}
.foot{display:flex;gap:10px;padding:8px 16px 16px}
.foot .btn{flex:1}
/* play */
.bar{display:flex;align-items:center;gap:10px;padding:12px 14px}
.prog{flex:1;height:14px;border-radius:99px;background:#0006;overflow:hidden}
.prog b{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--sun),#ffe98a);transition:width .5s}
.hearts{display:flex;gap:2px}
.hearts svg{width:24px;height:24px;transition:transform .3s,opacity .3s}
.hearts svg.lost{opacity:.25;transform:scale(.7)}
.meta{display:flex;justify-content:space-between;padding:0 16px 6px;font-weight:700;font-size:14px;color:var(--mute)}
.meta .combo{color:var(--sun)}
.stage{flex:1;overflow-y:auto;padding:4px 14px 16px;-webkit-overflow-scrolling:touch}
.card{background:var(--card);color:var(--cink);border-radius:22px;padding:18px 16px;box-shadow:0 8px 0 #0003;animation:slideIn .45s cubic-bezier(.2,1.2,.4,1)}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;background:#ffe8df;color:var(--coral2);font-size:13px;font-weight:700;margin-bottom:8px}
.stem{font-size:17px;line-height:1.6}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 14px;border-radius:16px;background:#fff;color:var(--cink);text-align:left;box-shadow:0 4px 0 #0002,inset 0 0 0 2px #d9e6e6;font-size:17px;animation:slideIn .45s both}
.opt .k{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:#e7f2f2;font-weight:800}
.opt.ok{background:#dcfbe9;box-shadow:0 4px 0 #1fa86b,inset 0 0 0 2px var(--ok)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.no{background:#ffe3e6;box-shadow:0 4px 0 #d23f4f,inset 0 0 0 2px var(--bad);animation:shake .4s}
.opt.no .k{background:var(--bad);color:#fff}
.lock .opt,.lock .mi{pointer-events:none}
.ansbox{margin-top:14px;min-height:58px;border-radius:16px;background:#eef6f6;box-shadow:inset 0 0 0 2px #cfe2e2;display:flex;align-items:center;justify-content:center;font:800 30px "Baloo 2";color:var(--cink);letter-spacing:1px}
.ansbox.ok{background:#dcfbe9;box-shadow:inset 0 0 0 3px var(--ok)}
.ansbox.no{background:#ffe3e6;box-shadow:inset 0 0 0 3px var(--bad);animation:shake .4s}
.ansbox:empty::before{content:"Nhập đáp số";font:600 16px "Be Vietnam Pro";color:#8aa7ab;letter-spacing:0}
.pad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:10px 14px 14px;background:#04262e}
.pad button{min-height:52px;border-radius:14px;background:#174d58;font:800 22px "Baloo 2";box-shadow:0 4px 0 #0a3038}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #0a3038}
.pad .go{grid-column:span 2;background:var(--sun);color:#3a2a00;box-shadow:0 4px 0 #c99a08;font-size:19px}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:14px}
.mcol{display:grid;gap:10px;align-content:start}
.mi{position:relative;min-height:62px;padding:10px 8px 10px 10px;border-radius:14px;background:#fff;box-shadow:0 4px 0 #0002,inset 0 0 0 2px #d9e6e6;font-size:15px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--cink);overflow-x:auto;animation:slideIn .45s both}
.mi.sel{box-shadow:0 4px 0 #c99a08,inset 0 0 0 3px var(--sun);transform:translateY(-2px)}
.mi .bd{position:absolute;top:-8px;right:-6px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;animation:pop .3s}
.mi.ok{box-shadow:0 4px 0 #1fa86b,inset 0 0 0 3px var(--ok)}
.mi.no{box-shadow:0 4px 0 #d23f4f,inset 0 0 0 3px var(--bad);animation:shake .4s}
.hint{font-size:13px;color:#5f7d82;margin-top:8px}
.chk{padding:10px 14px 14px}
.chk .btn{width:100%}
/* feedback sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:18px 16px calc(16px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .35s cubic-bezier(.2,1.1,.4,1);max-height:70%;overflow-y:auto}
.sheet.on{transform:none}
.sheet.ok{background:#dcfbe9;color:#0c4a2f}
.sheet.no{background:#ffe3e6;color:#6b1420}
.sheet h2{font-size:28px;margin-bottom:4px}
.sheet .sol{background:#fff9;border-radius:14px;padding:10px 12px;margin:10px 0;font-size:15px}
.sheet .btn{width:100%;margin-top:8px}
.float{position:absolute;z-index:6;font:800 30px "Baloo 2";color:var(--sun);text-shadow:0 3px 0 #0006;pointer-events:none;animation:up 1s forwards}
/* overlay + result */
.ovl{position:absolute;inset:0;z-index:7;display:none;align-items:center;justify-content:center;background:#03222acc;padding:20px}
.ovl.on{display:flex;animation:fade .25s}
.panel{width:100%;max-width:380px;background:var(--card);color:var(--cink);border-radius:26px;padding:24px 20px;text-align:center;animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
.panel h2{font-size:34px}
.panel p{margin:6px 0 14px;color:#4c6a70}
.panel .btn{width:100%;margin-top:10px}
.bigstars{display:flex;justify-content:center;gap:6px;margin:12px 0}
.bigstars svg{width:58px;height:58px;animation:pop .5s both}
.bigstars svg:nth-child(2){transform:translateY(-12px);animation-delay:.25s}
.bigstars svg:nth-child(3){animation-delay:.5s}
.stat{display:flex;justify-content:space-around;margin:6px 0 4px}
.stat b{display:block;font:800 26px "Baloo 2";color:var(--coral2)}
.lvlcard .num{font:800 72px "Baloo 2";color:var(--coral)}
input.name{width:100%;min-height:52px;border-radius:14px;border:2px solid #cfe2e2;padding:0 14px;font:600 17px "Be Vietnam Pro";color:var(--cink);background:#fff;margin-top:6px}
.cert{text-align:left}
.cert .row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed #cfe2e2}
.cert .row .stars svg{width:20px;height:20px}
canvas#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}
mjx-container{max-width:100%;overflow-x:auto;overflow-y:hidden}
@keyframes fade{from{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.2);opacity:0}}
@keyframes rise{from{transform:translateY(30px);opacity:0}}
@keyframes blink{50%{opacity:.3}}
@keyframes tw{50%{opacity:.1}}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes bob{50%{margin-top:-6px}}
@keyframes jump{40%{margin-top:-34px}}
@keyframes tilt{30%{rotate:-14deg}70%{rotate:10deg}}
@keyframes flap{0%,80%,100%{transform:rotate(0)}90%{transform:rotate(-18deg)}}
@keyframes slideIn{from{transform:translateY(24px);opacity:0}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.scr{overflow:hidden}
.gwrap{position:relative;flex:1;min-height:0;overflow-y:auto;display:flex;padding:12px 16px}
.ggrid{width:100%;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.gtile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:170px;padding:16px;border-radius:26px;background:var(--c);color:var(--t);box-shadow:inset 0 -9px 0 var(--d),0 10px 0 -2px #0003;text-align:left;overflow:hidden;transition:transform .1s}
.gtile:active{transform:scale(.96)}
.gtile::after{content:"";position:absolute;right:-30px;bottom:-30px;width:110px;height:110px;border-radius:50%;background:#ffffff26}
.gtile .gk{font-weight:700;font-size:15px;opacity:.9}
.gtile .gn{font:800 64px/0.9 "Baloo 2",sans-serif}
.gtile .gm{font-weight:700;font-size:14px;margin-top:auto}
.gtile .gs{display:flex;align-items:center;gap:4px;font-weight:800;font-size:14px}
.gtile .gs svg{width:18px;height:18px}
.gtile .gme{position:absolute;top:12px;right:12px;padding:2px 8px;border-radius:99px;background:#fffaf2;color:#12313a;font-size:11px;font-weight:800}
.gtile.mine{outline:4px solid #fffaf2;outline-offset:3px}
.ahead .top{justify-content:space-between}
.aband{position:relative;display:flex;align-items:center;gap:14px;margin:4px 16px 12px;padding:16px;border-radius:24px;background:var(--kc);color:var(--kt);box-shadow:inset 0 -8px 0 var(--kd);overflow:hidden;animation:slideIn .45s both}
.aband::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:#ffffff26}
.abig{flex:none;width:72px;height:72px;border-radius:20px;background:#fffaf2;color:var(--kd);display:grid;place-items:center;font:800 46px "Baloo 2",sans-serif}
.ak{font-size:13px;font-weight:700;opacity:.85}
.aband h1{font-size:34px}
.asub{font-size:14px;font-weight:600;opacity:.9}
.tlist{position:relative;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:4px 16px 12px}
.tcard{position:relative;display:flex;gap:14px;align-items:center;width:100%;padding:16px;border-radius:22px;background:var(--card);color:var(--cink);box-shadow:0 7px 0 #0003;animation:slideIn .45s both}
.tcard .badge{flex:none;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:var(--kc);color:var(--kt);font:800 24px "Baloo 2",sans-serif;box-shadow:inset 0 -5px 0 var(--kd)}
.tcard.done .badge{background:var(--ok);color:#fff;box-shadow:inset 0 -5px 0 #1fa86b}
.tcard h3{font:800 20px/1.1 "Baloo 2",sans-serif;margin:0}
.tcard .row{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#4c6a70;margin-top:4px}
.meter{height:8px;border-radius:99px;background:#e3eeee;overflow:hidden;margin-top:6px}
.meter b{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--kc),var(--sun))}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.mapscroll{position:relative;flex:1;overflow-y:auto}
.map{flex:none}
.node.open .isle{background:var(--kc);color:var(--kt);box-shadow:inset 0 -7px 0 var(--kd),0 16px 0 -6px #04232b88}
.node.done .isle{background:#fffaf2;color:var(--kd);box-shadow:inset 0 -7px 0 #c9d6da,0 16px 0 -6px #04232b88}
.tf{display:grid;gap:10px;margin-top:14px}
.tfrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 10px 10px 12px;border-radius:16px;background:#fff;box-shadow:0 4px 0 #0002,inset 0 0 0 2px #d9e6e6;animation:slideIn .45s both}
.tfrow .lbl{font-size:16px;overflow-x:auto}
.tfrow.ok{box-shadow:0 4px 0 #1fa86b,inset 0 0 0 2px var(--ok)}
.tfrow.no{box-shadow:0 4px 0 #d23f4f,inset 0 0 0 2px var(--bad);animation:shake .4s}
.tfb{display:flex;gap:6px}
.tfb button{width:52px;height:44px;border-radius:12px;font-weight:800;background:#e7f2f2;color:var(--cink)}
.tfb button.on.t{background:var(--ok);color:#fff}
.tfb button.on.f{background:var(--bad);color:#fff}
.lock .tfb button{pointer-events:none}
.mi .tx{max-width:100%;overflow-x:auto}
.cert .row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed #cfe2e2;text-align:left}
.pill svg{width:20px;height:20px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:800;background:#e7f2f2;color:#12313a;white-space:nowrap;margin-bottom:4px}
.chip.giao{background:#dcfbe9;color:#0c6b3f}.chip.nhap{background:#fff3c4;color:#7a5a00}.chip.an{background:#e3e3e3;color:#555}
#tbar{position:relative;padding:8px 16px 0}
.tbar{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:16px;background:#fffaf2;color:#12313a;font-size:14px}
.tbar .tinfo{flex:1}
.tbar .terr{margin-top:6px;color:#c0303f;font-size:13px}
.tbar .tsrc{margin-top:4px;font-size:12px;color:#5f7d82}
.tbar .tbtns{display:flex;flex-direction:column;gap:8px}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px;box-shadow:0 3px 0 #c99a08;white-space:nowrap}
.btn.sm.alt{box-shadow:0 3px 0 #b9c9c9}
.foot .btn{flex:1}
.rwrap{position:relative;flex:1;overflow-y:auto;padding:8px 16px 20px}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:#0005}
.seg button{flex:1;padding:9px 6px;border-radius:11px;font-weight:700;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--sun);color:#3a2a00}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:flex-end;gap:8px;margin:18px 0 8px}
.pod{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;animation:rise .6s both}
.pod .av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font:800 22px "Baloo 2",sans-serif;color:#fff;border:4px solid #fff3}
.pod .nm{font-weight:700;font-size:14px;line-height:1.2;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pod .sc{font-size:13px;color:var(--mute)}
.pod .blk{width:100%;border-radius:14px 14px 4px 4px;display:grid;place-items:center;font:800 30px "Baloo 2",sans-serif;color:#5a3f00}
.pod:nth-child(1) .blk{height:70px;background:#c9d6da}.pod:nth-child(2) .blk{height:100px;background:var(--sun)}.pod:nth-child(3) .blk{height:54px;background:#e7a36a}
.pod:nth-child(2){animation-delay:.15s}.pod:nth-child(3){animation-delay:.3s}
.pod:nth-child(2) .av{width:66px;height:66px;border-color:var(--sun)}
.rlist{display:grid;gap:8px}
.rrow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:16px;background:#ffffff12;animation:slideIn .4s both}
.rrow .rk{font:800 20px "Baloo 2",sans-serif;text-align:center;color:var(--mute)}
.rrow .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .cl{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--mute)}
.rrow .cl svg{width:14px;height:14px}
.rrow .pt{text-align:right;font-weight:800;white-space:nowrap}
.rrow .pt small{display:block;font-weight:600;font-size:12px;color:var(--mute)}
.rrow.me{background:var(--card);color:var(--cink)}
.rrow.me .rk,.rrow.me .cl,.rrow.me .pt small{color:#4c6a70}
.mine{margin:12px 0}
.mau{display:inline-block;padding:0 6px;border-radius:6px;background:#ffffff26;font-size:11px;font-weight:700;vertical-align:1px}
.pill.sm{padding:4px 10px;font-size:13px}
.ctop{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}

/* Chiều rộng nội dung theo từng màn, nền app luôn phủ hết khung nhìn. */
@media (min-width: 600px) {
  .app {
    --content-width: 960px;
    --reading-width: 760px;
    --gutter: clamp(20px, 4vw, 44px);
  }

  .scrollv, .gwrap, .ubar, .scr > .top, #gsub {
    width: 100%;
    max-width: var(--content-width);
    margin-inline: auto;
    padding-inline: var(--gutter);
  }

  #thBody, #tlBody, #redoBody, #frBody, #profBody, #boardBody {
    max-width: var(--reading-width);
  }

  .lwrap {
    width: 100%;
    max-width: 500px;
    margin-inline: auto;
    padding: 32px var(--gutter);
  }

  .mons, #subjBody > .foot, .opts {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  #subjBody > .foot { display: grid; padding-inline: 0; }
  #sOut:only-child { grid-column: 1 / -1; justify-self: center; min-width: 160px; }
  .ggrid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .dgrid { grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); }
  .shgrid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }

  .tmap {
    width: calc(100% - 2 * var(--gutter));
    max-width: 1100px;
    margin-inline: auto;
  }
  .plank { max-width: 460px; }
  .jbtns { right: max(var(--gutter), calc((100% - 1100px) / 2 + 12px)); }
  .jpanel {
    width: calc(100% - 108px);
    max-width: 440px;
    left: auto;
    right: max(calc(var(--gutter) + 72px), calc((100% - 1100px) / 2 + 84px));
  }

  #play > .bar, #play > .meta, #play > #dock, .stage {
    width: 100%;
    max-width: var(--reading-width);
    margin-inline: auto;
  }
  #play > .timer {
    width: calc(100% - 32px);
    max-width: calc(var(--reading-width) - 32px);
    margin-inline: auto;
  }
  .stage .card { padding: 24px; }
  .opt .ot { overflow-wrap: anywhere; }
  .pad { max-width: 420px; margin-inline: auto; border-radius: 18px 18px 0 0; }
  .chk .btn { max-width: 360px; margin-inline: auto; }
  .sheet, .shbar { width: 100%; max-width: var(--reading-width); margin-inline: auto; }
  .panel { max-width: 520px; }
}

@media (min-width: 720px) {
  #login .lwrap {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
    align-items: center;
    gap: 28px;
    max-width: 860px;
  }
  .lhead { margin-bottom: 0; }
}

@media (min-width: 960px) {
  .ggrid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}

@media (min-width: 480px) and (max-height: 580px) {
  .jbtns {
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: flex-end;
    left: 10px;
    bottom: calc(18px + env(safe-area-inset-bottom));
  }
  .jbtns .jbtn { width: 48px; height: 48px; }
  .jbtns .jbtn + .jbtn { margin-top: 0; }
  .jpanel {
    bottom: calc(84px + env(safe-area-inset-bottom));
    max-height: calc(100% - 140px);
  }
}

/* Đề và bàn phím đáp số cùng hàng khi chiều cao bị giới hạn. */
@media (min-width: 600px) and (max-height: 680px) {
  #play.on:has(#dock .pad) {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(214px, 32%);
    grid-template-rows: auto auto auto minmax(0, 1fr);
    max-width: 1000px;
    margin-inline: auto;
  }
  #play:has(#dock .pad) > :is(.bar, .timer, .meta) { grid-column: 1 / -1; }
  #play:has(#dock .pad) > .bar { grid-row: 1; }
  #play:has(#dock .pad) > .timer { grid-row: 2; }
  #play:has(#dock .pad) > .meta { grid-row: 3; }
  #play:has(#dock .pad) > .stage { grid-area: 4 / 1; min-height: 0; }
  #play:has(#dock .pad) > #dock { grid-area: 4 / 2; min-height: 0; overflow-y: auto; }
  #play:has(#dock .pad) .pad { padding-top: 4px; }
}

.cherry-chat {

}

.cherry-chat [hidden] {display:none!important}
.cherry-chat button {font:inherit;color:inherit;cursor:pointer}

.cherry-chat button:focus-visible,.cherry-chat .cat-hit:focus-visible {outline:3px solid #be640e;outline-offset:2px}
.chat-top,.chat-dock,.chat-finished {display:flex;align-items:center;gap:8px;flex:none;padding:10px 14px}
.chat-top {padding-bottom:4px;flex-wrap:wrap}

.chat-progress {min-width:36px;flex:1;height:12px;overflow:hidden;border-radius:12px;background:#e8dfcb}

.chat-current {padding:0 16px 4px;font-weight:700;font-size:14px;color:var(--chat-teal)}
.chat-feed {flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;position:relative}

.chat-avatar {width:40px;height:auto;flex:none}
.chat-col {display:grid;gap:8px;align-content:start}
.chat-bubble,.chat-knowledge,.chat-figure {background:white;border:2px solid var(--chat-line);border-radius:16px;padding:9px 13px;overflow-wrap:anywhere}

@keyframes cherry-dot {0%,60%,100% {transform:none;opacity:.5} 30% {transform:translateY(-4px);opacity:1}}
@media (prefers-reduced-motion:reduce) {
  .chat-dots i {animation:none}

<script>
{
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

// Câu hỏi có tham số (giống cú pháp game lớp học):
//   %@ a = ngaunhien(2, 9)        số nguyên ngẫu nhiên trong [2; 9]
//   %@ b = chon(2, 3, 5)          chọn ngẫu nhiên một giá trị
//   %@ c = a*b + 1                biểu thức từ các tham số trước
//   %@ dieukien: a != b           điều kiện phải thỏa (thử lại tối đa 300 lần)
// Trong đề viết {{a}}, {{2*a+b}}, {{+b}} (luôn có dấu), {{ps(p, q)}} (phân số tối giản).
// Không dùng tham số bên trong hình TikZ.

const FUNCS = new Set(['ngaunhien', 'chon', 'ps', 'abs', 'min', 'max', 'ucln', 'bcnn', 'sqrt', 'tron']);
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };

// ---- số hữu tỉ ----
class Frac {
  constructor(p, q) {
    if (!Number.isInteger(p) || !Number.isInteger(q) || q === 0) throw new Error('ps(p, q) cần p, q nguyên và q ≠ 0');
    const g = gcd(p, q) || 1, s = q < 0 ? -1 : 1;
    this.p = (s * p) / g; this.q = (s * q) / g;
  }
  get v() { return this.p / this.q; }
}
const isF = x => x instanceof Frac;
const toF = x => (isF(x) ? x : Number.isInteger(x) ? new Frac(x, 1) : null);
function arith(op, a, b) {
  if (isF(a) || isF(b)) {
    const A = toF(a), B = toF(b);
    if (A && B) {
      if (op === '+') return new Frac(A.p * B.q + B.p * A.q, A.q * B.q);
      if (op === '-') return new Frac(A.p * B.q - B.p * A.q, A.q * B.q);
      if (op === '*') return new Frac(A.p * B.p, A.q * B.q);
      if (op === '/') return new Frac(A.p * B.q, A.q * B.p);
    }
    a = isF(a) ? a.v : a; b = isF(b) ? b.v : b;
  }
  switch (op) {
    case '+': return a + b; case '-': return a - b; case '*': return a * b;
    case '/': if (b === 0) throw new Error('chia cho 0'); return a / b;
    case '%': return a % b; case '^': return a ** b;
  }
}
const num = x => (isF(x) ? x.v : x);

// ---- tách từ & phân tích biểu thức ----
function tokenize(s) {
  const t = []; let i = 0;
  while (i < s.length) {
    const c = s[i];
    if (/\s/.test(c)) { i++; continue; }
    const two = s.slice(i, i + 2);
    if (['==', '!=', '<=', '>=', '&&', '||'].includes(two)) { t.push(two); i += 2; continue; }
    if ('+-*/%^(),<>!'.includes(c)) { t.push(c); i++; continue; }
    const m = s.slice(i).match(/^(\d+(?:\.\d+)?|[A-Za-z_]\w*)/);
    if (!m) throw new Error(`ký tự lạ "${c}"`);
    t.push(m[1]); i += m[1].length;
  }
  return t;
}
function evaluate(src, env, rng = Math.random) {
  const t = tokenize(String(src)); let k = 0;
  const peek = () => t[k], eat = x => { if (t[k] !== x) throw new Error(`thiếu "${x}"`); k++; };
  const bin = (next, ops, f) => () => { let a = next(); while (ops.includes(peek())) { const o = t[k++]; a = f(o, a, next()); } return a; };
  const atom = () => {
    const x = t[k++];
    if (x === undefined) throw new Error('biểu thức dở dang');
    if (x === '(') { const v = or(); eat(')'); return v; }
    if (/^\d/.test(x)) return Number(x);
    if (peek() === '(') {
      if (!FUNCS.has(x)) throw new Error(`không có hàm ${x}`);
      k++; const args = [];
      if (peek() !== ')') { args.push(or()); while (peek() === ',') { k++; args.push(or()); } }
      eat(')');
      return call(x, args, rng);
    }
    if (!(x in env)) throw new Error(`chưa khai báo tham số ${x}`);
    return env[x];
  };
  const pow = () => { const a = atom(); if (peek() === '^') { k++; return arith('^', num(a), num(unary())); } return a; };
  const unary = () => {
    if (peek() === '-') { k++; const v = unary(); return isF(v) ? new Frac(-v.p, v.q) : -v; }
    if (peek() === '+') { k++; return unary(); }
    if (peek() === '!') { k++; return !unary(); }
    return pow();
  };
  const mul = bin(unary, ['*', '/', '%'], (o, a, b) => arith(o, a, b));
  const add = bin(mul, ['+', '-'], (o, a, b) => arith(o, a, b));
  const cmp = () => {
    const a = add();
    if (['==', '!=', '<', '>', '<=', '>='].includes(peek())) {
      const o = t[k++], x = num(a), y = num(add()), e = 1e-9;
      return o === '==' ? Math.abs(x - y) < e : o === '!=' ? Math.abs(x - y) >= e : o === '<' ? x < y : o === '>' ? x > y : o === '<=' ? x <= y + e : x >= y - e;
    }
    return a;
  };
  const and = bin(cmp, ['&&'], (o, a, b) => a && b);
  const or = bin(and, ['||'], (o, a, b) => a || b);
  const v = or();
  if (k < t.length) throw new Error(`thừa "${t[k]}"`);
  return v;
}
function call(f, a, rng) {
  const n = a.map(num);
  switch (f) {
    case 'ngaunhien': {
      const [lo, hi] = n;
      if (!Number.isInteger(lo) || !Number.isInteger(hi) || lo > hi) throw new Error('ngaunhien(a, b) cần a ≤ b nguyên');
      return lo + Math.floor(rng() * (hi - lo + 1));
    }
    case 'chon': if (!a.length) throw new Error('chon() cần ít nhất 1 giá trị'); return a[Math.floor(rng() * a.length)];
    case 'ps': return new Frac(n[0], n[1]);
    case 'abs': return isF(a[0]) ? new Frac(Math.abs(a[0].p), a[0].q) : Math.abs(n[0]);
    case 'min': return Math.min(...n); case 'max': return Math.max(...n);
    case 'ucln': return gcd(n[0], n[1]);
    case 'bcnn': return Math.abs(n[0] * n[1]) / (gcd(n[0], n[1]) || 1);
    case 'sqrt': return Math.sqrt(n[0]);
    case 'tron': { const d = n[1] ?? 0; return Math.round(n[0] * 10 ** d) / 10 ** d; }
  }
}

// ---- khai báo tham số ----
function parseSpec(lines) {
  const vars = [], conds = [];
  for (const raw of lines) {
    const l = raw.trim();
    if (!l) continue;
    let m = l.match(/^dieukien\s*:\s*(.+)$/i);
    if (m) { conds.push(m[1]); continue; }
    m = l.match(/^([A-Za-z_]\w*)\s*=\s*(.+)$/);
    if (!m) throw new Error(`dòng tham số không hiểu: "${l}"`);
    if (FUNCS.has(m[1])) throw new Error(`không đặt tên tham số trùng tên hàm: ${m[1]}`);
    vars.push({ name: m[1], expr: m[2] });
  }
  return { vars, conds };
}
function sampleEnv(spec, rng = Math.random) {
  for (let tries = 0; tries < 300; tries++) {
    const env = {};
    for (const v of spec.vars) env[v.name] = evaluate(v.expr, env, rng);
    if (spec.conds.every(c => evaluate(c, env, rng))) return env;
  }
  throw new Error('không tìm được bộ tham số thỏa điều kiện sau 300 lần thử');
}

// ---- in giá trị ----
function fmt(v, mode) {
  if (typeof v === 'boolean') return v ? 'đúng' : 'sai';
  if (isF(v)) {
    if (v.q === 1) return String(v.p);
    if (mode === 'ans') return `${v.p}/${v.q}`;
    return (v.p < 0 ? '-' : '') + `\\dfrac{${Math.abs(v.p)}}{${v.q}}`;
  }
  let s = Number.isInteger(v) ? String(v) : String(Math.round(v * 1e6) / 1e6);
  if (s.includes('.')) s = mode === 'ans' ? s.replace('.', ',') : s.replace('.', '{,}');
  return s;
}
function fill(str, env, mode = 'text') {
  if (typeof str !== 'string') return str;
  return str.replace(/\{\{(\+?)([^{}]+)\}\}/g, (_, plus, e) => {
    const v = evaluate(e, env);
    const s = fmt(v, mode);
    return plus && num(v) >= 0 ? '+' + s : s;
  });
}
function fillQ(q, env) {
  const f = s => fill(s, env);
  return {
    ...q, stem: f(q.stem), sol: f(q.sol),
    ...(q.hints && { hints: q.hints.map(f) }),
    ...(q.opts && { opts: q.opts.map(o => ({ ...o, t: f(o.t), ...(o.why && { why: f(o.why) }) })) }),
    ...(q.items && { items: q.items.map(o => ({ ...o, t: f(o.t), ...(o.why && { why: f(o.why) }) })) }),
    ...(q.traps && { traps: q.traps.map(x => ({ a: fill(x.a, env, 'ans'), why: f(x.why) })) }),
    ...(q.pairs && { pairs: q.pairs.map(p => p.map(f)) }),
    ...(q.ans && { ans: q.ans.map(a => fill(a, env, 'ans')) }),
    ...(q.steps && { steps: q.steps.map(x => ({ ...x, t: f(x.t) })) }),
    ...(q.nodes && { nodes: q.nodes.map(x => ({ ...x, t: f(x.t), c: f(x.c) })) }),
    ...(q.bad && { bad: q.bad.map(x => ({ ...x, t: f(x.t), ...(x.why && { why: f(x.why) }) })) }),
    ...(q.badc && { badc: q.badc.map(x => ({ ...x, t: f(x.t), ...(x.why && { why: f(x.why) }) })) }),
  };
}
// Sinh một bản cụ thể của câu hỏi (câu không có tham số giữ nguyên)
function instantiate(q, rng = Math.random) {
  if (!q.params) return q;
  const env = sampleEnv(parseSpec(q.params), rng);
  const { params, ...rest } = fillQ(q, env);
  return rest;
}

// Cú pháp:
//   \chude{Tên chủ đề}
//   \man{1}{Nhận biết}

//   các bước liền nhau cùng nhãn \buoc[1]{..} được đổi chỗ cho nhau

function takeCmd(body, cmd) {

  const g = group(body, k + cmd.length + 1);
  if (!g) return [body, null];
  return [body.slice(0, k) + body.slice(g[1]), g[0].trim()];

  const out = []; let g;
  while ((g = group(b, i))) { out.push(g[0]); i = g[1]; }

}

  const { name, args } = token;
  if (token.env) {
    if (!token.closed) error('Khối ' + name + ' chưa đóng \\end{' + name + '}');
    return token.closed;
  }
  if (name === 'theobuoc') {
    if (!args.length) error('\\theobuoc cần ít nhất một trạng thái {…}');
    return args.length > 0;
  }
  const count = LESSON_ARGS[name] ?? CHAT_ARGS[name];
  const filled = args.every((arg, index) => Boolean(arg) || (name === 'hinhmau' && index === 1));
  const valid = filled && (name === 'emdahoc'
    ? args.length >= 2 && args.length <= 5
    : args.length === count);
  if (!valid) error('\\' + name + ' cần ' + (name === 'emdahoc' ? '2–5' : count) + ' cặp {…} có nội dung');
  return valid;
}

function lessonLabel(source) {
  const match = /^\s*\[([^\]\n]*)\]/.exec(source);
  return { label: match?.[1].trim() || '', end: match?.[0].length || 0 };
}

function chatMath(text, warn) {
  // Không dùng regex lookbehind: Safari iOS < 16.4 báo lỗi cú pháp làm cả app không chạy.
  // Cặp "\\x" được nuốt trước nên "\\$" không bao giờ mở một công thức.
  if ([...text.matchAll(/\\[\s\S]|\$(?!\$)((?:\\.|[^$\\])+)\$/g)]
    .some(match => match[1] !== undefined && /[=<>]|\\Rightarrow\b/.test(match[1]))) {
    warn('Viết công thức có dấu so sánh hoặc suy ra trên dòng riêng \\[…\\]');
  }
}

function chatOptions(token, error, warn, locate) {
  const { label, end } = token.name === 'thu' ? lessonLabel(token.content) : { label: '', end: 0 };
  const question = group(token.content, end);
  const q = question?.[0].trim() || '';
  if (!q) error('Khối ' + token.name + ' cần câu hỏi {…}');
  const optionsSource = token.content.slice(question?.[1] ?? end);
  const opts = [];
  let cursor = 0;
  for (const cmd of lessonTokens(optionsSource, true)) {
    locate(token.contentStart + (question?.[1] ?? end) + cmd.start);
    if (optionsSource.slice(cursor, cmd.start).trim() || !['dung', 'sai'].includes(cmd.name)) {
      error('Chỉ đặt \\dung và \\sai sau câu hỏi trong khối ' + token.name);
    }
    cursor = cmd.end;
    if (!['dung', 'sai'].includes(cmd.name) || !lessonArgs(cmd, error)) continue;
    const [text, why] = cmd.args;
    opts.push({ text, ok: cmd.name === 'dung', why });
    chatMath(why, warn);
  }
  locate(token.start);
  if (optionsSource.slice(cursor).trim()) error('Khối ' + token.name + ' có nội dung ngoài phương án');
  if (opts.length < 2 || opts.length > 4 || opts.filter(option => option.ok).length !== 1) {
    error('Khối ' + token.name + ' cần 2–4 phương án, đúng một \\dung, mỗi phương án có giải thích');
  }
  if (new Set(opts.map(option => option.text)).size !== opts.length) error('Các phương án phải khác nhau');
  chatMath(q, warn);
  return { label, quiz: { q, opts } };
}

function chatFigureFields(name, source, error, state = false) {
  const result = {};
  for (const field of source.split(';').map(s => s.trim()).filter(Boolean)) {
    const [, key, value] = /^([a-z]+\d*)\s*=\s*(.*)$/.exec(field) || [];
    if (name === 'can') {
      if (key === 'trai' || key === 'phai') {
        const items = value ? value.split(/\s+\+\s+/).map(item => {
          const weight = /^q(?:\*([1-9]\d?))?$/.exec(item);
          const object = /^([ktb]):(.+)$/.exec(item);
          if (weight) return { kind: 'q', count: Number(weight[1] || 1) };
          if (object && object[2].trim()) return { kind: object[1], label: object[2].trim() };
          return null;
        }) : [];
        if (items.every(Boolean)) { result[key] = items; continue; }
      }
      if (key === 'nghieng' && /^(khong|trai|phai)$/.test(value)) { result[key] = value; continue; }
      if (key === 'ghichu') { result[key] = value; continue; }
    } else {
      if (/^dong[1-4]$/.test(key || '')) {
        const sides = value.split('=').map(side => side.trim()
          .replace(/(^|\s)([+-])\s+(?=\S)/g, '$1$2').split(/\s+/).filter(Boolean));
        if (sides.length === 2 && sides.every(side => side.length)) { result[key] = sides; continue; }
      }
      if (/^mui[1-3]$/.test(key || '')) { result[key] = value; continue; }
      if (state && key === 'dong' && /^[1-4]$/.test(value)) { result.dong = Number(value); continue; }
      if (state && key === 'to') {
        result.to = {};
        for (const pair of value.split(',').filter(Boolean)) {
          const [, term, color] = /^\s*([1-4][tp][1-9]\d*)\s*:\s*([a-z]+)\s*$/.exec(pair) || [];
          if (!term || !LESSON_COLORS.has(color)) error('Số hạng hoặc màu không hợp lệ: ' + pair);
          else result.to[term] = color;
        }
        continue;
      }
    }
    error('Tham số hoặc trạng thái hình ' + name + ' không hợp lệ: ' + field);
  }
  return result;
}

function chatTermExists(params, key) {
  const [, row, side, term] = /^([1-4])([tp])([1-9]\d*)$/.exec(key) || [];
  return Boolean(params['dong' + row]?.[side === 't' ? 0 : 1]?.[Number(term) - 1]);
}

function chatApplyState(figure, state, error) {
  if (!state || figure?.mau?.name !== 'dang-thuc') return figure;
  const params = { ...figure.mau.params, ...state };
  for (const key of Object.keys(state.to || {})) {
    if (!chatTermExists(params, key)) error('Khóa số hạng không có trong hình: ' + key);
  }
  if (state.dong && !params['dong' + state.dong]) error('Hình không có dòng ' + state.dong);
  return { ...figure, mau: { ...figure.mau, params } };
}

function lessonFigureToken(token, error, chat) {
  if (token.name === 'hinhmau' && lessonArgs(token, error)) {
    const [name, source] = token.args;
    if (chat && ['can', 'dang-thuc'].includes(name)) {
      const params = chatFigureFields(name, source, error);
      if (name === 'dang-thuc' && (!params.dong1 || [2, 3, 4].some(i => params['dong' + i] && !params['dong' + (i - 1)]))) {
        error('Hình dang-thuc cần các dòng liên tiếp, bắt đầu bằng dong1');
      }
      return { kind: 'mau', src: token.raw, mau: { name, params } };
    }
    if (name !== 'cat-tuyen') {
      error('Chưa có hình mẫu ' + name);
      return null;
    }
    const params = {};
    for (const field of source.split(';').map(s => s.trim()).filter(Boolean)) {
      const parts = field.match(/^(duong|diem|song-song|c)\s*=\s*(.+)$/);
      if (!parts) {
        error('Tham số hình mẫu không hợp lệ: ' + field);
        continue;
      }
      const [, key, value] = parts;
      const list = value.split(',').map(s => s.trim());
      if ((key === 'duong' && (list.length !== 3 || list.some(s => !s))) ||
          (key === 'diem' && (list.length !== 2 || list.some(s => !s))) ||
          (key === 'song-song' && !/^[01]$/.test(value)) ||
          (key === 'c' && !/^(trai|phai)$/.test(value))) {
        error('Tham số hình mẫu không hợp lệ: ' + field);
        continue;
      }
      params[key] = key === 'duong' || key === 'diem' ? list : value;
    }
    return { kind: 'mau', src: token.raw, mau: { name, params } };
  }
  if (token.name === 'hinhbuoc' || token.name === 'tikzpicture') {
    if (!lessonArgs(token, error)) return null;
    return { kind: token.name === 'hinhbuoc' ? 'hinhbuoc' : 'tikz', src: token.raw };
  }
  return null;
}

function lessonFigure(source, error, chat) {
  const tokens = lessonTokens(source);
  if (tokens.length !== 1 || (tokens[0]?.raw !== source.trim()) ||
      !['tikzpicture', 'hinhbuoc', 'hinhmau'].includes(tokens[0]?.name)) {
    error('Cần một hình TikZ, hinhbuoc hoặc \\hinhmau');
    return null;
  }
  return lessonFigureToken(tokens[0], error, chat);
}

function lessonState(source, error, figure) {
  const name = figure?.mau?.name;
  if (name === 'can' || name === 'dang-thuc') return chatFigureFields(name, source, error, true);
  const state = {};
  for (const field of source.split(';').map(s => s.trim()).filter(Boolean)) {
    const match = field.match(/^([a-z]+)\s*=\s*(.+)$/);
    const [, key, value] = match || [];
    if (key === 'to' || key === 'do') {
      const angles = state[key] ||= {};
      for (const pair of value.split(',')) {
        const entry = pair.trim().match(/^([^:\s]+)\s*:\s*(\S.*)$/);
        const [, angle, label] = entry || [];
        if (!LESSON_ANGLE.test(angle || '')) error('Khóa góc không hợp lệ: ' + (angle || pair.trim()));
        else if (key === 'to' && !LESSON_COLORS.has(label)) error('Màu góc không hợp lệ: ' + label);
        else angles[angle] = label;
      }
    } else if (key === 'so' && (value === 'an' || value === 'hien')) state.so = value;
    else if (key === 'vung' && LESSON_REGIONS.has(value)) state.vung = value;
    else if (key === 'buoc' && /^\d+$/.test(value) && Number(value) >= 1 && Number(value) <= HB_MAX) state.buoc = Number(value);
    else error('Trạng thái hình không hợp lệ: ' + field);
  }
  return state;
}

function lessonQuiz(args, error, chat = false) {
  const [q, correct, wrong, explainCorrect, explainWrong] = args;
  if (correct === wrong) error('Hai phương án phải khác nhau');
  if (chat) return { q, opts: [
    { text: correct, ok: true, why: explainCorrect },
    { text: wrong, ok: false, why: explainWrong },
  ] };
  return { q, correct, wrong, explainCorrect, explainWrong };
}

function lessonBoundary(token, error, warn, chat = false, locate = () => {}) {
  const opening = token.name === 'modau';
  const boundary = opening
    ? { cherry: '', cauhoi: '', nutbuoc: '', fig: null }
    : { cherry: '', fig: null, quiz: null, emdahoc: [] };
  if (!lessonArgs(token, error)) return boundary;
  let after;
  for (const cmd of lessonTokens(token.content, chat)) {
    locate(token.contentStart + cmd.start);
    const [a] = cmd.args;
    const { name } = cmd;
    if (['tikzpicture', 'hinhbuoc', 'hinhmau'].includes(name)) {
      boundary.fig = lessonFigureToken(cmd, error, chat);
      continue;
    }
    if (!lessonArgs(cmd, error)) continue;
    if (chat && !cmd.env) chatLessonMath(cmd, warn);
    if (name === 'cherry' || name === 'loidan') {
      boundary.cherry = a;
      if ([...a].length > 120) warn('\\cherry dài hơn 120 kí tự');
    } else if (opening && (name === 'cauhoi' || name === 'nutbuoc')) boundary[name] = a;
    else if (!opening && (name === 'thungay' || name === 'thu')) {
      if (chat && boundary.quiz) error('Khối ketbai chỉ có một câu hỏi');
      if (name === 'thu') {
        const parsed = chatOptions(cmd, error, warn, offset => locate(token.contentStart + offset));
        boundary.quiz = parsed.quiz;
        if (parsed.label) boundary.label = parsed.label;
      } else boundary.quiz = lessonQuiz(cmd.args, error, chat);
    } else if (chat && !opening && name === 'saukhitra') {
      if (!boundary.quiz) error('\\saukhitra cần theo sau câu hỏi');
      else after = { source: a, at: token.contentStart + cmd.start };
    }
    else if (!opening && name === 'emdahoc') boundary.emdahoc = cmd.args;
    else if (name === 'hinhrieng') boundary.fig = lessonFigure(a, error, chat);
  }
  if (after) {
    locate(after.at);
    boundary.after = lessonState(after.source, error, boundary.fig);
    chatApplyState(boundary.fig, boundary.after, error);
  }
  locate(token.start);
  if (opening && !boundary.fig) error('Khối modau cần có hình');
  if (opening && !boundary.cauhoi) error('Khối modau cần có \\cauhoi');
  if (!opening && !boundary.quiz) error(chat ? 'Khối ketbai cần có thu hoặc \\thungay' : 'Khối ketbai cần có \\thungay');
  return boundary;
}

function lessonPart(title = '', goal = '') {
  return { title, goal, recap: '', fig: null, screens: [] };
}

function legacyLesson(items, lesson) {
  let part = lessonPart(), started = false;
  for (const { k, title, body, sol, correct, wrong, explainCorrect, explainWrong, template, value } of items) {
    if (k === 'loidan') {
      if (started) lesson.parts.push(part);
      part = lessonPart();
      started = true;
      continue;
    }
    started = true;
    if (!part.title && title) part.title = title;
    if (!part.fig && (LESSON_RECAP.has(k) || k === 'luuy')) {
      const staticFigure = lessonTokens(body).find(token => token.name === 'tikzpicture' && token.closed);
      if (staticFigure) part.fig = { kind: 'tikz', src: staticFigure.raw };
    }
    if (k === 'thungay') part.screens.push({ type: 'quiz', quiz: { q: body, correct, wrong, explainCorrect, explainWrong } });
    else if (k === 'vidu') part.screens.push({ type: 'vidu', body, sol });
    else if (k === 'hinhbuoc' || k === 'giaimau') part.screens.push({ type: k === 'hinhbuoc' ? 'steps' : k, body });
    else if (k === 'minhhoa') part.screens.push({ type: 'lab', kind: k, template, value });
    else part.screens.push({ type: 'read', kind: k, title, body });
  }
  if (started) lesson.parts.push(part);
  for (const item of lesson.parts) item.recap = lessonRecap(item);
}

function lessonRecap(part) {
  return part.screens.filter(sc => LESSON_RECAP.has(sc.kind)).map(sc => sc.body).join(' \\\\ ');
}

function chatLessonMath(cmd, warn) {
  const { name, args } = cmd;
  if (['hinhchung', 'hinhrieng', 'hinhmau', 'trangthai', 'saukhitra', 'theobuoc'].includes(name)) return;
  if (name === 'thungay' || name === 'emtinh') {
    for (const i of [0, 3, 4]) chatMath(args[i] || '', warn);
  } else if (name === 'thaotac') {
    chatMath(args[2], warn);
  } else args.forEach(text => chatMath(text, warn));
}

function parseLesson(body, errors, warnings, chatLine = 0) {
  const chat = Boolean(chatLine);
  const tokens = lessonTokens(body, chat);
  const legacy = !chat && !tokens.some(t => t.name === 'phan');
  const lesson = { modau: null, parts: [], ketbai: null, legacy };
  let at = 0;
  const locate = offset => { at = offset; };
  const diagnostic = msg => chat
    ? { line: chatLine + body.slice(0, at).split('\n').length - 1, msg: 'Bài chat: ' + msg }
    : { msg: 'Bài giảng: ' + msg };
  const error = msg => errors.push(diagnostic(msg));
  const warn = msg => warnings.push(diagnostic(msg));
  const screenLocations = new Map();
  const partLocations = new Map();
  if (legacy) {
    const theory = parseTheory(body, errors);
    for (const cmd of tokens.filter(t => t.name === 'modau' || t.name === 'ketbai')) {
      lesson[cmd.name] = lessonBoundary(cmd, error, warn);
    }
    legacyLesson(theory, lesson);
    return { theory, lesson };
  }

  // Dùng bộ đọc cũ cho các lệnh cũ ở cấp màn. Các khối và đối số mới thuộc riêng lesson.
  const oldNames = new Set([...Object.keys(THEORY_KINDS), 'loidan', 'thungay', 'minhhoa', 'hinhbuoc', 'giaimau']);
  const oldCommands = tokens.filter(t => oldNames.has(t.name));
  const theory = !chat && oldCommands.length ? parseTheory(oldCommands.map(t => t.raw).join('\n'), errors) : [];
  let part, pending = {}, previous, lastName;
  let stepStates, calcCommand;
  const hasQuestion = screen => ['quiz', 'tap', 'region', 'calc'].includes(screen?.type);
  const figureFor = (screen = pending) => screen?.fig || part?.fig;
  const stateFor = (source, screen = pending) => lessonState(source, error, chat ? figureFor(screen) : undefined);
  const setAfter = (target, source, screen) => {
    target.after = stateFor(source, screen);
  };
  for (const [index, cmd] of tokens.entries()) {
    const { name, args: [a, b, c, d, e, f] } = cmd;
    locate(cmd.start);
    const preceding = lastName;
    lastName = name;
    if (stepStates && name !== 'vidu') {
      error('\\theobuoc phải đứng ngay trước \\vidu');
      stepStates = undefined;
    }
    if (name === 'modau' || name === 'ketbai') {
      if (lesson[name]) error('Chỉ được có một khối ' + name);
      lesson[name] = lessonBoundary(cmd, error, warn, chat, locate);
      part = undefined;
      continue;
    }
    if (name === 'phan') {
      if (!lessonArgs(cmd, error)) continue;
      part = lessonPart(a, b);
      lesson.parts.push(part);
      partLocations.set(part, cmd.start);
      pending = {};
      previous = undefined;
      continue;
    }
    if (!part) {
      error('\\' + name + ' cần nằm trong một phần');
      continue;
    }
    if (!lessonArgs(cmd, error)) continue;
    if (chat && !cmd.env) chatLessonMath(cmd, warn);
    if (name === 'cherry' || name === 'loidan') {
      pending.cherry = a;
      if ([...a].length > 120) warn('\\cherry dài hơn 120 kí tự');
      continue;
    }
    if (name === 'nhaclai') { part.recap = a; continue; }
    if (name === 'hinhchung') { part.fig = lessonFigure(a, error, chat); continue; }
    if (name === 'hinhrieng') { pending.fig = lessonFigure(a, error, chat); continue; }
    if (name === 'trangthai') { pending.state = stateFor(a); continue; }
    if (name === 'theobuoc') { stepStates = cmd.args; continue; }
    if (name === 'saukhitra' && chat) {
      if (previous?.type === 'calc' && ['tinh', 'emtinh'].includes(preceding)) {
        setAfter(previous.calc.items.at(-1), a, previous);
      } else if (hasQuestion(previous) && ['thu', 'thungay', 'chamhinh', 'chamvung', 'nhac'].includes(preceding)) {
        setAfter(previous, a, previous);
      } else if (tokens[index + 1]?.name === 'thungay') {
        pending.after = stateFor(a);
      } else error('\\saukhitra cần theo sau một câu hỏi hoặc thao tác chạm');
      continue;
    }
    if (name === 'saukhitra') {
      const after = lessonState(a, error);
      // Bài mẫu đặt sau câu hỏi; cú pháp soạn cũng cho phép đặt trước.
      if (previous?.type === 'quiz' && preceding === 'thungay' && tokens[index + 1]?.name !== 'thungay') previous.after = after;
      else pending.after = after;
      continue;
    }
    if (name === 'chuyen') {
      pending.toggle = [{ label: a, state: stateFor(b) }, { label: c, state: stateFor(d) }];
      continue;
    }
    if (name === 'nhac') {
      if (previous?.type !== 'tap' || !['chamhinh', 'nhac'].includes(preceding)) error('\\nhac cần theo sau \\chamhinh');
      else if (!(chat && figureFor(previous)?.mau?.name === 'dang-thuc') && !LESSON_ANGLE.test(a)) error('Khóa góc không hợp lệ: ' + a);
      else previous.tap.nhac[a] = b;
      continue;
    }
    if (name === 'ketluan') {
      if (previous?.type !== 'calc' || !(preceding === 'emtinh' || (chat && ['tinh', 'saukhitra'].includes(preceding)))) error('\\ketluan cần theo sau \\emtinh');
      else previous.calc.ketluan = a;
      continue;
    }

    let screen;
    if (LESSON_RECAP.has(name) || name === 'nhanxet') screen = { type: 'read', kind: name, title: a, body: b };
    else if (name === 'luuy') screen = { type: 'read', kind: name, title: 'Cần nhớ', body: a };
    else if (name === 'vidu') {
      screen = { type: 'vidu', body: a, sol: b };
      if (stepStates) {
        if (stepStates.length > b.split(/\\\\/).filter(step => step.trim()).length) {
          error('\\theobuoc có nhiều trạng thái hơn số bước của \\vidu');
        }
        screen.stepStates = stepStates.map(source => stateFor(source));
        stepStates = undefined;
      }
    } else if (name === 'thu') {
      const { label, quiz } = chatOptions(cmd, error, warn, locate);
      screen = { type: 'quiz', label: label || 'Thử ngay', quiz };
    } else if (name === 'thungay') screen = { type: 'quiz', quiz: lessonQuiz(cmd.args, error, chat) };
    else if (name === 'thaotac') {
      if (cmd.label && cmd.label !== 'lech') error('Nhãn của \\thaotac chỉ nhận [lech]');
      const act = { label: a, state: stateFor(b, preceding === name ? previous : pending), say: c, warn: cmd.label === 'lech' };
      if (preceding === name && previous?.type === 'act') {
        previous.acts.push(act);
        continue;
      }
      screen = { type: 'act', acts: [act] };
    }
    else if (name === 'chamhinh') {
      if (!(chat && figureFor()?.mau?.name === 'dang-thuc') && !LESSON_ANGLE.test(b)) error('Khóa góc không hợp lệ: ' + b);
      screen = { type: 'tap', tap: { prompt: a, ans: b, ok: c, hint: d, nhac: {} } };
    } else if (name === 'chamvung') {
      if (!LESSON_REGIONS.has(b)) error('Khóa vùng không hợp lệ: ' + b);
      screen = { type: 'region', region: { prompt: a, key: b, ok: c } };
    } else if (name === 'truot') screen = { type: 'slide', slide: { label: a, after: b } };
    else if (name === 'emtinh' || name === 'tinh') {
      const consecutive = previous?.type === 'calc' &&
        (preceding === name || (chat && preceding === 'saukhitra' && calcCommand === name));
      const item = name === 'tinh'
        ? chatOptions(cmd, error, warn, locate).quiz
        : { ...lessonQuiz([a, b, c, d, e], error, chat), state: stateFor(f, consecutive ? previous : pending) };
      calcCommand = name;
      if (consecutive) {
        previous.calc.items.push(item);
        continue;
      }
      screen = { type: 'calc', calc: { items: [item], ketluan: '' } };
    } else if (name === 'xemtungbuoc') screen = { type: 'steps' };
    else if (name === 'hinhbuoc') screen = { type: 'steps', body: cmd.raw, fig: lessonFigureToken(cmd, error) };
    else if (name === 'minhhoa') screen = { type: 'lab', kind: name, template: a, value: b };
    else if (name === 'giaimau') screen = { type: 'giaimau', body: cmd.raw };
    else {
      error('\\' + name + ' không phải lệnh màn hoặc lệnh gắn');
      continue;
    }
    previous = { ...pending, ...screen };
    part.screens.push(previous);
    screenLocations.set(previous, cmd.start);
    pending = {};
  }
  if (stepStates) error('\\theobuoc phải đứng ngay trước \\vidu');
  locate(0);
  if (chat && !lesson.parts.length) error('Cần ít nhất một \\phan');
  if (chat && !/\\ten\b/.test(body)) warn('Bài chưa dùng \\ten để gọi tên học sinh');
  if (!lesson.modau) warn('Thiếu khối modau');
  if (!lesson.ketbai) warn('Thiếu khối ketbai');
  for (const item of lesson.parts) {
    const { title, screens, fig } = item;
    locate(partLocations.get(item));
    if (!screens.length) error('Phần "' + title + '" chưa có màn');
    if (chat && screens.length && !screens.some(hasQuestion)) warn('Phần "' + title + '" chưa có câu hỏi');
    if (screens.length > 10) warn('Phần "' + title + '" có hơn 10 màn');
    if (!item.recap) item.recap = lessonRecap(item);
    for (const [index, screen] of screens.entries()) {
      locate(screenLocations.get(screen));
      const figure = screen.fig || fig;
      if (chat && figure?.mau?.name === 'dang-thuc') {
        let current = chatApplyState(figure, screen.state, error);
        if (screen.tap) {
          for (const key of [screen.tap.ans, ...Object.keys(screen.tap.nhac)]) {
            if (!chatTermExists(current.mau.params, key)) error('Khóa số hạng không có trong hình: ' + key);
          }
        }
        for (const toggle of screen.toggle || []) chatApplyState(current, toggle.state, error);
        for (const state of screen.stepStates || []) current = chatApplyState(current, state, error);
        for (const act of screen.acts || []) current = chatApplyState(current, act.state, error);
        for (const calc of screen.calc?.items || []) {
          current = chatApplyState(current, calc.state, error);
          current = chatApplyState(current, calc.after, error);
        }
        chatApplyState(current, screen.after, error);
      }
      if (['tap', 'region', 'slide'].includes(screen.type) && figure?.kind !== 'mau') {
        error('Phần "' + title + '", màn ' + (index + 1) + ' cần hình mẫu');
      }
      if (screen.type === 'read' && !figure && !lessonTokens(screen.body).some(token =>
        token.closed && (token.name === 'tikzpicture' || token.name === 'hinhbuoc'))) {
        warn('Phần "' + title + '", màn ' + (index + 1) + ' chỉ có chữ');
      }
    }
  }
  return { theory, lesson };
}

function chatGrades(value) {
  if (!Array.isArray(value)) return [];
  return [...new Set(value.map(Number).filter(grade => Number.isInteger(grade) && grade >= 6 && grade <= 12))]
    .sort((a, b) => a - b);
}

function chatMaskComments(source) {
  return source.replace(/(^|[^\\])%[^\r\n]*/gm, (_, prefix) =>
    prefix + ' '.repeat(_.length - prefix.length));
}

function chatBlockRange(source, environment) {
  const re = new RegExp('\\\\(begin|end)\\s*\\{' + environment + '\\}', 'g');
  const markers = [...chatMaskComments(source).matchAll(re)];
  if (!markers.length) return null;
  const [start, end] = markers;
  if (markers.length !== 2 || start[1] !== 'begin' || end[1] !== 'end') {
    return { error: 'Cần đúng một khối ' + environment + ' có đủ lệnh mở và đóng.', start: start.index };
  }
  return { start: start.index, end: end.index + end[0].length };
}

function inspectChatSource(source, { standalone = false } = {}) {
  const raw = String(source || '');
  const block = chatBlockRange(raw, 'baichat');
  const line = raw.slice(0, block?.start || 0).split(/\r\n|\n|\r/).length;
  const reject = msg => ({ chat: null, block: '', errors: [{ line, msg }], warnings: [] });
  if (!block || block.error) return reject(block?.error || 'Dán một khối \\begin{baichat}…\\end{baichat}.');
  if (standalone && chatMaskComments(raw.slice(0, block.start) + '\n' + raw.slice(block.end)).trim()) {
    return reject('Ô Bản chat chỉ nhận khối baichat.');
  }
  const text = raw.slice(block.start, block.end);
  const parsed = parseBank('\\chude{Bài chat}\n' + text);
  const locate = item => ({ ...item, line: Math.max(line, line + (item.line || 2) - 2) });
  return { chat: parsed.chat, block: text, errors: parsed.errors.map(locate), warnings: parsed.warnings.map(locate) };
}

function replaceChatBlock(topicSource, chatBlock) {
  const raw = String(topicSource || '');
  const current = chatBlockRange(raw, 'baichat');
  if (current?.error) throw new Error(current.error);
  if (current) return raw.slice(0, current.start) + chatBlock + raw.slice(current.end);

  const old = chatBlockRange(raw, 'lythuyet');
  if (old?.error) throw new Error(old.error);
  const masked = chatMaskComments(raw);
  const heading = /\\chude\s*\{/.exec(masked);
  const end = old?.end ?? (heading && group(masked, heading.index + 6)?.[1]);
  if (!end) throw new Error('Chủ đề cần có \\chude{Tên chủ đề} trước khi thêm bản chat.');
  const newline = raw.includes('\r\n') ? '\r\n' : '\n';
  const suffix = raw.slice(end);
  // Giữ bình luận cuối dòng đi cùng lệnh trước khi chèn.
  const sameLine = /^[ \t]*%[^\r\n]*/.exec(suffix)?.[0] || '';
  const at = end + sameLine.length;
  return raw.slice(0, at) + newline + newline + chatBlock + newline + raw.slice(at);
}

// Lịch ôn ngắt quãng + sổ câu sai + chuỗi ngày học. Ngày tính theo giờ Việt Nam.
const INTERVALS = [1, 1, 3, 7, 14, 30]; // theo hộp 0..5 (ngày)
const VN = 7 * 3600e3;
const vnDay = (t = Date.now()) => new Date(t + VN).toISOString().slice(0, 10);
const addDays = (day, n) => new Date(Date.parse(day + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10);
const dayDiff = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5);

// Cập nhật một dòng ltt_reviews sau một lần trả lời. row = dòng cũ hoặc null.
function nextReview(row, ok, today = vnDay()) {
  if (!ok) {
    return { box: 0, due: addDays(today, 1), in_notebook: true, nb_hits: 0, last_ok: row?.last_ok ?? null, wrong_count: (row?.wrong_count || 0) + 1 };
  }
  if (!row) return { box: 1, due: addDays(today, INTERVALS[1]), in_notebook: false, nb_hits: 0, last_ok: today, wrong_count: 0 };
  if (row.last_ok === today) return null; // đúng nhiều lần trong cùng một ngày chỉ tính một lần
  const box = Math.min((row.box || 0) + 1, 5);
  // Câu đang ở sổ Câu sai: làm đúng lại chính câu đó (ở bản đồ, đề ôn tập) KHÔNG gạch khỏi sổ, vì có thể chỉ là nhớ đáp án.
  // Chỉ làm đúng câu thay thế trong "Làm lại câu sai" mới gạch (redoResult).
  if (row.in_notebook) return { ...row, box: row.box || 0, last_ok: today, wrong_count: row.wrong_count || 0 };
  return { box, due: addDays(today, INTERVALS[box]), last_ok: today, wrong_count: row.wrong_count || 0, nb_hits: 0, in_notebook: false };
}

// Làm lại câu sai (thầy chốt 28/11/2026): học sinh làm một câu thay thế cùng bài; đúng 1 lần là câu gốc ra khỏi sổ.
// Sai: câu gốc vẫn ở sổ, lần sau đổi câu thay thế khác; nếu bài hết câu mới thì câu gốc chỉ mở lại sau 1 ngày (due).
function redoResult(row, ok, today = vnDay()) {
  if (ok) return { ...row, in_notebook: false, nb_hits: 1, box: Math.max(1, row.box || 0), due: addDays(today, INTERVALS[1]), last_ok: today };
  return { ...row, in_notebook: true, nb_hits: 0, box: 0, due: addDays(today, 1), wrong_count: (row.wrong_count || 0) + 1 };
}

// Chuỗi ngày học: mỗi ngày đạt mục tiêu (qua 1 màn hoặc làm xong 1 lượt ôn) thì +1.
// Lỡ đúng 1 ngày mà còn lá chắn thì tự dùng lá chắn để giữ chuỗi. Cứ 7 ngày liên tiếp được thêm 1 lá chắn (tối đa 2).
function nextStreak(p, today = vnDay()) {
  const last = p.last_day ? String(p.last_day).slice(0, 10) : null;
  if (last === today) return null;
  let streak = p.streak || 0, shields = p.shields ?? 1, shieldUsed = false;
  const gap = last ? dayDiff(last, today) : null;
  if (gap === 1) streak += 1;
  else if (gap === 2 && shields > 0) { shields -= 1; streak += 1; shieldUsed = true; }
  else streak = 1;
  if (streak % 7 === 0) shields = Math.min(2, shields + 1);
  return { streak, best_streak: Math.max(p.best_streak || 0, streak), last_day: today, shields, shieldUsed };
}
// Chuỗi đang hiển thị (đã đứt nếu quá 1 ngày mà không có lá chắn)
function liveStreak(p, today = vnDay()) {
  if (!p.last_day) return 0;
  const gap = dayDiff(String(p.last_day).slice(0, 10), today);
  return gap <= 1 || (gap === 2 && (p.shields || 0) > 0) ? p.streak || 0 : 0;
}

// Thi đấu: mùa 30 ngày, bậc và thanh tiến trình, bài kiểm tra thăng hạng, điểm phong độ Thách Đấu.
// Dùng chung cho giao diện (scripts/build-app.mjs ghép vào app) và máy chủ (lib/validate.js).

const SEASON0 = '2026-11-23';  // ngày bắt đầu Mùa 1
const SEASON_DAYS = 30;        // mỗi mùa 30 ngày; sang mùa mới tụt SEASON_DROP bậc
const SEASON_DROP = 2;
const RANK_UP = 30, RANK_DOWN = 20; // mỗi trận cộng tối đa / trừ tối đa
const NB_LOCK = 10;            // quá bấy nhiêu câu sai chưa làm lại đúng thì tạm khóa Thi đấu
const NB_UNLOCK = 5;           // đang khóa: làm lại đến khi còn không quá bấy nhiêu câu sai thì mở lại
const RANK_WRONG = 1 / 3;      // câu trả lời sai bị trừ 1/3 điểm câu: chọn bừa 1 trong 4 trung bình được 0 điểm
const RANK_SPEED = 0.15;       // thưởng thời gian tối đa (15% điểm trận), tính theo thời gian còn dư của cả trận

// Bậc: Đồng, Bạc, Vàng, Bạch Kim, Kim Cương, Cao Thủ, Đại Cao Thủ, Thách Đấu.
// Điểm thi đấu (lp) chỉ là thanh tiến trình: ở bậc t, lp chạy từ TIER_LP[t] đến TIER_LP[t+1] (đầy thanh).
// Đầy thanh thì phải làm bài kiểm tra thăng hạng; đạt mới lên bậc. Thách Đấu: lp từ 1200 đến TOP_CAP ("độ vững bậc").
const TIER_LP = [0, 100, 200, 350, 500, 700, 900, 1200];
const TOP = TIER_LP.length - 1;
const TOP_CAP = 1300;
const tierFromLp = lp => { let t = 0; TIER_LP.forEach((x, i) => { if ((lp || 0) >= x) t = i; }); return t; };
const tierOfP = p => (p && Number.isInteger(p.tier) ? Math.max(0, Math.min(TOP, p.tier)) : tierFromLp(p && p.lp));
const capOf = t => (t >= TOP ? TOP_CAP : TIER_LP[t + 1]);
const barFull = (t, lp) => t < TOP && (lp || 0) >= TIER_LP[t + 1];
const barPct = (t, lp) => t >= TOP ? Math.round(100 * Math.max(0, Math.min(1, ((lp || 0) - TIER_LP[TOP]) / (TOP_CAP - TIER_LP[TOP]))))
  : Math.round(100 * Math.max(0, Math.min(1, ((lp || 0) - TIER_LP[t]) / (TIER_LP[t + 1] - TIER_LP[t]))));
const SHIELD = 5;              // vừa lên bậc: 5 trận đầu không bị tụt bậc

// Sau một trận được d điểm: thanh không vượt mốc bậc trên; tụt dưới mốc bậc mình thì xuống bậc (trừ khi đang được bảo vệ).
function applyMatch({ tier, lp, shield = 0 }, d) {
  let t = tier, x = Math.max(0, (lp || 0) + d);
  x = Math.min(x, capOf(t));
  if (x < TIER_LP[t]) { if (shield > 0) x = TIER_LP[t]; else if (t > 0) t--; }
  return { tier: t, lp: x, shield: Math.max(0, shield - 1), down: t < tier };
}
// Sang mùa mới: tụt SEASON_DROP bậc, thanh tiến trình về đầu bậc
const seasonStart = tier => { const t = Math.max(0, (tier || 0) - SEASON_DROP); return { tier: t, lp: TIER_LP[t] }; };

// Bài kiểm tra thăng hạng
const PROMO_N = 12;            // số câu
const PROMO_PER_DAY = 2;       // mỗi ngày thi tối đa 2 lần
const PROMO_FAIL = 20;         // trượt: thanh tiến trình lùi 20 điểm
const promoPass = to => 0.55 + 0.05 * to;          // lên Bạc 60%, mỗi bậc +5%, lên Thách Đấu 90%
const promoNeed3 = to => (to >= 3 ? 2 : 0);         // từ Bạch Kim: đúng ít nhất 2 câu mức 3 trở lên
// Chấm bài kiểm tra: score là điểm bài (đã trừ câu sai), max là tổng điểm các câu; ok3/n3: số câu mức ≥ 3 đúng / có trong đề.
function promoResult({ score, max, ok3, n3, to }) {
  const pc = max > 0 ? Math.max(0, score) / max : 0, need3 = Math.min(promoNeed3(to), n3);
  return { pc: Math.round(pc * 100), pass: pc >= promoPass(to) - 1e-9 && ok3 >= need3, need3 };
}

// Thách Đấu: điểm phong độ = trung bình tỉ lệ điểm trận của PD_N trận gần nhất × 1000 (đánh nhiều không tăng điểm)
const PD_N = 10, PD_MIN = 3;
const pdOf = h => { const a = (Array.isArray(h) ? h : []).slice(-PD_N).map(Number).filter(Number.isFinite); return a.length ? Math.round(1000 * a.reduce((s, x) => s + Math.max(0, Math.min(1, x)), 0) / a.length) : 0; };

function seasonOf(day = vnDay()) {
  const k = Math.max(0, Math.floor(dayDiff(SEASON0, day) / SEASON_DAYS));
  const start = addDays(SEASON0, k * SEASON_DAYS), end = addDays(start, SEASON_DAYS - 1);
  const f = d => d.slice(8, 10) + '/' + d.slice(5, 7);
  return { n: k + 1, start, end, name: `Mùa ${k + 1} (${f(start)}–${f(end)})`, left: dayDiff(day, end) + 1 };
}
const seasonName = (day = vnDay()) => seasonOf(day).name;

// Mức chuẩn của bậc (tỉ lệ điểm trận so với điểm tối đa): Đồng 40%, mỗi bậc +6%, Thách Đấu 82%.
// Điểm tối đa = điểm các câu × (1 + RANK_SPEED); thưởng thời gian nhỏ nên mức chuẩn chủ yếu đo số câu đúng.
// Câu sai bị trừ điểm (RANK_WRONG) nên mức chuẩn để như cũ: học sinh đúng 60% vẫn lên được ở Đồng, chọn bừa thì tụt.
const rankTarget = tier => 0.4 + 0.06 * tier;
// Điểm bị trừ khi trả lời sai một câu được pts điểm
const wrongPenalty = pts => Math.round(pts * RANK_WRONG);
// Thưởng thời gian cuối trận: điểm câu đúng × RANK_SPEED × tỉ lệ thời gian còn dư
const speedBonus = (score, leftFrac) => Math.round(score * RANK_SPEED * Math.max(0, Math.min(1, leftFrac)));
// Thưởng chính xác theo số câu đúng trong trận
const accBonus = (correct, n) => { const a = n ? correct / n : 0; return a >= 1 ? 6 : a >= 0.9 ? 4 : a >= 0.8 ? 2 : 0; };

// Điểm thi đấu cộng/trừ sau một trận. score: điểm trận; max: điểm trận tối đa (đúng hết, thật nhanh).
function rankDelta({ score, max, correct, n, tier }) {
  const r = max > 0 ? score / max : 0;
  const base = Math.max(-RANK_DOWN, Math.min(RANK_UP - 6, Math.round((r - rankTarget(tier)) * 100)));
  const bonus = accBonus(correct, n);
  return { d: Math.min(RANK_UP, base + bonus), base, bonus };
}

// \\ ngoài công thức = xuống dòng; trong $...$, $$...$$, \(...\), \[...\] giữ nguyên (cases, aligned, ma trận cần \\)
const brOut=s=>s.replace(/(\\\$|\$\$[\s\S]*?\$\$|\$(?:\\[\s\S]|[^$\\])*\$|\\\([\s\S]*?\\\)|\\\[[\s\S]*?\\\])|\\\\/g,(m,keep)=>keep?mathBreak(m):'<br>');
/* Công thức dài trên điện thoại (thầy chốt 26/11/2026). MathJax 3 không tự xuống dòng, nên:
   (a) công thức $…$ có dấu quan hệ (=, <, >, ≤, ≥, ≠, ≈, ⇒, ⇔) ở ngoài ngoặc được cắt thành nhiều mảnh $…$ nối bằng <wbr>:
       vừa một dòng thì vẫn liền nhau như cũ, không vừa thì xuống dòng ngay trước dấu "=" như khi viết tay;
   (b) chuỗi bằng nhau từ 3 vế trở lên mà phải xuống dòng thì dàn mỗi bước một dòng, dấu "=" thẳng cột (mathFit);
   (c) công thức không cắt được mà rộng hơn khung thì thu nhỏ cho vừa (không dưới 75%); vẫn không vừa thì cuộn ngang, có gợi ý. */
const MB_REL=/^(=|&lt;|&gt;|\\(?:le|leq|ge|geq|ne|neq|approx|Rightarrow|Leftarrow|Leftrightarrow|equiv)(?![a-zA-Z]))/;
function mathBreak(m){
  if(m[0]!=='$'||m[1]==='$'||m.length<16)return m;
  const s=m.slice(1,-1);if(/\\begin|&amp;|\\\\/.test(s))return m;
  const cuts=[];let d=0;
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(c==='\\'){
      if(s[i+1]==='{'||s[i+1]==='}'){d+=s[i+1]==='{'?1:-1;i++;continue}
      const r=d===0&&i>0&&s.slice(i).match(MB_REL);if(r){cuts.push(i);i+=r[0].length-1;continue}
      const w=s.slice(i+1).match(/^[a-zA-Z]+/);if(w)i+=w[0].length;else i++;continue}
    if('{(['.includes(c))d++;else if('})]'.includes(c))d=Math.max(0,d-1);
    else if(d===0&&i>0){const r=s.slice(i).match(MB_REL);if(r&&s[i-1]!=='&'&&!(c==='='&&/[<>!]|&[lg]t;$/.test(s.slice(Math.max(0,i-4),i)))){cuts.push(i);i+=r[0].length-1}}
  }
  if(!cuts.length)return m;
  const parts=[];let a=0;for(const k of cuts){if(k>a)parts.push(s.slice(a,k));a=k}parts.push(s.slice(a));
  if(parts.length<2||parts.some(p=>!p.trim()))return m;
  const eq=parts.slice(1).every(p=>p[0]==='=');
  return `<span class="mchain"${eq?' data-eq="1"':''}>${parts.map((p,n)=>'$'+(n?'{}':'')+p+'$').join('<wbr>')}</span>`;
}
function mathFit(el){
  if(!el||!el.querySelectorAll)return;
  el.querySelectorAll('.mhint,br.mbr').forEach(x=>x.remove());
  el.querySelectorAll('mjx-container.mrow').forEach(x=>{x.classList.remove('mrow');x.style.paddingLeft=''});
  el.querySelectorAll('mjx-container[data-mfit]').forEach(x=>{x.style.fontSize='';x.removeAttribute('data-mfit')});
  // (b) dàn bước: chuỗi bằng nhau ≥ 3 vế đã phải xuống dòng → mỗi "= …" một dòng, thẳng dưới dấu "=" đầu tiên.
  // Dùng <br> (không dùng display:block) để dấu chấm cuối câu vẫn đứng ngay sau vế cuối.
  el.querySelectorAll('.mchain[data-eq]').forEach(c=>{
    const ms=[...c.querySelectorAll(':scope>mjx-container')];if(ms.length<3||!c.offsetWidth)return;
    const top=x=>x.getBoundingClientRect().top,left=x=>x.getBoundingClientRect().left;
    if(!ms.some(x=>top(x)>top(ms[0])+ms[0].offsetHeight*0.6))return;
    const wrapped1=top(ms[1])>top(ms[0])+ms[0].offsetHeight*0.6;
    const rows=wrapped1?ms.slice(1):ms.slice(2);
    rows.forEach(x=>{x.classList.add('mrow');x.insertAdjacentHTML('beforebegin','<br class="mbr">')});
    const lineStart=left(rows[0]),room=c.parentElement?c.parentElement.clientWidth:0;
    const off=wrapped1?0:left(ms[1])-lineStart;
    const pad=off>0&&room&&off<=room*0.6?off:24;
    rows.forEach(x=>x.style.paddingLeft=pad+'px');
  });
  // (c) thu nhỏ công thức rộng hơn khung
  // So với bề rộng của cả khối chữ chứa công thức, KHÔNG so với khung của chính công thức: kí hiệu đứng một mình
  // như $\in$, $\notin$ có khoảng trống hai bên vẽ tràn ra ngoài khung nhỏ của nó (lỗi 26/11/2026: hiện "vuốt ngang"
  // và đẩy kí hiệu xuống dòng riêng).
  el.querySelectorAll('mjx-container').forEach(x=>{
    let host=x.parentElement;while(host&&host!==el&&getComputedStyle(host).display.startsWith('inline'))host=host.parentElement;
    if(!host)return;const cs=getComputedStyle(host);
    const room=host.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),w=x.scrollWidth;
    if(!x.offsetWidth||room<=0||w<=room+1)return;
    const r=room/w;x.setAttribute('data-mfit','1');x.style.fontSize=Math.max(75,Math.floor(r*100))+'%';
    if(r<0.75&&x.scrollWidth>room+1)x.insertAdjacentHTML('afterend','<span class="mhint">↔ vuốt ngang để xem hết</span>');
  });
}

  if(parts.length)requestAnimationFrame(tick);else cx.clearRect(0,0,cv.width,cv.height)}

/* danh sách phẳng: {hk} | {ch:{n,title,phan}} | {id,num,title,lt,ch} */
const currOf=k=>{const out=[];let num=0,cn=0;for(const c of CURR[k]||[]){if(c==='HK1'){out.push({hk:1});continue}
  cn++;const ch={n:cn,title:c[0],phan:c[1]};out.push({ch});let lt=0;
  for(const b of c[2]){if(b==='LT'){lt++;out.push({id:`k${k}-c${cn}-lt${lt}`,num:0,title:'Luyện tập chung',lt:true,coin:'LT',ch})}else if(b==='CC'){out.push({id:`k${k}-c${cn}-cc`,num:0,title:'Bài tập cuối chương',lt:true,coin:'ÔT',ch})}else{num++;out.push({id:`k${k}-b${num}`,num,title:b,ch})}}}return out};
const lessonName=L=>L.lt?`${L.title} · Chương ${L.ch.n}`:`Bài ${L.num}. ${L.title}`;
function mapItems(k){const all=gradeTopics(k).filter(t=>!isDe(t)&&!isTL(t)&&!isKho(t)&&!isBM(t)),used=new Set(),items=[];
  for(const c of currOf(k)){if(!c.id){items.push(c);continue}
    const ts=all.filter(t=>!used.has(t)&&((t.chuong||ALIAS[t.id])===c.id));ts.forEach(t=>used.add(t));
    if(ts.length)ts.forEach((t,i)=>items.push({L:c,t,sub:ts.length>1?i+1:0}));else items.push({L:c,t:null})}
  const rest=all.filter(t=>!used.has(t));if(rest.length){items.push({ch:{n:0,title:'Chủ đề bổ sung',phan:'dai-so'}});rest.forEach(t=>items.push({L:{id:'',num:0,title:t.title,ch:null},t}))}
  return items}

const save=()=>{if(ACC)store.set('ltt:p:'+ACC.id,P)};
const key=(t,i)=>t.id+'|'+i;

const isDe=t=>t.phan==='on-tap';
const isKho=t=>t.phan==='thi-dau'; // Kho Thi đấu theo chương: không hiện trên bản đồ, chỉ dùng cho Thi đấu
const isBM=t=>t.phan==='bai-mau'; // Bài tự luận theo chương (lời giải từng bước, chat cùng Cherry): nằm trong chặng Tự luận cuối chương
/* chương của một chủ đề (số chương SGK) và mốc Thi đấu "đã học hết chương N" của khối; null = chưa gắn chương */
const CURC={},currC=k=>CURC[k]||(CURC[k]=currOf(k));
const chapsOf=k=>currC(k).filter(c=>c.hk||c.ch&&!c.id);
const chapTitle=(k,n)=>{const c=chapsOf(k).find(x=>x.ch&&x.ch.n===n);return c?c.ch.title:''};
function chapOf(t){if(isKho(t)||isBM(t)){const m=/^k\d+-c(\d+)$/.exec(t.chuong||'');return m?+m[1]:null}
  const id=t.chuong||ALIAS[t.id];if(!id)return null;const c=currC(t.khoi).find(x=>x.id===id);return c&&c.ch?c.ch.n:null}
const mocOf=k=>Number(MOC&&MOC[k])||0;
const chRange=m=>m===1?'Chương 1':`Chương 1–${m}`;
const inMoc=t=>{const m=mocOf(t.khoi),c=chapOf(t);return !m||c==null||c<=m};
const isTL=t=>isTLBank(t.levels); // đề tự luận: học sinh làm vào vở, app chỉ có đề và gợi ý
const nMan=t=>1; // mỗi bài (hoặc đề) là một chặng
const MAN_NAME=['Nhận biết','Thông hiểu','Vận dụng'];
const LESSON_PLAN=[3,3,2]; // số câu mức 1, 2, 3 trong một bài (khoảng 10 phút)
const topicStars=t=>{let s=0;for(let i=0;i<nMan(t);i++)s+=bestOf(t,i);return s};
const topicPassed=t=>{let s=0;for(let i=0;i<nMan(t);i++)if(bestOf(t,i)>0)s++;return s};
const visible=t=>GV()?true:(t.status==='giao'&&!t.errors.length);
const gradeTopics=k=>TOPICS.filter(t=>t.khoi===k&&visible(t)).sort((a,b)=>(a.status==='an')-(b.status==='an')||a.order-b.order||a.title.localeCompare(b.title,'vi'));
const hasQ=t=>t.levels.some(l=>l.qs.length); // bài chỉ có lý thuyết thì không tính vào đường đi
const routeTopics=k=>mapItems(k).filter(x=>x.t&&hasQ(x.t)).map(x=>x.t);
const deTopics=k=>gradeTopics(k).filter(isDe);
const deDone=t=>!!(P.pt&&P.pt[key(t,0)]);
function topicOpen(ts,j){const t=ts[j];return j===0||GV()||!!asgFor(t)||topicPassed(t)>0||topicPassed(ts[j-1])>=1}
const lvlOpen=(ts,j,i)=>topicOpen(ts,j)&&(i===0||GV()||bestOf(ts[j],i-1)>0);

const normName=s=>String(s||'').normalize('NFC').toLowerCase().replace(/\s+/g,' ').trim();
const plain=s=>normName(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');
async function hashPin(salt,pin){const s=salt+':'+pin;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return 'x'+h}}
const pinOk=p=>/^\d{4}$/.test(p);
function findAcc(name,khoi){const n=normName(name),p=plain(name);let m=ACCS.filter(a=>normName(a.name)===n);if(!m.length)m=ACCS.filter(a=>plain(a.name)===p);if(khoi)m=m.filter(a=>a.khoi===khoi);return m}

    if(st==='open'&&!cur)cur={x:x2,y:ny};

      ${a&&!as.complete?`<em class="hwn ${as.overdue?'late':''}">Thầy giao · ${dueLabel(a,as)}</em>`:''}${GV()&&t.status!=='giao'?`<em class="hwn st">${({nhap:'Nháp',an:'Đã ẩn'})[t.status]||t.status}</em>`:''}</button>`;
