name: Kiểm tra
on:
  push:
  pull_request:
jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hoc-cung-cherry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hoc-cung-cherry/package-lock.json
      - run: npm ci
      - name: Ghép giao diện (client/ → public/app.html)
        run: node scripts/build-app.mjs
      - name: Dựng trang xem thử bài chat
        run: node scripts/build-xem-thu.mjs
      - name: Kiểm tra cú pháp giao diện đã ghép
        run: node -e "const h=require('fs').readFileSync('public/app.html','utf8');for(const m of h.matchAll(/<script>([\s\S]*?)<\/script>/g))new Function(m[1]);console.log('OK')"
      - run: npm test
      - name: Build Next.js với dữ liệu giả
        run: npx next build
        env:
          FAKE_DB: '1'
          SESSION_SECRET: kiem-tra-tu-dong-khong-phai-bi-mat-0123456789
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Nhắc nếu quên ghép giao diện
        run: git diff --quiet -- public/app.html lib/items.js || echo "::warning::public/app.html chưa được ghép lại sau khi sửa client/. Vercel vẫn tự ghép khi triển khai."
